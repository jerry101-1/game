<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML 跑酷小遊戲</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1a1a2e;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            user-select: none;
        }

        #game-container {
            position: relative;
            width: 800px;
            height: 300px;
            background: linear-gradient(to bottom, #16213e, #0f3460);
            border-bottom: 8px solid #e94560;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
        }

        /* 玩家角色 */
        #player {
            position: absolute;
            bottom: 0px;
            left: 50px;
            width: 40px;
            height: 40px;
            background-color: #00fff5;
            border-radius: 6px;
            box-shadow: 0 0 10px #00fff5;
        }

        /* 障礙物 */
        .obstacle {
            position: absolute;
            bottom: 0;
            right: -30px;
            width: 30px;
            height: 50px;
            background-color: #e94560;
            border-radius: 4px;
            box-shadow: 0 0 10px #e94560;
        }

        /* 分數顯示 */
        #ui {
            position: absolute;
            top: 15px;
            left: 20px;
            font-size: 20px;
            font-weight: bold;
            z-index: 10;
        }

        /* 遊戲結束提示 */
        #game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(0, 0, 0, 0.85);
            padding: 30px 50px;
            border-radius: 12px;
            border: 2px solid #e94560;
        }

        #game-over h1 {
            font-size: 36px;
            color: #e94560;
            margin-bottom: 10px;
        }

        #game-over p {
            font-size: 18px;
            margin-bottom: 20px;
        }

        #restart-btn {
            padding: 10px 25px;
            font-size: 16px;
            font-weight: bold;
            background-color: #00fff5;
            color: #0f3460;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: 0.2s;
        }

        #restart-btn:hover {
            background-color: #fff;
            transform: scale(1.05);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui">分數: <span id="score">0</span></div>
        <div id="player"></div>
        <div id="game-over">
            <h1>GAME OVER</h1>
            <p>最終得分: <span id="final-score">0</span></p>
            <button id="restart-btn" onclick="resetGame()">重新開始</button>
        </div>
    </div>

    <script>
        const player = document.getElementById('player');
        const container = document.getElementById('game-container');
        const scoreDisplay = document.getElementById('score');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreDisplay = document.getElementById('final-score');

        // 遊戲物理與數據
        let isJumping = false;
        let gravity = 0.9;
        let playerY = 0;
        let velocityY = 0;
        let score = 0;
        let gameSpeed = 5;
        let isGameOver = false;
        let obstacles = [];
        let spawnTimer = 0;
        let animationFrameId;

        // 跳躍機制
        function jump() {
            if (isJumping || isGameOver) return;
            isJumping = true;
            velocityY = 15; // 跳躍高度
        }

        // 鍵盤監聽
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'ArrowUp') {
                jump();
            }
        });

        // 觸控/點擊監聽
        container.addEventListener('touchstart', jump);
        container.addEventListener('mousedown', jump);

        // 生成障礙物
        function spawnObstacle() {
            const obstacle = document.createElement('div');
            obstacle.classList.add('obstacle');
            
            // 隨機高度與寬度
            const height = Math.floor(Math.random() * 30) + 30; // 30px ~ 60px
            const width = Math.floor(Math.random() * 15) + 20;  // 20px ~ 35px
            
            obstacle.style.height = `${height}px`;
            obstacle.style.width = `${width}px`;
            obstacle.style.right = '-40px';

            container.appendChild(obstacle);
            obstacles.push({ element: obstacle, x: 800, width: width, height: height });
        }

        // 遊戲主循環
        function update() {
            if (isGameOver) return;

            // 1. 處理玩家跳躍物理
            if (isJumping) {
                playerY += velocityY;
                velocityY -= gravity;

                if (playerY <= 0) {
                    playerY = 0;
                    isJumping = false;
                    velocityY = 0;
                }
            }
            player.style.bottom = `${playerY}px`;

            // 2. 生成障礙物機制
            spawnTimer++;
            if (spawnTimer > Math.max(50, 120 - Math.floor(score / 50))) { // 隨時間加快生成頻率
                spawnObstacle();
                spawnTimer = 0;
            }

            // 3. 移動障礙物與碰撞檢測
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i];
                obs.x -= gameSpeed;
                obs.element.style.right = `${800 - obs.x}px`;

                // 碰撞判定 (AABB)
                const playerWidth = 40;
                const playerHeight = 40;
                const playerX = 50; // 玩家固定 X 座標

                if (
                    playerX < obs.x + obs.width &&
                    playerX + playerWidth > obs.x &&
                    playerY < obs.height
                ) {
                    endGame();
                    return;
                }

                // 移除超出螢幕的障礙物
                if (obs.x + obs.width < 0) {
                    obs.element.remove();
                    obstacles.splice(i, 1);
                }
            }

            // 4. 更新分數與遊戲速度
            score++;
            scoreDisplay.textContent = Math.floor(score / 5);
            gameSpeed = 5 + Math.floor(score / 200) * 0.5; // 隨時間加速

            animationFrameId = requestAnimationFrame(update);
        }

        // 遊戲結束
        function endGame() {
            isGameOver = true;
            cancelAnimationFrame(animationFrameId);
            finalScoreDisplay.textContent = Math.floor(score / 5);
            gameOverScreen.style.display = 'block';
        }

        // 重置遊戲
        function resetGame() {
            // 清除現有障礙物
            obstacles.forEach(obs => obs.element.remove());
            obstacles = [];

            // 重置數據
            isGameOver = false;
            score = 0;
            gameSpeed = 5;
            playerY = 0;
            isJumping = false;
            spawnTimer = 0;
            player.style.bottom = '0px';
            scoreDisplay.textContent = '0';
            gameOverScreen.style.display = 'none';

            // 重新啟動遊戲循環
            update();
        }

        // 啟動遊戲
        update();
    </script>
</body>
</html>
