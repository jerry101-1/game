<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚔ RPG 冒險 ⚔</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background:#0a0a0f; color:#e0e0e0; font-family:'Consolas','Monaco',monospace; padding:15px; max-width:760px; margin:0 auto; min-height:100vh; line-height:1.5; }
h1 { color:#4fc3f7; text-align:center; font-size:1.5em; margin-bottom:15px; text-shadow:0 0 10px rgba(79,195,247,0.5); }
.panel { background:#151520; border:1px solid #2a2a3a; border-radius:8px; padding:14px; margin-bottom:12px; }
.panel-title { color:#4fc3f7; font-weight:bold; margin-bottom:10px; font-size:0.95em; display:flex; align-items:center; gap:8px; flex-wrap:wrap; }
.subtitle { color:#888; font-size:12px; }
.hidden { display:none !important; }
.stat-row { display:flex; justify-content:space-between; font-size:13px; margin:4px 0; color:#ccc; flex-wrap:wrap; }
.stat-row .val { color:#4fc3f7; font-weight:bold; }
.hp-bar { background:#1a1a25; height:22px; border-radius:11px; overflow:hidden; margin:6px 0; border:1px solid #2a2a3a; position:relative; }
.hp-fill { height:100%; transition:width 0.35s ease; border-radius:11px; }
.hp-fill.green { background:linear-gradient(90deg,#2e7d32,#4caf50); }
.hp-fill.yellow { background:linear-gradient(90deg,#f9a825,#ffeb3b); }
.hp-fill.red { background:linear-gradient(90deg,#c62828,#f44336); }
.hp-text { font-size:11px; color:#fff; text-align:center; position:absolute; top:0;left:0;right:0;bottom:0; line-height:22px; z-index:2; text-shadow:0 0 4px #000,0 0 2px #000; pointer-events:none; }
button { background:#1e88e5; color:#fff; border:none; padding:10px 16px; font-size:14px; font-weight:bold; border-radius:6px; cursor:pointer; margin:4px 2px; font-family:inherit; transition:all 0.15s; }
button:hover:not(:disabled) { background:#42a5f5; transform:translateY(-1px); }
button:disabled { background:#333; color:#666; cursor:not-allowed; }
button.skill { background:#8e24aa; } button.skill:hover:not(:disabled) { background:#ab47bc; }
button.defend { background:#00897b; } button.defend:hover:not(:disabled) { background:#26a69a; }
button.potion { background:#43a047; } button.potion:hover:not(:disabled) { background:#66bb6a; }
button.danger { background:#c62828; } button.danger:hover:not(:disabled) { background:#e53935; }
button.gold { background:#f9a825; color:#111; } button.gold:hover:not(:disabled) { background:#fdd835; }
button.fruit { background:#6a1b9a; } button.fruit:hover:not(:disabled) { background:#8e24aa; }
button.ach { background:#00838f; } button.ach:hover:not(:disabled) { background:#0097a7; }
button.abyss { background:#37474f; } button.abyss:hover:not(:disabled) { background:#546e7a; }
button.talent { background:#ef6c00; } button.talent:hover:not(:disabled) { background:#fb8c00; }
button.map { background:#00897b; } button.map:hover:not(:disabled) { background:#26a69a; }
button.small { padding:6px 12px; font-size:12px; }
.badge { padding:2px 8px; border-radius:10px; font-size:11px; font-weight:bold; }
.badge.boss { background:#ff5252; color:#fff; }
.badge.prefix { background:#7b1fa2; color:#fff; }
.badge.combo { background:linear-gradient(90deg,#ff6f00,#f9a825); color:#fff; animation:pulse 1s infinite; }
@keyframes pulse { 0%,100%{transform:scale(1);} 50%{transform:scale(1.08);} }
#log { background:#08080c; border:1px solid #2a2a3a; padding:10px; height:200px; overflow-y:auto; border-radius:8px; font-size:13px; line-height:1.6; }
#log div { margin-bottom:4px; word-break:break-word; }
.dmg-player { color:#4caf50; } .dmg-monster { color:#f44336; }
.system { color:#ffeb3b; } .win { color:#4fc3f7; font-weight:bold; }
.lose { color:#f44336; font-weight:bold; } .crit { color:#ff9800; font-weight:bold; }
.skill-text { color:#ce93d8; } .loot { color:#ffd54f; }
.boss { color:#ff5252; font-weight:bold; } .fruit-text { color:#ba68c8; font-weight:bold; }
.combo-text { color:#ff9800; font-weight:bold; }
.ach-text { color:#26c6da; font-weight:bold; }
.talent-text { color:#ffb74d; font-weight:bold; }
.map-text { color:#26a69a; font-weight:bold; }
.fruit-card { background:#1a1a25; border:1px solid #4a148c; border-radius:8px; padding:12px; margin:8px 0; }
.fruit-card.active { border-color:#ffd54f; box-shadow:0 0 8px rgba(255,213,79,0.3); }
.fruit-card .fruit-name { color:#ba68c8; font-weight:bold; font-size:15px; }
.fruit-card .fruit-lv { color:#ffd54f; font-size:12px; }
.fruit-card .fruit-skill { color:#80cbc4; font-size:12px; margin-top:4px; }
.fruit-bar { background:#1a1a25; height:10px; border-radius:5px; overflow:hidden; margin:6px 0; border:1px solid #2a2a3a; }
.fruit-bar-fill { height:100%; background:linear-gradient(90deg,#6a1b9a,#ba68c8); transition:width 0.3s; }
.tabs { display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
.tab { padding:8px 14px; background:#1a1a25; border:1px solid #2a2a3a; border-radius:6px; cursor:pointer; font-size:13px; color:#888; transition:all 0.15s; }
.tab:hover { background:#22223a; }
.tab.active { background:#1e88e5; color:#fff; border-color:#1e88e5; }
.shop-item { display:flex; justify-content:space-between; align-items:center; padding:10px 0; border-bottom:1px solid #222; font-size:13px; gap:10px; }
.shop-item:last-child { border-bottom:none; }
.shop-item .cost { color:#ffd54f; font-weight:bold; }
.actions { display:flex; flex-wrap:wrap; gap:6px; justify-content:center; margin:10px 0; }
#fruitSkillBar { display:flex; justify-content:center; margin:8px 0; min-height:24px; flex-wrap:wrap; gap:6px; }
input[type="text"] { background:#1a1a25; border:1px solid #333; color:#eee; padding:6px 10px; border-radius:5px; font-family:inherit; width:60%; font-size:14px; }
::-webkit-scrollbar { width:6px; }
::-webkit-scrollbar-track { background:#111; }
::-webkit-scrollbar-thumb { background:#444; border-radius:3px; }

.equip-slot { display:flex; justify-content:space-between; align-items:center; padding:10px; background:#1a1a25; border:1px solid #2a2a3a; border-radius:6px; margin:6px 0; }
.equip-slot .slot-name { color:#888; font-size:12px; min-width:50px; }
.equip-item-name { font-weight:bold; font-size:13px; }
.equip-affix { font-size:11px; color:#80cbc4; margin-left:6px; }
.rarity-1 { color:#aaa; } .rarity-2 { color:#4caf50; } .rarity-3 { color:#4fc3f7; }
.rarity-4 { color:#ba68c8; } .rarity-5 { color:#ffd54f; } .rarity-6 { color:#ff5252; }
.equip-bag-item { background:#1a1a25; border:1px solid #2a2a3a; border-radius:6px; padding:8px 10px; margin:6px 0; display:flex; justify-content:space-between; align-items:center; gap:8px; }
.talent-branch { background:#1a1a25; border:1px solid #2a2a3a; border-radius:8px; padding:12px; margin:8px 0; }
.talent-branch-title { font-weight:bold; margin-bottom:8px; font-size:14px; }
.talent-item { display:flex; justify-content:space-between; align-items:center; padding:8px 0; border-bottom:1px solid #222; gap:10px; }
.talent-item:last-child { border-bottom:none; }
.talent-info { flex:1; }
.talent-name { font-weight:bold; font-size:13px; }
.talent-desc { font-size:11px; color:#aaa; }
.talent-lv { color:#ffd54f; font-size:12px; }
.abyss-floor { text-align:center; padding:20px 0; }
.abyss-floor-num { font-size:3em; color:#ff5252; font-weight:bold; text-shadow:0 0 20px rgba(255,82,82,0.6); }
.abyss-record { text-align:center; color:#ffd54f; font-size:14px; margin:10px 0; }
.achievement-popup {
  position:fixed; top:-120px; right:20px;
  background:linear-gradient(135deg,#1a1a2e,#2a2a4e);
  border:2px solid #ffd54f; border-radius:10px;
  padding:12px 16px; display:flex; gap:12px; align-items:center;
  box-shadow:0 0 30px rgba(255,213,79,0.5);
  z-index:9999; transition:top 0.5s ease; max-width:340px;
}
.achievement-popup.show { top:20px; }
.achievement-popup .ach-icon { font-size:28px; }
.achievement-popup .ach-title { color:#ffd54f; font-size:11px; font-weight:bold; }
.achievement-popup .ach-name { color:#fff; font-size:14px; font-weight:bold; }
.achievement-popup .ach-desc { color:#aaa; font-size:11px; margin-top:2px; }

/* ===== 地圖 ===== */
.island-card {
  background:#1a1a25;
  border:2px solid #2a2a3a;
  border-radius:10px;
  padding:14px;
  margin:10px 0;
  display:flex;
  gap:14px;
  align-items:center;
  transition:all 0.2s;
}
.island-card.locked { opacity:0.5; filter:grayscale(0.7); }
.island-card.current { border-color:#ffd54f !important; box-shadow:0 0 15px rgba(255,213,79,0.4); }
.island-card .island-icon { font-size:38px; line-height:1; min-width:44px; text-align:center; }
.island-card .island-info { flex:1; }
.island-card .island-name { font-size:16px; font-weight:bold; margin-bottom:2px; }
.island-card .island-desc { font-size:11px; color:#888; margin-bottom:4px; }
.island-card .island-meta { font-size:11px; color:#aaa; }
.island-card .island-action { display:flex; flex-direction:column; gap:4px; }
.island-card .island-lock { color:#666; font-size:11px; text-align:center; }
.map-header {
  background:#0f0f18; padding:10px; border-radius:8px;
  margin-bottom:12px; text-align:center; font-size:13px;
}
</style>
</head>
<body>

<h1>⚔ RPG 冒險 ⚔</h1>

<!-- 開場 -->
<div id="screen-start" class="panel">
  <div class="panel-title">歡迎來到冒險世界</div>
  <p class="subtitle" style="margin-bottom:10px;">在很久很久以前...世界被黑暗籠罩...而你，是唯一的希望...</p>
  <div style="margin-bottom:10px;">
    <label style="font-size:13px;">勇者名字：</label>
    <input id="inputName" type="text" placeholder="無名勇者">
  </div>
  <div class="actions" style="justify-content:flex-start;">
    <button class="gold" onclick="startGame()">開始冒險</button>
  </div>
</div>

<!-- 村莊 -->
<div id="screen-town" class="panel hidden">
  <div class="panel-title">🏘️ 村莊</div>
  <div class="stat-row"><span>職業：<span class="val" id="townRole">-</span></span><span>等級：<span class="val" id="townLevel">1</span></span></div>
  <div class="stat-row"><span>HP：<span class="val" id="townHp">-</span></span><span>金幣：<span class="val" id="townMoney">0</span></span></div>
  <div class="stat-row"><span>攻擊：<span class="val" id="townAtk">-</span></span><span>防禦：<span class="val" id="townDef">-</span></span></div>
  <div class="stat-row"><span>藥水：<span class="val" id="townPotion">0</span></span><span>目前島嶼：<span class="val" id="townIsland">草原</span></span></div>
  <div class="stat-row"><span>經驗：<span class="val" id="townExp">0/100</span></span><span>擊殺：<span class="val" id="townKill">0</span></span></div>
  <div class="stat-row"><span>天賦點：<span class="val" id="townTalent">0</span></span><span>深淵最高：<span class="val" id="townAbyss">0</span></span></div>
  <div class="actions" style="margin-top:12px;">
    <button onclick="goAdventure()">⚔ 出發冒險</button>
    <button class="map" onclick="openMap()">🗺️ 世界地圖</button>
    <button class="abyss" onclick="openAbyss()">🌀 深淵</button>
    <button class="gold" onclick="openShop()">🛒 商店</button>
    <button class="fruit" onclick="openFruit()">🍇 果實</button>
    <button class="ach" onclick="openEquip()">🎽 裝備</button>
    <button class="talent" onclick="openTalent()">🌟 天賦</button>
    <button onclick="saveGame()">💾 存檔</button>
  </div>
</div>

<!-- 世界地圖 -->
<div id="screen-map" class="panel hidden">
  <div class="panel-title">🗺️ 世界地圖</div>
  <div class="map-header" id="mapHeader"></div>
  <div id="mapContent"></div>
  <div class="actions" style="margin-top:10px;"><button onclick="closeMap()">離開</button></div>
</div>

<!-- 商店 -->
<div id="screen-shop" class="panel hidden">
  <div class="panel-title">🛒 村莊商店 <span class="subtitle" id="shopMoney"></span></div>
  <div id="shopList"></div>
  <div class="actions" style="margin-top:10px;"><button onclick="closeShop()">離開商店</button></div>
</div>

<!-- 果實 -->
<div id="screen-fruit" class="panel hidden">
  <div class="panel-title">🍇 果實系統 <span class="subtitle" id="fruitMoney"></span></div>
  <div class="tabs">
    <div class="tab active" data-tab="draw" onclick="switchFruitTab('draw')">🎰 抽果</div>
    <div class="tab" data-tab="bag" onclick="switchFruitTab('bag')">🎒 背包</div>
    <div class="tab" data-tab="train" onclick="switchFruitTab('train')">💪 練果</div>
  </div>
  <div id="fruitContent"></div>
  <div class="actions" style="margin-top:10px;"><button onclick="closeFruit()">離開</button></div>
</div>

<!-- 裝備 -->
<div id="screen-equip" class="panel hidden">
  <div class="panel-title">🎽 裝備系統 <span class="subtitle" id="equipMoney"></span></div>
  <div class="tabs">
    <div class="tab active" data-tab="worn" onclick="switchEquipTab('worn')">👤 已裝備</div>
    <div class="tab" data-tab="bag" onclick="switchEquipTab('bag')">🎒 背包</div>
  </div>
  <div id="equipContent"></div>
  <div class="actions" style="margin-top:10px;"><button onclick="closeEquip()">離開</button></div>
</div>

<!-- 天賦 -->
<div id="screen-talent" class="panel hidden">
  <div class="panel-title">🌟 天賦樹 <span class="subtitle" id="talentPoints"></span></div>
  <div id="talentContent"></div>
  <div class="actions" style="margin-top:10px;">
    <button class="danger" onclick="resetTalents()">重置天賦（1000 金）</button>
    <button onclick="closeTalent()">離開</button>
  </div>
</div>

<!-- 深淵 -->
<div id="screen-abyss" class="panel hidden">
  <div class="panel-title">🌀 深淵模式</div>
  <div id="abyssContent"></div>
  <div class="actions" style="margin-top:10px;"><button onclick="closeAbyss()">離開</button></div>
</div>

<!-- 冒險 -->
<div id="screen-adventure" class="panel hidden">
  <div class="panel-title">🌲 探索中 <span id="advIsland" class="subtitle"></span></div>
  <div class="stat-row"><span>HP：<span class="val" id="advHp">-</span></span><span>金幣：<span class="val" id="advMoney">0</span></span></div>
  <div class="stat-row"><span>經驗：<span class="val" id="advExp">0/100</span></span><span>藥水：<span class="val" id="advPotion">0</span></span></div>
</div>

<!-- 戰鬥 -->
<div id="screen-battle" class="panel hidden">
  <div class="panel-title">🧙 你（<span id="battleRole"></span> Lv.<span id="battleLevel"></span>）
    <span id="comboBadge" class="badge combo hidden"></span>
  </div>
  <div class="hp-bar">
    <div id="playerHpBar" class="hp-fill green" style="width:100%"></div>
    <div class="hp-text" id="playerHpText">100 / 100</div>
  </div>
  <div class="stat-row" style="margin-top:6px;">
    <span>攻擊 <span class="val" id="battleAtk"></span></span>
    <span>防禦 <span class="val" id="battleDef"></span></span>
    <span>藥水 <span class="val" id="battlePotion"></span></span>
  </div>

  <div style="margin-top:16px;">
    <div class="panel-title">
      👹 <span id="monsterName">野生史萊姆</span>
      <span id="monsterPrefix" class="badge prefix hidden"></span>
      <span id="monsterBoss" class="badge boss hidden"></span>
    </div>
    <div class="hp-bar">
      <div id="monsterHpBar" class="hp-fill green" style="width:100%"></div>
      <div class="hp-text" id="monsterHpText">50 / 50</div>
    </div>
    <div class="stat-row" style="margin-top:6px;">
      <span>Lv.<span class="val" id="monsterLv"></span></span>
      <span>弱點 <span class="val" id="monsterWeak"></span></span>
      <span>抗性 <span class="val" id="monsterRes"></span></span>
    </div>
    <div class="subtitle" id="monsterSkill" style="margin-top:4px;"></div>
  </div>

  <div class="actions" style="margin-top:14px;">
    <button id="btnAttack" onclick="playerAttack()">普通攻擊</button>
    <button id="btnSkill" class="skill" onclick="playerSkill()">職業技能</button>
    <button id="btnPower" class="danger" onclick="playerPower()">全力一擊</button>
    <button id="btnDefend" class="defend" onclick="playerDefend()">防禦</button>
    <button id="btnPotion" class="potion" onclick="playerPotion()">藥水</button>
    <button id="btnCombo" class="gold hidden" onclick="playerCombo()">⚡ 連擊爆發</button>
    <button id="btnAuto" class="gold" onclick="toggleAuto()">自動</button>
  </div>

  <div id="fruitSkillBar"></div>

  <div class="actions">
    <button id="btnContinue" class="gold hidden" onclick="continueAdventure()">繼續探索</button>
    <button id="btnReturn" class="hidden" onclick="returnToTown()">返回村莊</button>
  </div>
</div>

<!-- 記錄 -->
<div class="panel">
  <div class="panel-title">📜 戰鬥記錄</div>
  <div id="log"></div>
</div>

const $ = id => document.getElementById(id);
const show = id => $(id).classList.remove('hidden');
const hide = id => $(id).classList.add('hidden');
const rand = (min,max) => Math.floor(Math.random()*(max-min+1))+min;
const roll = pct => Math.random()*100 < pct;

function log(msg,cls='') {
  const div = document.createElement('div');
  div.textContent = msg;
  if (cls) div.className = cls;
  $('log').appendChild(div);
  $('log').scrollTop = $('log').scrollHeight;
}
function clearLog() { $('log').innerHTML = ''; }

function showScreen(name) {
  ['screen-start','screen-town','screen-map','screen-shop','screen-fruit','screen-equip','screen-talent','screen-abyss','screen-adventure','screen-battle']
    .forEach(s => hide(s));
  if (name) show(name);
}

function elemName(e){return {1:'火',2:'冰',3:'雷',4:'物理'}[e]||'無';}

function getTalentBonus() {
  const b={atkPct:0,crit:0,critDmg:0,pierce:0,hpPct:0,defPct:0,dodge:0,regen:0,gold:0,exp:0,cd:0,fruitDmg:0};
  for (const [id,lv] of Object.entries(S.talents)) {
    const t=TALENTS[id];
    if (!t||!lv) continue;
    b[t.effect]+=t.per*lv;
  }
  return b;
}

function effAtk(){return Math.floor(S.atk*(1+getTalentBonus().atkPct/100));}
function effDef(){return Math.floor(S.def*(1+getTalentBonus().defPct/100));}
function effMaxHp(){return Math.floor(S.maxHp*(1+getTalentBonus().hpPct/100));}
function effDodge(){return S.playerDodge+getTalentBonus().dodge;}
function effCritRate(){return S.critRate+getTalentBonus().crit;}
function effCritDmg(){return S.critDmg+getTalentBonus().critDmg;}

function getIsland(){return ISLANDS[S.currentIsland];}

  else if (n<=35) S.roleType=4; else if (n<=45) S.roleType=5; else if (n<=55) S.roleType=6;
  else if (n<=63) S.roleType=7; else if (n<=72) S.roleType=8; else if (n<=80) S.roleType=9;
  else if (n<=88) S.roleType=10; else if (n<=95) S.roleType=11; else S.roleType=12;
  const role = ROLES[S.roleType];
  S.roleName = role.name;
  S.maxHp = role.hp; S.hp = role.hp;

function saveGame() {

  catch(e) { log('【系統】存檔失敗。','lose'); }
}
function loadGame() {
  try {
    const data = localStorage.getItem('rpg_save_v4');
    if (data) {
      const p = JSON.parse(data);
      Object.assign(S, p);
      if (!S.equipment) S.equipment = {weapon:null,armor:null,accessory:null};
      if (!S.inventory) S.inventory = [];
      if (!S.talents) S.talents = {};
      if (!S.achievements) S.achievements = {};
      if (!S.fruits) S.fruits = {};
      if (!S.islandBossDefeated) S.islandBossDefeated = {};
      if (!S.currentIsland) S.currentIsland = 'grassland';
      return true;
    }
  } catch(e) {}
  return false;
}

  log(`${island.desc}`, 'system');
  saveGame();
  closeMap();
}

function pickRarity(bonus=0){const r=Math.random()*100-bonus;if(r<1)return 6;if(r<5)return 5;if(r<15)return 4;if(r<35)return 3;if(r<65)return 2;return 1;}

function genEquipment(level, forcedRarity) {
  const rarity = forcedRarity || pickRarity(0);
  const rar = RARITY[rarity];
  const slotKeys = ['weapon','armor','accessory'];
  const slot = slotKeys[rand(0,2)];
  const sd = SLOT_DATA[slot];
  const name = sd.pre[rand(0,sd.pre.length-1)] + sd.base[rand(0,sd.base.length-1)];
  const affixes = [];
  if (slot === 'weapon') {
    const v = Math.round((5 + level*1.5) * rar.mult);
    affixes.push({stat:'atk',val:v,label:`攻擊 +${v}`});
  } else if (slot === 'armor') {
    const v = Math.round((20 + level*6) * rar.mult);
    affixes.push({stat:'hp',val:v,label:`生命 +${v}`});
  } else {
    const v = Math.round((3 + level*1) * rar.mult);
    const types = [
      {stat:'atk',val:v,label:`攻擊 +${v}`},
      {stat:'hp',val:Math.round(v*5),label:`生命 +${Math.round(v*5)}`},
      {stat:'crit',val:Math.max(1,Math.round(v/3)),label:`爆擊率 +${Math.max(1,Math.round(v/3))}%`},
    ];
    affixes.push(types[rand(0,types.length-1)]);
  }
  const used = new Set(affixes.map(a=>a.stat));
  for (let i = 0; i < rar.affixes; i++) {
    let tries = 0;
    while (tries++ < 20) {
      const a = AFFIX_POOL[rand(0,AFFIX_POOL.length-1)];
      if (used.has(a.stat)) continue;
      const v = Math.max(1, Math.round((a.base + level*a.scale) * rar.mult));
      affixes.push({stat:a.stat,val:v,label:`${a.label} +${v}${a.pct?'%':''}`});
      used.add(a.stat);
      break;
    }
  }
  return {uid:'eq_'+Date.now()+'_'+Math.random().toString(36).slice(2,7),slot,name,rarity,level,affixes};
}

function applyEquipStats(item,sign=1) {
  if (!item) return;
  for (const a of item.affixes) {
    switch(a.stat) {
      case 'atk': S.atk+=sign*a.val; break;
      case 'def': S.def+=sign*a.val; break;
      case 'hp': S.maxHp+=sign*a.val; if (sign>0) S.hp+=a.val; break;
      case 'crit': S.critRate+=sign*a.val; break;
      case 'critDmg': S.critDmg+=sign*a.val; break;
      case 'lifesteal': S.lifesteal+=sign*a.val; break;
      case 'reflect': S.reflect+=sign*a.val; break;
      case 'dodge': S.playerDodge+=sign*a.val; break;
      case 'gold': S.goldBonus+=sign*a.val; break;
      case 'exp': S.expBonus+=sign*a.val; break;
    }
  }
  if (S.hp > effMaxHp()) S.hp = effMaxHp();
}
function equipItem(item) {
  const slot = item.slot;
  const old = S.equipment[slot];
  if (old) { applyEquipStats(old,-1); S.inventory.push(old); }
  S.inventory = S.inventory.filter(i=>i.uid !== item.uid);
  S.equipment[slot] = item;
  applyEquipStats(item,1);
  log(`裝備了 ${item.name}`,'win');
  checkAchievements(); renderEquip();
}
function unequipSlot(slot) {
  const old = S.equipment[slot];
  if (!old) return;
  applyEquipStats(old,-1);
  S.inventory.push(old);
  S.equipment[slot] = null;
  renderEquip();
}
function sellItem(item) {
  const price = (5 + item.level*3) * item.rarity;
  S.money += price;
  S.inventory = S.inventory.filter(i=>i.uid !== item.uid);
  log(`賣出 ${item.name}，獲得 ${price} 金幣。`,'loot');
  renderEquip(); updateTownUI();
}

let equipTab = 'worn';
function openEquip() { showScreen('screen-equip'); renderEquip(); }
function closeEquip() { updateTownUI(); showScreen('screen-town'); }
function switchEquipTab(t) {
  equipTab = t;
  document.querySelectorAll('#screen-equip .tab').forEach(x => x.classList.toggle('active', x.dataset.tab === t));
  renderEquip();
}
function renderEquip() {
  $('equipMoney').textContent = `（金幣：${S.money}｜背包 ${S.inventory.length} 件）`;
  const c = $('equipContent');
  const itemHTML = (item, actions = true) => {
    if (!item) return '';
    const rar = RARITY[item.rarity];
    const affixHTML = item.affixes.map(a => `<span class="equip-affix">${a.label}</span>`).join('');
    return `<div class="equip-bag-item">
      <div style="flex:1;">
        <div class="equip-item-name rarity-${item.rarity}">${item.name} <span class="subtitle">[${rar.name}] Lv.${item.level}</span></div>
        <div>${affixHTML}</div>
      </div>
      ${actions?`<div style="white-space:nowrap;">
        <button class="small gold" onclick="equipItemById('${item.uid}')">裝備</button>
        <button class="small danger" onclick="sellItemById('${item.uid}')">賣出</button>
      </div>`:''}
    </div>`;
  };
  if (equipTab === 'worn') {
    let html = '';
    for (const slot of ['weapon','armor','accessory']) {
      const item = S.equipment[slot];
      const sd = SLOT_DATA[slot];
      html += `<div class="equip-slot">
        <span class="slot-name">${sd.name}</span>
        <div style="flex:1;margin-left:10px;">${item ? itemHTML(item, false) : '<span class="subtitle">（未裝備）</span>'}</div>
        ${item?`<button class="small danger" onclick="unequipSlotById('${slot}')">卸下</button>`:''}
      </div>`;
    }
    c.innerHTML = html;
    return;
  }
  if (equipTab === 'bag') {
    if (!S.inventory.length) { c.innerHTML = `<div class="subtitle" style="padding:20px;text-align:center;">🎒 背包沒有裝備</div>`; return; }
    const sorted = [...S.inventory].sort((a,b) => b.rarity - a.rarity || b.level - a.level);
    c.innerHTML = sorted.map(item => itemHTML(item, true)).join('');
  }
}
function equipItemById(uid){const item=S.inventory.find(i=>i.uid===uid);if(item)equipItem(item);}
function sellItemById(uid){const item=S.inventory.find(i=>i.uid===uid);if(item)sellItem(item);}
function unequipSlotById(slot){unequipSlot(slot);}

  $('talentPoints').textContent = `（可用點數：${S.talentPoints}）`;
  const branches = {
    atk:{name:'⚔ 攻擊',color:'#f44336'},
    def:{name:'🛡 防禦',color:'#4fc3f7'},
    util:{name:'✨ 特殊',color:'#ffd54f'},
  };
  let html = '';
  for (const [bid,br] of Object.entries(branches)) {
    html += `<div class="talent-branch"><div class="talent-branch-title" style="color:${br.color};">${br.name}</div>`;
    for (const [tid,t] of Object.entries(TALENTS)) {
      if (t.branch !== bid) continue;
      const lv = S.talents[tid] || 0;
      const canUp = lv < t.max && S.talentPoints > 0;
      html += `<div class="talent-item">
        <div class="talent-info">
          <div class="talent-name">${t.name} <span class="talent-lv">Lv.${lv}/${t.max}</span></div>
          <div class="talent-desc">${t.desc(lv)}</div>
        </div>
        <button class="talent small" ${canUp?'':'disabled'} onclick="upgradeTalent('${tid}')">+1</button>
      </div>`;
    }
    html += `</div>`;
  }
  $('talentContent').innerHTML = html;
}
function upgradeTalent(id) {
  const t = TALENTS[id]; if (!t) return;
  const lv = S.talents[id] || 0;
  if (lv >= t.max) return;
  if (S.talentPoints <= 0) { log('沒有天賦點！','lose'); return; }
  S.talents[id] = lv + 1;
  S.talentPoints--;
  log(`天賦 ${t.name} 提升至 Lv.${lv+1}`,'talent-text');
  renderTalent(); updateTownUI();
}
function resetTalents() {
  if (S.money < 1000) { log('金幣不足！需要 1000 金。','lose'); return; }
  let total = 0;
  for (const lv of Object.values(S.talents)) total += lv;
  if (total === 0) { log('沒有天賦可重置。','system'); return; }
  S.money -= 1000;
  S.talentPoints += total;
  S.talents = {};
  log(`重置天賦，返還 ${total} 點。`,'talent-text');
  renderTalent(); updateTownUI();
}

let fruitTab = 'draw';
function openFruit() { showScreen('screen-fruit'); renderFruit(); }
function closeFruit() { updateTownUI(); showScreen('screen-town'); }
function switchFruitTab(t) {
  fruitTab = t;
  document.querySelectorAll('#screen-fruit .tab').forEach(x => x.classList.toggle('active', x.dataset.tab === t));
  renderFruit();
}
function drawCost() {
  if (S.level < 15) return null;
  if (S.level < 50) return 500;
  if (S.level < 100) return 1500;
  return 3000;
}
function renderFruit() {
  $('fruitMoney').textContent = `（金幣：${S.money}）`;
  const c = $('fruitContent');
  if (fruitTab === 'draw') {
    const cost = drawCost();
    if (cost === null) {
      c.innerHTML = `<div class="subtitle" style="padding:20px;text-align:center;">🍇 需要達到 <b style="color:#ffd54f;">Lv.15</b> 才能開始抽果實！<br>（目前 Lv.${S.level}）</div>`;
      return;
    }
    c.innerHTML = `<div style="text-align:center;padding:10px;">
      <div class="subtitle">每次抽果消耗 <b style="color:#ffd54f;">${cost} 金幣</b></div>
      <div class="subtitle" style="margin-bottom:10px;">目前等級 Lv.${S.level}｜金幣 ${S.money}</div>
      <div class="actions">
        <button class="fruit" onclick="drawFruit(1)">抽 1 次（${cost} 金）</button>
        <button class="fruit" onclick="drawFruit(10)">抽 10 次（${cost*10} 金）</button>
      </div></div>`;
    return;
  }
  if (fruitTab === 'bag') {
    const owned = Object.keys(S.fruits);
    if (!owned.length) { c.innerHTML = `<div class="subtitle" style="padding:20px;text-align:center;">🎒 背包空空如也</div>`; return; }
    c.innerHTML = owned.map(id => {
      const f = FRUITS[id], data = S.fruits[id];
      const isActive = S.activeFruit === id;
      const skills = f.skills.map(sk => {
        const unlocked = data.level >= sk.lv;
        return `<div class="fruit-skill" style="color:${unlocked?'#80cbc4':'#555'}">${unlocked?'✓':'🔒'} Lv.${sk.lv} ${sk.name}｜${sk.desc}（CD ${sk.cd}）</div>`;
      }).join('');
      return `<div class="fruit-card ${isActive?'active':''}">
        <div class="fruit-name">${f.icon} ${f.name}</div>
        <div class="fruit-lv">Lv.${data.level}｜經驗 ${data.exp}｜屬性：${elemName(f.element)}</div>
        <div class="fruit-bar"><div class="fruit-bar-fill" style="width:${Math.min(100, Math.floor(data.exp/fruitExpNeeded(data.level)*100))}%"></div></div>
        <div class="subtitle">${f.desc}</div>${skills}
        <div style="margin-top:8px;">${isActive?'<button class="gold small" onclick="unequipFruit()">卸下</button>':`<button class="fruit small" onclick="equipFruit('${id}')">裝備</button>`}</div>
      </div>`;
    }).join('');
    return;
  }
  if (fruitTab === 'train') {
    const owned = Object.keys(S.fruits);
    if (!owned.length) { c.innerHTML = `<div class="subtitle" style="padding:20px;text-align:center;">🎒 沒有果實可以練</div>`; return; }
    c.innerHTML = owned.map(id => {
      const f = FRUITS[id], data = S.fruits[id];
      const cost = trainCost(data.level);
      const canTrain = S.money >= cost;
      return `<div class="fruit-card">
        <div class="fruit-name">${f.icon} ${f.name} Lv.${data.level}</div>
        <div class="fruit-bar"><div class="fruit-bar-fill" style="width:${Math.min(100, Math.floor(data.exp/fruitExpNeeded(data.level)*100))}%"></div></div>
        <div class="subtitle">經驗 ${data.exp} / ${fruitExpNeeded(data.level)}</div>
        <div style="margin-top:8px;">
          <button class="fruit small" ${canTrain?'':'disabled'} onclick="trainFruit('${id}')">練果（${cost} 金）</button>
          <button class="fruit small" ${canTrain?'':'disabled'} onclick="trainFruit10('${id}')">練 10 次（${cost*10} 金）</button>
        </div></div>`;
    }).join('');
  }
}
function fruitExpNeeded(lv){return Math.floor(100*Math.pow(lv,1.4));}
function trainCost(lv){return 50+lv*20;}
function pickFruit(){const total=FRUIT_POOL.reduce((s,p)=>s+p.weight,0);let r=Math.random()*total;for(const p of FRUIT_POOL){r-=p.weight;if(r<=0)return p.id;}return FRUIT_POOL[0].id;}
function drawFruit(times) {
  const cost = drawCost()*times;
  if (S.money < cost) { log('金幣不足！','lose'); return; }
  S.money -= cost;
  const results = [];
  for (let i = 0; i < times; i++) {
    const id = pickFruit();
    if (!S.fruits[id]) { S.fruits[id] = {level:1,exp:0}; results.push({id,isNew:true}); }
    else {
      S.fruits[id].exp += 50;
      while (S.fruits[id].exp >= fruitExpNeeded(S.fruits[id].level)) {
        S.fruits[id].exp -= fruitExpNeeded(S.fruits[id].level);
        S.fruits[id].level++;
      }
      results.push({id,isNew:false});
    }
  }
  const c = $('fruitContent');
  let html = `<div style="text-align:center;margin-bottom:10px;"><b style="color:#ffd54f;">抽果結果</b></div>`;
  html += results.map(r => {
    const f = FRUITS[r.id];
    return `<div class="fruit-card"><span class="fruit-name">${f.icon} ${f.name}</span>${r.isNew?'<span style="color:#4caf50;font-size:12px;"> NEW!</span>':'<span style="color:#888;font-size:12px;">（重複，經驗+50）</span>'}</div>`;
  }).join('');
  html += `<div class="actions"><button class="fruit" onclick="renderFruit()">返回</button></div>`;
  c.innerHTML = html;
  log(`抽果 ${times} 次，消耗 ${cost} 金幣。`,'fruit-text');
  updateTownUI(); checkAchievements();
}
function equipFruit(id){S.activeFruit=id;log(`裝備果實：${FRUITS[id].name}`,'fruit-text');renderFruit();}
function unequipFruit(){S.activeFruit=null;renderFruit();}
function trainFruit(id) {
  const data = S.fruits[id];
  const cost = trainCost(data.level);
  if (S.money < cost) { log('金幣不足！','lose'); return; }
  S.money -= cost;
  data.exp += rand(30,80);
  while (data.exp >= fruitExpNeeded(data.level)) {
    data.exp -= fruitExpNeeded(data.level);
    data.level++;
    const f = FRUITS[id];
    const unlocked = f.skills.find(sk => sk.lv === data.level);
    if (unlocked) log(`★ ${f.name} 解鎖新技能：${unlocked.name}！`,'fruit-text');
  }
  log(`練果成功！${FRUITS[id].name} 目前 Lv.${data.level}`,'fruit-text');
  renderFruit(); updateTownUI();
}
function trainFruit10(id) {
  const data = S.fruits[id];
  const cost = trainCost(data.level)*10;
  if (S.money < cost) { log('金幣不足！','lose'); return; }
  S.money -= cost;
  for (let i = 0; i < 10; i++) {
    data.exp += rand(30,80);
    while (data.exp >= fruitExpNeeded(data.level)) {
      data.exp -= fruitExpNeeded(data.level);
      data.level++;
      const f = FRUITS[id];
      const unlocked = f.skills.find(sk => sk.lv === data.level);
      if (unlocked) log(`★ ${f.name} 解鎖新技能：${unlocked.name}！`,'fruit-text');
    }
  }
  log(`練果 10 次完成！${FRUITS[id].name} 目前 Lv.${data.level}`,'fruit-text');
  renderFruit(); updateTownUI();
}

function openAbyss() { showScreen('screen-abyss'); renderAbyss(); }
function closeAbyss() { updateTownUI(); showScreen('screen-town'); }
function renderAbyss() {
  const c = $('abyssContent');
  if (S.abyssFloor === 0) {
    c.innerHTML = `<div class="abyss-floor">
      <div class="abyss-floor-num">∞</div>
      <div class="subtitle">深淵無盡，越深越強</div>
      <div class="abyss-record">歷史最高：第 ${S.abyssBest} 層</div>
      <div class="subtitle" style="margin-top:10px;color:#ffd54f;">獎勵：每層裝備 + 金幣 + 經驗</div>
      <div class="actions" style="margin-top:16px;"><button class="abyss" onclick="startAbyss()">🌀 挑戰深淵</button></div>
      <div class="subtitle" style="margin-top:12px;font-size:11px;">⚠ 深淵中無法返回村莊（除非戰敗）<br>⚠ 每 10 層出現 BOSS</div>
    </div>`;
  }
}
function startAbyss() {
  S.abyssFloor = 1; S.inAbyss = true; S.hp = effMaxHp();
  log('🌀 進入深淵第 1 層...','abyss');
  showScreen('screen-adventure');
  setTimeout(() => abyssEncounter(), 800);
}
function abyssEncounter() {
  if (S.hp <= 0) { abyssDeath(); return; }
  const floor = S.abyssFloor;
  const isBoss = floor % 10 === 0;
  if (isBoss) { log(`★ 深淵第 ${floor} 層 BOSS！`,'boss'); spawnAbyssBoss(floor); }
  else spawnAbyssMonster(floor);
  startBattle();
}
function spawnAbyssMonster(floor) {
  const islandKeys = Object.keys(ISLANDS);
  const island = ISLANDS[islandKeys[rand(0, islandKeys.length-1)]];
  const m = island.monsters[rand(0, island.monsters.length-1)];
  const mult = 1 + floor*0.25;
  const lv = Math.max(1, S.level + Math.floor(floor/3));
  S.monster = {
    name:`[深淵${floor}F] ${m.name}`, skill:m.skill,
    hp:Math.floor((m.hp + m.hp*0.3*lv) * mult),
    atk:Math.floor((m.atk + m.atk*0.3*lv) * mult),
    def:Math.floor((m.def + m.def*0.3*lv) * mult),
    exp:Math.floor(m.exp*lv*mult), money:Math.floor(m.money*lv*mult),
    maxHp:0, lv, type:1,
    weak:m.weak, res:m.res, dodge:m.dodge,
    prefixType:0, prefix:"", isAbyss:true,
  };
  if (floor >= 5 && roll(40)) {
    const pt = rand(1,12);
    S.monster.prefixType = pt;
    S.monster.prefix = PREFIXES[pt].name;
    S.monster.name = S.monster.prefix + S.monster.name;
    if (pt === 6) S.monster.def = Math.floor(S.monster.def*1.5);
    if (pt === 10) { S.monster.hp = Math.floor(S.monster.hp*1.5); S.monster.atk = Math.floor(S.monster.atk*1.2); }
    if (pt === 11) S.monster.dodge += 20;
  }
  S.monster.maxHp = S.monster.hp;
}
function spawnAbyssBoss(floor) {
  const islands = Object.values(ISLANDS);
  const pick = islands[rand(0, islands.length-1)];
  const b = pick.boss;
  const mult = 1 + floor*0.15;
  S.monster = {
    name:`[深淵${floor}F] ${b.name}`, skill:b.skill,
    hp:Math.floor(b.hp*mult), atk:Math.floor(b.atk*mult), def:Math.floor(b.def*mult),
    exp:Math.floor(b.exp*mult), money:Math.floor(b.money*mult),
    maxHp:0, lv:S.level, type:100,
    weak:b.weak, res:b.res, dodge:10,
    prefixType:0, prefix:"", isBoss:true, isAbyss:true,
    lines:b.lines || [],
  };
  S.monster.maxHp = S.monster.hp;
}
function abyssDeath() {
  const reward = S.abyssFloor * 50;
  S.money += reward;
  S.abyssBest = Math.max(S.abyssBest, S.abyssFloor);
  log(`🌀 深淵挑戰結束（第 ${S.abyssFloor} 層），獲得 ${reward} 金幣。`,'lose');
  S.abyssFloor = 0; S.inAbyss = false; S.hp = effMaxHp();
  updateTownUI(); saveGame(); showScreen('screen-town');
  checkAchievements();
}
function abyssNextFloor() {
  S.abyssFloor++;
  log(`🌀 進入深淵第 ${S.abyssFloor} 層...`,'abyss');
  setTimeout(() => abyssEncounter(), 600);
}

//  冒險（一般，使用島嶼系統）
// ============================================================
function goAdventure() {
  if (S.hp <= 0) S.hp = effMaxHp();
  S.inAbyss = false;
  showScreen('screen-adventure');
  updateAdventureUI();
  const island = getIsland();
  log(`你踏上【${island.name}】的土地...`,'map-text');
  setTimeout(nextEncounter, 500);
}
function updateAdventureUI() {
  $('advHp').textContent = `${S.hp}/${effMaxHp()}`;
  $('advMoney').textContent = S.money;
  $('advExp').textContent = `${S.exp}/${S.expNeeded}`;
  $('advPotion').textContent = S.potion;
  $('advIsland').textContent = `｜${getIsland().icon} ${getIsland().name}`;
}

function nextEncounter() {
  if (S.hp <= 0) { handleDeath(); return; }
  if (!S.isBossFight && roll(30)) {
    triggerRandomEvent();
    if (S.hp <= 0) { handleDeath(); return; }
  }
  S.isBossFight = false;
  // 島 BOSS 觸發：該島累積擊殺 10 隻，且 BOSS 未擊敗
  const island = getIsland();
  if (S.islandKills >= 10 && !S.islandBossDefeated[S.currentIsland]) {
    S.isBossFight = true;
    log(`★ 【${island.name}】BOSS 出現！`,'boss');
  }
  if (S.isBossFight) spawnIslandBoss();
  else spawnIslandMonster();
  startBattle();
}

function spawnIslandMonster() {
  const island = getIsland();
  const m = island.monsters[rand(0, island.monsters.length-1)];
  // 怪物等級約等於島嶼需求等級，小幅波動
  const baseLv = Math.max(1, island.reqLevel);
  const lv = baseLv + rand(-2, 2);
  const lvMult = 1 + (lv - island.reqLevel) * 0.05;

  const tpl = {
    name:m.name, skill:m.skill,
    hp: Math.floor(m.hp * lvMult),
    atk: Math.floor(m.atk * lvMult),
    def: Math.floor(m.def * lvMult),
    exp: m.exp, money: m.money,
    weak:m.weak, res:m.res, dodge:m.dodge,
  };
  let prefixType = 0, prefix = "";
  if (roll(30)) {
    prefixType = rand(1,12);
    prefix = PREFIXES[prefixType].name;
    if (prefixType === 6) tpl.def = Math.floor(tpl.def*1.5);
    if (prefixType === 10) { tpl.hp = Math.floor(tpl.hp*1.5); tpl.atk = Math.floor(tpl.atk*1.2); }
    if (prefixType === 11) tpl.dodge += 20;
  }
  S.monster = { ...tpl, maxHp:tpl.hp, lv, type:1, prefixType, prefix, name:prefix + tpl.name };
  if (prefixType) log(`詞綴：${prefix}（${PREFIXES[prefixType].desc}）`,'skill-text');
}

function spawnIslandBoss() {
  const b = getIsland().boss;
  const island = getIsland();
  const lv = Math.max(1, island.reqLevel + 5);
  S.monster = {
    name:b.name, skill:b.skill,
    hp:b.hp, atk:b.atk, def:b.def,
    exp:b.exp, money:b.money,
    maxHp:b.hp, lv, type:100,
    weak:b.weak, res:b.res, dodge:10,
    prefixType:0, prefix:"", isBoss:true,
    lines: b.lines || [],
    islandId: S.currentIsland,
  };
}

function startBattle() {
  S.inBattle = true; S.gameOver = false;
  S.skillCD = 0; S.fruitSkillCD = 0;
  S.isDefending = false; S.isShieldActive = false;
  S.monsterFrozen = false; S.monsterCharging = false;
  S.poisonTurns = 0; S.poisonDamage = 0;
  S.burnTurns = 0; S.burnDamage = 0;
  S.combo = 0;
  if (S.monster.prefixType === 5) {
    S.skillCD += 1;
    log(`【詛咒】${S.monster.name} 的詛咒讓你技能冷卻變慢！`,'skill-text');
  }
  showScreen('screen-battle');
  renderBattleUI();
  enableButtons(true);
  log(`遭遇 ${S.monster.name} (Lv.${S.monster.lv})！`,'system');
  log(`怪物特性：${S.monster.skill}`,'system');
  if (S.monster.lines && S.monster.lines.length) {
    let i = 0;
    const showNext = () => {
      if (i < S.monster.lines.length) {
        log(S.monster.lines[i], 'boss');
        i++;
        setTimeout(showNext, 900);
      }
    };
    setTimeout(showNext, 500);
  }
}

function enableButtons(on) {
  ['btnAttack','btnSkill','btnPower','btnDefend','btnPotion'].forEach(id => $(id).disabled = !on);
  $('btnAuto').disabled = false;
}

function renderBattleUI() {
  const maxHp = effMaxHp();
  const hpPct = Math.max(0, S.hp/maxHp*100);
  const bar = $('playerHpBar');
  bar.style.width = hpPct+'%';
  bar.className = 'hp-fill ' + (hpPct>60?'green':hpPct>30?'yellow':'red');
  $('playerHpText').textContent = `${Math.max(0,S.hp)} / ${maxHp}`;
  $('battleRole').textContent = S.roleName;
  $('battleLevel').textContent = S.level;
  $('battleAtk').textContent = effAtk();
  $('battleDef').textContent = effDef();
  $('battlePotion').textContent = S.potion;

  const m = S.monster;
  if (m) {
    const mPct = Math.max(0, m.hp/m.maxHp*100);
    const mBar = $('monsterHpBar');
    mBar.style.width = mPct+'%';
    mBar.className = 'hp-fill ' + (mPct>60?'green':mPct>30?'yellow':'red');
    $('monsterHpText').textContent = `${Math.max(0,m.hp)} / ${m.maxHp}`;
    $('monsterName').textContent = m.name;
    $('monsterLv').textContent = m.lv;
    $('monsterWeak').textContent = elemName(m.weak);
    $('monsterRes').textContent = elemName(m.res);
    $('monsterSkill').textContent = m.skill;
    const pBadge = $('monsterPrefix');
    if (m.prefixType) { pBadge.textContent = m.prefix; pBadge.classList.remove('hidden'); }
    else pBadge.classList.add('hidden');
    const bBadge = $('monsterBoss');
    if (m.isBoss) {
      bBadge.textContent = S.inAbyss ? `深淵 ${S.abyssFloor}F` : `${getIsland().name} BOSS`;
      bBadge.classList.remove('hidden');
    } else bBadge.classList.add('hidden');
  }

  const sk = $('btnSkill');
  if (S.skillCD > 0) { sk.textContent = `職業技能 (CD:${S.skillCD})`; sk.disabled = true; }
  else { sk.textContent = '職業技能'; sk.disabled = false; }

  const cb = $('comboBadge');
  if (S.combo > 0) { cb.textContent = `🔥 ${S.combo} 連擊`; cb.classList.remove('hidden'); }
  else cb.classList.add('hidden');

  const btnCombo = $('btnCombo');
  if (S.combo >= 5) btnCombo.classList.remove('hidden');
  else btnCombo.classList.add('hidden');

  renderFruitSkillBar();
}

function renderFruitSkillBar() {
  const bar = $('fruitSkillBar');
  if (!S.activeFruit || !S.fruits[S.activeFruit]) {
    bar.innerHTML = '<span class="subtitle">尚未裝備果實</span>';
    return;
  }
  const f = FRUITS[S.activeFruit];
  const data = S.fruits[S.activeFruit];
  let usable = null;
  for (const sk of f.skills) if (data.level >= sk.lv) usable = sk;
  if (!usable) { bar.innerHTML = '<span class="subtitle">果實技能未解鎖</span>'; return; }
  const cdText = S.fruitSkillCD > 0 ? `(CD:${S.fruitSkillCD})` : '';
  bar.innerHTML = `<button id="btnFruitSkill" class="fruit" ${S.fruitSkillCD>0?'disabled':''} onclick="playerFruitSkill()">
    ${f.icon} ${usable.name} ${cdText}</button>`;
}

function playerAttack(){if(S.inBattle&&!S.gameOver)playerAction(1);}
function playerSkill(){
  if (!S.inBattle||S.gameOver) return;
  if (S.skillCD>0) { log(`技能還在冷卻中（剩 ${S.skillCD} 回合）`,'system'); return; }
  playerAction(2);
}
function playerPower(){if(S.inBattle&&!S.gameOver)playerAction(3);}
function playerDefend(){if(S.inBattle&&!S.gameOver)playerAction(4);}

function playerCombo() {
  if (!S.inBattle||S.gameOver) return;
  if (S.combo < 5) { log('連擊不足！','system'); return; }
  enableButtons(false);
  const m = S.monster;
  const mult = 2 + S.combo * 0.15;
  let pDmg = Math.round(effAtk() * mult);
  log(`⚡ 【連擊爆發】消耗 ${S.combo} 連擊，造成 ${pDmg} 點毀滅傷害！`,'combo-text');
  m.hp -= pDmg;
  S.combo = 0;
  renderBattleUI();
  if (m.hp <= 0) { m.hp = 0; renderBattleUI(); setTimeout(onMonsterDefeated, 400); return; }
  setTimeout(monsterTurn, 600);
}

function playerPotion() {
  if (!S.inBattle||S.gameOver) return;
  if (S.potion <= 0) { log('沒有藥水了！','lose'); return; }
  const maxHp = effMaxHp();
  const heal = Math.floor(maxHp*0.4);
  S.hp = Math.min(maxHp, S.hp+heal);
  S.potion--;
  log(`【藥水】回復 ${heal} 點 HP！（剩餘 ${S.potion} 瓶）`,'win');
  renderBattleUI();
  setTimeout(monsterTurn, 600);
}

function playerFruitSkill() {
  if (!S.inBattle||S.gameOver) return;
  if (S.fruitSkillCD > 0) { log(`果實技能冷卻中（剩 ${S.fruitSkillCD} 回合）`,'system'); return; }
  if (!S.activeFruit || !S.fruits[S.activeFruit]) return;
  const f = FRUITS[S.activeFruit];
  const data = S.fruits[S.activeFruit];
  let usable = null;
  for (const sk of f.skills) if (data.level >= sk.lv) usable = sk;
  if (!usable) return;
  enableButtons(false);
  const m = S.monster;
  const fruitBonus = 1 + getTalentBonus().fruitDmg/100;
  let pDmg = Math.round(effAtk() * usable.mult * fruitBonus);
  let element = f.element;
  log(`【${f.name}·${usable.name}】${usable.desc}`,'fruit-text');
  let mult = 1.0;
  if (element === m.weak) { mult = 1.5; log('【弱點命中！】傷害 ×1.5','crit'); }
  else if (element === m.res) { mult = 0.7; log('【抗性】傷害 ×0.7','system'); }
  pDmg = Math.max(1, Math.round(pDmg*mult));
  if (S.activeFruit==='ice'||S.activeFruit==='void') {
    if (roll(30)) { S.monsterFrozen=true; log('敵人被凍結！','skill-text'); }
  }
  if (S.activeFruit==='flame'||S.activeFruit==='phoenix') {
    S.burnTurns = 3; S.burnDamage = Math.floor(effMaxHp()*0.02)+5;
    log('敵人被點燃！','skill-text');
  }
  if (['dark','phoenix','light','void'].includes(S.activeFruit)) {
    const steal = Math.floor(pDmg*0.2);
    S.hp = Math.min(effMaxHp(), S.hp+steal);
    log(`吸收精氣，回復 ${steal} 點 HP！`,'win');
  }
  m.hp -= pDmg;
  log(`造成 ${pDmg} 點傷害！`,'dmg-player');
  S.fruitSkillCD = Math.max(1, usable.cd - getTalentBonus().cd);
  renderBattleUI();
  if (m.hp<=0) { m.hp=0; renderBattleUI(); setTimeout(onMonsterDefeated,400); return; }
  setTimeout(monsterTurn, 600);
}

function playerAction(action) {
  enableButtons(false);
  const m = S.monster;
  if (action === 4) {
    S.isDefending = true;
    log('【防禦】你擺出防禦姿態。','system');
    setTimeout(monsterTurn, 500);
    return;
  }
  let pDmg = 0, element = 4;
  if (action === 2) {
    switch(S.roleType) {
      case 1: pDmg=Math.round(effAtk()*2.3)*2;S.skillCD=3;log(`【會心一擊】造成 ${pDmg} 點傷害！`,'skill-text');break;
      case 2: pDmg=effAtk();S.skillCD=5;S.isShieldActive=true;log(`【鐵壁嘲諷】造成 ${pDmg} 點傷害，下回合減傷 70%！`,'skill-text');break;
      case 3: pDmg=effAtk()*3;S.skillCD=4;log(`【影襲】造成 ${pDmg} 點傷害！`,'skill-text');break;
      case 4: { S.skillCD=1;const td=S.level*4;pDmg=effAtk()+td;log(`【厚積薄發】造成 ${pDmg} 點傷害！`,'skill-text');break; }
      case 5: { S.skillCD=4;pDmg=Math.round(effAtk()*3.5);element=1;
        if (roll(20)) { S.monsterFrozen=true;log('【冰凍】敵人被凍結！','skill-text'); }
        const bf=Math.floor(S.hp*0.10);S.hp-=bf;
        log(`【奧術隕石】造成 ${pDmg} 點傷害！`,'skill-text');
        log(`【副作用】魔能反噬 ${bf} 點！`,'lose');break; }
      case 6: { S.skillCD=3;pDmg=Math.round(effAtk()*1.8);element=3;
        const st=Math.round(pDmg*0.6);S.hp=Math.min(effMaxHp(),S.hp+st);
        log(`【暗影吸魂斬】造成 ${pDmg} 點傷害，吸取 ${st} HP！`,'skill-text');break; }
      case 7: { S.skillCD=3;pDmg=Math.round(effAtk()*1.5);
        const heal=Math.floor(effMaxHp()*0.3);S.hp=Math.min(effMaxHp(),S.hp+heal);
        log(`【聖光治癒】造成 ${pDmg} 點傷害並回復 ${heal} HP！`,'skill-text');break; }
      case 8: { S.skillCD=3;const ratio=1+(1-S.hp/effMaxHp())*2;pDmg=Math.round(effAtk()*ratio);
        log(`【狂暴斬】造成 ${pDmg} 點傷害！`,'skill-text');break; }
      case 9: { S.skillCD=3;element=rand(1,4);pDmg=Math.round(effAtk()*2.6);
        log(`【元素爆發】${elemName(element)}屬性，造成 ${pDmg} 點傷害！`,'skill-text');break; }
      case 10: { S.skillCD=4;pDmg=Math.round(effAtk()*3.0);element=1;
        S.burnTurns=3;S.burnDamage=Math.floor(effMaxHp()*0.02)+5;
        log(`【龍息】造成 ${pDmg} 點傷害並附加燃燒！`,'skill-text');break; }
      case 11: { S.skillCD=4;pDmg=Math.round(effAtk()*2.5);
        const st=Math.round(pDmg*0.4);S.hp=Math.min(effMaxHp(),S.hp+st);
        log(`【亡靈汲取】造成 ${pDmg} 點傷害，吸取 ${st} HP！`,'skill-text');break; }
      case 12: { S.skillCD=3;pDmg=Math.round(effAtk()*2.8);element=4;
        log(`【狙擊】造成 ${pDmg} 點傷害！`,'skill-text');break; }
      default: pDmg=effAtk()*2;S.skillCD=3;
    }
  } else if (action === 3) {
    if (roll(20)) { log(`【全力一擊】MISS！`,'lose'); pDmg=0; }
    else { pDmg = Math.round(effAtk()*effAtk() / (effAtk()+m.def) * 1.5); log(`【全力一擊】全力揮出！`,'system'); }
  } else {
    pDmg = Math.round(effAtk()*effAtk() / (effAtk()+m.def));
  }

  const tal = getTalentBonus();
  if (tal.pierce > 0) pDmg = Math.round(pDmg * (1 + tal.pierce/100));

  let critRate = effCritRate();
  if (action === 3) critRate += 50;
  const isCrit = pDmg > 0 && roll(critRate);
  if (isCrit) pDmg = Math.round(pDmg * (effCritDmg()/100));
  if (S.combo > 0) pDmg = Math.round(pDmg * (1 + S.combo*0.05));

  if (pDmg > 0 && roll(m.dodge)) {
    log(`【閃避】${m.name} 躲開了！`,'system');
    pDmg = 0;
  }

  if (pDmg > 0) {
    let mult = 1.0;
    if (element === m.weak) { mult = 1.5; log('【弱點命中！】×1.5','crit'); }
    else if (element === m.res) { mult = 0.7; log('【抗性】×0.7','system'); }
    pDmg = Math.max(1, Math.round(pDmg*mult));
    m.hp -= pDmg;
    if (m.prefixType === 2 && pDmg > 0) {
      const reflect = Math.max(1, Math.floor(pDmg*0.05));
      S.hp -= reflect;
      log(`【荊棘】反傷 ${reflect} 點！`,'lose');
    }
    if (isCrit) {
      S.combo++;
      if (S.combo > S.maxCombo) S.maxCombo = S.combo;
      checkAchievements();
    }
    if (isCrit) log(`★ 致命一擊！對 ${m.name} 造成 ${pDmg} 點傷害！${S.combo>0?` [${S.combo}連擊]`:''}`,'crit');
    else log(`你對 ${m.name} 造成 ${pDmg} 點傷害！`,'dmg-player');
    if (S.lifesteal > 0) {
      const heal = Math.floor(pDmg*S.lifesteal/100);
      if (heal > 0) { S.hp = Math.min(effMaxHp(),S.hp+heal); log(`【吸血】回復 ${heal} 點 HP`,'win'); }
    }
  } else {
    log(`沒有造成傷害。`,'system');
    S.combo = 0;
  }
  renderBattleUI();
  if (m.hp<=0) { m.hp=0; renderBattleUI(); setTimeout(onMonsterDefeated,400); return; }
  setTimeout(monsterTurn, 600);
}

// ============================================================
//  怪物回合
// ============================================================
function monsterTurn() {
  if (!S.inBattle||S.gameOver) return;
  const m = S.monster;
  if (m.hp <= 0) { onMonsterDefeated(); return; }
  if (S.monsterFrozen) {
    log(`${m.name} 被冰凍，無法行動！`,'system');
    S.monsterFrozen = false;
    endMonsterTurn();
    return;
  }
  if (S.monsterCharging) {
    S.monsterCharging = false;
    let dmg = Math.max(1, Math.round(m.atk*2.5 - effDef()));
    if (S.isDefending) { dmg = Math.max(1, Math.floor(dmg*0.2)); log('【防禦】擋下大部分傷害！','system'); S.isDefending=false; }
    if (S.isShieldActive) { dmg = Math.max(1, Math.floor(dmg*0.3)); log('【格擋】盾牌發揮效果！','system'); S.isShieldActive=false; }
    if (roll(effDodge())) log('【閃避】你閃過了攻擊！','system');
    else { S.hp -= dmg; log(`【大招】${m.name} 造成 ${dmg} 點傷害！`,'dmg-monster'); }
    endMonsterTurn();
    return;
  }
  if (roll(15)) {
    S.monsterCharging = true;
    log(`【蓄力】${m.name} 準備大招！`,'system');
    endMonsterTurn();
    return;
  }

  let mDmg = Math.max(1, Math.round(m.atk - effDef()));
  if (roll(30)) {
    log(`${m.name} 發動技能：【${m.skill}】`,'system');
    mDmg = Math.round(mDmg * (1 + Math.random()*0.5 + 0.3));
  }
  mDmg = Math.max(1, mDmg);

  if (m.prefixType === 1 && m.hp < m.maxHp*0.3) { mDmg *= 2; log(`【狂暴】${m.name} 攻擊倍增！`,'lose'); }
  if (m.prefixType === 3 && roll(25)) { mDmg *= 2; log(`【迅捷】${m.name} 連續攻擊！`,'lose'); }
  if (m.prefixType === 12) { const heal=Math.floor(m.maxHp*0.05); m.hp=Math.min(m.maxHp,m.hp+heal); log(`【詛咒血脈】${m.name} 回復 ${heal} HP！`,'win'); }

  if (S.isShieldActive) { mDmg = Math.max(1, Math.floor(mDmg*0.3)); log('【格擋】免除 70% 傷害！','system'); S.isShieldActive=false; }
  if (S.isDefending) { mDmg = Math.max(1, Math.floor(mDmg*0.2)); log('【防禦】擋下大部分傷害！','system'); S.isDefending=false; }

  if (roll(effDodge())) {
    log(`【閃避】你閃過了 ${m.name} 的攻擊！`,'system');
  } else {
    S.hp -= mDmg;
    log(`${m.name} 造成 ${mDmg} 點傷害！`,'dmg-monster');
    S.combo = 0;
    if (m.prefixType === 4) {
      const steal = Math.max(1, Math.floor(mDmg*0.3));
      m.hp = Math.min(m.maxHp, m.hp+steal);
      log(`【吸血】${m.name} 回復 ${steal} HP！`,'win');
    }
  }

  if (m.prefixType === 7 && roll(40)) {
    S.poisonTurns = 3; S.poisonDamage = Math.floor(effMaxHp()*0.04);
    log(`【劇毒】你中毒了！`,'lose');
  }
  if (m.prefixType === 8 && roll(40)) {
    S.burnTurns = 3; S.burnDamage = Math.floor(effMaxHp()*0.03)+5;
    log(`【燃燒】你被點燃了！`,'lose');
  }

  if (S.poisonTurns > 0) {
    S.hp -= S.poisonDamage; S.poisonTurns--;
    log(`【中毒】受到 ${S.poisonDamage} 點毒傷${S.poisonTurns>0?`（剩 ${S.poisonTurns}）`:'（結束）'}`,'lose');
  }
  if (S.burnTurns > 0) {
    S.hp -= S.burnDamage; S.burnTurns--;
    log(`【燃燒】受到 ${S.burnDamage} 點燃傷${S.burnTurns>0?`（剩 ${S.burnTurns}）`:'（結束）'}`,'lose');
  }

  const tal = getTalentBonus();
  if (tal.regen > 0) {
    const heal = Math.floor(effMaxHp() * tal.regen / 100);
    if (heal > 0) S.hp = Math.min(effMaxHp(), S.hp+heal);
  }

  endMonsterTurn();
}

function endMonsterTurn() {
  if (S.skillCD > 0) S.skillCD--;
  if (S.fruitSkillCD > 0) S.fruitSkillCD--;
  renderBattleUI();
  if (S.hp <= 0) {
    S.hp = 0;
    renderBattleUI();
    log('你被擊敗了...','lose');
    setTimeout(() => { if (S.inAbyss) abyssDeath(); else handleDeath(); }, 800);
    return;
  }
  if (S.autoMode) {
    setTimeout(() => { if (S.autoMode && S.inBattle) autoDecide(); }, 500);
  } else {
    enableButtons(true);
  }
}

function toggleAuto() {
  S.autoMode = !S.autoMode;
  log(S.autoMode ? '【系統】自動模式。' : '【系統】手動模式。','system');
  renderBattleUI();
  if (S.autoMode && S.inBattle) { enableButtons(false); autoDecide(); }
}
function autoDecide() {
  if (!S.inBattle||S.gameOver) return;
  if (S.hp < effMaxHp()*0.3 && S.potion > 0) { playerPotion(); return; }
  if (S.combo >= 5) { playerCombo(); return; }
  if (S.activeFruit && S.fruits[S.activeFruit] && S.fruitSkillCD === 0) { playerFruitSkill(); return; }
  if (S.skillCD === 0) { playerSkill(); return; }
  playerAttack();
}

// ============================================================
//  怪物擊敗 / 戰後
// ============================================================
function onMonsterDefeated() {
  const m = S.monster;
  const wasBoss = m.isBoss;
  const bossIslandId = m.islandId;
  S.inBattle = false;
  S.gameOver = true;
  enableButtons(false);

  const tal = getTalentBonus();
  const expBonus = Math.floor(m.exp * ((S.playexp - 100) + S.expBonus + tal.exp) / 100);
  const totalExp = m.exp + expBonus;
  const goldBonus = Math.floor(m.money * (S.goldBonus + tal.gold) / 100);
  const totalGold = m.money + goldBonus;
  S.exp += totalExp;
  S.money += totalGold;
  S.killCount++;

  log(`擊敗 ${m.name}！獲得 ${totalExp} 經驗與 ${totalGold} 金幣。`,'win');

  // 島 BOSS 擊敗
  if (wasBoss && bossIslandId && !S.inAbyss) {
    S.islandBossDefeated[bossIslandId] = true;
    S.islandKills = 0;
    log(`🏆 你擊敗了【${ISLANDS[bossIslandId].name}】的 BOSS！`,'win');
    // 檢查下一座島是否解鎖
    const islandKeys = Object.keys(ISLANDS);
    const idx = islandKeys.indexOf(bossIslandId);
    if (idx >= 0 && idx+1 < islandKeys.length) {
      const next = ISLANDS[islandKeys[idx+1]];
      if (S.level >= next.reqLevel) {
        log(`🗺️ 新島嶼【${next.name}】已解鎖！`,'map-text');
      } else {
        log(`🗺️ 【${next.name}】需要 Lv.${next.reqLevel} 才能前往。`,'system');
      }
    }
  } else if (!S.inAbyss) {
    S.islandKills++;
    if (S.islandKills === 10 && !S.islandBossDefeated[S.currentIsland]) {
      log(`⚠ 【${getIsland().name}】BOSS 即將出現！`,'boss');
    }
  }

  checkAchievements();

  // 深淵模式
  if (S.inAbyss) {
    const dropRarity = pickRarity(S.abyssFloor/3);
    const item = genEquipment(S.level, dropRarity);
    S.inventory.push(item);
    log(`🌀 深淵掉落：${item.name}`,'loot');
    if (S.abyssFloor % 5 === 0) { S.potion++; log(`🌀 深淵獎勵：治療藥水 +1`,'win'); }
    if (roll(35)) { setTimeout(() => offerLoot(), 500); return; }
    setTimeout(() => abyssNextFloor(), 800);
    return;
  }

  // 一般模式：裝備掉落
  let dropRate = 25;
  if (m.prefixType > 0) dropRate += 25;
  if (wasBoss) dropRate = 100;
  const equipDropRate = 20 + (wasBoss ? 50 : 0) + (m.prefixType > 0 ? 10 : 0);
  if (roll(equipDropRate)) {
    const item = genEquipment(S.level, pickRarity(S.level/8 + (wasBoss ? 40 : 0)));
    S.inventory.push(item);
    log(`🎽 掉落裝備：${item.name}`,'loot');
  }
  if (roll(dropRate)) { setTimeout(() => offerLoot(), 500); return; }
  afterBattle();
}

function offerLoot() {
  const pool = [
    {name:'攻擊力 +',type:1,val:rand(3,8)},
    {name:'最大 HP +',type:2,val:rand(20,50)},
    {name:'金幣 +',type:3,val:rand(50,150)},
    {name:'經驗 +',type:4,val:rand(50,120)},
    {name:'防禦力 +',type:5,val:rand(2,5)},
    {name:'回復 30% HP',type:6,val:30},
    {name:'治療藥水 x1',type:7,val:1},
  ];
  const chosen = [];
  while (chosen.length < 3) {
    const i = rand(0, pool.length-1);
    if (!chosen.includes(i)) chosen.push(i);
  }
  log('★ 怪物掉落了寶箱！請選擇獎勵：','loot');
  showScreen('screen-shop');
  $('shopMoney').textContent = '寶箱三選一';
  const list = $('shopList');
  list.innerHTML = '';
  chosen.forEach((idx, i) => {
    const l = pool[idx];
    const row = document.createElement('div');
    row.className = 'shop-item';
    row.innerHTML = `<span>(${i+1}) ${l.name}${l.val}</span><button class="small">選擇</button>`;
    row.querySelector('button').onclick = () => { applyLoot(l); closeShop(); afterBattle(); };
    list.appendChild(row);
  });
}

function applyLoot(l) {
  switch(l.type) {
    case 1: S.atk += l.val; log(`【獎勵】攻擊力 +${l.val}`,'win'); break;
    case 2: S.maxHp += l.val; S.hp += l.val; log(`【獎勵】最大 HP +${l.val}`,'win'); break;
    case 3: S.money += l.val; log(`【獎勵】金幣 +${l.val}`,'win'); break;
    case 4: S.exp += l.val; log(`【獎勵】經驗 +${l.val}`,'win'); break;
    case 5: S.def += l.val; log(`【獎勵】防禦力 +${l.val}`,'win'); break;
    case 6: { const heal=Math.floor(effMaxHp()*0.3); S.hp=Math.min(effMaxHp(),S.hp+heal); log(`【獎勵】回復 ${heal} HP`,'win'); break; }
    case 7: S.potion += l.val; log(`【獎勵】藥水 x${l.val}`,'win'); break;
  }
}

function afterBattle() {
  if (S.inAbyss) { setTimeout(() => abyssNextFloor(), 800); return; }
  while (S.exp >= S.expNeeded) {
    S.exp -= S.expNeeded;
    S.level++;
    S.expNeeded = Math.floor(100 * Math.pow(S.level, 1.5));
    const hpGain = 100 + S.level*15;
    const atkGain = 8 + (S.roleType === 3 ? 6 : 3);
    const defGain = 3 + (S.roleType === 2 ? 4 : 1);
    S.maxHp += hpGain;
    S.hp = effMaxHp();
    S.atk += atkGain;
    S.def += defGain;
    S.talentPoints++;
    log(`★ 【等級提升】Lv.${S.level}！ HP+${hpGain} 攻擊+${atkGain} 防禦+${defGain} 天賦點+1`,'win');
    if (S.level === 15) log('🍇 已解鎖果實系統！','fruit-text');
    // 檢查新島解鎖
    for (const [id, island] of Object.entries(ISLANDS)) {
      if (island.reqLevel === S.level) {
        log(`🗺️ 新島嶼【${island.name}】已解鎖！`,'map-text');
      }
    }
    checkAchievements();
  }
  $('btnContinue').classList.remove('hidden');
  $('btnReturn').classList.remove('hidden');
  log('是否繼續探索？','system');
}

function continueAdventure() {
  $('btnContinue').classList.add('hidden');
  $('btnReturn').classList.add('hidden');
  if (S.hp <= 0) { handleDeath(); return; }
  if (S.autoMode) {
    if (S.hp < effMaxHp()*0.3) { log('【自動】血量過低，返回村莊。','system'); returnToTown(); return; }
    setTimeout(nextEncounter, 600);
    return;
  }
  nextEncounter();
}

function returnToTown() {
  $('btnContinue').classList.add('hidden');
  $('btnReturn').classList.add('hidden');
  S.autoMode = false;
  S.inBattle = false;
  S.inAbyss = false;
  S.abyssFloor = 0;
  updateTownUI();
  saveGame();
  showScreen('screen-town');
  log('你回到了村莊。','system');
}

function handleDeath() {
  S.inBattle = false;
  S.gameOver = true;
  log('【你倒下了】','lose');
  const lostMoney = Math.floor(S.money * 0.25);
  S.money -= lostMoney;
  S.hp = effMaxHp();
  S.potion = Math.max(S.potion, 1);
  S.runCount++;
  S.abyssFloor = 0;
  S.inAbyss = false;
  log(`損失了 ${lostMoney} 金幣，但重新站了起來。`,'system');
  updateTownUI();
  saveGame();
  showScreen('screen-town');
}

// ============================================================
//  隨機事件
// ============================================================
function triggerRandomEvent() {
  const e = rand(1, 7);
  log('[事件] ','system');
  switch(e) {
    case 1: { const heal=Math.floor(effMaxHp()*0.3);S.hp=Math.min(effMaxHp(),S.hp+heal);log(`發現生命藥水！回復 ${heal} HP。`,'win');break; }
    case 2: { const dmg=10+2*S.level;S.hp-=dmg;log(`踩到毒箭陷阱！受到 ${dmg} 點傷害！`,'lose');break; }
    case 3: { const gain=3*S.level;S.atk+=gain;log(`磨利了武器！攻擊力 +${gain}`,'win');break; }
    case 4: { const gain=Math.floor(50*(S.playexp/100)*S.level);S.exp+=gain;log(`撿到失傳卷軸！+${gain} 經驗。`,'win');break; }
    case 5: { S.playexp+=5;log(`受到高人指點！經驗加成提升至 ${S.playexp}%。`,'win');break; }
    case 6: { log('找到隱藏商店！','loot');S.money+=100;S.potion++;const item=genEquipment(S.level+5,pickRarity(30));S.inventory.push(item);log(`商人送了你 100 金幣、1 瓶藥水、以及 ${item.name}`,'win');checkAchievements();break; }
    case 7: { log('遇到旅人指路！','map-text');S.money += 50 + S.level*5;log(`旅人分享了一些金幣（+${50+S.level*5}）並為你指引方向。`,'win');break; }
  }
  if (S.hp <= 0) S.hp = 0;
}

// ============================================================
//  成就
// ============================================================
function checkAchievements() {
  for (const [id, a] of Object.entries(ACHIEVEMENTS)) {
    if (S.achievements[id]) continue;
    if (a.check()) {
      S.achievements[id] = true;
      popupAchievement(a.name, a.desc);
      log(`🏆 成就解鎖：${a.name}（${a.desc}）`,'ach-text');
    }
  }
}
function popupAchievement(name, desc) {
  const el = document.createElement('div');
  el.className = 'achievement-popup';
  el.innerHTML = `<div class="ach-icon">🏆</div>
    <div><div class="ach-title">成就解鎖！</div>
    <div class="ach-name">${name}</div>
    <div class="ach-desc">${desc}</div></div>`;
  document.body.appendChild(el);
  setTimeout(() => el.classList.add('show'), 50);
  setTimeout(() => { el.classList.remove('show'); setTimeout(() => el.remove(), 500); }, 3500);
}

// ============================================================
//  鍵盤快捷鍵
// ============================================================
document.addEventListener('keydown', e => {
  if (!S.inBattle || S.gameOver || S.autoMode) return;
  switch(e.key) {
    case '1': if (!$('btnAttack').disabled) playerAttack(); break;
    case '2': if (!$('btnSkill').disabled) playerSkill(); break;
    case '3': if (!$('btnPower').disabled) playerPower(); break;
    case '4': if (!$('btnDefend').disabled) playerDefend(); break;
    case '5': if (!$('btnPotion').disabled) playerPotion(); break;
    case '6': if ($('btnFruitSkill') && !$('btnFruitSkill').disabled) playerFruitSkill(); break;
    case 'q': if (S.combo >= 5) playerCombo(); break;
  }
});

// ============================================================
//  初始化
// ============================================================
(function init() {
  if (loadGame()) {
    log(`歡迎回來，${S.playerName}！`,'system');
    updateTownUI();
    showScreen('screen-town');
    checkAchievements();
  } else {
    showScreen('screen-start');
  }
  log('按 1-6 可使用快捷鍵行動（戰鬥中）。','system');
})();
</script>
</body>
</html>
