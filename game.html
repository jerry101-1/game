<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>⚔ RPG 冒險 ⚔</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a0f;
    color: #e0e0e0;
    font-family: 'Consolas', 'Monaco', monospace;
    padding: 15px;
    max-width: 760px;
    margin: 0 auto;
    min-height: 100vh;
  }
  h1 {
    color: #4fc3f7;
    text-align: center;
    font-size: 1.5em;
    margin-bottom: 15px;
    text-shadow: 0 0 10px rgba(79,195,247,0.5);
  }
  .panel {
    background: #151520;
    border: 1px solid #2a2a3a;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 10px;
  }
  .panel-title {
    color: #4fc3f7;
    font-weight: bold;
    margin-bottom: 8px;
    font-size: 0.95em;
  }
  .hp-bar {
    background: #1a1a25;
    height: 22px;
    border-radius: 11px;
    overflow: hidden;
    margin: 6px 0;
    border: 1px solid #2a2a3a;
    position: relative;
  }
  .hp-fill {
    height: 100%;
    transition: width 0.35s ease;
    border-radius: 11px;
  }
  .hp-fill.green { background: linear-gradient(90deg,#2e7d32,#4caf50); }
  .hp-fill.yellow { background: linear-gradient(90deg,#f9a825,#ffeb3b); }
  .hp-fill.red { background: linear-gradient(90deg,#c62828,#f44336); }
  .hp-text {
    font-size: 11px;
    color: #aaa;
    text-align: center;
    margin-top: -18px;
    position: relative;
    z-index: 2;
    text-shadow: 0 0 3px #000;
    line-height: 22px;
  }
  .stat-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin: 3px 0;
    color: #ccc;
  }
  .stat-row .val { color: #4fc3f7; font-weight: bold; }
  button {
    background: #1e88e5;
    color: #fff;
    border: none;
    padding: 10px 16px;
    font-size: 14px;
    font-weight: bold;
    border-radius: 6px;
    cursor: pointer;
    margin: 4px 2px;
    font-family: inherit;
    transition: all 0.15s;
  }
  button:hover:not(:disabled) {
    background: #42a5f5;
    transform: translateY(-1px);
  }
  button:disabled {
    background: #333;
    color: #666;
    cursor: not-allowed;
  }
  button.skill { background: #8e24aa; }
  button.skill:hover:not(:disabled) { background: #ab47bc; }
  button.defend { background: #00897b; }
  button.defend:hover:not(:disabled) { background: #26a69a; }
  button.potion { background: #43a047; }
  button.potion:hover:not(:disabled) { background: #66bb6a; }
  button.danger { background: #c62828; }
  button.danger:hover:not(:disabled) { background: #e53935; }
  button.gold { background: #f9a825; color: #111; }
  button.gold:hover:not(:disabled) { background: #fdd835; }
  button.fruit { background: #6a1b9a; }
  button.fruit:hover:not(:disabled) { background: #8e24aa; }
  #log {
    background: #08080c;
    border: 1px solid #2a2a3a;
    padding: 10px;
    height: 220px;
    overflow-y: auto;
    border-radius: 8px;
    font-size: 13px;
    line-height: 1.6;
  }
  #log div { margin-bottom: 3px; }
  .dmg-player { color: #4caf50; }
  .dmg-monster { color: #f44336; }
  .system { color: #ffeb3b; }
  .win { color: #4fc3f7; font-weight: bold; }
  .lose { color: #f44336; font-weight: bold; }
  .crit { color: #ff9800; font-weight: bold; }
  .skill-text { color: #ce93d8; }
  .loot { color: #ffd54f; }
  .boss { color: #ff5252; font-weight: bold; }
  .fruit-text { color: #ba68c8; font-weight: bold; }
  .hidden { display: none !important; }
  .actions { text-align: center; margin: 8px 0; }
  .subtitle { color: #888; font-size: 12px; }
  .chapter-badge {
    background: #ff5252;
    color: #fff;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: bold;
  }
  .prefix-badge {
    background: #7b1fa2;
    color: #fff;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
  }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: #111; }
  ::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
  .shop-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 10px;
    border-bottom: 1px solid #222;
    font-size: 13px;
  }
  .shop-item:last-child { border-bottom: none; }
  .shop-item button { padding: 6px 12px; font-size: 12px; margin: 0; }
  .shop-item .cost { color: #ffd54f; font-weight: bold; }
  .fruit-card {
    background: #1a1a25;
    border: 1px solid #4a148c;
    border-radius: 8px;
    padding: 10px;
    margin: 6px 0;
  }
  .fruit-card .fruit-name { color: #ba68c8; font-weight: bold; font-size: 15px; }
  .fruit-card .fruit-lv { color: #ffd54f; font-size: 12px; }
  .fruit-card .fruit-skill { color: #80cbc4; font-size: 12px; margin-top: 4px; }
  .fruit-locked { opacity: 0.5; }
  .fruit-bar {
    background: #1a1a25; height: 12px; border-radius: 6px;
    overflow: hidden; margin: 4px 0; border: 1px solid #2a2a3a;
  }
  .fruit-bar-fill {
    height: 100%; background: linear-gradient(90deg,#6a1b9a,#ba68c8);
    transition: width 0.3s;
  }
  .tabs { display: flex; gap: 4px; margin-bottom: 8px; flex-wrap: wrap; }
  .tab {
    padding: 6px 14px; background: #1a1a25; border: 1px solid #2a2a3a;
    border-radius: 6px; cursor: pointer; font-size: 13px; color: #888;
  }
  .tab.active { background: #1e88e5; color: #fff; border-color: #1e88e5; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 4px; }
</style>
</head>
<body>

<h1>⚔ RPG 冒險 ⚔</h1>

<!-- ===== 開場 ===== -->
<div id="screen-start" class="panel">
  <div class="panel-title">歡迎來到冒險世界</div>
  <p class="subtitle" style="margin-bottom:10px;">在很久很久以前...世界被黑暗籠罩...而你，是唯一的希望...</p>
  <div style="margin-bottom:10px;">
    <label style="font-size:13px;">勇者名字：</label>
    <input id="inputName" type="text" placeholder="無名勇者" style="background:#1a1a25;border:1px solid #333;color:#eee;padding:6px 10px;border-radius:5px;font-family:inherit;width:60%;">
  </div>
  <button class="gold" onclick="startGame()">開始冒險</button>
</div>

<!-- ===== 村莊 ===== -->
<div id="screen-town" class="panel hidden">
  <div class="panel-title">🏘️ 村莊</div>
  <div class="stat-row"><span>職業：<span class="val" id="townRole">-</span></span><span>等級：<span class="val" id="townLevel">1</span></span></div>
  <div class="stat-row"><span>HP：<span class="val" id="townHp">-</span></span><span>金幣：<span class="val" id="townMoney">0</span></span></div>
  <div class="stat-row"><span>攻擊：<span class="val" id="townAtk">-</span></span><span>防禦：<span class="val" id="townDef">-</span></span></div>
  <div class="stat-row"><span>藥水：<span class="val" id="townPotion">0</span></span><span>章節：<span class="val" id="townChapter">1</span></span></div>
  <div class="stat-row"><span>經驗：<span class="val" id="townExp">0/100</span></span><span>擊殺：<span class="val" id="townKill">0</span></span></div>
  <div class="actions" style="margin-top:12px;">
    <button onclick="goAdventure()">⚔ 出發冒險</button>
    <button class="gold" onclick="openShop()">🛒 商店</button>
    <button class="fruit" onclick="openFruit()">🍇 果實</button>
    <button onclick="saveGame()">💾 存檔</button>
  </div>
</div>

<!-- ===== 商店 ===== -->
<div id="screen-shop" class="panel hidden">
  <div class="panel-title">🛒 村莊商店 <span class="subtitle" id="shopMoney"></span></div>
  <div id="shopList"></div>
  <div class="actions" style="margin-top:10px;">
    <button onclick="closeShop()">離開商店</button>
  </div>
</div>

<!-- ===== 果實 ===== -->
<div id="screen-fruit" class="panel hidden">
  <div class="panel-title">🍇 果實系統 <span class="subtitle" id="fruitMoney"></span></div>
  <div class="tabs">
    <div class="tab active" data-tab="draw" onclick="switchFruitTab('draw')">🎰 抽果</div>
    <div class="tab" data-tab="bag" onclick="switchFruitTab('bag')">🎒 果實背包</div>
    <div class="tab" data-tab="train" onclick="switchFruitTab('train')">💪 練果</div>
  </div>
  <div id="fruitContent"></div>
  <div class="actions" style="margin-top:10px;">
    <button onclick="closeFruit()">離開</button>
  </div>
</div>

<!-- ===== 冒險 ===== -->
<div id="screen-adventure" class="panel hidden">
  <div class="panel-title">🌲 荒野探索</div>
  <div class="stat-row"><span>HP：<span class="val" id="advHp">-</span></span><span>金幣：<span class="val" id="advMoney">0</span></span></div>
  <div class="stat-row"><span>經驗：<span class="val" id="advExp">0/100</span></span><span>藥水：<span class="val" id="advPotion">0</span></span></div>
</div>

<!-- ===== 戰鬥 ===== -->
<div id="screen-battle" class="panel hidden">
  <div class="panel-title">🧙 你（<span id="battleRole"></span> Lv.<span id="battleLevel"></span>）</div>
  <div class="hp-bar"><div id="playerHpBar" class="hp-fill green" style="width:100%"></div></div>
  <div class="hp-text" id="playerHpText">100 / 100</div>
  <div class="stat-row" style="margin-top:6px;">
    <span>攻擊 <span class="val" id="battleAtk"></span></span>
    <span>防禦 <span class="val" id="battleDef"></span></span>
    <span>藥水 <span class="val" id="battlePotion"></span></span>
  </div>

  <div style="margin-top:14px;">
    <div class="panel-title">👹 <span id="monsterName">野生史萊姆</span>
      <span id="monsterPrefix" class="prefix-badge hidden"></span>
      <span id="monsterBoss" class="chapter-badge hidden"></span>
    </div>
    <div class="hp-bar"><div id="monsterHpBar" class="hp-fill green" style="width:100%"></div></div>
    <div class="hp-text" id="monsterHpText">50 / 50</div>
    <div class="stat-row" style="margin-top:6px;">
      <span>Lv.<span class="val" id="monsterLv"></span></span>
      <span>弱點 <span class="val" id="monsterWeak"></span></span>
      <span>抗性 <span class="val" id="monsterRes"></span></span>
    </div>
    <div class="subtitle" id="monsterSkill" style="margin-top:4px;"></div>
  </div>

  <div class="actions" style="margin-top:14px;">
    <button id="btnAttack" onclick="playerAttack()">普通攻擊</button>
    <button id="btnSkill" class="skill" onclick="playerSkill()">職業技能</button>
    <button id="btnPower" class="danger" onclick="playerPower()">全力一擊</button>
    <button id="btnDefend" class="defend" onclick="playerDefend()">防禦</button>
    <button id="btnPotion" class="potion" onclick="playerPotion()">藥水</button>
    <button id="btnAuto" class="gold" onclick="toggleAuto()">自動</button>
  </div>
  <div id="fruitSkillBar" class="actions"></div>
  <div class="actions">
    <button id="btnContinue" class="gold hidden" onclick="continueAdventure()">繼續探索</button>
    <button id="btnReturn" class="hidden" onclick="returnToTown()">返回村莊</button>
  </div>
</div>

<div class="panel">
  <div class="panel-title">📜 戰鬥記錄</div>
  <div id="log"></div>
</div>

const $ = id => document.getElementById(id);
const show = id => $(id).classList.remove('hidden');
const hide = id => $(id).classList.add('hidden');
const rand = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
const roll = pct => Math.random() * 100 < pct;

function log(msg, cls = '') {
  const div = document.createElement('div');
  div.textContent = msg;
  if (cls) div.className = cls;
  $('log').appendChild(div);
  $('log').scrollTop = $('log').scrollHeight;
}
function clearLog() { $('log').innerHTML = ''; }

function showScreen(name) {
  ['screen-start','screen-town','screen-shop','screen-fruit','screen-adventure','screen-battle']
    .forEach(s => hide(s));
  if (name) show(name);
}

function elemName(e) {
  return { 1:'火', 2:'冰', 3:'雷', 4:'物理' }[e] || '無';
}
function elemColor(e) {
  return { 1:'#f44336', 2:'#4fc3f7', 3:'#ffeb3b', 4:'#aaa' }[e] || '#aaa';
}

//  開場
// ============================================================
function startGame() {
  const nameInput = $('inputName').value.trim();
  S.playerName = nameInput || "無名勇者";

  // 隨機職業（12 種）
  const n = rand(1, 100);
  if (n <= 5)        S.roleType = 1;
  else if (n <= 12)  S.roleType = 2;
  else if (n <= 20)  S.roleType = 3;
  else if (n <= 35)  S.roleType = 4;
  else if (n <= 45)  S.roleType = 5;
  else if (n <= 55)  S.roleType = 6;
  else if (n <= 63)  S.roleType = 7;
  else if (n <= 72)  S.roleType = 8;
  else if (n <= 80)  S.roleType = 9;
  else if (n <= 88)  S.roleType = 10;
  else if (n <= 95)  S.roleType = 11;
  else               S.roleType = 12;

  const role = ROLES[S.roleType];
  S.roleName = role.name;
  S.maxHp = role.hp; S.hp = role.hp;
  S.atk = role.atk;  S.def = role.def;
  S.money = 0; S.level = 1; S.exp = 0; S.expNeeded = 100;
  S.chapter = 1; S.killCount = 0; S.runCount = 1; S.potion = 3;
  S.swordLevel = S.shieldLevel = S.contractLevel = S.expShopLevel = 0;
  S.playexp = 100;
  S.fruits = {}; S.activeFruit = null;

  clearLog();
  log(`歡迎你，${S.playerName}！`, 'system');
  log(`你的職業是：${S.roleName} (Lv.1)`, 'system');
  log(`【職業特性】${role.desc}`, 'system');
  log(`HP: ${S.hp}/${S.maxHp}　攻擊: ${S.atk}　防禦: ${S.def}`, 'system');

  updateTownUI();
  showScreen('screen-town');
}

function saveGame() {
  try {
    localStorage.setItem('rpg_save', JSON.stringify(S));
    log('【系統】遊戲已存檔。', 'system');
  } catch(e) { log('【系統】存檔失敗。', 'lose'); }
}

function loadGame() {
  try {
    const data = localStorage.getItem('rpg_save');
    if (data) {
      const parsed = JSON.parse(data);
      Object.assign(S, parsed);
      if (!S.fruits) S.fruits = {};
      return true;
    }
  } catch(e) {}
  return false;
}

function renderShop() {
  $('shopMoney').textContent = `（金幣：${S.money}）`;
  const items = [];

  const swordCost = S.swordLevel === 0 ? 50 : 50 + S.swordLevel * 30;
  const swordGain = S.swordLevel === 0 ? 5 : 5 + S.swordLevel * 2;
  items.push({
    name: S.swordLevel === 0 ? '強化武器 (+5 攻擊力)' : `強化武器 Lv.${S.swordLevel} → Lv.${S.swordLevel+1} (+${swordGain} 攻擊)`,
    cost: swordCost,
    action: () => { S.atk += swordGain; S.money -= swordCost; S.swordLevel++; log(`武器強化成功！攻擊力 +${swordGain}（目前 ${S.atk}）`, 'win'); }
  });

  const shieldCost = S.shieldLevel === 0 ? 50 : 50 + S.shieldLevel * 30;
  const shieldGain = S.shieldLevel === 0 ? 3 : 3 + S.shieldLevel * 2;
  items.push({
    name: S.shieldLevel === 0 ? '強化護甲 (+3 防禦力)' : `強化護甲 Lv.${S.shieldLevel} → Lv.${S.shieldLevel+1} (+${shieldGain} 防禦)`,
    cost: shieldCost,
    action: () => { S.def += shieldGain; S.money -= shieldCost; S.shieldLevel++; log(`護甲強化成功！防禦力 +${shieldGain}（目前 ${S.def}）`, 'win'); }
  });

  items.push({
    name: '增加體力 (+20 最大血量)',
    cost: 50,
    action: () => { S.maxHp += 20; S.hp = S.maxHp; S.money -= 50; log(`體力強化成功！最大 HP +20（目前 ${S.maxHp}）`, 'win'); }
  });

  items.push({
    name: '購買治療藥水',
    cost: 100,
    action: () => { S.potion++; S.money -= 100; log(`購買成功！目前藥水 ${S.potion} 瓶`, 'win'); }
  });

  if (S.level >= 10) {
    const sc = S.contractLevel === 0 ? 500 : 500 + S.contractLevel * 500;
    const sa = S.contractLevel === 0 ? 250 : 250 + S.contractLevel * 100;
    const sl = S.contractLevel === 0 ? 100 : 100 + S.contractLevel * 50;
    items.push({
      name: `簽訂惡魔契約 (+${sa} 攻擊 / -${sl} 最大HP)`,
      cost: sc,
      action: () => {
        if (S.maxHp > sl + 10) {
          S.atk += sa; S.maxHp -= sl;
          if (S.hp > S.maxHp) S.hp = S.maxHp;
          S.money -= sc; S.contractLevel++;
          log(`黑暗契約加深！攻擊 +${sa}，最大HP -${sl}`, 'skill-text');
        } else { log('靈魂已殘破不堪，無法再簽約。', 'lose'); }
      }
    });

    const ec = S.expShopLevel === 0 ? 600 : 600 + S.expShopLevel * 500;
    const eg = S.expShopLevel === 0 ? 20 : 15;
    items.push({
      name: `時空學習秘典 (經驗 +${eg}%)`,
      cost: ec,
      action: () => { S.playexp += eg; S.money -= ec; S.expShopLevel++; log(`經驗獲取率提升至 ${S.playexp}%`, 'win'); }
    });
  }

  const list = $('shopList');
  list.innerHTML = '';
  items.forEach(it => {
    const row = document.createElement('div');
    row.className = 'shop-item';
    const canBuy = S.money >= it.cost;
    row.innerHTML = `<span>${it.name}</span>
      <span><span class="cost">${it.cost} 金</span>
      <button ${canBuy ? '' : 'disabled'}>購買</button></span>`;
    row.querySelector('button').onclick = () => {
      if (S.money < it.cost) { log('金幣不足！', 'lose'); return; }
      it.action();
      renderShop();
      updateTownUI();
    };
    list.appendChild(row);
  });
}

// 抽果費用（依等級）
function drawCost() {
  if (S.level < 15) return null;
  if (S.level < 50) return 500;    // 15~49 等：500 金
  if (S.level < 100) return 1500;  // 50~99 等：1500 金
  return 3000;                     // 100 等以上：3000 金
}

function renderFruit() {
  $('fruitMoney').textContent = `（金幣：${S.money}）`;
  const c = $('fruitContent');

  if (fruitTab === 'draw') {
    const cost = drawCost();
    if (cost === null) {
      c.innerHTML = `<div class="subtitle" style="padding:20px;text-align:center;">
        🍇 需要達到 <b style="color:#ffd54f;">Lv.15</b> 才能開始抽果實！<br>
        （目前 Lv.${S.level}）
      </div>`;
      return;
    }
    c.innerHTML = `
      <div style="text-align:center;padding:10px;">
        <div class="subtitle">每次抽果消耗 <b style="color:#ffd54f;">${cost} 金幣</b></div>
        <div class="subtitle">目前等級 Lv.${S.level}｜金幣 ${S.money}</div>
        <div style="margin-top:12px;">
          <button class="fruit" onclick="drawFruit(1)">抽 1 次（${cost} 金）</button>
          <button class="fruit" onclick="drawFruit(10)">抽 10 次（${cost*10} 金）</button>
        </div>
        <div class="subtitle" style="margin-top:16px;">── 可抽到的果實 ──</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px;">
          ${FRUIT_POOL.map(p => {
            const f = FRUITS[p.id];
            return `<span style="background:#1a1a25;padding:4px 8px;border-radius:6px;font-size:12px;color:${
              f.rarity==='神話'?'#ff5252':f.rarity==='傳說'?'#ffd54f':f.rarity==='史詩'?'#ba68c8':f.rarity==='稀有'?'#4fc3f7':'#aaa'
            };">${f.icon} ${f.name} <span style="color:#666;">(${f.rarity})</span></span>`;
          }).join('')}
        </div>
      </div>`;
    return;
  }

  if (fruitTab === 'bag') {
    const owned = Object.keys(S.fruits);
    if (owned.length === 0) {
      c.innerHTML = `<div class="subtitle" style="padding:20px;text-align:center;">🎒 背包空空如也，去抽個果實吧！</div>`;
      return;
    }
    c.innerHTML = owned.map(id => {
      const f = FRUITS[id];
      const data = S.fruits[id];
      const isActive = S.activeFruit === id;
      const rarityColor = f.rarity==='神話'?'#ff5252':f.rarity==='傳說'?'#ffd54f':f.rarity==='史詩'?'#ba68c8':f.rarity==='稀有'?'#4fc3f7':'#aaa';
      const skills = f.skills.map(sk => {
        const unlocked = data.level >= sk.lv;
        return `<div class="fruit-skill" style="color:${unlocked?'#80cbc4':'#555'}">
          ${unlocked?'✓':'🔒'} Lv.${sk.lv} ${sk.name}｜${sk.desc}（CD ${sk.cd}）
        </div>`;
      }).join('');
      return `<div class="fruit-card ${isActive?'':''}" style="${isActive?'border-color:#ffd54f;':''}">
        <div class="fruit-name">${f.icon} ${f.name} <span style="color:${rarityColor};font-size:12px;">[${f.rarity}]</span></div>
        <div class="fruit-lv">Lv.${data.level}｜經驗 ${data.exp}｜屬性：${elemName(f.element)}</div>
        <div class="fruit-bar"><div class="fruit-bar-fill" style="width:${fruitExpPct(data.level, data.exp)}%"></div></div>
        <div class="subtitle">${f.desc}</div>
        ${skills}
        <div style="margin-top:6px;">
          ${isActive ? '<button class="gold" onclick="unequipFruit()">卸下</button>' : `<button class="fruit" onclick="equipFruit('${id}')">裝備</button>`}
        </div>
      </div>`;
    }).join('');
    return;
  }

  if (fruitTab === 'train') {
    const owned = Object.keys(S.fruits);
    if (owned.length === 0) {
      c.innerHTML = `<div class="subtitle" style="padding:20px;text-align:center;">🎒 沒有果實可以練，先去抽果吧！</div>`;
      return;
    }
    c.innerHTML = owned.map(id => {
      const f = FRUITS[id];
      const data = S.fruits[id];
      const cost = trainCost(data.level);
      const canTrain = S.money >= cost;
      return `<div class="fruit-card">
        <div class="fruit-name">${f.icon} ${f.name} Lv.${data.level}</div>
        <div class="fruit-bar"><div class="fruit-bar-fill" style="width:${fruitExpPct(data.level, data.exp)}%"></div></div>
        <div class="subtitle">經驗 ${data.exp} / ${fruitExpNeeded(data.level)}</div>
        <div style="margin-top:6px;">
          <button class="fruit" ${canTrain?'':'disabled'} onclick="trainFruit('${id}')">練果（${cost} 金）</button>
          <button class="fruit" ${canTrain?'':'disabled'} onclick="trainFruit10('${id}')">練 10 次（${cost*10} 金）</button>
        </div>
      </div>`;
    }).join('');
    return;
  }
}

function fruitExpNeeded(lv) {
  return Math.floor(100 * Math.pow(lv, 1.4));
}
function fruitExpPct(lv, exp) {
  return Math.min(100, Math.floor(exp / fruitExpNeeded(lv) * 100));
}
function trainCost(lv) {
  return 50 + lv * 20;
}

function drawFruit(times) {
  const cost = drawCost() * times;
  if (S.money < cost) { log('金幣不足！', 'lose'); return; }
  S.money -= cost;

  const results = [];
  for (let i = 0; i < times; i++) {
    const id = pickFruit();
    if (!S.fruits[id]) {
      S.fruits[id] = { level: 1, exp: 0 };
      results.push({ id, isNew: true });
    } else {
      S.fruits[id].exp += 50;
      // 自動升等
      while (S.fruits[id].exp >= fruitExpNeeded(S.fruits[id].level)) {
        S.fruits[id].exp -= fruitExpNeeded(S.fruits[id].level);
        S.fruits[id].level++;
      }
      results.push({ id, isNew: false });
    }
  }

  // 顯示結果
  const c = $('fruitContent');
  let html = `<div style="text-align:center;margin-bottom:8px;"><b style="color:#ffd54f;">抽果結果</b></div>`;
  html += results.map(r => {
    const f = FRUITS[r.id];
    const rarityColor = f.rarity==='神話'?'#ff5252':f.rarity==='傳說'?'#ffd54f':f.rarity==='史詩'?'#ba68c8':f.rarity==='稀有'?'#4fc3f7':'#aaa';
    return `<div class="fruit-card">
      <span class="fruit-name">${f.icon} ${f.name}</span>
      <span style="color:${rarityColor};font-size:12px;">[${f.rarity}]</span>
      ${r.isNew ? '<span style="color:#4caf50;font-size:12px;"> NEW!</span>' : '<span style="color:#888;font-size:12px;">（重複，經驗+50）</span>'}
    </div>`;
  }).join('');
  html += `<div class="actions"><button class="fruit" onclick="renderFruit()">返回</button></div>`;
  c.innerHTML = html;

  log(`抽果 ${times} 次，消耗 ${cost} 金幣。`, 'fruit-text');
  updateTownUI();
}

function pickFruit() {
  const total = FRUIT_POOL.reduce((s, p) => s + p.weight, 0);
  let r = Math.random() * total;
  for (const p of FRUIT_POOL) {
    r -= p.weight;
    if (r <= 0) return p.id;
  }
  return FRUIT_POOL[0].id;
}

function equipFruit(id) {
  S.activeFruit = id;
  log(`裝備果實：${FRUITS[id].name}`, 'fruit-text');
  renderFruit();
}
function unequipFruit() {
  S.activeFruit = null;
  log('已卸下果實。', 'system');
  renderFruit();
}

function trainFruit(id) {
  const data = S.fruits[id];
  const cost = trainCost(data.level);
  if (S.money < cost) { log('金幣不足！', 'lose'); return; }
  S.money -= cost;
  data.exp += rand(30, 80);
  let leveled = false;
  while (data.exp >= fruitExpNeeded(data.level)) {
    data.exp -= fruitExpNeeded(data.level);
    data.level++;
    leveled = true;
    // 檢查是否解鎖新技能
    const f = FRUITS[id];
    const unlocked = f.skills.find(sk => sk.lv === data.level);
    if (unlocked) {
      log(`★ ${f.name} 解鎖新技能：${unlocked.name}！`, 'fruit-text');
    }
  }
  log(`練果成功！${FRUITS[id].name} 經驗 +，目前 Lv.${data.level}`, 'fruit-text');
  renderFruit();
  updateTownUI();
}

function trainFruit10(id) {
  const data = S.fruits[id];
  const cost = trainCost(data.level) * 10;
  if (S.money < cost) { log('金幣不足！', 'lose'); return; }
  S.money -= cost;
  for (let i = 0; i < 10; i++) {
    data.exp += rand(30, 80);
    while (data.exp >= fruitExpNeeded(data.level)) {
      data.exp -= fruitExpNeeded(data.level);
      data.level++;
      const f = FRUITS[id];
      const unlocked = f.skills.find(sk => sk.lv === data.level);
      if (unlocked) {
        log(`★ ${f.name} 解鎖新技能：${unlocked.name}！`, 'fruit-text');
      }
    }
  }
  log(`練果 10 次完成！${FRUITS[id].name} 目前 Lv.${data.level}`, 'fruit-text');
  renderFruit();
  updateTownUI();
}

// ============================================================
//  冒險
// ============================================================
function goAdventure() {
  if (S.hp <= 0) { S.hp = S.maxHp; }
  showScreen('screen-adventure');
  updateAdventureUI();
  log('你踏入了荒野...', 'system');
  setTimeout(nextEncounter, 500);
}
function updateAdventureUI() {
  $('advHp').textContent = `${S.hp}/${S.maxHp}`;
  $('advMoney').textContent = S.money;
  $('advExp').textContent = `${S.exp}/${S.expNeeded}`;
  $('advPotion').textContent = S.potion;
}

function nextEncounter() {
  if (S.hp <= 0) { handleDeath(); return; }
  if (!S.isBossFight && roll(30)) {
    triggerRandomEvent();
    if (S.hp <= 0) { handleDeath(); return; }
  }
  S.isBossFight = false;
  if (S.level >= S.chapter * 10 && S.chapter <= 5) {
    S.isBossFight = true;
    log(`★ 第 ${S.chapter} 章 BOSS 出現！`, 'boss');
  }
  if (S.isBossFight) spawnBoss(S.chapter);
  else spawnMonster();
  startBattle();
}

// ============================================================
//  怪物生成
// ============================================================
function spawnMonster() {
  const type = rand(1, 7);
  const lv = Math.max(1, S.level + rand(-1, 1));

  let tpl;
  if (S.level >= 50 && type === 7) {
    tpl = {
      name: "【最終魔王】毀滅之龍",
      skill: "吐出終結一切的黑炎！",
      hp: 5000 + 1000 * lv, atk: 300 + 80 * lv, def: 150 + 100 * lv,
      exp: 20000, money: 50000, weak: 3, res: 1, dodge: 0,
    };
  } else {
    const base = MONSTERS[type];
    tpl = {
      name: base.name, skill: base.skill,
      hp: base.hp + (base.hp * 0.3 | 0) * lv,
      atk: base.atk + (base.atk * 0.3 | 0) * lv,
      def: base.def + (base.def * 0.3 | 0) * lv,
      exp: base.exp * lv, money: base.money * lv,
      weak: base.weak, res: base.res, dodge: base.dodge,
    };
  }

  // 詞綴（30% 機率，12 種）
  let prefixType = 0, prefix = "";
  if (type !== 7 && roll(30)) {
    prefixType = rand(1, 12);
    prefix = PREFIXES[prefixType].name;
    // 套用詞綴效果
    if (prefixType === 6) tpl.def = Math.floor(tpl.def * 1.5);
    if (prefixType === 10) { tpl.hp = Math.floor(tpl.hp * 1.5); tpl.atk = Math.floor(tpl.atk * 1.2); }
    if (prefixType === 11) tpl.dodge += 20;
  }

  S.monster = {
    ...tpl, maxHp: tpl.hp, lv, type, prefixType, prefix,
    name: prefix + tpl.name,
  };

  if (prefixType) log(`詞綴：${prefix}（${PREFIXES[prefixType].desc}）`, 'skill-text');
}

function spawnBoss(ch) {
  const b = BOSSES[ch] || BOSSES[5];
  const lv = ch * 10;
  S.monster = {
    name: b.name, skill: b.skill,
    hp: b.hp + (b.hp * 0.1 | 0) * lv,
    atk: b.atk + b.atk * 0.1 * lv,
    def: b.def + b.def * 0.1 * lv,
    exp: b.exp * lv, money: b.money * lv,
    maxHp: 0, lv, type: 100 + ch,
    weak: b.weak, res: b.res, dodge: 10,
    prefixType: 0, prefix: "", isBoss: true,
  };
  S.monster.maxHp = S.monster.hp;
}

// ============================================================
//  戰鬥
// ============================================================
function startBattle() {
  S.inBattle = true;
  S.gameOver = false;
  S.skillCD = 0;
  S.fruitSkillCD = 0;
  S.isDefending = false;
  S.isShieldActive = false;
  S.monsterFrozen = false;
  S.monsterCharging = false;
  S.poisonTurns = 0; S.poisonDamage = 0;
  S.burnTurns = 0; S.burnDamage = 0;
  S.bleedTurns = 0; S.bleedDamage = 0;
  S.weakenTurns = 0;

  S.playerDodge = 5;
  if (S.roleType === 3) S.playerDodge += 10;
  if (S.roleType === 12) S.playerDodge += 5;
  if (S.playerDodge > 40) S.playerDodge = 40;

  if (S.monster.prefixType === 5) {
    S.skillCD += 1;
    log(`【詛咒】${S.monster.name} 的詛咒讓你技能冷卻變慢！`, 'skill-text');
  }

  showScreen('screen-battle');
  renderBattleUI();
  enableButtons(true);

  log(`遭遇 ${S.monster.name} (Lv.${S.monster.lv})！`, 'system');
  log(`怪物特性：${S.monster.skill}`, 'system');
}

function enableButtons(on) {
  ['btnAttack','btnSkill','btnPower','btnDefend','btnPotion'].forEach(id => {
    $(id).disabled = !on;
  });
  $('btnAuto').disabled = false;
}

function renderBattleUI() {
  const hpPct = Math.max(0, S.hp / S.maxHp * 100);
  const bar = $('playerHpBar');
  bar.style.width = hpPct + '%';
  bar.className = 'hp-fill ' + (hpPct > 60 ? 'green' : hpPct > 30 ? 'yellow' : 'red');
  $('playerHpText').textContent = `${Math.max(0,S.hp)} / ${S.maxHp}`;
  $('battleRole').textContent = S.roleName;
  $('battleLevel').textContent = S.level;
  $('battleAtk').textContent = S.atk;
  $('battleDef').textContent = S.def;
  $('battlePotion').textContent = S.potion;

  const m = S.monster;
  if (m) {
    const mPct = Math.max(0, m.hp / m.maxHp * 100);
    const mBar = $('monsterHpBar');
    mBar.style.width = mPct + '%';
    mBar.className = 'hp-fill ' + (mPct > 60 ? 'green' : mPct > 30 ? 'yellow' : 'red');
    $('monsterHpText').textContent = `${Math.max(0,m.hp)} / ${m.maxHp}`;
    $('monsterName').textContent = m.name;
    $('monsterLv').textContent = m.lv;
    $('monsterWeak').textContent = elemName(m.weak);
    $('monsterRes').textContent = elemName(m.res);
    $('monsterSkill').textContent = m.skill;

    const pBadge = $('monsterPrefix');
    if (m.prefixType) { pBadge.textContent = m.prefix; pBadge.classList.remove('hidden'); }
    else pBadge.classList.add('hidden');

    const bBadge = $('monsterBoss');
    if (m.isBoss) { bBadge.textContent = `第 ${S.chapter} 章 BOSS`; bBadge.classList.remove('hidden'); }
    else bBadge.classList.add('hidden');
  }

  const sk = $('btnSkill');
  if (S.skillCD > 0) { sk.textContent = `職業技能 (CD:${S.skillCD})`; sk.disabled = true; }
  else { sk.textContent = '職業技能'; sk.disabled = false; }

  // 果實技能列
  renderFruitSkillBar();
}

function renderFruitSkillBar() {
  const bar = $('fruitSkillBar');
  if (!S.activeFruit || !S.fruits[S.activeFruit]) {
    bar.innerHTML = '<span class="subtitle">尚未裝備果實（可至村莊的果實系統裝備）</span>';
    return;
  }
  const f = FRUITS[S.activeFruit];
  const data = S.fruits[S.activeFruit];
  // 找當前最高解鎖技能
  let usable = null;
  for (const sk of f.skills) {
    if (data.level >= sk.lv) usable = sk;
  }
  if (!usable) { bar.innerHTML = '<span class="subtitle">果實技能未解鎖</span>'; return; }

  const cdText = S.fruitSkillCD > 0 ? `(CD:${S.fruitSkillCD})` : '';
  bar.innerHTML = `<button id="btnFruitSkill" class="fruit" ${S.fruitSkillCD>0?'disabled':''} onclick="playerFruitSkill()">
    ${f.icon} ${usable.name} ${cdText}
  </button>`;
}

function playerAttack() { if (S.inBattle && !S.gameOver) playerAction(1); }
function playerSkill() {
  if (!S.inBattle || S.gameOver) return;
  if (S.skillCD > 0) { log(`技能還在冷卻中（剩 ${S.skillCD} 回合）`, 'system'); return; }
  playerAction(2);
}
function playerPower() { if (S.inBattle && !S.gameOver) playerAction(3); }
function playerDefend() { if (S.inBattle && !S.gameOver) playerAction(4); }
function playerPotion() {
  if (!S.inBattle || S.gameOver) return;
  if (S.potion <= 0) { log('沒有藥水了！', 'lose'); return; }
  const heal = Math.floor(S.maxHp * 0.4);
  S.hp = Math.min(S.maxHp, S.hp + heal);
  S.potion--;
  log(`【藥水】回復 ${heal} 點 HP！（剩餘 ${S.potion} 瓶）`, 'win');
  renderBattleUI();
  setTimeout(monsterTurn, 600);
}

function playerFruitSkill() {
  if (!S.inBattle || S.gameOver) return;
  if (S.fruitSkillCD > 0) { log(`果實技能冷卻中（剩 ${S.fruitSkillCD} 回合）`, 'system'); return; }
  if (!S.activeFruit || !S.fruits[S.activeFruit]) return;

  const f = FRUITS[S.activeFruit];
  const data = S.fruits[S.activeFruit];
  let usable = null;
  for (const sk of f.skills) if (data.level >= sk.lv) usable = sk;
  if (!usable) { log('果實技能未解鎖', 'lose'); return; }

  enableButtons(false);
  const m = S.monster;
  let pDmg = Math.round(S.atk * usable.mult);
  let element = f.element;

  log(`【${f.name}·${usable.name}】${usable.desc}`, 'fruit-text');

  // 弱點/抗性
  let mult = 1.0;
  if (element === m.weak) { mult = 1.5; log('【弱點命中！】傷害 ×1.5', 'crit'); }
  else if (element === m.res) { mult = 0.7; log('【抗性】傷害 ×0.7', 'system'); }
  pDmg = Math.max(1, Math.round(pDmg * mult));

  // 特殊效果
  if (S.activeFruit === 'ice' || S.activeFruit === 'void') {
    if (roll(30)) { S.monsterFrozen = true; log('敵人被凍結！', 'skill-text'); }
  }
  if (S.activeFruit === 'flame' || S.activeFruit === 'phoenix') {
    S.burnTurns = 3; S.burnDamage = Math.floor(S.maxHp * 0.02) + 5;
    log('敵人被點燃！', 'skill-text');
  }
  if (S.activeFruit === 'dark' || S.activeFruit === 'phoenix' || S.activeFruit === 'light' || S.activeFruit === 'void') {
    const steal = Math.floor(pDmg * 0.2);
    S.hp = Math.min(S.maxHp, S.hp + steal);
    log(`吸收精氣，回復 ${steal} 點 HP！`, 'win');
  }

  m.hp -= pDmg;
  log(`造成 ${pDmg} 點傷害！`, 'dmg-player');

  S.fruitSkillCD = usable.cd;
  renderBattleUI();

  if (m.hp <= 0) { m.hp = 0; renderBattleUI(); setTimeout(onMonsterDefeated, 400); return; }
  setTimeout(monsterTurn, 600);
}

function playerAction(action) {
  enableButtons(false);
  const m = S.monster;

  if (action === 4) {
    S.isDefending = true;
    log('【防禦】你擺出防禦姿態，準備迎接攻擊。', 'system');
    setTimeout(monsterTurn, 500);
    return;
  }

  let pDmg = 0;
  let element = 4;

  if (action === 2) {
    // 各職業技能
    switch (S.roleType) {
      case 1: pDmg = Math.round(S.atk * 2.3) * 2; S.skillCD = 3;
        log(`【會心一擊】你屏氣凝神，一劍貫穿弱點！造成 ${pDmg} 點傷害！`, 'skill-text'); break;
      case 2: pDmg = S.atk; S.skillCD = 5; S.isShieldActive = true;
        log(`【鐵壁嘲諷】你高舉巨盾，造成 ${pDmg} 點傷害，下回合減傷 70%！`, 'skill-text'); break;
      case 3: pDmg = S.atk * 3; S.skillCD = 4;
        log(`【影襲】你化為殘影，瞬間出現在怪物背後！造成 ${pDmg} 點傷害！`, 'skill-text'); break;
      case 4: { S.skillCD = 1; const td = S.level * 4; pDmg = S.atk + td;
        log(`【厚積薄發】你使出渾身解數，造成 ${pDmg} 點傷害！（含 ${td} 等級加成）`, 'skill-text'); break; }
      case 5: { S.skillCD = 4; pDmg = Math.round(S.atk * 3.5); element = 1;
        if (roll(20)) { S.monsterFrozen = true; log('【冰凍】敵人被凍結！', 'skill-text'); }
        const bf = Math.floor(S.hp * 0.10); S.hp -= bf;
        log(`【奧術隕石】造成 ${pDmg} 點毀滅傷害！`, 'skill-text');
        log(`【副作用】魔能反噬，你受到 ${bf} 點傷害！`, 'lose'); break; }
      case 6: { S.skillCD = 3; pDmg = Math.round(S.atk * 1.8); element = 3;
        const st = Math.round(pDmg * 0.6); S.hp = Math.min(S.maxHp, S.hp + st);
        log(`【暗影吸魂斬】造成 ${pDmg} 點傷害，吸取 ${st} 點 HP！`, 'skill-text'); break; }
      case 7: { S.skillCD = 3; pDmg = Math.round(S.atk * 1.5);
        const heal = Math.floor(S.maxHp * 0.3); S.hp = Math.min(S.maxHp, S.hp + heal);
        log(`【聖光治癒】你釋放聖光，造成 ${pDmg} 點傷害並回復 ${heal} 點 HP！`, 'skill-text'); break; }
      case 8: { S.skillCD = 3; const ratio = 1 + (1 - S.hp/S.maxHp) * 2; pDmg = Math.round(S.atk * ratio);
        log(`【狂暴斬】你越戰越勇！造成 ${pDmg} 點傷害！（傷害倍率 ${ratio.toFixed(2)}x）`, 'skill-text'); break; }
      case 9: { S.skillCD = 3; element = rand(1, 4); pDmg = Math.round(S.atk * 2.6);
        log(`【元素爆發】你釋放${elemName(element)}元素！造成 ${pDmg} 點傷害！`, 'skill-text'); break; }
      case 10: { S.skillCD = 4; pDmg = Math.round(S.atk * 3.0); element = 1;
        S.burnTurns = 3; S.burnDamage = Math.floor(S.maxHp * 0.02) + 5;
        log(`【龍息】你噴吐龍息，造成 ${pDmg} 點傷害並附加燃燒！`, 'skill-text'); break; }
      case 11: { S.skillCD = 4; pDmg = Math.round(S.atk * 2.5);
        const st = Math.round(pDmg * 0.4); S.hp = Math.min(S.maxHp, S.hp + st);
        log(`【亡靈汲取】造成 ${pDmg} 點傷害，吸取 ${st} 點 HP！`, 'skill-text'); break; }
      case 12: { S.skillCD = 3; pDmg = Math.round(S.atk * 2.8); element = 4;
        log(`【狙擊】你精準射擊，造成 ${pDmg} 點傷害（無視 30% 防禦）！`, 'skill-text'); break; }
      default: pDmg = S.atk * 2; S.skillCD = 3;
        log(`【技能】造成 ${pDmg} 點傷害！`, 'skill-text');
    }
  }
  else if (action === 3) {
    if (roll(20)) { log(`【全力一擊】你全力揮出，但 ${m.name} 靈巧地躲開了！(MISS)`, 'lose'); pDmg = 0; }
    else {
      pDmg = Math.round((S.atk * S.atk / (S.atk + m.def)) * 1.5);
      log(`【全力一擊】你孤注一擲，全力揮出！`, 'system');
    }
  }
  else {
    pDmg = Math.round(S.atk * S.atk / (S.atk + m.def));
  }

  let critRate = 15;
  if (action === 3) critRate += 50;
  if (S.roleType === 12) critRate += 15;
  const isCrit = pDmg > 0 && roll(critRate);
  if (isCrit) pDmg *= 2;

  if (pDmg > 0 && roll(m.dodge)) {
    log(`【閃避】${m.name} 靈巧地躲開了你的攻擊！`, 'system');
    pDmg = 0;
  }

  if (pDmg > 0) {
    let mult = 1.0;
    if (element === m.weak) { mult = 1.5; log('【弱點命中！】傷害 ×1.5', 'crit'); }
    else if (element === m.res) { mult = 0.7; log('【抗性】傷害 ×0.7', 'system'); }
    pDmg = Math.max(1, Math.round(pDmg * mult));
    m.hp -= pDmg;

    if (m.prefixType === 2 && pDmg > 0) {
      const reflect = Math.max(1, Math.floor(pDmg * 0.05));
      S.hp -= reflect;
      log(`【荊棘】${m.name} 的反傷讓你受到 ${reflect} 點傷害！`, 'lose');
    }

    if (isCrit) log(`★ 致命一擊！對 ${m.name} 造成 ${pDmg} 點傷害！`, 'crit');
    else log(`你對 ${m.name} 造成 ${pDmg} 點傷害！`, 'dmg-player');
  } else {
    log(`你沒有對 ${m.name} 造成傷害。`, 'system');
  }

  renderBattleUI();

  if (m.hp <= 0) { m.hp = 0; renderBattleUI(); setTimeout(onMonsterDefeated, 400); return; }
  setTimeout(monsterTurn, 600);
}

// ============================================================
//  怪物回合
// ============================================================
function monsterTurn() {
  if (!S.inBattle || S.gameOver) return;
  const m = S.monster;
  if (m.hp <= 0) { onMonsterDefeated(); return; }

  if (S.monsterFrozen) {
    log(`${m.name} 被冰凍，無法行動！`, 'system');
    S.monsterFrozen = false;
    endMonsterTurn();
    return;
  }

  if (S.monsterCharging) {
    S.monsterCharging = false;
    let dmg = Math.max(1, Math.round(m.atk * 2.5 - S.def));
    if (S.isDefending) { dmg = Math.max(1, Math.floor(dmg * 0.2)); log('【防禦】你擋下了大部分傷害！', 'system'); S.isDefending = false; }
    if (S.isShieldActive) { dmg = Math.max(1, Math.floor(dmg * 0.3)); log('【格擋】盾牌發揮效果！', 'system'); S.isShieldActive = false; }
    if (roll(S.playerDodge)) { log('【閃避】你靈巧地閃過了攻擊！', 'system'); }
    else { S.hp -= dmg; log(`【大招】${m.name} 釋放了毀滅一擊！你受到 ${dmg} 點傷害！`, 'dmg-monster'); }
    endMonsterTurn();
    return;
  }

  if (m.type < 100 && roll(15)) {
    S.monsterCharging = true;
    log(`【蓄力】${m.name} 正在凝聚力量……下回合將發動大招！`, 'system');
    endMonsterTurn();
    return;
  }

  let mDmg = Math.max(1, Math.round(m.atk - S.def));

  if (roll(30) && m.type !== 7) {
    log(`${m.name} 發動技能：【${m.skill}】`, 'system');
    switch (m.type) {
      case 1: mDmg = Math.round(m.atk * 1.5 - S.def); break;
      case 2: mDmg = Math.max(1, Math.round(m.atk*0.7-S.def)) + Math.max(1, Math.round(m.atk*0.7-S.def)); log('哥布林快速揮刀砍了你兩次！', 'system'); break;
      case 3: mDmg = Math.round(m.atk - S.def*0.5); break;
      case 4: { mDmg = Math.round(m.atk - S.def); const heal = m.lv * 20; m.hp = Math.min(m.maxHp, m.hp + heal); log(`石像鬼恢復了 ${heal} 點 HP！`, 'win'); break; }
      case 5: mDmg = Math.round(m.atk - S.def) * 2; log('這一箭直擊你的要害！', 'system'); break;
      case 6: { mDmg = Math.round(m.atk - S.def); const heal = Math.floor(mDmg/2); m.hp = Math.min(m.maxHp, m.hp + heal); log(`迷幻蘑菇回復 ${heal} 點 HP！`, 'win'); break; }
    }
  }

  mDmg = Math.max(1, mDmg);

  // 詞綴效果
  if (m.prefixType === 1 && m.hp < m.maxHp * 0.3) { mDmg *= 2; log(`【狂暴】${m.name} 攻擊力倍增！`, 'lose'); }
  if (m.prefixType === 3 && roll(25)) { mDmg *= 2; log(`【迅捷】${m.name} 連續攻擊了兩次！`, 'lose'); }
  if (m.prefixType === 12) { const heal = Math.floor(m.maxHp * 0.05); m.hp = Math.min(m.maxHp, m.hp + heal); log(`【詛咒血脈】${m.name} 回復 ${heal} 點 HP！`, 'win'); }

  if (S.isShieldActive) { mDmg = Math.max(1, Math.floor(mDmg * 0.3)); log('【格擋】盾牌發揮效果，免除了 70% 傷害！', 'system'); S.isShieldActive = false; }
  if (S.isDefending) { mDmg = Math.max(1, Math.floor(mDmg * 0.2)); log('【防禦】你擋下了大部分傷害！', 'system'); S.isDefending = false; }

  if (roll(S.playerDodge)) {
    log(`【閃避】你靈巧地閃過了 ${m.name} 的攻擊！`, 'system');
  } else {
    S.hp -= mDmg;
    log(`${m.name} 攻擊你，造成 ${mDmg} 點傷害！`, 'dmg-monster');
    if (m.prefixType === 4) {
      const steal = Math.max(1, Math.floor(mDmg * 0.3));
      m.hp = Math.min(m.maxHp, m.hp + steal);
      log(`【吸血】${m.name} 回復 ${steal} 點 HP！`, 'win');
    }
  }

  // 負面狀態
  if (m.type === 6 && roll(40)) {
    S.poisonTurns = 3; S.poisonDamage = Math.floor(S.maxHp * 0.05);
    log(`【中毒】你被毒孢子感染，每回合損失 ${S.poisonDamage} 點 HP！`, 'lose');
  }
  if (m.prefixType === 7 && roll(40)) {
    S.poisonTurns = 3; S.poisonDamage = Math.floor(S.maxHp * 0.04);
    log(`【劇毒】你中毒了！`, 'lose');
  }
  if (m.prefixType === 8 && roll(40)) {
    S.burnTurns = 3; S.burnDamage = Math.floor(S.maxHp * 0.03) + 5;
    log(`【燃燒】你被點燃了！`, 'lose');
  }
  if (m.prefixType === 9 && roll(30)) {
    S.weakenTurns = 3;
    log(`【虛弱】你的攻擊力被削弱了！`, 'lose');
  }

  if (S.poisonTurns > 0) {
    S.hp -= S.poisonDamage; S.poisonTurns--;
    log(`【中毒】你受到 ${S.poisonDamage} 點毒傷${S.poisonTurns>0?`（剩餘 ${S.poisonTurns} 回合）`:'（中毒結束）'}`, 'lose');
  }
  if (S.burnTurns > 0) {
    S.hp -= S.burnDamage; S.burnTurns--;
    log(`【燃燒】你受到 ${S.burnDamage} 點燃傷${S.burnTurns>0?`（剩餘 ${S.burnTurns} 回合）`:'（燃燒結束）'}`, 'lose');
  }

  endMonsterTurn();
}

function endMonsterTurn() {
  if (S.skillCD > 0) S.skillCD--;
  if (S.fruitSkillCD > 0) S.fruitSkillCD--;
  if (S.weakenTurns > 0) S.weakenTurns--;
  renderBattleUI();

  if (S.hp <= 0) {
    S.hp = 0;
    renderBattleUI();
    log('你被擊敗了...', 'lose');
    setTimeout(handleDeath, 800);
    return;
  }

  if (S.autoMode) {
    setTimeout(() => { if (S.autoMode && S.inBattle) autoDecide(); }, 500);
  } else {
    enableButtons(true);
  }
}

// ============================================================
//  自動模式
// ============================================================
function toggleAuto() {
  S.autoMode = !S.autoMode;
  log(S.autoMode ? '【系統】切換為自動模式。' : '【系統】已切換為手動模式。', 'system');
  renderBattleUI();
  if (S.autoMode && S.inBattle) { enableButtons(false); autoDecide(); }
}

function autoDecide() {
  if (!S.inBattle || S.gameOver) return;
  if (S.hp < S.maxHp * 0.3 && S.potion > 0) { playerPotion(); return; }
  // 果實技能優先
  if (S.activeFruit && S.fruits[S.activeFruit] && S.fruitSkillCD === 0) { playerFruitSkill(); return; }
  if (S.skillCD === 0) { playerSkill(); return; }
  playerAttack();
}

// ============================================================
//  怪物擊敗 / 戰後
// ============================================================
function onMonsterDefeated() {
  const m = S.monster;
  S.inBattle = false;
  S.gameOver = true;
  enableButtons(false);

  const bonus = Math.floor(m.exp * (S.playexp - 100) / 100);
  const totalExp = m.exp + bonus;
  S.exp += totalExp;
  S.money += m.money;
  S.killCount++;

  log(`擊敗 ${m.name}！獲得 ${totalExp} 經驗（基礎 ${m.exp} + 加成 ${bonus}）與 ${m.money} 金幣。`, 'win');

  let dropRate = 25;
  if (m.prefixType > 0) dropRate += 25;
  if (m.type === 7) dropRate = 100;
  if (m.isBoss) dropRate = 100;
  if (roll(dropRate)) { setTimeout(() => offerLoot(), 500); return; }
  afterBattle();
}

function offerLoot() {
  const pool = [
    { name: '攻擊力 +', type:1, val: rand(3,8) },
    { name: '最大 HP +', type:2, val: rand(20,50) },
    { name: '金幣 +', type:3, val: rand(50,150) },
    { name: '經驗 +', type:4, val: rand(50,120) },
    { name: '防禦力 +', type:5, val: rand(2,5) },
    { name: '回復 30% HP', type:6, val: 30 },
    { name: '治療藥水 x1', type:7, val: 1 },
  ];
  const chosen = [];
  while (chosen.length < 3) {
    const i = rand(0, pool.length - 1);
    if (!chosen.includes(i)) chosen.push(i);
  }

  log('★ 怪物掉落了寶箱！請選擇獎勵：', 'loot');
  showScreen('screen-shop');
  $('shopMoney').textContent = '寶箱三選一';
  const list = $('shopList');
  list.innerHTML = '';
  chosen.forEach((idx, i) => {
    const l = pool[idx];
    const row = document.createElement('div');
    row.className = 'shop-item';
    row.innerHTML = `<span>(${i+1}) ${l.name}${l.val}</span><button>選擇</button>`;
    row.querySelector('button').onclick = () => { applyLoot(l); closeShop(); afterBattle(); };
    list.appendChild(row);
  });
}

function applyLoot(l) {
  switch (l.type) {
    case 1: S.atk += l.val; log(`【獎勵】攻擊力 +${l.val}（目前 ${S.atk}）`, 'win'); break;
    case 2: S.maxHp += l.val; S.hp += l.val; log(`【獎勵】最大 HP +${l.val}（目前 ${S.maxHp}）`, 'win'); break;
    case 3: S.money += l.val; log(`【獎勵】金幣 +${l.val}（目前 ${S.money}）`, 'win'); break;
    case 4: S.exp += l.val; log(`【獎勵】經驗 +${l.val}`, 'win'); break;
    case 5: S.def += l.val; log(`【獎勵】防禦力 +${l.val}（目前 ${S.def}）`, 'win'); break;
    case 6: { const heal = Math.floor(S.maxHp * 0.3); S.hp = Math.min(S.maxHp, S.hp + heal); log(`【獎勵】回復 ${heal} 點 HP`, 'win'); break; }
    case 7: S.potion += l.val; log(`【獎勵】獲得治療藥水 x${l.val}（目前 ${S.potion} 瓶）`, 'win'); break;
  }
}

function afterBattle() {
  while (S.exp >= S.expNeeded) {
    S.exp -= S.expNeeded;
    S.level++;
    S.expNeeded = Math.floor(100 * Math.pow(S.level, 1.5));
    const hpGain = 100 + S.level * 15;
    const atkGain = 8 + (S.roleType === 3 ? 6 : 3);
    const defGain = 3 + (S.roleType === 2 ? 4 : 1);
    S.maxHp += hpGain; S.hp = S.maxHp;
    S.atk += atkGain; S.def += defGain;
    log(`★ 【等級提升】你升到了 Lv.${S.level}！ HP+${hpGain} 攻擊+${atkGain} 防禦+${defGain}`, 'win');
    // 升級提示解鎖果實
    if (S.level === 15) log('🍇 已解鎖果實系統！可至村莊的果實區抽果。', 'fruit-text');
    if (S.level === 50) log('🍇 抽果費用提升，可獲得更高稀有度果實！', 'fruit-text');
    if (S.level === 100) log('🍇 抽果費用再提升，可獲得神話級果實！', 'fruit-text');
  }

  if (S.isBossFight && S.monster && S.monster.hp <= 0) {
    S.chapter++;
    log(`★ 第 ${S.chapter-1} 章通關！進入第 ${S.chapter} 章！`, 'win');
    S.isBossFight = false;
    saveGame();
    returnToTown();
    return;
  }

  $('btnContinue').classList.remove('hidden');
  $('btnReturn').classList.remove('hidden');
  log('是否繼續探索？', 'system');
}

function continueAdventure() {
  $('btnContinue').classList.add('hidden');
  $('btnReturn').classList.add('hidden');
  if (S.hp <= 0) { handleDeath(); return; }
  if (S.autoMode) {
    if (S.hp < S.maxHp * 0.3) { log('【自動】血量過低，返回村莊。', 'system'); returnToTown(); return; }
    log('【自動】繼續探索...', 'system');
    setTimeout(nextEncounter, 600);
    return;
  }
  nextEncounter();
}

function returnToTown() {
  $('btnContinue').classList.add('hidden');
  $('btnReturn').classList.add('hidden');
  S.autoMode = false;
  S.inBattle = false;
  updateTownUI();
  saveGame();
  showScreen('screen-town');
  log('你回到了村莊。', 'system');
}

// ============================================================
//  死亡
// ============================================================
function handleDeath() {
  S.inBattle = false;
  S.gameOver = true;
  log('【你倒下了】', 'lose');
  const lostMoney = Math.floor(S.money * 0.25);
  S.money -= lostMoney;
  S.hp = S.maxHp;
  S.potion = Math.max(S.potion, 1);
  S.runCount++;
  log(`你損失了 ${lostMoney} 金幣，但重新站了起來。`, 'system');
  updateTownUI();
  saveGame();
  showScreen('screen-town');
}

// ============================================================
//  隨機事件
// ============================================================
function triggerRandomEvent() {
  const e = rand(1, 6);
  log('[事件] ', 'system');
  switch (e) {
    case 1: { const heal = Math.floor(S.maxHp * 0.3); S.hp = Math.min(S.maxHp, S.hp + heal); log(`你發現了生命藥水！回復 ${heal} 點 HP。`, 'win'); break; }
    case 2: { const dmg = 10 + 2 * S.level; S.hp -= dmg; log(`踩到毒箭陷阱！受到 ${dmg} 點傷害！`, 'lose'); break; }
    case 3: { const gain = 3 * S.level; S.atk += gain; log(`磨利了武器！攻擊力永久 +${gain}（目前 ${S.atk}）`, 'win'); break; }
    case 4: { const gain = Math.floor(50 * (S.playexp / 100) * S.level); S.exp += gain; log(`撿到失傳卷軸！獲得 ${gain} 點經驗。`, 'win'); break; }
    case 5: { S.playexp += 5; log(`受到高人指點！經驗加成提升至 ${S.playexp}%。`, 'win'); break; }
    case 6: { log('找到隱藏商店！', 'loot'); S.money += 100; S.potion++; log('神秘商人送了你 100 金幣和 1 瓶藥水。', 'win'); break; }
  }
  if (S.hp <= 0) { S.hp = 0; }
}

// ============================================================
//  鍵盤快捷鍵
// ============================================================
document.addEventListener('keydown', e => {
  if (!S.inBattle || S.gameOver || S.autoMode) return;
  switch (e.key) {
    case '1': if (!$('btnAttack').disabled) playerAttack(); break;
    case '2': if (!$('btnSkill').disabled) playerSkill(); break;
    case '3': if (!$('btnPower').disabled) playerPower(); break;
    case '4': if (!$('btnDefend').disabled) playerDefend(); break;
    case '5': if (!$('btnPotion').disabled) playerPotion(); break;
    case '6': if ($('btnFruitSkill') && !$('btnFruitSkill').disabled) playerFruitSkill(); break;
  }
});

// ============================================================
//  初始化
// ============================================================
(function init() {
  if (loadGame()) {
    log(`歡迎回來，${S.playerName}！`, 'system');
    updateTownUI();
    showScreen('screen-town');
  } else {
    showScreen('screen-start');
  }
  log('按 1-6 可使用快捷鍵行動（戰鬥中）。', 'system');
})();
</script>
</body>
</html>
