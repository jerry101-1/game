<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2.5D 像素地牢大亂鬥</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #05050d;
      color: #c9d1d9;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; overflow: hidden;
    }
    h1 {
      margin-bottom: 8px; color: #38bdf8;
      text-shadow: 0 0 12px rgba(56, 189, 248, 0.6); font-size: 1.6rem;
    }
    .status-panel { display: flex; gap: 20px; margin-bottom: 10px; z-index: 10; }
    .player-card {
      background: rgba(15, 23, 42, 0.85); border: 2px solid #334155;
      padding: 8px 16px; border-radius: 8px; min-width: 180px; backdrop-filter: blur(8px);
    }
    .p1-card { border-color: #38bdf8; box-shadow: 0 0 10px rgba(56, 189, 248, 0.2); }
    .p2-card { border-color: #4ade80; box-shadow: 0 0 10px rgba(74, 222, 128, 0.2); }
    .p1-title { color: #38bdf8; font-weight: bold; }
    .p2-title { color: #4ade80; font-weight: bold; }

    .game-container {
      position: relative; width: 860px; height: 520px;
      border: 3px solid #334155; border-radius: 12px; overflow: hidden;
      box-shadow: 0 15px 35px rgba(0,0,0,0.9);
    }
    #webgl-container { width: 100%; height: 100%; }

    .log-box {
      position: absolute; right: 12px; top: 12px; width: 220px; height: 180px;
      background: rgba(15, 23, 42, 0.75); border: 1px solid rgba(51, 65, 85, 0.8);
      border-radius: 6px; padding: 8px; font-size: 0.78rem; overflow-y: auto; pointer-events: none;
    }
    .log-msg { margin-bottom: 4px; }
    .log-msg.p1 { color: #38bdf8; }
    .log-msg.p2 { color: #4ade80; }
    .log-msg.system { color: #f2cc60; }
    .log-msg.danger { color: #ef4444; }

    .game-over-overlay {
      display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(5, 5, 13, 0.9); flex-direction: column; align-items: center; justify-content: center; z-index: 20;
    }
    .game-over-title {
      font-size: 3.2rem; color: #ef4444; font-weight: bold; text-shadow: 0 0 20px rgba(239, 68, 68, 0.8); margin-bottom: 10px;
    }
    .restart-btn {
      margin-top: 15px; padding: 10px 24px; font-size: 1rem; background: #22c55e;
      color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; transition: 0.2s;
    }
    .restart-btn:hover { background: #16a34a; transform: scale(1.05); }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <h1>⚔️ 2.5D 像素風地牢大亂鬥</h1>
  
  <div class="status-panel">
    <div class="player-card p1-card">
      <div class="p1-title">👤 1P 像素戰士</div>
      <div>❤️ HP: <span id="p1-hp">100</span></div>
      <div>⚔️ ATK: <span id="p1-atk">15</span></div>
      <div>💰 Gold: <span id="p1-gold">0</span></div>
    </div>
    
    <div style="align-self: center; font-size: 1.1rem; font-weight: bold;">🏰 層數: <span id="floor">1</span></div>

    <div class="player-card p2-card">
      <div class="p2-title">👤 2P 像素遊俠</div>
      <div>❤️ HP: <span id="p2-hp">100</span></div>
      <div>⚔️ ATK: <span id="p2-atk">15</span></div>
      <div>💰 Gold: <span id="p2-gold">0</span></div>
    </div>
  </div>

  <div class="game-container">
    <div id="webgl-container"></div>
    <div class="log-box" id="logBox"><div class="log-msg system">進入暗黑地牢！擊滅怪物開啟傳送門...</div></div>

    <div class="game-over-overlay" id="gameOverOverlay">
      <div class="game-over-title">GAME OVER</div>
      <div style="font-size: 1.1rem;">全員陣亡！停留於第 <span id="final-floor">1</span> 層</div>
      <button class="restart-btn" onclick="resetGame()">重新開始 (按 R 鍵)</button>
    </div>
  </div>

  <script>
    const container = document.getElementById('webgl-container');
    const width = 860, height = 520;

    // 1. 初始化 3D 場景 & 霧氣
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x070714);
    scene.fog = new THREE.FogExp2(0x070714, 0.035); // 深層霧氣

    const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
    camera.position.set(0, 26, 22);
    camera.lookAt(0, -2, 0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(width, height);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // 2. 光源 (氛圍對比)
    const ambientLight = new THREE.AmbientLight(0x334155, 1.2);
    scene.add(ambientLight);

    const mainLight = new THREE.DirectionalLight(0xffffff, 1.5);
    mainLight.position.set(12, 25, 15);
    mainLight.castShadow = true;
    scene.add(mainLight);

    // 3. 地板與網格線
    const floorGeo = new THREE.PlaneGeometry(36, 22);
    const floorMat = new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.4, metalness: 0.6 });
    const floorMesh = new THREE.Mesh(floorGeo, floorMat);
    floorMesh.rotation.x = -Math.PI / 2;
    floorMesh.receiveShadow = true;
    scene.add(floorMesh);

    const gridHelper = new THREE.GridHelper(36, 18, 0x38bdf8, 0x1e293b);
    gridHelper.position.y = 0.01;
    scene.add(gridHelper);

    // 遊戲資料
    let currentFloor = 1;
    let isGameOver = false;
    const keys = {};

    let p1, p2, bullets = [], monsters = [], particles = [], portalMesh = null, isPortalUnlocked = false;

    function addLog(msg, type = "system") {
      const logBox = document.getElementById('logBox');
      const div = document.createElement('div');
      div.className = `log-msg ${type}`;
      div.textContent = msg;
      logBox.appendChild(div);
      logBox.scrollTop = logBox.scrollHeight;
    }

    // ⭐ 新增：3D 像素外觀生成函數 ⭐
    function createPlayerMesh(colorHex, shapeType) {
      const group = new THREE.Group();
      
      // 核心身體
      const bodyGeo = shapeType === 'sphere' ? new THREE.SphereGeometry(0.7, 8, 8) : new THREE.BoxGeometry(1.2, 1.2, 1.2);
      const bodyMat = new THREE.MeshStandardMaterial({ color: colorHex, roughness: 0.3, metalness: 0.4 });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.castShadow = true;
      group.add(body);

      // 眼睛 (發光像素)
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
      const eye1 = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), eyeMat);
      eye1.position.set(-0.35, 0.2, 0.6); group.add(eye1);
      const eye2 = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), eyeMat);
      eye2.position.set(0.35, 0.2, 0.6); group.add(eye2);

      // 裝飾 (1P的光環, 2P的帽兜感)
      if (shapeType === 'sphere') {
        const ring = new THREE.Mesh(new THREE.TorusGeometry(0.55, 0.08, 6, 20), new THREE.MeshBasicMaterial({ color: 0x38bdf8 }));
        ring.rotation.x = Math.PI/2; ring.position.y = 1.0; group.add(ring);
      } else {
        const hood = new THREE.Mesh(new THREE.BoxGeometry(1.4, 0.5, 0.8), bodyMat);
        hood.position.set(0, 0.7, 0.2); group.add(hood);
      }

      return group;
    }

    function createMonsterMesh(typeIndex) {
      const group = new THREE.Group();
      const typeConfig = [
        { color: 0xef4444, shape: 'sphere' }, // 魔眼
        { color: 0xa855f7, shape: 'box' },    // 粘液怪
        { color: 0x1f1f2e, shape: 'sphere' }  // 骷髏
      ][typeIndex % 3];

      const bodyGeo = typeConfig.shape === 'sphere' ? new THREE.SphereGeometry(0.65, 8, 8) : new THREE.BoxGeometry(1.0, 1.0, 1.0);
      const bodyMat = new THREE.MeshStandardMaterial({ color: typeConfig.color, roughness: 0.5 });
      const body = new THREE.Mesh(bodyGeo, bodyMat);
      body.castShadow = true;
      group.add(body);

      // 紅眼
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
      const eye = new THREE.Mesh(new THREE.BoxGeometry(typeConfig.shape === 'sphere' ? 0.4: 0.3, 0.3, 0.3), eyeMat);
      eye.position.set(typeConfig.shape === 'sphere' ? 0 : -0.2, 0.1, 0.6); group.add(eye);
      if (typeConfig.shape === 'box') {
        const eye2 = new THREE.Mesh(new THREE.BoxGeometry(0.3, 0.3, 0.3), eyeMat);
        eye2.position.set(0.2, 0.1, 0.6); group.add(eye2);
      }

      return group;
    }

    function createPlayers() {
      // 1P 藍色戰士
      const m1 = createPlayerMesh(0x0077c2, 'sphere');
      scene.add(m1);
      p1 = { mesh: m1, hp: 100, maxHp: 100, atk: 15, gold: 0, dir: new THREE.Vector3(1, 0, 0), lastShot: 0 };

      // 2P 綠色遊俠
      const m2 = createPlayerMesh(0x1a9a4e, 'box');
      scene.add(m2);
      p2 = { mesh: m2, hp: 100, maxHp: 100, atk: 15, gold: 0, dir: new THREE.Vector3(1, 0, 0), lastShot: 0 };
    }

    function initFloor() {
      p1.mesh.position.set(-12, 0.8, -2);
      p2.mesh.position.set(-12, 0.7, 2);
      p1.mesh.visible = true;
      p2.mesh.visible = true;

      // 清理
      bullets.forEach(b => scene.remove(b.mesh));
      monsters.forEach(m => scene.remove(m.mesh));
      if (portalMesh) scene.remove(portalMesh);

      bullets = [];
      monsters = [];
      isPortalUnlocked = false;

      // 傳送門 (魔法傳送陣)
      const portalGeo = new THREE.TorusGeometry(1.2, 0.18, 16, 32);
      const portalMat = new THREE.MeshBasicMaterial({ color: 0x334155 });
      portalMesh = new THREE.Mesh(portalGeo, portalMat);
      portalMesh.rotation.x = Math.PI / 2;
      portalMesh.position.set(14, 0.1, 0);
      scene.add(portalMesh);

      // 怪物多樣化生成
      const count = 3 + currentFloor * 2;
      for (let i = 0; i < count; i++) {
        const mMesh = createMonsterMesh(i); // ⭐ 不同種類 ⭐
        
        let posX = -2 + Math.random() * 14;
        let posZ = -9 + Math.random() * 18;
        mMesh.position.set(posX, i % 3 === 1 ? 0.5: 0.8, posZ);
        scene.add(mMesh);

        monsters.push({
          mesh: mMesh,
          speed: 0.05 + currentFloor * 0.008,
          hp: 35 + currentFloor * 15,
          maxHp: 35 + currentFloor * 15,
          atk: 8 + currentFloor * 2,
          gold: 15 + currentFloor * 5,
          isAggressive: false, // ⭐ 新增：遇敵 AI ⭐
          wanderCounter: 0,
          wanderAngle: 0
        });
      }

      addLog(`🏰 進入第 ${currentFloor} 層地牢！擊滅怪物解鎖傳送門...`);
    }

    function resetGame() {
      currentFloor = 1; isGameOver = false;
      document.getElementById('gameOverOverlay').style.display = 'none';
      p1.hp = 100; p1.gold = 0; p2.hp = 100; p2.gold = 0;
      document.getElementById('logBox').innerHTML = '';
      addLog(`🎮 像素冒險重新開始！`);
      initFloor();
    }

    // 鍵盤監聽
    window.addEventListener('keydown', e => { 
      keys[e.code] = true; 
      if ((e.code === 'KeyR' || e.key === 'r') && isGameOver) resetGame();
    });
    window.addEventListener('keyup', e => { keys[e.code] = false; });

    function handleInput() {
      if (isGameOver) return;
      const speed = 0.18, now = Date.now();

      // 1P 控制 (WASD + Space)
      if (p1.hp > 0) {
        let move = new THREE.Vector3();
        if (keys['KeyW']) move.z -= 1;
        if (keys['KeyS']) move.z += 1;
        if (keys['KeyA']) move.x -= 1;
        if (keys['KeyD']) move.x += 1;

        if (move.length() > 0) {
          move.normalize(); p1.dir.copy(move);
          p1.mesh.position.addScaledVector(move, speed);
          // 限制邊界
          p1.mesh.position.x = Math.max(-16, Math.min(16, p1.mesh.position.x));
          p1.mesh.position.z = Math.max(-10, Math.min(10, p1.mesh.position.z));
        }

        if (keys['Space'] && now - p1.lastShot > 250) {
          spawnBullet(p1, 0x38bdf8);
          p1.lastShot = now;
        }
      }

      // 2P 控制 (Arrows + Enter)
      if (p2.hp > 0) {
        let move = new THREE.Vector3();
        if (keys['ArrowUp']) move.z -= 1;
        if (keys['ArrowDown']) move.z += 1;
        if (keys['ArrowLeft']) move.x -= 1;
        if (keys['ArrowRight']) move.x += 1;

        if (move.length() > 0) {
          move.normalize(); p2.dir.copy(move);
          p2.mesh.position.addScaledVector(move, speed);
          p2.mesh.position.x = Math.max(-16, Math.min(16, p2.mesh.position.x));
          p2.mesh.position.z = Math.max(-10, Math.min(10, p2.mesh.position.z));
        }

        if (keys['Enter'] && now - p2.lastShot > 250) {
          spawnBullet(p2, 0x4ade80);
          p2.lastShot = now;
        }
      }
    }

    function spawnBullet(player, colorHex) {
      // 子彈造型大升級
      const bGeo = new THREE.CylinderGeometry(0.2, 0.2, 1.2, 6);
      const bMat = new THREE.MeshBasicMaterial({ color: colorHex });
      const bMesh = new THREE.Mesh(bGeo, bMat);
      
      bMesh.position.copy(player.mesh.position);
      bMesh.position.y = 0.8;
      
      // 子彈發光與旋轉
      bMesh.rotation.copy(player.mesh.rotation);
      const axis = new THREE.Vector3(0, 0, 1);
      bMesh.quaternion.setFromUnitVectors(axis, player.dir.clone());
      bMesh.rotateX(Math.PI/2);
      
      scene.add(bMesh);

      // 新增發光點
      const light = new THREE.PointLight(colorHex, 1.5, 6);
      bMesh.add(light);

      bullets.push({ mesh: bMesh, dir: player.dir.clone(), speed: 0.38, atk: player.atk, owner: player === p1 ? '1P' : '2P' });
    }

    function createExplosionEffect(pos, colorHex) {
      for (let i = 0; i < 15; i++) {
        const pGeo = new THREE.BoxGeometry(0.18, 0.18, 0.18);
        const pMat = new THREE.MeshBasicMaterial({ color: colorHex });
        const p = new THREE.Mesh(pGeo, pMat);
        p.position.copy(pos);
        scene.add(p);
        particles.push({ mesh: p, vel: new THREE.Vector3((Math.random()-0.5)*0.25, 0.2 + Math.random()*0.15, (Math.random()-0.5)*0.25), life: 25 });
      }
    }

    function update() {
      if (isGameOver) return;
      handleInput();

      // 更新子彈與碰撞
      bullets.forEach((b, index) => {
        b.mesh.position.addScaledVector(b.dir, b.speed);
        if (Math.abs(b.mesh.position.x) > 18 || Math.abs(b.mesh.position.z) > 12) {
          scene.remove(b.mesh); bullets.splice(index, 1); return;
        }

        monsters.forEach((m, mIndex) => {
          if (b.mesh.position.distanceTo(m.mesh.position) < 1.2) {
            m.hp -= b.atk;
            createExplosionEffect(b.mesh.position, 0xef4444); // 打擊碎屑
            b.isGrounded = true; // 標記已擊中，稍後移除
            m.isAggressive = true; // ⭐ 新增：被擊中觸發主動追逐 ⭐

            if (m.hp <= 0) {
              if (b.owner === '1P') p1.gold += m.gold;
              if (b.owner === '2P') p2.gold += m.gold;
              addLog(`🎯 ${b.owner} 擊滅怪物 +${m.gold}G`, b.owner.toLowerCase());
              
              createExplosionEffect(m.mesh.position, m.mesh.children[0].material.color.getHex()); // 死亡特效
              scene.remove(m.mesh); monsters.splice(mIndex, 1);

              if (monsters.length === 0) {
                isPortalUnlocked = true;
                portalMesh.material.color.setHex(0x4ade80);
                addLog('🔓 傳送門已開啟！進入前往下一層...');
              }
            }
          }
        });
        if (b.isGrounded) { scene.remove(b.mesh); bullets.splice(index, 1); }
      });

      // ⭐ 升級：怪物 AI ⭐
      monsters.forEach(m => {
        let targets = [];
        if (p1.hp > 0) targets.push(p1);
        if (p2.hp > 0) targets.push(p2);

        if (targets.length > 0) {
          targets.sort((a,b) => m.mesh.position.distanceTo(a.mesh.position) - m.mesh.position.distanceTo(b.mesh.position));
          let target = targets[0];

          let dist = m.mesh.position.distanceTo(target.mesh.position);
          
          if (dist < 8) m.isAggressive = true; // ⭐ 新增：遇敵被動觸發 ⭐

          if (m.isAggressive) {
            // ⭐ 主動追逐 ⭐
            let dir = new THREE.Vector3().subVectors(target.mesh.position, m.mesh.position).normalize();
            m.mesh.position.addScaledVector(dir, m.speed);
            
            // 攻擊
            if (dist < 1.3) {
              target.hp = Math.max(0, target.hp - 0.4);
              if (target.hp <= 0) target.mesh.visible = false;
            }
          } else {
            // ⭐ 被動亂跑 (隨機晃動) ⭐
            m.wanderCounter++;
            if (m.wanderCounter > 60) {
              m.wanderCounter = 0;
              m.wanderAngle = Math.random() * Math.PI * 2;
              m.wanderSpeed = 0.03 + Math.random() * 0.02;
            }
            m.mesh.position.x += Math.cos(m.wanderAngle) * (m.wanderSpeed || 0.03);
            m.mesh.position.z += Math.sin(m.wanderAngle) * (m.wanderSpeed || 0.03);
          }
        }
      });

      // 傳送門過關
      if (isPortalUnlocked) {
        [p1, p2].forEach(p => {
          if (p.hp > 0 && p.mesh.position.distanceTo(portalMesh.position) < 1.5) {
            currentFloor++;
            p1.hp = Math.min(p1.maxHp, p1.hp + 30);
            p2.hp = Math.min(p2.maxHp, p2.hp + 30);
            initFloor();
          }
        });
      }

      // 特效碎屑淡出
      particles.forEach((p, idx) => {
        p.mesh.position.add(p.vel);
        p.vel.y -= 0.01; // 重力
        p.life--;
        if (p.life <= 0) { scene.remove(p.mesh); particles.splice(idx, 1); }
      });

      // 兩人死亡
      if (p1.hp <= 0 && p2.hp <= 0) {
        isGameOver = true;
        document.getElementById('final-floor').textContent = currentFloor;
        document.getElementById('gameOverOverlay').style.display = 'flex';
        addLog(`💀 雙人皆已陣亡！停留於第 ${currentFloor} 層...`, "danger");
      }

      updateUI();
    }

    function updateUI() {
      document.getElementById('floor').textContent = currentFloor;
      document.getElementById('p1-hp').textContent = Math.ceil(p1.hp);
      document.getElementById('p1-atk').textContent = p1.atk;
      document.getElementById('p1-gold').textContent = p1.gold;

      document.getElementById('p2-hp').textContent = Math.ceil(p2.hp);
      document.getElementById('p2-atk').textContent = p2.atk;
      document.getElementById('p2-gold').textContent = p2.gold;
    }

    function animate() {
      requestAnimationFrame(animate);
      update();
      if (portalMesh) portalMesh.rotation.z += 0.03;
      renderer.render(scene, camera);
    }

    createPlayers();
    resetGame();
    animate();
  </script>
</body>
</html>
