<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>2D 槍械拾取與戰鬥原型</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            color: #fff;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        canvas {
            border: 2px solid #555;
            background-color: #1a1a24;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
        .instructions {
            margin-top: 10px;
            font-size: 14px;
            color: #aaa;
            text-align: center;
        }
    </style>
</head>
<body>

    <h2>2D 動作遊戲 Prototype</h2>
    <canvas id="gameCanvas" width="800" height="450"></canvas>
    
    <div class="instructions">
        <strong>操作說明：</strong> A / D 鍵或 ← / → 移動 | Space / W / ↑ 跳躍（可二連跳）<br>
        <strong>S / ↓ 鍵：</strong> 撿起地上的槍 | <strong>1 / 2 鍵：</strong> 切換武器 | <strong>滑鼠左鍵：</strong> 發射（產生爆波）
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

// --- 遊戲環境與地圖設定 ---
const FLOOR_Y = canvas.height - 40;
const GRAVITY = 0.5;

// --- 按鍵監聽 ---
const keys = {};
let mouseX = 0, mouseY = 0;

window.addEventListener('keydown', e => {
    // 阻止方向鍵與空白鍵滾動網頁
    if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) {
        e.preventDefault();
    }
    
    if (!keys[e.code]) {
        // 二連跳觸發
        if ((e.code === 'Space' || e.code === 'KeyW' || e.code === 'ArrowUp')) {
            player.jump();
        }
        // 撿起武器觸發 (按 S 或 下方向鍵)
        if (e.code === 'KeyS' || e.code === 'ArrowDown') {
            player.tryPickupWeapon();
        }
        // 切換武器 (1 或 2)
        if (e.code === 'Digit1') player.switchWeapon(0);
        if (e.code === 'Digit2') player.switchWeapon(1);
    }
    keys[e.code] = true;
});

window.addEventListener('keyup', e => { keys[e.code] = false; });
canvas.addEventListener('mousemove', e => {
    const rect = canvas.getBoundingClientRect();
    mouseX = e.clientX - rect.left;
    mouseY = e.clientY - rect.top;
});
canvas.addEventListener('mousedown', e => {
    if (e.button === 0) player.shoot();
});

// --- 槍枝類型資料 ---
const WEAPON_TYPES = {
    PISTOL: { name: '手槍', color: '#f39c12', bulletSpeed: 10, cooldown: 15, damage: 10, shockwaveRadius: 20 },
    SHOTGUN: { name: '獵槍', color: '#e74c3c', bulletSpeed: 8, cooldown: 35, damage: 25, shockwaveRadius: 35 },
    RIFLE: { name: '步槍', color: '#3498db', bulletSpeed: 14, cooldown: 8, damage: 7, shockwaveRadius: 15 }
};

// --- 爆波（特效）類別 ---
class Shockwave {
    constructor(x, y, maxRadius) {
        this.x = x;
        this.y = y;
        this.radius = 5;
        this.maxRadius = maxRadius;
        this.alpha = 1;
    }
    update() {
        this.radius += 2.5;
        this.alpha -= 0.05;
    }
    draw() {
        ctx.save();
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255, 235, 59, ${Math.max(0, this.alpha)})`;
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.restore();
    }
}

// --- 掉落在地上的武器 ---
class GroundWeapon {
    constructor(x, y, type) {
        this.x = x;
        this.y = y;
        this.type = type; // WEAPON_TYPES 的物件
        this.width = 24;
        this.height = 12;
    }
    draw() {
        ctx.fillStyle = this.type.color;
        ctx.fillRect(this.x - this.width/2, this.y - this.height, this.width, this.height);
        
        ctx.fillStyle = '#fff';
        ctx.font = '10px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(this.type.name, this.x, this.y - this.height - 4);
    }
}

// --- 寶箱類別 ---
class Chest {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.width = 30;
        this.height = 24;
    }
    draw() {
        ctx.fillStyle = '#f1c40f';
        ctx.fillRect(this.x - this.width/2, this.y - this.height, this.width, this.height);
        ctx.strokeStyle = '#d35400';
        ctx.lineWidth = 2;
        ctx.strokeRect(this.x - this.width/2, this.y - this.height, this.width, this.height);
    }
}

// --- 子彈類別 ---
class Bullet {
    constructor(x, y, vx, vy) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.life = 60;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life--;
    }
    draw() {
        ctx.fillStyle = '#ffeb3b';
        ctx.beginPath();
        ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
        ctx.fill();
    }
}

// --- 玩家類別 ---
class Player {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.width = 24;
        this.height = 40;
        this.vx = 0;
        this.vy = 0;
        this.isGrounded = false;
        
        // 跳躍控制
        this.jumpCount = 0;
        this.maxJumps = 2; // 二連跳
        
        // 背包系統（最多 2 把槍，初始配備手槍）
        this.inventory = [WEAPON_TYPES.PISTOL];
        this.equippedIndex = 0;
        this.shootCooldown = 0;
    }

    jump() {
        if (this.jumpCount < this.maxJumps) {
            this.vy = -10;
            this.jumpCount++;
            this.isGrounded = false;
        }
    }

    switchWeapon(index) {
        if (index < this.inventory.length) {
            this.equippedIndex = index;
        }
    }

    shoot() {
        if (this.shootCooldown > 0) return;
        
        const currentWeapon = this.inventory[this.equippedIndex];
        const angle = Math.atan2(mouseY - (this.y - this.height/2), mouseX - this.x);
        
        const vx = Math.cos(angle) * currentWeapon.bulletSpeed;
        const vy = Math.sin(angle) * currentWeapon.bulletSpeed;
        
        bullets.push(new Bullet(this.x, this.y - this.height/2, vx, vy));
        
        // 產生爆波效果
        shockwaves.push(new Shockwave(this.x, this.y - this.height/2, currentWeapon.shockwaveRadius));
        
        this.shootCooldown = currentWeapon.cooldown;
    }

    tryPickupWeapon() {
        // 搜尋附近的地面槍枝
        for (let i = 0; i < groundWeapons.length; i++) {
            const gw = groundWeapons[i];
            const dist = Math.hypot(this.x - gw.x, (this.y - this.height/2) - gw.y);
            
            if (dist < 45) { // 處於可拾取範圍
                if (this.inventory.length < 2) {
                    // 背包只有 1 把：直接拾取至第二欄
                    this.inventory.push(gw.type);
                    this.equippedIndex = 1;
                } else {
                    // 背包已有 2 把：將當前手上的槍丟到地上，換成新槍
                    const droppedType = this.inventory[this.equippedIndex];
                    this.inventory[this.equippedIndex] = gw.type;
                    
                    // 將換掉的槍留給其他人撿
                    groundWeapons.push(new GroundWeapon(this.x, FLOOR_Y, droppedType));
                }
                
                // 移除被撿起的地板武器
                groundWeapons.splice(i, 1);
                break;
            }
        }
    }

    update() {
        // 左右移動
        if (keys['KeyA'] || keys['ArrowLeft']) this.vx = -4;
        else if (keys['KeyD'] || keys['ArrowRight']) this.vx = 4;
        else this.vx = 0;

        // 重力計算
        this.vy += GRAVITY;
        this.x += this.vx;
        this.y += this.vy;

        // 地板碰撞
        if (this.y >= FLOOR_Y) {
            this.y = FLOOR_Y;
            this.vy = 0;
            this.isGrounded = true;
            this.jumpCount = 0; // 著地重置跳躍次數
        }

        // 地圖邊界
        if (this.x < 15) this.x = 15;
        if (this.x > canvas.width - 15) this.x = canvas.width - 15;

        // 冷卻時間更新
        if (this.shootCooldown > 0) this.shootCooldown--;

        // 觸碰寶箱邏輯：寶箱碰到就開，開完就不見
        for (let i = chests.length - 1; i >= 0; i--) {
            const chest = chests[i];
            if (Math.abs(this.x - chest.x) < 25 && Math.abs(this.y - chest.y) < 25) {
                // 隨機開出 獵槍 或 步槍
                const randomWeapon = Math.random() < 0.5 ? WEAPON_TYPES.SHOTGUN : WEAPON_TYPES.RIFLE;
                
                // 寶箱位置產生槍枝
                groundWeapons.push(new GroundWeapon(chest.x, FLOOR_Y, randomWeapon));
                
                // 寶箱消失
                chests.splice(i, 1);
            }
        }
    }

    draw() {
        // 畫玩家主體
        ctx.fillStyle = '#2ecc71';
        ctx.fillRect(this.x - this.width/2, this.y - this.height, this.width, this.height);

        // 畫當前持有的槍
        const currentWeapon = this.inventory[this.equippedIndex];
        const angle = Math.atan2(mouseY - (this.y - this.height/2), mouseX - this.x);
        
        ctx.save();
        ctx.translate(this.x, this.y - this.height/2);
        ctx.rotate(angle);
        ctx.fillStyle = currentWeapon.color;
        ctx.fillRect(0, -3, 18, 6);
        ctx.restore();
    }
}

// --- 實例化遊戲物件 ---
const player = new Player(100, FLOOR_Y);
const bullets = [];
const shockwaves = [];
const groundWeapons = [];
const chests = [
    new Chest(300, FLOOR_Y),
    new Chest(550, FLOOR_Y)
];

// --- 繪製 UI UI/HUD ---
function drawUI() {
    // 繪製背包資訊
    ctx.fillStyle = 'rgba(0,0,0,0.5)';
    ctx.fillRect(10, 10, 200, 70);
    ctx.strokeStyle = '#555';
    ctx.strokeRect(10, 10, 200, 70);

    ctx.fillStyle = '#fff';
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText("背包 (可持 2 把槍):", 20, 30);

    for (let i = 0; i < 2; i++) {
        const weapon = player.inventory[i];
        const isSelected = (i === player.equippedIndex);
        
        ctx.fillStyle = isSelected ? '#ffeb3b' : '#aaa';
        const label = weapon ? `[${i+1}] ${weapon.name}` : `[${i+1}] (空)`;
        ctx.fillText((isSelected ? "➤ " : "   ") + label, 20, 50 + i * 20);
    }
}

// --- 主遊戲循環 ---
function gameLoop() {
    // 1. 清空畫布
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // 2. 繪製地板
    ctx.fillStyle = '#3e2723';
    ctx.fillRect(0, FLOOR_Y, canvas.width, canvas.height - FLOOR_Y);
    ctx.fillStyle = '#4caf50';
    ctx.fillRect(0, FLOOR_Y, canvas.width, 5); // 草地頂層

    // 3. 更新與繪製寶箱
    chests.forEach(chest => chest.draw());

    // 4. 更新與繪製地面槍枝
    groundWeapons.forEach(gw => gw.draw());

    // 5. 更新與繪製子彈
    for (let i = bullets.length - 1; i >= 0; i--) {
        bullets[i].update();
        bullets[i].draw();
        if (bullets[i].life <= 0) bullets.splice(i, 1);
    }

    // 6. 更新與繪製爆波
    for (let i = shockwaves.length - 1; i >= 0; i--) {
        shockwaves[i].update();
        shockwaves[i].draw();
        if (shockwaves[i].alpha <= 0) shockwaves.splice(i, 1);
    }

    // 7. 更新與繪製玩家
    player.update();
    player.draw();

    // 8. 繪製 UI
    drawUI();

    requestAnimationFrame(gameLoop);
}

// 啟動遊戲
gameLoop();
</script>

</body>
</html>
