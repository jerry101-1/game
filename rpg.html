<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>2D 像素動作戰鬥 - Temple of Boom 修正版</title>
    <style>
        body {
            margin: 0;
            background-color: #050508;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            user-select: none;
        }
        .game-container {
            position: relative;
            width: 800px;
            height: 450px;
        }
        canvas {
            border: 4px solid #3d281d;
            background-color: #2b1d14;
            box-shadow: 0 0 35px rgba(0, 0, 0, 0.95);
            image-rendering: pixelated;
        }
        #menuOverlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 10, 12, 0.88);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            box-sizing: border-box;
        }
        .menu-title {
            color: #f39c12;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 25px;
            text-shadow: 3px 3px #000;
        }
        .btn-container {
            display: flex;
            gap: 20px;
        }
        .mode-btn {
            background-color: #6b4423;
            color: #fff;
            border: 3px solid #f1c40f;
            padding: 14px 28px;
            font-size: 18px;
            font-family: inherit;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.15s ease;
            box-shadow: 0 5px 0 #3a2313;
        }
        .mode-btn:hover {
            background-color: #8c582d;
            border-color: #fff;
            transform: translateY(-2px);
            box-shadow: 0 7px 0 #3a2313;
        }
        .instructions {
            margin-top: 12px;
            font-size: 13px;
            color: #aaa;
            text-align: center;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <h2 style="color: #f39c12; margin-bottom: 8px;">TEMPLE OF BOOM (完全修復版)</h2>
    
    <div class="game-container">
        <div id="menuOverlay">
            <div class="menu-title">選擇遊戲模式</div>
            <div class="btn-container">
                <button class="mode-btn" onclick="startGame(1)">🎮 1P 單人模式</button>
                <button class="mode-btn" onclick="startGame(2)">⚔️ 2P 雙人同樂</button>
            </div>
        </div>

        <canvas id="gameCanvas" width="800" height="450"></canvas>
    </div>
    
    <div class="instructions">
        <strong>【1P 操作】</strong> W：跳躍 | A/D：移動 | S：撿槍 | C：換槍 | V：開槍<br>
        <strong>【2P 操作】</strong> ↑：跳躍 | ←/→：移動 | ↓：撿槍 | K：換槍 | L：開槍<br>
        <strong>【遊戲結束】</strong> 按 R 鍵重新開始
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const menuOverlay = document.getElementById('menuOverlay');

const GRAVITY = 0.45;
let killCount = 0;
let gameState = 'MENU'; 
let gameMode = 1;      

const keys = {};

window.addEventListener('keydown', e => {
    if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) {
        e.preventDefault();
    }

    if (gameState === 'MENU') {
        if (e.code === 'Digit1' || e.code === 'Numpad1') startGame(1);
        if (e.code === 'Digit2' || e.code === 'Numpad2') startGame(2);
        return;
    }

    if (gameState === 'GAMEOVER') {
        if (e.code === 'KeyR') startGame(gameMode);
        return;
    }

    if (!keys[e.code]) {
        if (e.code === 'KeyW' && player1 && player1.hp > 0) player1.jump();
        if (e.code === 'KeyS' && player1 && player1.hp > 0) player1.tryPickupWeapon();
        if (e.code === 'KeyC' && player1 && player1.hp > 0) player1.cycleWeapon();
        if (e.code === 'KeyV' && player1 && player1.hp > 0) player1.shoot();

        if (gameMode === 2 && player2 && player2.hp > 0) {
            if (e.code === 'ArrowUp') player2.jump();
            if (e.code === 'ArrowDown') player2.tryPickupWeapon();
            if (e.code === 'KeyK') player2.cycleWeapon();
            if (e.code === 'KeyL') player2.shoot();
        }
    }
    keys[e.code] = true;
});

window.addEventListener('keyup', e => { keys[e.code] = false; });

// 線段-矩形碰撞檢測
function checkLineRectCollision(x1, y1, x2, y2, rx, ry, rw, rh) {
    const minX = Math.min(x1, x2);
    const maxX = Math.max(x1, x2);
    const minY = Math.min(y1, y2);
    const maxY = Math.max(y1, y2);

    if (maxX < rx || minX > rx + rw || maxY < ry || minY > ry + rh) return false;
    return true;
}

// 地圖平台
const platforms = [
    { x: 0, y: 420, w: 800, h: 30, isGround: true },
    { x: 300, y: 350, w: 200, h: 70, isGround: true },
    { x: 135, y: 370, w: 90, h: 14 },
    { x: 575, y: 370, w: 90, h: 14 },
    { x: 40, y: 290, w: 180, h: 14 },
    { x: 580, y: 290, w: 180, h: 14 },
    { x: 350, y: 250, w: 100, h: 14 },
    { x: 120, y: 190, w: 180, h: 14 },
    { x: 500, y: 190, w: 180, h: 14 },
    { x: 130, y: 80, w: 200, h: 14 },
    { x: 470, y: 80, w: 200, h: 14 }
];

// 武器資料
const WEAPON_TYPES = {
    PISTOL:   { id: 'PISTOL', name: '手槍', color: '#f39c12', speed: 13, cooldown: 14, damage: 25, ammo: 40 },
    SMG:      { id: 'SMG', name: '衝鋒槍', color: '#f1c40f', speed: 15, cooldown: 6, damage: 15, ammo: 80 },
    SHOTGUN:  { id: 'SHOTGUN', name: '散彈槍', color: '#e67e22', speed: 11, cooldown: 35, damage: 20, ammo: 24 },
    SNIPER:   { id: 'SNIPER', name: '狙擊槍', color: '#3498db', speed: 22, cooldown: 45, damage: 90, ammo: 12 },
    GRENADE:  { id: 'GRENADE', name: '榴彈槍', color: '#e74c3c', speed: 9, cooldown: 40, damage: 70, ammo: 15 }
};

function getRandomWeapon() {
    const list = [WEAPON_TYPES.SMG, WEAPON_TYPES.SHOTGUN, WEAPON_TYPES.SNIPER, WEAPON_TYPES.GRENADE];
    return list[Math.floor(Math.random() * list.length)];
}

// 粒子特效
class Particle {
    constructor(x, y, vx, vy, color, size, life) {
        this.x = x; this.y = y; this.vx = vx; this.vy = vy;
        this.color = color; this.size = size; this.life = life; this.maxLife = life;
    }
    update() { this.x += this.vx; this.y += this.vy; this.life--; }
    draw() {
        ctx.fillStyle = this.color;
        ctx.globalAlpha = Math.max(0, this.life / this.maxLife);
        ctx.fillRect(this.x, this.y, this.size, this.size);
        ctx.globalAlpha = 1.0;
    }
}

// 子彈類別
class Bullet {
    constructor(x, y, vx, vy, weaponType, isEnemy = false) {
        this.x = x; this.y = y;
        this.prevX = x; this.prevY = y;
        this.vx = vx; this.vy = vy;
        this.type = weaponType;
        this.isEnemy = isEnemy;
        this.damage = isEnemy ? 10 : weaponType.damage;
        this.life = 100;
    }

    update() {
        this.prevX = this.x;
        this.prevY = this.y;

        if (this.type && this.type.id === 'GRENADE') this.vy += 0.25;

        this.x += this.vx; this.y += this.vy; this.life--;

        if (this.type && this.type.id === 'GRENADE') {
            platforms.forEach(p => {
                if (this.x > p.x && this.x < p.x + p.w && this.y >= p.y - 2 && this.y <= p.y + p.h) {
                    this.explode(); this.life = 0;
                }
            });
        }
    }

    explode() {
        for (let i = 0; i < 15; i++) {
            particles.push(new Particle(this.x, this.y, (Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6, '#e74c3c', 3, 20));
        }
        enemies.forEach(e => {
            if (Math.hypot(e.x - this.x, (e.y - e.h/2) - this.y) < 60) {
                e.takeDamage(this.damage, this.vx > 0 ? 1 : -1);
            }
        });
    }

    draw() {
        ctx.fillStyle = this.isEnemy ? '#ff4d4d' : (this.type ? this.type.color : '#ffe100');
        ctx.fillRect(this.x - 3, this.y - 2, 6, 4);
    }
}

// 寶箱與掉落武器
class Chest {
    constructor(x, y) { this.x = x; this.y = y; this.w = 26; this.h = 18; }
    draw() {
        ctx.fillStyle = '#8b5a2b';
        ctx.fillRect(this.x - this.w/2, this.y - this.h, this.w, this.h);
        ctx.fillStyle = '#f1c40f';
        ctx.fillRect(this.x - this.w/2, this.y - this.h, this.w, 4);
        ctx.fillRect(this.x - this.w/2, this.y - 4, this.w, 4);
        ctx.fillRect(this.x - 3, this.y - this.h/2 - 2, 6, 6);
    }
}

class GroundWeapon {
    constructor(x, y, type) {
        this.x = x; this.y = y; this.type = type; this.bounce = 0;
    }
    draw() {
        this.bounce += 0.08;
        const offsetY = Math.sin(this.bounce) * 3;
        ctx.fillStyle = this.type.color;
        ctx.fillRect(this.x - 10, this.y - 8 + offsetY, 20, 8);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 10px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(this.type.name, this.x, this.y - 12 + offsetY);
    }
}

// 怪物類別 (修復穿牆與扣血)
class Enemy {
    constructor(x, y, type = 'GOBLIN') {
        this.x = x; this.y = y; this.type = type;
        this.w = type === 'SPIDER' ? 26 : 20;
        this.h = type === 'SPIDER' ? 18 : 24;
        this.color = type === 'SPIDER' ? '#8e44ad' : '#27ae60';
        this.vx = (Math.random() > 0.5 ? 1 : -1) * 1.5;
        this.vy = 0;
        this.maxHp = type === 'SPIDER' ? 30 : 45;
        this.hp = this.maxHp;
        this.shootCooldown = 0;
        this.flashTimer = 0;
        this.onGround = false;
    }

    takeDamage(amount, direction) {
        this.hp -= amount;
        this.flashTimer = 6;
        this.vx += direction * 2.0; // 擊退效果
        this.vy = -2.5;

        for (let i = 0; i < 6; i++) {
            particles.push(new Particle(this.x, this.y - this.h/2, (Math.random() - 0.5) * 4, -Math.random() * 3, '#ff4d4d', 2, 15));
        }
    }

    update() {
        this.vy += GRAVITY;
        this.x += this.vx;
        this.y += this.vy;
        this.onGround = false;

        if (Math.abs(this.vx) > 1.5) this.vx *= 0.88;

        // 平台與地面防穿透
        platforms.forEach(p => {
            if (this.vy >= 0 &&
                this.x + this.w/2 > p.x &&
                this.x - this.w/2 < p.x + p.w &&
                this.y >= p.y && this.y - this.vy <= p.y + 8) {
                this.y = p.y;
                this.vy = 0;
                this.onGround = true;
            }
        });

        // 嚴格地圖左右邊界防穿牆
        if (this.x - this.w/2 < 15) { 
            this.x = 15 + this.w/2; 
            this.vx = Math.abs(this.vx); 
        }
        if (this.x + this.w/2 > canvas.width - 15) { 
            this.x = canvas.width - 15 - this.w/2; 
            this.vx = -Math.abs(this.vx); 
        }

        let targets = [player1, player2].filter(p => p && p.hp > 0);
        let target = targets.length > 0 ? targets[0] : null;

        if (target) {
            if (Math.abs(target.x - this.x) > 15) {
                this.vx = target.x > this.x ? 1.5 : -1.5;
            }

            if (this.onGround && (target.y < this.y - 30 || Math.random() < 0.015)) {
                this.vy = -8.5;
            }
        }

        if (this.type === 'GOBLIN') {
            if (this.shootCooldown > 0) this.shootCooldown--;
            if (target && Math.hypot(target.x - this.x, target.y - this.y) < 260 && this.shootCooldown <= 0) {
                const angle = Math.atan2((target.y - 12) - this.y, target.x - this.x);
                bullets.push(new Bullet(this.x, this.y - 12, Math.cos(angle)*5.5, Math.sin(angle)*5.5, null, true));
                this.shootCooldown = 90 + Math.floor(Math.random() * 40);
            }
        }

        if (this.flashTimer > 0) this.flashTimer--;
    }

    draw() {
        ctx.fillStyle = this.flashTimer > 0 ? '#ffffff' : this.color;

        if (this.type === 'SPIDER') {
            ctx.fillRect(this.x - this.w/2, this.y - this.h, this.w, this.h);
            ctx.fillStyle = '#fff';
            ctx.fillRect(this.x - 8, this.y - this.h - 4, 4, 5);
            ctx.fillRect(this.x + 4, this.y - this.h - 4, 4, 5);
        } else {
            ctx.fillRect(this.x - this.w/2, this.y - this.h, this.w, this.h);
            ctx.fillStyle = '#111';
            ctx.fillRect(this.vx > 0 ? this.x : this.x - 10, this.y - 12, 10, 4);
        }

        // 血條
        const barW = 22;
        ctx.fillStyle = '#000';
        ctx.fillRect(this.x - barW/2 - 1, this.y - this.h - 8, barW + 2, 4);
        ctx.fillStyle = '#e74c3c';
        ctx.fillRect(this.x - barW/2, this.y - this.h - 7, Math.max(0, (this.hp / this.maxHp) * barW), 2);
    }
}

// 玩家類別
class Player {
    constructor(x, y, bodyColor, styleType, controls) {
        this.x = x; this.y = y; this.w = 20; this.h = 28;
        this.bodyColor = bodyColor; this.styleType = styleType;
        this.controls = controls;
        this.facing = 1; this.vx = 0; this.vy = 0;
        this.hp = 100;
        this.jumpCount = 0;
        this.inventory = [WEAPON_TYPES.PISTOL];
        this.equippedIndex = 0;
        this.shootCooldown = 0;
    }

    jump() {
        if (this.jumpCount < 2) {
            this.vy = -9.2;
            this.jumpCount++;
            for (let i = 0; i < 4; i++) {
                particles.push(new Particle(this.x, this.y, (Math.random() - 0.5) * 3, -Math.random() * 2, '#ccc', 2, 12));
            }
        }
    }

    cycleWeapon() {
        if (this.inventory.length > 1) {
            this.equippedIndex = (this.equippedIndex + 1) % this.inventory.length;
        }
    }

    shoot() {
        if (this.shootCooldown > 0) return;
        const weapon = this.inventory[this.equippedIndex];
        const gunX = this.x + (this.facing * 12);
        const gunY = this.y - 14;

        if (weapon.id === 'SHOTGUN') {
            for (let a of [-0.18, 0, 0.18]) {
                bullets.push(new Bullet(gunX, gunY, this.facing * weapon.speed * Math.cos(a), weapon.speed * Math.sin(a), weapon));
            }
        } else {
            bullets.push(new Bullet(gunX, gunY, this.facing * weapon.speed, 0, weapon));
        }

        this.shootCooldown = weapon.cooldown;
    }

    tryPickupWeapon() {
        for (let i = groundWeapons.length - 1; i >= 0; i--) {
            const gw = groundWeapons[i];
            if (Math.hypot(this.x - gw.x, (this.y - 14) - gw.y) < 35) {
                if (this.inventory.length < 2) {
                    this.inventory.push(gw.type);
                    this.equippedIndex = 1;
                } else {
                    const dropped = this.inventory[this.equippedIndex];
                    this.inventory[this.equippedIndex] = gw.type;
                    groundWeapons.push(new GroundWeapon(this.x, this.y, dropped));
                }
                groundWeapons.splice(i, 1);
                break;
            }
        }
    }

    update() {
        if (this.hp <= 0) return;

        if (keys[this.controls.left]) { this.vx = -3.5; this.facing = -1; }
        else if (keys[this.controls.right]) { this.vx = 3.5; this.facing = 1; }
        else { this.vx = 0; }

        this.vy += GRAVITY;
        this.x += this.vx;
        this.y += this.vy;

        platforms.forEach(p => {
            if (this.vy >= 0 && 
                this.x + this.w/2 > p.x && 
                this.x - this.w/2 < p.x + p.w &&
                this.y >= p.y && this.y - this.vy <= p.y + 6) {
                this.y = p.y;
                this.vy = 0;
                this.jumpCount = 0;
            }
        });

        if (this.x < 15) this.x = 15;
        if (this.x > canvas.width - 15) this.x = canvas.width - 15;

        if (this.shootCooldown > 0) this.shootCooldown--;

        for (let i = chests.length - 1; i >= 0; i--) {
            const c = chests[i];
            if (Math.abs(this.x - c.x) < 22 && Math.abs(this.y - c.y) < 25) {
                groundWeapons.push(new GroundWeapon(c.x, c.y, getRandomWeapon()));
                for (let k = 0; k < 12; k++) {
                    particles.push(new Particle(c.x, c.y - 10, (Math.random() - 0.5) * 5, (Math.random() - 0.5) * 5, '#f1c40f', 3, 20));
                }
                chests.splice(i, 1);
            }
        }
    }

    draw() {
        if (this.hp <= 0) return;

        ctx.fillStyle = this.bodyColor;
        ctx.fillRect(this.x - this.w/2, this.y - this.h, this.w, this.h);

        if (this.styleType === 'BANDANA') {
            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(this.x - this.w/2, this.y - this.h, this.w, 6);
        } else {
            ctx.fillStyle = '#8b5a2b';
            ctx.fillRect(this.x - this.w/2 - 4, this.y - this.h - 2, this.w + 8, 4);
            ctx.fillRect(this.x - 6, this.y - this.h - 8, 12, 6);
        }

        ctx.fillStyle = '#fff';
        const eyeX = this.facing === 1 ? this.x + 2 : this.x - 6;
        ctx.fillRect(eyeX, this.y - this.h + 8, 4, 4);

        const weapon = this.inventory[this.equippedIndex];
        ctx.fillStyle = weapon.color;
        const gunX = this.facing === 1 ? this.x : this.x - 12;
        ctx.fillRect(gunX, this.y - 16, 12, 5);
    }
}

let player1, player2;
let bullets = [];
let particles = [];
let groundWeapons = [];
let chests = [];
let enemies = [];

function spawnEnemies() {
    if (enemies.length < 4) {
        const type = Math.random() > 0.5 ? 'SPIDER' : 'GOBLIN';
        enemies.push(new Enemy(100 + Math.random() * 600, 60, type));
    }
}

function startGame(mode) {
    gameMode = mode;
    gameState = 'PLAYING';
    killCount = 0;

    menuOverlay.style.display = 'none';

    bullets = [];
    particles = [];
    groundWeapons = [];
    
    chests = [new Chest(180, 370), new Chest(620, 370)];

    enemies = [
        new Enemy(400, 80, 'SPIDER'),
        new Enemy(100, 420, 'GOBLIN'),
        new Enemy(700, 290, 'GOBLIN')
    ];

    player1 = new Player(360, 350, '#3498db', 'BANDANA', { left: 'KeyA', right: 'KeyD' });
    player2 = gameMode === 2 ? new Player(440, 350, '#1abc9c', 'HAT', { left: 'ArrowLeft', right: 'ArrowRight' }) : null;
}

function drawMapAndUI() {
    ctx.fillStyle = '#4a3324';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#3a271b';
    for (let x = 0; x < canvas.width; x += 80) ctx.fillRect(x, 0, 3, canvas.height);

    platforms.forEach(p => {
        ctx.fillStyle = '#8c6d3f';
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = '#d4ac0d';
        ctx.fillRect(p.x, p.y, p.w, 3);
        ctx.fillStyle = '#5c4528';
        ctx.fillRect(p.x, p.y + p.h - 3, p.w, 3);
    });

    drawHealthBar(20, 15, player1.hp, 100, '#3498db', '1P');
    if (player2) drawHealthBar(canvas.width - 150, 15, player2.hp, 100, '#1abc9c', '2P');

    ctx.fillStyle = '#fff';
    ctx.fillRect(canvas.width / 2 - 6, 12, 4, 14);
    ctx.fillRect(canvas.width / 2 + 2, 12, 4, 14);

    ctx.fillStyle = '#ffffff';
    ctx.font = '900 22px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(`KILLS ${killCount}`, canvas.width / 2, 432);
}

function drawHealthBar(x, y, hp, maxHp, color, label) {
    const width = 130;
    const height = 16;
    
    ctx.fillStyle = '#000';
    ctx.fillRect(x - 2, y - 2, width + 4, height + 4);

    const segments = 10;
    const segW = (width - (segments - 1) * 2) / segments;
    const currentSegs = Math.ceil((Math.max(0, hp) / maxHp) * segments);

    for (let i = 0; i < segments; i++) {
        ctx.fillStyle = (i < currentSegs) ? ((i === segments - 1) ? '#e74c3c' : '#2ecc71') : '#444';
        ctx.fillRect(x + i * (segW + 2), y, segW, height);
    }
}

// 主循環
function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (gameState === 'MENU') {
        requestAnimationFrame(gameLoop);
        return;
    }

    if (gameState === 'GAMEOVER') {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.88)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#e74c3c';
        ctx.font = 'bold 36px monospace';
        ctx.textAlign = 'center';
        ctx.fillText("GAME OVER", canvas.width / 2, 180);
        ctx.fillStyle = '#fff';
        ctx.font = '18px monospace';
        ctx.fillText(`最終擊殺數: ${killCount}`, canvas.width / 2, 230);
        ctx.fillText("按下 [ R ] 鍵重新開始", canvas.width / 2, 280);
        requestAnimationFrame(gameLoop);
        return;
    }

    drawMapAndUI();

    chests.forEach(c => c.draw());
    groundWeapons.forEach(gw => gw.draw());

    if (Math.random() < 0.006) spawnEnemies();

    // 1. 更新並繪製怪物
    enemies.forEach(e => e.update());

    // 2. ★ 全域怪物死亡檢查 (徹底解決打不死的 Bug) ★
    for (let j = enemies.length - 1; j >= 0; j--) {
        if (enemies[j].hp <= 0) {
            const e = enemies[j];
            for (let k = 0; k < 16; k++) {
                particles.push(new Particle(e.x, e.y - e.h/2, (Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6, e.color, 3, 20));
            }
            enemies.splice(j, 1);
            killCount++;
        }
    }

    // 3. 子彈與碰撞處理
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.update();
        b.draw();

        if (!b.isEnemy) {
            for (let j = 0; j < enemies.length; j++) {
                const e = enemies[j];
                const enemyBox = { x: e.x - e.w/2, y: e.y - e.h, w: e.w, h: e.h };

                if (checkLineRectCollision(b.prevX, b.prevY, b.x, b.y, enemyBox.x, enemyBox.y, enemyBox.w, enemyBox.h)) {
                    e.takeDamage(b.damage, b.vx > 0 ? 1 : -1);
                    bullets.splice(i, 1);
                    break;
                }
            }
        } else {
            [player1, player2].forEach(p => {
                if (p && p.hp > 0) {
                    const pBox = { x: p.x - p.w/2, y: p.y - p.h, w: p.w, h: p.h };
                    if (checkLineRectCollision(b.prevX, b.prevY, b.x, b.y, pBox.x, pBox.y, pBox.w, pBox.h)) {
                        p.hp -= b.damage;
                        for (let k = 0; k < 6; k++) {
                            particles.push(new Particle(p.x, p.y - p.h/2, (Math.random() - 0.5) * 4, (Math.random() - 0.5) * 4, '#e74c3c', 2, 15));
                        }
                        bullets.splice(i, 1);
                    }
                }
            });
        }

        if (b && b.life <= 0) bullets.splice(i, 1);
    }

    const is1PDead = player1.hp <= 0;
    const is2PDead = gameMode === 2 ? (player2.hp <= 0) : true;
    if (is1PDead && is2PDead) {
        gameState = 'GAMEOVER';
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update(); particles[i].draw();
        if (particles[i].life <= 0) particles.splice(i, 1);
    }

    enemies.forEach(e => e.draw());

    player1.update(); player1.draw();
    if (player2) { player2.update(); player2.draw(); }

    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
