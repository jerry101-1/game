<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>2D 像素武器散射與 BOSS 戰</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0b0712; color: #fff;
      font-family: 'Courier New', Courier, monospace;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 100vh; overflow: hidden;
    }
    .game-wrapper {
      position: relative; border: 4px solid #3d2314; border-radius: 8px;
      box-shadow: 0 0 35px rgba(0,0,0,0.9);
    }
    canvas { background-color: #1a1017; image-rendering: pixelated; display: block; }
    .controls-hint {
      margin-top: 10px; display: flex; gap: 30px; background: rgba(0,0,0,0.7);
      padding: 8px 20px; border-radius: 6px; font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="game-wrapper">
    <canvas id="gameCanvas" width="860" height="520"></canvas>
  </div>

  <div class="controls-hint">
    <div><strong>1P (藍)：</strong> WASD 移動/跳 | <strong>C</strong> 開槍 | <strong>V</strong> 換槍/開箱</div>
    <div><strong>2P (綠)：</strong> ↑↓←→ 移動/跳 | <strong>K</strong> 開槍 | <strong>L</strong> 換槍/開箱</div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let totalKills = 0, isGameOver = false;
    let nextBossThreshold = 15;
    const keys = {};

    // ─── 1. 武器參數 (包含 spread: 散射角度弧度) ───
    const WEAPONS = {
      pistol:     { name: '手槍', fireRate: 250, ammoType: 'inf', dmg: 18, speed: 10, spread: 0.02, color: '#f1c40f' },
      ak47:       { name: 'AK-47', fireRate: 140, ammoType: 'rifle', dmg: 26, speed: 12, spread: 0.08, color: '#e67e22' },
      mgun:       { name: '重機槍', fireRate: 70,  ammoType: 'rifle', dmg: 20, speed: 13, spread: 0.22, color: '#f39c12' },
      smg:        { name: 'SMG', fireRate: 80,  ammoType: 'pistol', dmg: 14, speed: 11, spread: 0.16, color: '#3498db' },
      shotgun:    { name: '霰彈槍', fireRate: 500, ammoType: 'shotgun', dmg: 16, speed: 10, spread: 0.28, color: '#e74c3c' },
      crossbow:   { name: '十字弓', fireRate: 450, ammoType: 'special', dmg: 65, speed: 16, spread: 0.0, color: '#16a085' },
      rpg:        { name: 'RPG', fireRate: 900, ammoType: 'explosive', dmg: 130, speed: 7, spread: 0.0, color: '#c0392b', splashRadius: 65 },
      grenade:    { name: '榴彈發射器', fireRate: 700, ammoType: 'explosive', dmg: 85, speed: 8, spread: 0.05, color: '#d35400', gravity: 0.25, splashRadius: 45 },
      mine:       { name: '地雷發射器', fireRate: 800, ammoType: 'special', dmg: 160, speed: 5, spread: 0.0, color: '#9b59b6', splashRadius: 55 }
    };

    const platforms = [
      { x: 0, y: 470, w: 860, h: 50 },
      { x: 0, y: 370, w: 240, h: 16 },
      { x: 620, y: 370, w: 240, h: 16 },
      { x: 280, y: 395, w: 300, h: 20 },
      { x: 120, y: 270, w: 240, h: 16 },
      { x: 500, y: 270, w: 240, h: 16 },
      { x: 350, y: 190, w: 160, h: 16 },
      { x: 0, y: 160, w: 200, h: 16 },
      { x: 660, y: 160, w: 200, h: 16 }
    ];

    const chests = [
      { x: 80, y: 440, w: 28, h: 22, opened: false },
      { x: 750, y: 440, w: 28, h: 22, opened: false },
      { x: 416, y: 365, w: 28, h: 22, opened: false }
    ];

    function createPlayer(x, color, isP1) {
      return {
        x: x, y: 350, w: 20, h: 28, vx: 0, vy: 0,
        color: color, isP1: isP1, facing: 1, isGrounded: false,
        hp: 100, maxHp: 100, gold: 0,
        inventory: ['pistol', 'ak47'],
        currentWpnIdx: 0,
        ammoPool: { pistol: 100, rifle: 80, shotgun: 30, explosive: 10, special: 12 },
        lastShot: 0
      };
    }

    let p1 = createPlayer(380, '#3498db', true);
    let p2 = createPlayer(460, '#2ecc71', false);

    let bullets = [], bossBullets = [], monsters = [], drops = [], mines = [], explosions = [];
    let boss = null;

    window.addEventListener('keydown', e => { keys[e.code] = true; });
    window.addEventListener('keyup', e => { keys[e.code] = false; });

    // ─── 帶有散射角度的開槍運算 ───
    function fireWeapon(player) {
      const now = Date.now();
      const wpnKey = player.inventory[player.currentWpnIdx];
      const wpn = WEAPONS[wpnKey];

      if (now - player.lastShot < wpn.fireRate) return;

      if (wpn.ammoType !== 'inf') {
        if (player.ammoPool[wpn.ammoType] <= 0) return;
        player.ammoPool[wpn.ammoType]--;
      }

      player.lastShot = now;
      const spawnX = player.x + (player.facing === 1 ? player.w : -8);
      const spawnY = player.y + 10;

      if (wpnKey === 'shotgun') {
        // 霰彈槍：多發散射彈幕
        for (let i = -2; i <= 2; i++) {
          let spreadAngle = (i * 0.08) + (Math.random() - 0.5) * 0.05;
          let baseVx = player.facing * wpn.speed;
          bullets.push({
            x: spawnX, y: spawnY, w: 5, h: 4,
            vx: baseVx * Math.cos(spreadAngle),
            vy: baseVx * Math.sin(spreadAngle),
            type: wpnKey, dmg: wpn.dmg, color: wpn.color, owner: player
          });
        }
      } else if (wpnKey === 'mine') {
        mines.push({
          x: spawnX, y: spawnY, w: 14, h: 8,
          vx: player.facing * wpn.speed, vy: -2,
          dmg: wpn.dmg, radius: wpn.splashRadius, isPlanted: false
        });
      } else {
        // 一般槍枝（包含 AK-47, SMG, 重機槍的隨機散射計算）
        let offsetAngle = (Math.random() - 0.5) * wpn.spread;
        let baseVx = player.facing * wpn.speed;

        bullets.push({
          x: spawnX, y: spawnY,
          w: wpnKey === 'crossbow' ? 12 : 8, h: wpnKey === 'crossbow' ? 3 : 5,
          vx: baseVx * Math.cos(offsetAngle),
          vy: baseVx * Math.sin(offsetAngle) + (wpnKey === 'grenade' ? -3.5 : 0),
          type: wpnKey, dmg: wpn.dmg, color: wpn.color,
          gravity: wpn.gravity || 0, radius: wpn.splashRadius || 0, owner: player
        });
      }
    }

    function interactChest(player) {
      chests.forEach(c => {
        if (!c.opened && Math.abs((player.x + player.w/2) - (c.x + c.w/2)) < 35 && Math.abs(player.y - c.y) < 30) {
          c.opened = true;
          const weaponList = ['mgun', 'smg', 'crossbow', 'ak47', 'shotgun', 'rpg', 'grenade', 'mine'];
          const picked = weaponList[Math.floor(Math.random() * weaponList.length)];
          
          if (!player.inventory.includes(picked)) player.inventory.push(picked);
          
          player.ammoPool.rifle += 60;
          player.ammoPool.shotgun += 20;
          player.ammoPool.special += 10;
          player.ammoPool.explosive += 6;
        }
      });
    }

    function spawnMonster() {
      if (monsters.length > 12 || isGameOver || boss) return;
      const pts = [{x: 20, y: 50}, {x: 820, y: 50}, {x: 430, y: 20}];
      const pt = pts[Math.floor(Math.random() * pts.length)];

      monsters.push({
        x: pt.x, y: pt.y, w: 22, h: 22, vx: 0, vy: 0,
        hp: 35 + Math.floor(totalKills * 2),
        speed: 1.1 + Math.random() * 0.8,
        color: '#8e44ad'
      });
    }
    setInterval(spawnMonster, 1800);

    function checkBossSpawn() {
      if (!boss && totalKills >= nextBossThreshold) {
        boss = {
          x: 400, y: 100, w: 60, h: 60, vx: 2, vy: 0,
          hp: 600 + totalKills * 20, maxHp: 600 + totalKills * 20,
          color: '#c0392b', lastShot: 0
        };
        nextBossThreshold += 25;
      }
    }

    function createExplosion(x, y, radius, damage) {
      explosions.push({ x: x, y: y, radius: radius, alpha: 1.0 });

      monsters.forEach((m, idx) => {
        if (Math.hypot((m.x + m.w/2) - x, (m.y + m.h/2) - y) < radius) {
          m.hp -= damage;
          if (m.hp <= 0) { totalKills++; monsters.splice(idx, 1); }
        }
      });

      if (boss && Math.hypot((boss.x + boss.w/2) - x, (boss.y + boss.h/2) - y) < radius + 20) {
        boss.hp -= damage;
      }
    }

    function updateEntity(ent, gravity = 0.48) {
      ent.vy += gravity;
      ent.x += ent.vx;
      ent.y += ent.vy;

      ent.isGrounded = false;
      platforms.forEach(p => {
        if (ent.x + ent.w > p.x && ent.x < p.x + p.w &&
            ent.y + ent.h >= p.y && ent.y + ent.h <= p.y + p.h + ent.vy) {
          ent.y = p.y - ent.h;
          ent.vy = 0;
          ent.isGrounded = true;
        }
      });
      ent.x = Math.max(0, Math.min(canvas.width - ent.w, ent.x));
    }

    function update() {
      if (isGameOver) return;
      checkBossSpawn();

      if (p1.hp > 0) {
        p1.vx = 0;
        if (keys['KeyA']) { p1.vx = -3.2; p1.facing = -1; }
        if (keys['KeyD']) { p1.vx = 3.2; p1.facing = 1; }
        if (keys['KeyW'] && p1.isGrounded) p1.vy = -9.8;
        if (keys['KeyC']) fireWeapon(p1);
        if (keys['KeyV']) {
          interactChest(p1);
          if (!keys['v_lock']) {
            p1.currentWpnIdx = (p1.currentWpnIdx + 1) % p1.inventory.length;
            keys['v_lock'] = true;
          }
        } else { keys['v_lock'] = false; }
        updateEntity(p1);
      }

      if (p2.hp > 0) {
        p2.vx = 0;
        if (keys['ArrowLeft']) { p2.vx = -3.2; p2.facing = -1; }
        if (keys['ArrowRight']) { p2.vx = 3.2; p2.facing = 1; }
        if (keys['ArrowUp'] && p2.isGrounded) p2.vy = -9.8;
        if (keys['KeyK']) fireWeapon(p2);
        if (keys['KeyL']) {
          interactChest(p2);
          if (!keys['l_lock']) {
            p2.currentWpnIdx = (p2.currentWpnIdx + 1) % p2.inventory.length;
            keys['l_lock'] = true;
          }
        } else { keys['l_lock'] = false; }
        updateEntity(p2);
      }

      for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        if (b.gravity) b.vy += b.gravity;
        b.x += b.vx; b.y += b.vy;

        let hitPlatform = false;
        platforms.forEach(p => {
          if (b.x > p.x && b.x < p.x + p.w && b.y > p.y && b.y < p.y + p.h) hitPlatform = true;
        });

        if (hitPlatform || b.x < 0 || b.x > canvas.width || b.y > canvas.height) {
          if (b.radius) createExplosion(b.x, b.y, b.radius, b.dmg);
          bullets.splice(i, 1); continue;
        }

        if (boss && b.x > boss.x && b.x < boss.x + boss.w && b.y > boss.y && b.y < boss.y + boss.h) {
          if (b.radius) createExplosion(b.x, b.y, b.radius, b.dmg);
          else boss.hp -= b.dmg;
          bullets.splice(i, 1); continue;
        }

        for (let j = monsters.length - 1; j >= 0; j--) {
          let m = monsters[j];
          if (b.x > m.x && b.x < m.x + m.w && b.y > m.y && b.y < m.y + m.h) {
            if (b.radius) {
              createExplosion(b.x, b.y, b.radius, b.dmg);
            } else {
              m.hp -= b.dmg;
              if (m.hp <= 0) {
                totalKills++;
                b.owner.gold += 15;
                if (Math.random() < 0.5) drops.push({ x: m.x, y: m.y, w: 12, h: 12, type: 'gold' });
                monsters.splice(j, 1);
              }
            }
            bullets.splice(i, 1); break;
          }
        }
      }

      if (boss) {
        updateEntity(boss, 0.2);
        if (boss.x <= 10 || boss.x >= canvas.width - boss.w - 10) boss.vx *= -1;

        const now = Date.now();
        if (now - boss.lastShot > 1400) {
          boss.lastShot = now;
          let targets = [p1, p2].filter(p => p.hp > 0);
          if (targets.length > 0) {
            let t = targets[Math.floor(Math.random() * targets.length)];
            let angle = Math.atan2((t.y + t.h/2) - (boss.y + boss.h/2), (t.x + t.w/2) - (boss.x + boss.w/2));
            bossBullets.push({
              x: boss.x + boss.w/2, y: boss.y + boss.h/2,
              vx: Math.cos(angle) * 5, vy: Math.sin(angle) * 5
            });
          }
        }

        if (boss.hp <= 0) {
          totalKills += 5;
          for (let k = 0; k < 6; k++) {
            drops.push({ x: boss.x + k*8, y: boss.y, w: 12, h: 12, type: 'hp' });
            drops.push({ x: boss.x + k*10, y: boss.y, w: 12, h: 12, type: 'ammo_all' });
          }
          boss = null;
        }
      }

      for (let i = bossBullets.length - 1; i >= 0; i--) {
        let bb = bossBullets[i];
        bb.x += bb.vx; bb.y += bb.vy;

        [p1, p2].forEach(p => {
          if (p.hp > 0 && Math.hypot((p.x + p.w/2) - bb.x, (p.y + p.h/2) - bb.y) < 16) {
            p.hp = Math.max(0, p.hp - 18);
            bossBullets.splice(i, 1);
          }
        });

        if (bb.x < 0 || bb.x > canvas.width || bb.y < 0 || bb.y > canvas.height) {
          bossBullets.splice(i, 1);
        }
      }

      mines.forEach((m, idx) => {
        if (!m.isPlanted) {
          updateEntity(m);
          if (m.isGrounded) m.isPlanted = true;
        }
        monsters.concat(boss ? [boss] : []).forEach(target => {
          if (Math.hypot((target.x + target.w/2) - m.x, (target.y + target.h/2) - m.y) < 25) {
            createExplosion(m.x, m.y, m.radius, m.dmg);
            mines.splice(idx, 1);
          }
        });
      });

      explosions.forEach((ex, idx) => {
        ex.alpha -= 0.05;
        if (ex.alpha <= 0) explosions.splice(idx, 1);
      });

      monsters.forEach(m => {
        updateEntity(m);
        let targets = [p1, p2].filter(p => p.hp > 0);
        if (targets.length > 0) {
          targets.sort((a,b) => Math.abs(a.x - m.x) - Math.abs(b.x - m.x));
          let target = targets[0];
          m.vx = target.x > m.x ? m.speed : -m.speed;
          if (Math.abs(m.x - target.x) < 18 && Math.abs(m.y - target.y) < 18) {
            target.hp = Math.max(0, target.hp - 0.4);
          }
        }
      });

      drops.forEach((d, index) => {
        d.y += 1;
        platforms.forEach(p => {
          if (d.x > p.x && d.x < p.x + p.w && d.y + d.h >= p.y && d.y <= p.y + p.h) d.y = p.y - d.h;
        });

        [p1, p2].forEach(p => {
          if (p.hp > 0 && Math.abs(p.x - d.x) < 20 && Math.abs(p.y - d.y) < 20) {
            if (d.type === 'gold') p.gold += 20;
            if (d.type === 'hp') p.hp = Math.min(p.maxHp, p.hp + 30);
            if (d.type === 'ammo_all') {
              p.ammoPool.rifle += 40; p.ammoPool.shotgun += 15;
              p.ammoPool.special += 8; p.ammoPool.explosive += 5;
            }
            drops.splice(index, 1);
          }
        });
      });

      if (p1.hp <= 0 && p2.hp <= 0) isGameOver = true;
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#2c1a11';
      platforms.forEach(p => {
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = '#5c3826'; ctx.fillRect(p.x, p.y, p.w, 4);
        ctx.fillStyle = '#2c1a11';
      });

      chests.forEach(c => {
        ctx.fillStyle = c.opened ? '#7f8c8d' : '#f39c12';
        ctx.fillRect(c.x, c.y, c.w, c.h);
      });

      drops.forEach(d => {
        ctx.fillStyle = d.type === 'gold' ? '#f1c40f' : d.type === 'hp' ? '#e74c3c' : '#a855f7';
        ctx.fillRect(d.x, d.y, d.w, d.h);
      });

      [p1, p2].forEach(p => {
        if (p.hp <= 0) return;
        ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = '#fff';
        let eyeX = p.facing === 1 ? p.x + 12 : p.x + 2;
        ctx.fillRect(eyeX, p.y + 4, 5, 5);
      });

      monsters.forEach(m => {
        ctx.fillStyle = m.color; ctx.fillRect(m.x, m.y, m.w, m.h);
      });

      if (boss) {
        ctx.fillStyle = boss.color; ctx.fillRect(boss.x, boss.y, boss.w, boss.h);
        ctx.fillStyle = '#f1c40f';
        ctx.fillRect(boss.x + 10, boss.y + 12, 12, 12);
        ctx.fillRect(boss.x + 38, boss.y + 12, 12, 12);

        ctx.fillStyle = 'rgba(0,0,0,0.7)'; ctx.fillRect(230, 12, 400, 20);
        ctx.fillStyle = '#e74c3c'; ctx.fillRect(235, 15, (boss.hp / boss.maxHp) * 390, 14);
        ctx.fillStyle = '#fff'; ctx.font = 'bold 12px Courier New'; ctx.textAlign = 'center';
        ctx.fillText('⚠️ BOSS 地牢霸主 ⚠️', canvas.width / 2, 26);
      }

      bullets.forEach(b => { ctx.fillStyle = b.color; ctx.fillRect(b.x, b.y, b.w, b.h); });
      bossBullets.forEach(bb => { ctx.fillStyle = '#ef4444'; ctx.fillRect(bb.x - 5, bb.y - 5, 10, 10); });
      mines.forEach(m => { ctx.fillStyle = '#9b59b6'; ctx.fillRect(m.x, m.y, m.w, m.h); });

      explosions.forEach(ex => {
        ctx.beginPath(); ctx.arc(ex.x, ex.y, ex.radius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(231, 76, 60, ${ex.alpha})`; ctx.fill();
      });

      drawPlayerHUD(p1, 15, 15);
      drawPlayerHUD(p2, canvas.width - 225, 15);

      ctx.fillStyle = '#ffffff'; ctx.font = 'bold 26px Courier New'; ctx.textAlign = 'center';
      ctx.fillText(`KILLS ${totalKills}`, canvas.width / 2, 505);

      if (isGameOver) {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.88)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = '#e74c3c'; ctx.font = 'bold 42px Courier New';
        ctx.fillText('GAME OVER', canvas.width / 2, 230);
        ctx.fillStyle = '#fff'; ctx.font = '20px Courier New';
        ctx.fillText(`最終擊殺數量: ${totalKills}`, canvas.width / 2, 280);
      }
    }

    function drawPlayerHUD(p, x, y) {
      ctx.fillStyle = 'rgba(15, 23, 42, 0.8)';
      ctx.fillRect(x, y, 210, 75);

      ctx.fillStyle = '#22c55e';
      ctx.fillRect(x + 10, y + 10, Math.max(0, (p.hp / p.maxHp) * 190), 10);

      const currKey = p.inventory[p.currentWpnIdx];
      const currWpn = WEAPONS[currKey];
      const currAmmo = currWpn.ammoType === 'inf' ? '∞' : p.ammoPool[currWpn.ammoType];

      let nextStr = '無';
      if (p.inventory.length > 1) {
        const nextKey = p.inventory[(p.currentWpnIdx + 1) % p.inventory.length];
        const nextWpn = WEAPONS[nextKey];
        const nextAmmo = nextWpn.ammoType === 'inf' ? '∞' : p.ammoPool[nextWpn.ammoType];
        nextStr = `${nextWpn.name}: ${nextAmmo}`;
      }

      ctx.font = 'bold 12px Courier New'; ctx.fillStyle = '#38bdf8'; ctx.textAlign = 'left';
      ctx.fillText(`${p.isP1 ? '1P 勇者' : '2P 槍手'} | 💰${p.gold}`, x + 10, y + 33);
      ctx.fillStyle = '#f1c40f';
      ctx.fillText(`▶ 當前: ${currWpn.name} [${currAmmo}]`, x + 10, y + 50);
      ctx.fillStyle = '#94a3b8';
      ctx.fillText(`  備用: ${nextStr}`, x + 10, y + 66);
    }

    function loop() { update(); draw(); requestAnimationFrame(loop); }
    loop();
  </script>
</body>
</html>
