<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>雙人 2D 射擊 RPG 冒險</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    h1 {
      margin-bottom: 10px;
      color: #58a6ff;
      text-shadow: 0 0 10px rgba(88, 166, 255, 0.4);
    }
    .status-panel {
      display: flex;
      gap: 20px;
      margin-bottom: 15px;
    }
    .player-card {
      background: #161b22;
      border: 2px solid #30363d;
      padding: 10px 20px;
      border-radius: 8px;
      min-width: 200px;
    }
    .p1-card { border-color: #38bdf8; }
    .p2-card { border-color: #4ade80; }
    .player-title { font-weight: bold; margin-bottom: 5px; }
    .p1-title { color: #38bdf8; }
    .p2-title { color: #4ade80; }
    
    .game-container {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      justify-content: center;
    }
    canvas {
      border: 3px solid #30363d;
      border-radius: 8px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
      background-color: #050508;
    }
    .log-box {
      width: 240px;
      height: 480px;
      background-color: #010409;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 10px;
      font-size: 0.85rem;
      overflow-y: auto;
      line-height: 1.4;
    }
    .log-msg { margin-bottom: 5px; }
    .log-msg.p1 { color: #38bdf8; }
    .log-msg.p2 { color: #4ade80; }
    .log-msg.system { color: #f2cc60; }

    .controls-guide {
      margin-top: 15px;
      display: flex;
      gap: 30px;
      background: #161b22;
      padding: 12px 25px;
      border-radius: 8px;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <h1>⚔️ 雙人RPG</h1>
  
  <div class="status-panel">
    <div class="player-card p1-card">
      <div class="player-title p1-title">👤 1P (藍)</div>
      <div>❤️ HP: <span id="p1-hp">100</span></div>
      <div>⚔️ ATK: <span id="p1-atk">15</span></div>
      <div>💰 Gold: <span id="p1-gold">0</span></div>
    </div>
    
    <div style="align-self: center; font-size: 1.2rem; font-weight: bold;">🏰 層數: <span id="floor">1</span></div>

    <div class="player-card p2-card">
      <div class="player-title p2-title">👤 2P (綠)</div>
      <div>❤️ HP: <span id="p2-hp">100</span></div>
      <div>⚔️ ATK: <span id="p2-atk">15</span></div>
      <div>💰 Gold: <span id="p2-gold">0</span></div>
    </div>
  </div>

  <div class="game-container">
    <canvas id="gameCanvas" width="560" height="480"></canvas>
    <div class="log-box" id="logBox">
      <div class="log-msg system">雙人冒險開始！消滅所有動態怪物以進入下一層...</div>
    </div>
  </div>

  <div class="controls-guide">
    <div><strong>1P 操作：</strong> WASD 移動 | <strong>空白鍵</strong> 發射子彈</div>
    <div><strong>2P 操作：</strong> 方向鍵 ↑↓←→ 移動 | <strong>Enter</strong> 發射子彈</div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    let currentFloor = 1;
    const keys = {};

    // 玩家屬性
    let p1 = { x: 80, y: 240, r: 12, hp: 100, maxHp: 100, atk: 15, gold: 0, dirX: 1, dirY: 0, lastShot: 0 };
    let p2 = { x: 80, y: 280, r: 12, hp: 100, maxHp: 100, atk: 15, gold: 0, dirX: 1, dirY: 0, lastShot: 0 };

    let bullets = [];
    let monsters = [];
    let portal = null;
    let isPortalUnlocked = false;

    function addLog(msg, type = "system") {
      const logBox = document.getElementById('logBox');
      const div = document.createElement('div');
      div.className = `log-msg ${type}`;
      div.textContent = msg;
      logBox.appendChild(div);
      logBox.scrollTop = logBox.scrollHeight;
    }

    function initFloor() {
      p1.x = 80; p1.y = 220;
      p2.x = 80; p2.y = 260;
      bullets = [];
      monsters = [];
      isPortalUnlocked = false;

      // 生成邊角傳送門
      portal = { x: canvas.width - 60, y: canvas.height / 2, r: 18 };

      // 動態怪物生成
      const count = 3 + currentFloor * 2;
      for (let i = 0; i < count; i++) {
        monsters.push({
          x: 200 + Math.random() * (canvas.width - 280),
          y: 50 + Math.random() * (canvas.height - 100),
          r: 14,
          speed: 1 + Math.random() * 0.8 + currentFloor * 0.1,
          hp: 30 + currentFloor * 15,
          maxHp: 30 + currentFloor * 15,
          atk: 8 + currentFloor * 2,
          gold: 15 + currentFloor * 5
        });
      }

      addLog(`🏰 進入第 ${currentFloor} 層！擊殺所有移動的怪物！`);
    }

    // 鍵盤監聽
    window.addEventListener('keydown', e => { keys[e.code] = true; });
    window.addEventListener('keyup', e => { keys[e.code] = false; });

    function handleInput() {
      const speed = 3.5;
      const now = Date.now();

      // 1P 控制 (WASD + Space)
      if (p1.hp > 0) {
        let dx = 0, dy = 0;
        if (keys['KeyW']) dy -= 1;
        if (keys['KeyS']) dy += 1;
        if (keys['KeyA']) dx -= 1;
        if (keys['KeyD']) dx += 1;

        if (dx !== 0 || dy !== 0) {
          p1.dirX = dx; p1.dirY = dy;
          p1.x = Math.max(20, Math.min(canvas.width - 20, p1.x + dx * speed));
          p1.y = Math.max(20, Math.min(canvas.height - 20, p1.y + dy * speed));
        }

        if (keys['Space'] && now - p1.lastShot > 250) {
          bullets.push({ x: p1.x, y: p1.y, vx: p1.dirX * 8, vy: p1.dirY * 8, atk: p1.atk, owner: '1P' });
          p1.lastShot = now;
        }
      }

      // 2P 控制 (ArrowKeys + Enter)
      if (p2.hp > 0) {
        let dx = 0, dy = 0;
        if (keys['ArrowUp']) dy -= 1;
        if (keys['ArrowDown']) dy += 1;
        if (keys['ArrowLeft']) dx -= 1;
        if (keys['ArrowRight']) dx += 1;

        if (dx !== 0 || dy !== 0) {
          p2.dirX = dx; p2.dirY = dy;
          p2.x = Math.max(20, Math.min(canvas.width - 20, p2.x + dx * speed));
          p2.y = Math.max(20, Math.min(canvas.height - 20, p2.y + dy * speed));
        }

        if (keys['Enter'] && now - p2.lastShot > 250) {
          bullets.push({ x: p2.x, y: p2.y, vx: p2.dirX * 8, vy: p2.dirY * 8, atk: p2.atk, owner: '2P' });
          p2.lastShot = now;
        }
      }
    }

    function update() {
      handleInput();

      // 移動子彈
      bullets.forEach((b, index) => {
        b.x += b.vx;
        b.y += b.vy;

        // 邊界消除
        if (b.x < 0 || b.x > canvas.width || b.y < 0 || b.y > canvas.height) {
          bullets.splice(index, 1);
          return;
        }

        // 子彈擊中怪物判定
        monsters.forEach((m, mIndex) => {
          let dist = Math.hypot(b.x - m.x, b.y - m.y);
          if (dist < m.r + 4) {
            m.hp -= b.atk;
            bullets.splice(index, 1);

            if (m.hp <= 0) {
              if (b.owner === '1P') p1.gold += m.gold;
              if (b.owner === '2P') p2.gold += m.gold;
              addLog(`💥 ${b.owner} 擊殺怪物，獲得 ${m.gold}G`, b.owner.toLowerCase());
              monsters.splice(mIndex, 1);

              if (monsters.length === 0) {
                isPortalUnlocked = true;
                addLog('🔓 所有怪物已被清空！傳送門已解鎖！');
              }
            }
          }
        });
      });

      // 怪物 AI 與碰撞
      monsters.forEach(m => {
        // 找到活著且最近的玩家
        let targets = [];
        if (p1.hp > 0) targets.push(p1);
        if (p2.hp > 0) targets.push(p2);

        if (targets.length > 0) {
          targets.sort((a, b) => Math.hypot(a.x - m.x, a.y - m.y) - Math.hypot(b.x - m.x, b.y - m.y));
          let target = targets[0];

          // 追逐玩家
          let angle = Math.atan2(target.y - m.y, target.x - m.x);
          m.x += Math.cos(angle) * m.speed;
          m.y += Math.sin(angle) * m.speed;

          // 撞擊傷害
          if (Math.hypot(target.x - m.x, target.y - m.y) < target.r + m.r) {
            target.hp = Math.max(0, target.hp - 0.5); // 連續觸碰傷害
          }
        }
      });

      // 傳送門進入判定
      if (isPortalUnlocked) {
        [p1, p2].forEach(p => {
          if (p.hp > 0 && Math.hypot(p.x - portal.x, p.y - portal.y) < p.r + portal.r) {
            currentFloor++;
            // 進入下一層補血獎勵
            p1.hp = Math.min(p1.maxHp, p1.hp + 30);
            p2.hp = Math.min(p2.maxHp, p2.hp + 30);
            initFloor();
          }
        });
      }

      // 遊戲結束判定
      if (p1.hp <= 0 && p2.hp <= 0) {
        alert(`💀 兩位勇者皆已陣亡！最終停留在第 ${currentFloor} 層。`);
        location.reload();
      }

      updateUI();
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. 畫地圖牆壁邊框
      ctx.strokeStyle = '#30363d';
      ctx.lineWidth = 10;
      ctx.strokeRect(0, 0, canvas.width, canvas.height);

      // 2. 畫傳送門
      ctx.fillStyle = isPortalUnlocked ? '#4ade80' : '#374151';
      ctx.beginPath();
      ctx.arc(portal.x, portal.y, portal.r, 0, Math.PI * 2);
      ctx.fill();

      // 3. 畫怪物 (紅色)
      monsters.forEach(m => {
        ctx.fillStyle = '#ef4444';
        ctx.beginPath();
        ctx.arc(m.x, m.y, m.r, 0, Math.PI * 2);
        ctx.fill();

        // 血條
        ctx.fillStyle = 'red';
        ctx.fillRect(m.x - 15, m.y - 22, 30, 4);
        ctx.fillStyle = '#22c55e';
        ctx.fillRect(m.x - 15, m.y - 22, (m.hp / m.maxHp) * 30, 4);
      });

      // 4. 畫子彈
      bullets.forEach(b => {
        ctx.fillStyle = b.owner === '1P' ? '#38bdf8' : '#4ade80';
        ctx.beginPath();
        ctx.arc(b.x, b.y, 4, 0, Math.PI * 2);
        ctx.fill();
      });

      // 5. 畫玩家 1P
      if (p1.hp > 0) {
        ctx.fillStyle = '#38bdf8';
        ctx.beginPath();
        ctx.arc(p1.x, p1.y, p1.r, 0, Math.PI * 2);
        ctx.fill();
      }

      // 6. 畫玩家 2P
      if (p2.hp > 0) {
        ctx.fillStyle = '#4ade80';
        ctx.beginPath();
        ctx.arc(p2.x, p2.y, p2.r, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function updateUI() {
      document.getElementById('floor').textContent = currentFloor;
      document.getElementById('p1-hp').textContent = Math.ceil(p1.hp);
      document.getElementById('p1-atk').textContent = p1.atk;
      document.getElementById('p1-gold').textContent = p1.gold;

      document.getElementById('p2-hp').textContent = Math.ceil(p2.hp);
      document.getElementById('p2-atk').textContent = p2.atk;
      document.getElementById('p2-gold').textContent = p2.gold;
    }

    function gameLoop() {
      update();
      draw();
      requestAnimationFrame(gameLoop);
    }

    initFloor();
    gameLoop();
  </script>
</body>
</html>
