<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>2D 雙人射擊遊戲 Prototype</title>
    <style>
        body {
            margin: 0;
            background-color: #111;
            color: #fff;
            font-family: monospace, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        canvas {
            border: 4px solid #3d2d1d;
            background-color: #3b2b22;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            image-rendering: pixelated;
        }
        .instructions {
            margin-top: 10px;
            font-size: 13px;
            color: #ccc;
            text-align: center;
            line-height: 1.5;
        }
    </style>
</head>
<body>

    <h2>2D 動作射擊 Prototype</h2>
    <canvas id="gameCanvas" width="800" height="450"></canvas>
    
    <div class="instructions">
        <strong>【1P 操作】</strong> W：跳躍 | A/D：移動 | S：撿槍 | C：換槍 | V：開槍<br>
        <strong>【2P 操作】</strong> ↑：跳躍 | ←/→：移動 | ↓：撿槍 | K：換槍 | L：開槍
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const GRAVITY = 0.45;
let killCount = 0;
let gameState = 'MENU'; // 'MENU' 或 'PLAYING'
let gameMode = 1;      // 1P 或 2P

const keys = {};

window.addEventListener('keydown', e => {
    if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) {
        e.preventDefault();
    }

    if (gameState === 'MENU') {
        if (e.code === 'Digit1' || e.code === 'Numpad1') startGame(1);
        if (e.code === 'Digit2' || e.code === 'Numpad2') startGame(2);
        return;
    }

    if (!keys[e.code]) {
        // --- 1P 按鍵觸發 ---
        if (e.code === 'KeyW') player1.jump();
        if (e.code === 'KeyS') player1.tryPickupWeapon();
        if (e.code === 'KeyC') player1.cycleWeapon();
        if (e.code === 'KeyV') player1.shoot();

        // --- 2P 按鍵觸發 (僅雙人模式) ---
        if (gameMode === 2 && player2) {
            if (e.code === 'ArrowUp') player2.jump();
            if (e.code === 'ArrowDown') player2.tryPickupWeapon();
            if (e.code === 'KeyK') player2.cycleWeapon();
            if (e.code === 'KeyL') player2.shoot();
        }
    }
    keys[e.code] = true;
});

window.addEventListener('keyup', e => { keys[e.code] = false; });

// --- 地圖平台資料 ---
const platforms = [
    { x: 0, y: 420, w: 800, h: 30, isGround: true },
    { x: 290, y: 350, w: 220, h: 70, isGround: true },
    { x: 135, y: 370, w: 100, h: 16 },
    { x: 565, y: 370, w: 100, h: 16 },
    { x: 50, y: 290, w: 200, h: 16 },
    { x: 550, y: 290, w: 200, h: 16 },
    { x: 110, y: 210, w: 200, h: 16 },
    { x: 490, y: 210, w: 200, h: 16 },
    { x: 350, y: 160, w: 100, h: 16 },
    { x: 130, y: 80, w: 200, h: 16 },
    { x: 470, y: 80, w: 200, h: 16 },
    { x: 0, y: 150, w: 90, h: 16 },
    { x: 710, y: 150, w: 90, h: 16 }
];

// --- 槍枝類型 ---
const WEAPON_TYPES = {
    PISTOL: { name: '手槍', color: '#f39c12', speed: 10, cooldown: 15, damage: 25, shockwave: 18 },
    SHOTGUN: { name: '獵槍', color: '#e74c3c', speed: 8, cooldown: 30, damage: 50, shockwave: 32 },
    RIFLE: { name: '步槍', color: '#3498db', speed: 14, cooldown: 8, damage: 18, shockwave: 14 }
};

class Shockwave {
    constructor(x, y, maxRadius) {
        this.x = x;
        this.y = y;
        this.radius = 4;
        this.maxRadius = maxRadius;
        this.alpha = 1;
    }
    update() {
        this.radius += 2.5;
        this.alpha -= 0.08;
    }
    draw() {
        ctx.save();
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255, 235, 59, ${Math.max(0, this.alpha)})`;
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();
    }
}

class Bullet {
    constructor(x, y, vx, vy, isEnemy = false, damage = 10) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.isEnemy = isEnemy;
        this.damage = damage;
        this.life = 80;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life--;
    }
    draw() {
        ctx.fillStyle = this.isEnemy ? '#e74c3c' : '#ffeb3b';
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.isEnemy ? 3 : 4, 0, Math.PI * 2);
        ctx.fill();
    }
}

class GroundWeapon {
    constructor(x, y, type) {
        this.x = x;
        this.y = y;
        this.type = type;
        this.w = 20;
        this.h = 10;
    }
    draw() {
        ctx.fillStyle = this.type.color;
        ctx.fillRect(this.x - this.w/2, this.y - this.h, this.w, this.h);
        ctx.fillStyle = '#fff';
        ctx.font = '10px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(this.type.name, this.x, this.y - this.h - 4);
    }
}

class Chest {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.w = 24;
        this.h = 20;
    }
    draw() {
        ctx.fillStyle = '#d4ac0d';
        ctx.fillRect(this.x - this.w/2, this.y - this.h, this.w, this.h);
        ctx.strokeStyle = '#784212';
        ctx.lineWidth = 2;
        ctx.strokeRect(this.x - this.w/2, this.y - this.h, this.w, this.h);
    }
}

// --- 怪物類別 (無名字) ---
class Enemy {
    constructor(x, y, color = '#8e44ad') {
        this.x = x;
        this.y = y;
        this.w = 22;
        this.h = 22;
        this.color = color;
        this.vx = (Math.random() > 0.5 ? 1 : -1) * 1.5;
        this.vy = 0;
        this.hp = 40;
        this.shootCooldown = 0;
    }

    update() {
        this.vy += GRAVITY;
        this.x += this.vx;
        this.y += this.vy;

        platforms.forEach(p => {
            if (this.vy >= 0 &&
                this.x + this.w/2 > p.x &&
                this.x - this.w/2 < p.x + p.w &&
                this.y >= p.y && this.y - this.vy <= p.y) {
                this.y = p.y;
                this.vy = 0;
            }
        });

        if (this.x < 20 || this.x > canvas.width - 20) this.vx *= -1;

        if (this.shootCooldown > 0) this.shootCooldown--;
        
        // 尋找最近的玩家進行攻擊
        let target = player1;
        if (player2) {
            const d1 = Math.hypot(player1.x - this.x, player1.y - this.y);
            const d2 = Math.hypot(player2.x - this.x, player2.y - this.y);
            if (d2 < d1) target = player2;
        }

        const dist = Math.hypot(target.x - this.x, target.y - this.y);
        if (dist < 260 && this.shootCooldown <= 0) {
            const angle = Math.atan2((target.y - 15) - this.y, target.x - this.x);
            bullets.push(new Bullet(this.x, this.y - 10, Math.cos(angle)*5, Math.sin(angle)*5, true, 8));
            this.shootCooldown = 100;
        }
    }

    draw() {
        // 僅畫怪物外觀，無視覺血條與名字
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x - this.w/2, this.y - this.h, this.w, this.h);
        ctx.fillStyle = '#fff';
        ctx.fillRect(this.x - 5, this.y - this.h + 4, 3, 3);
        ctx.fillRect(this.x + 2, this.y - this.h + 4, 3, 3);
    }
}

// --- 玩家類別 ---
class Player {
    constructor(x, y, color, controls) {
        this.x = x;
        this.y = y;
        this.w = 20;
        this.h = 32;
        this.color = color;
        this.controls = controls; // 按鍵組設定
        this.facing = 1; // 1: 右, -1: 左
        this.vx = 0;
        this.vy = 0;
        this.hp = 100;
        this.jumpCount = 0;
        this.maxJumps = 2;
        this.inventory = [WEAPON_TYPES.PISTOL];
        this.equippedIndex = 0;
        this.shootCooldown = 0;
    }

    jump() {
        if (this.jumpCount < this.maxJumps) {
            this.vy = -9.5;
            this.jumpCount++;
        }
    }

    cycleWeapon() {
        if (this.inventory.length > 1) {
            this.equippedIndex = (this.equippedIndex + 1) % this.inventory.length;
        }
    }

    shoot() {
        if (this.shootCooldown > 0) return;
        const weapon = this.inventory[this.equippedIndex];
        
        bullets.push(new Bullet(
            this.x, this.y - this.h/2, 
            this.facing * weapon.speed, 0, 
            false, 
            weapon.damage
        ));
        
        shockwaves.push(new Shockwave(this.x + (this.facing * 10), this.y - this.h/2, weapon.shockwave));
        this.shootCooldown = weapon.cooldown;
    }

    tryPickupWeapon() {
        for (let i = groundWeapons.length - 1; i >= 0; i--) {
            const gw = groundWeapons[i];
            if (Math.hypot(this.x - gw.x, (this.y - this.h/2) - gw.y) < 40) {
                if (this.inventory.length < 2) {
                    this.inventory.push(gw.type);
                    this.equippedIndex = 1;
                } else {
                    const dropped = this.inventory[this.equippedIndex];
                    this.inventory[this.equippedIndex] = gw.type;
                    groundWeapons.push(new GroundWeapon(this.x, this.y, dropped));
                }
                groundWeapons.splice(i, 1);
                break;
            }
        }
    }

    update() {
        // 移動控制
        if (keys[this.controls.left]) {
            this.vx = -3.5;
            this.facing = -1;
        } else if (keys[this.controls.right]) {
            this.vx = 3.5;
            this.facing = 1;
        } else {
            this.vx = 0;
        }

        this.vy += GRAVITY;
        this.x += this.vx;
        this.y += this.vy;

        platforms.forEach(p => {
            if (this.vy >= 0 && 
                this.x + this.w/2 > p.x && 
                this.x - this.w/2 < p.x + p.w &&
                this.y >= p.y && this.y - this.vy <= p.y + 4) {
                this.y = p.y;
                this.vy = 0;
                this.jumpCount = 0;
            }
        });

        if (this.x < 15) this.x = 15;
        if (this.x > canvas.width - 15) this.x = canvas.width - 15;

        if (this.shootCooldown > 0) this.shootCooldown--;

        // 寶箱碰撞
        for (let i = chests.length - 1; i >= 0; i--) {
            const c = chests[i];
            if (Math.abs(this.x - c.x) < 20 && Math.abs(this.y - c.y) < 25) {
                const dropType = Math.random() < 0.5 ? WEAPON_TYPES.SHOTGUN : WEAPON_TYPES.RIFLE;
                groundWeapons.push(new GroundWeapon(c.x, c.y, dropType));
                chests.splice(i, 1);
            }
        }
    }

    draw() {
        // 畫角色
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x - this.w/2, this.y - this.h, this.w, this.h);

        // 畫槍枝 (朝向當前方向)
        const weapon = this.inventory[this.equippedIndex];
        ctx.fillStyle = weapon.color;
        if (this.facing === 1) {
            ctx.fillRect(this.x, this.y - this.h/2 - 3, 16, 6);
        } else {
            ctx.fillRect(this.x - 16, this.y - this.h/2 - 3, 16, 6);
        }
    }
}

// --- 遊戲變數 ---
let player1, player2;
let bullets = [];
let shockwaves = [];
let groundWeapons = [];
let chests = [];
let enemies = [];

function startGame(mode) {
    gameMode = mode;
    gameState = 'PLAYING';
    killCount = 0;

    bullets = [];
    shockwaves = [];
    groundWeapons = [];
    
    chests = [
        new Chest(185, 370),
        new Chest(615, 370)
    ];

    enemies = [
        new Enemy(400, 80, '#8e44ad'),
        new Enemy(80, 420, '#27ae60'),
        new Enemy(720, 290, '#27ae60')
    ];

    // 初始化 1P
    player1 = new Player(350, 350, '#3498db', { left: 'KeyA', right: 'KeyD' });

    // 初始化 2P
    if (gameMode === 2) {
        player2 = new Player(450, 350, '#e67e22', { left: 'ArrowLeft', right: 'ArrowRight' });
    } else {
        player2 = null;
    }
}

function drawUI() {
    // 繪製地圖牆壁
    ctx.fillStyle = '#2c1d17';
    for (let y = 0; y < canvas.height; y += 40) {
        ctx.fillRect(0, y, canvas.width, 2);
    }

    // 繪製平台
    platforms.forEach(p => {
        ctx.fillStyle = p.isGround ? '#784212' : '#a0522d';
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = '#f39c12';
        ctx.fillRect(p.x, p.y, p.w, 3);
    });

    // 1P 狀態欄 (左上)
    ctx.fillStyle = '#3498db';
    ctx.font = 'bold 12px monospace';
    ctx.fillText(`1P HP: ${player1.hp}`, 20, 25);
    ctx.fillText(`槍: ${player1.inventory[player1.equippedIndex].name}`, 20, 42);

    // 2P 狀態欄 (右上)
    if (player2) {
        ctx.fillStyle = '#e67e22';
        ctx.textAlign = 'right';
        ctx.fillText(`2P HP: ${player2.hp}`, canvas.width - 20, 25);
        ctx.fillText(`槍: ${player2.inventory[player2.equippedIndex].name}`, canvas.width - 20, 42);
    }

    // KILLS 計數
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(`KILLS ${killCount}`, canvas.width / 2, 410);
}

function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (gameState === 'MENU') {
        ctx.fillStyle = '#f39c12';
        ctx.font = 'bold 30px monospace';
        ctx.textAlign = 'center';
        ctx.fillText("選擇遊戲模式", canvas.width / 2, 160);

        ctx.fillStyle = '#fff';
        ctx.font = '20px monospace';
        ctx.fillText("按下 [ 1 ] 鍵：單人模式 (1P)", canvas.width / 2, 230);
        ctx.fillText("按下 [ 2 ] 鍵：雙人模式 (1P + 2P)", canvas.width / 2, 270);
        
        requestAnimationFrame(gameLoop);
        return;
    }

    drawUI();

    chests.forEach(c => c.draw());
    groundWeapons.forEach(gw => gw.draw());

    // 子彈碰撞
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.update();
        b.draw();

        if (!b.isEnemy) {
            // 擊中怪物
            for (let j = enemies.length - 1; j >= 0; j--) {
                const e = enemies[j];
                if (Math.abs(b.x - e.x) < e.w/2 && Math.abs(b.y - (e.y - e.h/2)) < e.h/2) {
                    e.hp -= b.damage;
                    bullets.splice(i, 1);
                    if (e.hp <= 0) {
                        enemies.splice(j, 1);
                        killCount++;
                    }
                    break;
                }
            }
        } else {
            // 擊中玩家
            if (Math.abs(b.x - player1.x) < player1.w/2 && Math.abs(b.y - (player1.y - player1.h/2)) < player1.h/2) {
                player1.hp = Math.max(0, player1.hp - b.damage);
                bullets.splice(i, 1);
            } else if (player2 && Math.abs(b.x - player2.x) < player2.w/2 && Math.abs(b.y - (player2.y - player2.h/2)) < player2.h/2) {
                player2.hp = Math.max(0, player2.hp - b.damage);
                bullets.splice(i, 1);
            }
        }

        if (b && b.life <= 0) bullets.splice(i, 1);
    }

    // 特效更新
    for (let i = shockwaves.length - 1; i >= 0; i--) {
        shockwaves[i].update();
        shockwaves[i].draw();
        if (shockwaves[i].alpha <= 0) shockwaves.splice(i, 1);
    }

    // 怪物更新
    enemies.forEach(e => {
        e.update();
        e.draw();
    });

    // 玩家更新
    player1.update();
    player1.draw();

    if (player2) {
        player2.update();
        player2.draw();
    }

    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>

</body>
</html>
