<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>2D 像素動作戰鬥 - 多武器與機率掉落版</title>
    <style>
        body {
            margin: 0;
            background-color: #0b0b10;
            color: #fff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        canvas {
            border: 4px solid #5a3d28;
            background-color: #21181b;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.9);
            image-rendering: pixelated;
        }
        .instructions {
            margin-top: 12px;
            font-size: 13px;
            color: #aaa;
            text-align: center;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <h2 style="color: #f39c12; margin-bottom: 8px;">2D 像素動作戰鬥 (武器機率掉落與特殊彈藥)</h2>
    <canvas id="gameCanvas" width="800" height="450"></canvas>
    
    <div class="instructions">
        <strong>【1P 操作】</strong> W：跳躍 | A/D：移動 | S：撿槍 | C：換槍 | V：開槍<br>
        <strong>【2P 操作】</strong> ↑：跳躍 | ←/→：移動 | ↓：撿槍 | K：換槍 | L：開槍
    </div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

const GRAVITY = 0.45;
let killCount = 0;
let gameState = 'MENU'; 
let gameMode = 1;      

const keys = {};

window.addEventListener('keydown', e => {
    if (["Space", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].includes(e.code)) {
        e.preventDefault();
    }

    if (gameState === 'MENU') {
        if (e.code === 'Digit1' || e.code === 'Numpad1') startGame(1);
        if (e.code === 'Digit2' || e.code === 'Numpad2') startGame(2);
        return;
    }

    if (!keys[e.code]) {
        // 1P 操作
        if (e.code === 'KeyW') player1.jump();
        if (e.code === 'KeyS') player1.tryPickupWeapon();
        if (e.code === 'KeyC') player1.cycleWeapon();
        if (e.code === 'KeyV') player1.shoot();

        // 2P 操作
        if (gameMode === 2 && player2) {
            if (e.code === 'ArrowUp') player2.jump();
            if (e.code === 'ArrowDown') player2.tryPickupWeapon();
            if (e.code === 'KeyK') player2.cycleWeapon();
            if (e.code === 'KeyL') player2.shoot();
        }
    }
    keys[e.code] = true;
});

window.addEventListener('keyup', e => { keys[e.code] = false; });

// --- 地圖平台資料 ---
const platforms = [
    { x: 0, y: 410, w: 800, h: 40, isGround: true },
    { x: 290, y: 340, w: 220, h: 70, isGround: true },
    { x: 135, y: 360, w: 100, h: 14 },
    { x: 565, y: 360, w: 100, h: 14 },
    { x: 50, y: 280, w: 200, h: 14 },
    { x: 550, y: 280, w: 200, h: 14 },
    { x: 110, y: 200, w: 200, h: 14 },
    { x: 490, y: 200, w: 200, h: 14 },
    { x: 350, y: 150, w: 100, h: 14 },
    { x: 130, y: 70, w: 200, h: 14 },
    { x: 470, y: 70, w: 200, h: 14 },
    { x: 0, y: 140, w: 90, h: 14 },
    { x: 710, y: 140, w: 90, h: 14 }
];

// --- 武器資料庫與稀有度 ---
const WEAPON_TYPES = {
    PISTOL:   { id: 'PISTOL', name: '手槍', color: '#f39c12', rarity: 'COMMON', speed: 11, cooldown: 14, damage: 25, shockwave: 18, bulletType: 'STANDARD' },
    SMG:      { id: 'SMG', name: '衝鋒槍', color: '#f1c40f', rarity: 'COMMON', speed: 13, cooldown: 5, damage: 12, shockwave: 12, bulletType: 'STANDARD' },
    SHOTGUN:  { id: 'SHOTGUN', name: '散彈槍', color: '#e67e22', rarity: 'COMMON', speed: 9, cooldown: 35, damage: 20, shockwave: 30, bulletType: 'SPREAD' },
    SNIPER:   { id: 'SNIPER', name: '狙擊槍', color: '#3498db', rarity: 'RARE', speed: 22, cooldown: 45, damage: 90, shockwave: 25, bulletType: 'PIERCING' },
    GRENADE:  { id: 'GRENADE', name: '榴彈槍', color: '#e74c3c', rarity: 'RARE', speed: 8, cooldown: 40, damage: 60, shockwave: 40, bulletType: 'GRENADE' },
    MINE:     { id: 'MINE', name: '地雷槍', color: '#2ecc71', rarity: 'LEGEND', speed: 6, cooldown: 50, damage: 100, shockwave: 45, bulletType: 'MINE' }
};

// 機率抽取武器
function getRandomWeapon() {
    const rand = Math.random();
    if (rand < 0.10) { // 10% 傳說武器
        return WEAPON_TYPES.MINE;
    } else if (rand < 0.40) { // 30% 稀有武器
        return Math.random() < 0.5 ? WEAPON_TYPES.SNIPER : WEAPON_TYPES.GRENADE;
    } else { // 60% 普通武器
        const commons = [WEAPON_TYPES.SMG, WEAPON_TYPES.SHOTGUN];
        return commons[Math.floor(Math.random() * commons.length)];
    }
}

// --- 粒子系統 ---
class Particle {
    constructor(x, y, vx, vy, color, size, life) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.color = color;
        this.size = size;
        this.life = life;
        this.maxLife = life;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.life--;
    }
    draw() {
        ctx.fillStyle = this.color;
        ctx.globalAlpha = Math.max(0, this.life / this.maxLife);
        ctx.fillRect(this.x, this.y, this.size, this.size);
        ctx.globalAlpha = 1.0;
    }
}

// --- 爆波特效 ---
class Shockwave {
    constructor(x, y, maxRadius) {
        this.x = x;
        this.y = y;
        this.radius = 4;
        this.maxRadius = maxRadius;
        this.alpha = 1;
    }
    update() {
        this.radius += 3;
        this.alpha -= 0.08;
    }
    draw() {
        ctx.save();
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(255, 240, 150, ${Math.max(0, this.alpha)})`;
        ctx.lineWidth = 3;
        ctx.stroke();
        ctx.restore();
    }
}

// --- 子彈系統 ---
class Bullet {
    constructor(x, y, vx, vy, bulletType, isEnemy = false, damage = 10) {
        this.x = x;
        this.y = y;
        this.vx = vx;
        this.vy = vy;
        this.bulletType = bulletType; // STANDARD, SPREAD, PIERCING, GRENADE, MINE
        this.isEnemy = isEnemy;
        this.damage = damage;
        this.life = 120;
        this.isArmedMine = false;
        this.hitEnemies = []; // 供貫穿彈記錄
    }

    update() {
        if (this.bulletType === 'GRENADE') {
            this.vy += 0.25; // 榴彈重力效果
        }

        if (this.bulletType === 'MINE' && this.isArmedMine) {
            // 已放置的地雷靜止不動
            return;
        }

        this.x += this.vx;
        this.y += this.vy;
        this.life--;

        // 榴彈與地雷的地形碰撞
        if (this.bulletType === 'GRENADE' || this.bulletType === 'MINE') {
            platforms.forEach(p => {
                if (this.x > p.x && this.x < p.x + p.w && this.y >= p.y - 2 && this.y <= p.y + p.h) {
                    if (this.bulletType === 'GRENADE') {
                        this.explode();
                        this.life = 0;
                    } else if (this.bulletType === 'MINE') {
                        this.y = p.y - 4;
                        this.vx = 0;
                        this.vy = 0;
                        this.isArmedMine = true;
                    }
                }
            });
        }
    }

    explode() {
        shockwaves.push(new Shockwave(this.x, this.y, 40));
        for (let i = 0; i < 16; i++) {
            particles.push(new Particle(this.x, this.y, (Math.random() - 0.5) * 6, (Math.random() - 0.5) * 6, '#e74c3c', 3, 20));
        }
        // 範圍傷害
        enemies.forEach(e => {
            if (Math.hypot(e.x - this.x, (e.y - e.h/2) - this.y) < 50) {
                e.hp -= this.damage;
            }
        });
    }

    draw() {
        if (this.isEnemy) {
            ctx.fillStyle = '#ff4d4d';
            ctx.fillRect(this.x - 2, this.y - 2, 5, 5);
            return;
        }

        switch (this.bulletType) {
            case 'STANDARD':
                ctx.fillStyle = '#ffe100'; // 標準黃色子彈
                ctx.fillRect(this.x - 2, this.y - 2, 5, 5);
                break;
            case 'SPREAD':
                ctx.fillStyle = '#e67e22'; // 散彈橙紅色彈丸
                ctx.fillRect(this.x - 2, this.y - 2, 4, 4);
                break;
            case 'PIERCING':
                ctx.fillStyle = '#3498db'; // 狙擊穿透藍色光束
                ctx.fillRect(this.x - 6, this.y - 2, 12, 4);
                break;
            case 'GRENADE':
                ctx.fillStyle = '#e74c3c'; // 榴彈深紅色球體
                ctx.beginPath();
                ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
                ctx.fill();
                break;
            case 'MINE':
                ctx.fillStyle = this.isArmedMine ? '#2ecc71' : '#27ae60'; // 地雷閃爍綠光
                ctx.fillRect(this.x - 4, this.y - 3, 8, 4);
                break;
        }
    }
}

// --- 掉落槍枝類別 ---
class GroundWeapon {
    constructor(x, y, type) {
        this.x = x;
        this.y = y;
        this.type = type;
        this.w = 22;
        this.h = 10;
        this.bounce = 0;
    }
    draw() {
        this.bounce += 0.08;
        const offsetY = Math.sin(this.bounce) * 3;
        
        ctx.fillStyle = this.type.color;
        ctx.fillRect(this.x - this.w/2, this.y - this.h + offsetY, this.w, this.h);
        
        // 顯示名稱與稀有度顏色標籤
        ctx.fillStyle = this.type.rarity === 'LEGEND' ? '#2ecc71' : (this.type.rarity === 'RARE' ? '#3498db' : '#fff');
        ctx.font = '10px monospace';
        ctx.textAlign = 'center';
        ctx.fillText(this.type.name, this.x, this.y - this.h + offsetY - 6);
    }
}

// --- 寶箱類別 ---
class Chest {
    constructor(x, y) {
        this.x = x;
        this.y = y;
        this.w = 24;
        this.h = 18;
    }
    draw() {
        ctx.fillStyle = '#b76d29';
        ctx.fillRect(this.x - this.w/2, this.y - this.h, this.w, this.h);
        ctx.fillStyle = '#f1c40f';
        ctx.fillRect(this.x - this.w/2, this.y - this.h, this.w, 4);
        ctx.fillRect(this.x - 3, this.y - this.h/2 - 2, 6, 6);
    }
}

// --- 怪物類別 (無名稱/無血條) ---
class Enemy {
    constructor(x, y, color = '#9b59b6') {
        this.x = x;
        this.y = y;
        this.w = 22;
        this.h = 24;
        this.color = color;
        this.vx = (Math.random() > 0.5 ? 1 : -1) * 1.5;
        this.vy = 0;
        this.hp = 50;
        this.shootCooldown = 0;
        this.animTimer = 0;
    }

    update() {
        this.vy += GRAVITY;
        this.x += this.vx;
        this.y += this.vy;

        platforms.forEach(p => {
            if (this.vy >= 0 &&
                this.x + this.w/2 > p.x &&
                this.x - this.w/2 < p.x + p.w &&
                this.y >= p.y && this.y - this.vy <= p.y) {
                this.y = p.y;
                this.vy = 0;
            }
        });

        if (this.x < 20 || this.x > canvas.width - 20) this.vx *= -1;

        if (this.shootCooldown > 0) this.shootCooldown--;
        
        let target = player1;
        if (player2) {
            const d1 = Math.hypot(player1.x - this.x, player1.y - this.y);
            const d2 = Math.hypot(player2.x - this.x, player2.y - this.y);
            if (d2 < d1) target = player2;
        }

        const dist = Math.hypot(target.x - this.x, target.y - this.y);
        if (dist < 280 && this.shootCooldown <= 0) {
            const angle = Math.atan2((target.y - 12) - this.y, target.x - this.x);
            bullets.push(new Bullet(this.x, this.y - 12, Math.cos(angle)*5, Math.sin(angle)*5, 'STANDARD', true, 10));
            this.shootCooldown = 95;
        }

        this.animTimer += 0.1;
    }

    draw() {
        ctx.fillStyle = this.color;
        ctx.fillRect(this.x - this.w/2, this.y - this.h, this.w, this.h);

        ctx.fillStyle = '#fff';
        const eyeOffset = this.vx > 0 ? 2 : -2;
        ctx.fillRect(this.x - 5 + eyeOffset, this.y - this.h + 6, 4, 4);
        ctx.fillRect(this.x + 1 + eyeOffset, this.y - this.h + 6, 4, 4);
        ctx.fillStyle = '#000';
        ctx.fillRect(this.x - 4 + eyeOffset, this.y - this.h + 7, 2, 2);
        ctx.fillRect(this.x + 2 + eyeOffset, this.y - this.h + 7, 2, 2);

        const legOffset = Math.sin(this.animTimer * 5) * 2;
        ctx.fillStyle = '#111';
        ctx.fillRect(this.x - this.w/2 + 2, this.y, 4, 2 + legOffset);
        ctx.fillRect(this.x + this.w/2 - 6, this.y, 4, 2 - legOffset);
    }
}

// --- 玩家類別 ---
class Player {
    constructor(x, y, bodyColor, headbandColor, controls) {
        this.x = x;
        this.y = y;
        this.w = 20;
        this.h = 30;
        this.bodyColor = bodyColor;
        this.headbandColor = headbandColor;
        this.controls = controls;
        this.facing = 1;
        this.vx = 0;
        this.vy = 0;
        this.hp = 100;
        this.jumpCount = 0;
        this.maxJumps = 2;
        this.inventory = [WEAPON_TYPES.PISTOL];
        this.equippedIndex = 0;
        this.shootCooldown = 0;
        this.animTimer = 0;
    }

    jump() {
        if (this.jumpCount < this.maxJumps) {
            this.vy = -9.5;
            this.jumpCount++;
            for (let i = 0; i < 5; i++) {
                particles.push(new Particle(this.x, this.y, (Math.random() - 0.5) * 3, -Math.random() * 2, '#aaa', 3, 15));
            }
        }
    }

    cycleWeapon() {
        if (this.inventory.length > 1) {
            this.equippedIndex = (this.equippedIndex + 1) % this.inventory.length;
        }
    }

    shoot() {
        if (this.shootCooldown > 0) return;
        const weapon = this.inventory[this.equippedIndex];
        const gunX = this.x + (this.facing * 12);
        const gunY = this.y - this.h/2;
        
        if (weapon.id === 'SHOTGUN') {
            // 散彈槍：發射 3 發擴散彈
            for (let angle of [-0.2, 0, 0.2]) {
                const vx = this.facing * weapon.speed * Math.cos(angle);
                const vy = weapon.speed * Math.sin(angle);
                bullets.push(new Bullet(gunX, gunY, vx, vy, weapon.bulletType, false, weapon.damage));
            }
        } else if (weapon.id === 'GRENADE') {
            // 榴彈槍：帶有向上弧度的拋物線
            bullets.push(new Bullet(gunX, gunY, this.facing * weapon.speed, -3, weapon.bulletType, false, weapon.damage));
        } else {
            // 一般/衝鋒/狙擊/地雷槍
            bullets.push(new Bullet(gunX, gunY, this.facing * weapon.speed, 0, weapon.bulletType, false, weapon.damage));
        }
        
        shockwaves.push(new Shockwave(gunX, gunY, weapon.shockwave));
        this.shootCooldown = weapon.cooldown;
    }

    tryPickupWeapon() {
        for (let i = groundWeapons.length - 1; i >= 0; i--) {
            const gw = groundWeapons[i];
            if (Math.hypot(this.x - gw.x, (this.y - this.h/2) - gw.y) < 40) {
                if (this.inventory.length < 2) {
                    this.inventory.push(gw.type);
                    this.equippedIndex = 1;
                } else {
                    const dropped = this.inventory[this.equippedIndex];
                    this.inventory[this.equippedIndex] = gw.type;
                    groundWeapons.push(new GroundWeapon(this.x, this.y, dropped));
                }
                groundWeapons.splice(i, 1);
                break;
            }
        }
    }

    update() {
        if (keys[this.controls.left]) {
            this.vx = -3.5;
            this.facing = -1;
            this.animTimer += 0.15;
        } else if (keys[this.controls.right]) {
            this.vx = 3.5;
            this.facing = 1;
            this.animTimer += 0.15;
        } else {
            this.vx = 0;
        }

        this.vy += GRAVITY;
        this.x += this.vx;
        this.y += this.vy;

        platforms.forEach(p => {
            if (this.vy >= 0 && 
                this.x + this.w/2 > p.x && 
                this.x - this.w/2 < p.x + p.w &&
                this.y >= p.y && this.y - this.vy <= p.y + 4) {
                this.y = p.y;
                this.vy = 0;
                this.jumpCount = 0;
            }
        });

        if (this.x < 15) this.x = 15;
        if (this.x > canvas.width - 15) this.x = canvas.width - 15;

        if (this.shootCooldown > 0) this.shootCooldown--;

        // 開寶箱 (根據機率刷新武器)
        for (let i = chests.length - 1; i >= 0; i--) {
            const c = chests[i];
            if (Math.abs(this.x - c.x) < 22 && Math.abs(this.y - c.y) < 25) {
                const dropType = getRandomWeapon();
                groundWeapons.push(new GroundWeapon(c.x, c.y, dropType));
                
                for (let k = 0; k < 12; k++) {
                    particles.push(new Particle(c.x, c.y - 10, (Math.random() - 0.5) * 5, (Math.random() - 0.5) * 5, '#f1c40f', 3, 25));
                }

                chests.splice(i, 1);
            }
        }
    }

    draw() {
        ctx.fillStyle = this.bodyColor;
        ctx.fillRect(this.x - this.w/2, this.y - this.h, this.w, this.h);

        ctx.fillStyle = this.headbandColor;
        ctx.fillRect(this.x - this.w/2, this.y - this.h, this.w, 6);

        ctx.fillStyle = '#fff';
        const eyeOffset = this.facing === 1 ? 2 : -4;
        ctx.fillRect(this.x + eyeOffset, this.y - this.h + 8, 4, 4);

        const weapon = this.inventory[this.equippedIndex];
        ctx.fillStyle = weapon.color;
        const gunX = this.facing === 1 ? this.x : this.x - 14;
        ctx.fillRect(gunX, this.y - this.h/2 - 2, 14, 5);
    }
}

// --- 全域變數 ---
let player1, player2;
let bullets = [];
let shockwaves = [];
let particles = [];
let groundWeapons = [];
let chests = [];
let enemies = [];

function startGame(mode) {
    gameMode = mode;
    gameState = 'PLAYING';
    killCount = 0;

    bullets = [];
    shockwaves = [];
    particles = [];
    groundWeapons = [];
    
    chests = [
        new Chest(185, 360),
        new Chest(615, 360)
    ];

    enemies = [
        new Enemy(400, 80, '#9b59b6'),
        new Enemy(80, 410, '#2ecc71'),
        new Enemy(720, 280, '#2ecc71')
    ];

    player1 = new Player(350, 340, '#3498db', '#e74c3c', { left: 'KeyA', right: 'KeyD' });

    if (gameMode === 2) {
        player2 = new Player(450, 340, '#2ecc71', '#f1c40f', { left: 'ArrowLeft', right: 'ArrowRight' });
    } else {
        player2 = null;
    }
}

function drawMapAndUI() {
    ctx.fillStyle = '#1e1518';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    platforms.forEach(p => {
        ctx.fillStyle = p.isGround ? '#5c3a21' : '#794d2b';
        ctx.fillRect(p.x, p.y, p.w, p.h);
        ctx.fillStyle = '#d4ac0d';
        ctx.fillRect(p.x, p.y, p.w, 3);
    });

    // 1P HUD
    ctx.fillStyle = '#3498db';
    ctx.font = 'bold 13px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`1P HP: ${player1.hp}`, 20, 25);
    ctx.fillText(`武器: ${player1.inventory[player1.equippedIndex].name}`, 20, 42);

    // 2P HUD
    if (player2) {
        ctx.fillStyle = '#2ecc71';
        ctx.textAlign = 'right';
        ctx.fillText(`2P HP: ${player2.hp}`, canvas.width - 20, 25);
        ctx.fillText(`武器: ${player2.inventory[player2.equippedIndex].name}`, canvas.width - 20, 42);
    }

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 18px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(`KILLS ${killCount}`, canvas.width / 2, 435);
}

// --- 遊戲主循環 ---
function gameLoop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (gameState === 'MENU') {
        ctx.fillStyle = '#1e1518';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = '#f39c12';
        ctx.font = 'bold 28px monospace';
        ctx.textAlign = 'center';
        ctx.fillText("選擇遊戲模式", canvas.width / 2, 170);

        ctx.fillStyle = '#fff';
        ctx.font = '16px monospace';
        ctx.fillText("按 [ 1 ] 鍵：單人模式 (1P)", canvas.width / 2, 230);
        ctx.fillText("按 [ 2 ] 鍵：雙人同樂 (1P + 2P)", canvas.width / 2, 270);
        
        requestAnimationFrame(gameLoop);
        return;
    }

    drawMapAndUI();

    chests.forEach(c => c.draw());
    groundWeapons.forEach(gw => gw.draw());

    // 子彈計算
    for (let i = bullets.length - 1; i >= 0; i--) {
        const b = bullets[i];
        b.update();
        b.draw();

        if (!b.isEnemy) {
            // 玩家子彈撞擊怪物
            for (let j = enemies.length - 1; j >= 0; j--) {
                const e = enemies[j];
                const isColliding = Math.abs(b.x - e.x) < e.w/2 && Math.abs(b.y - (e.y - e.h/2)) < e.h/2;

                if (b.bulletType === 'MINE' && b.isArmedMine && isColliding) {
                    b.explode();
                    b.life = 0;
                    break;
                }

                if (isColliding) {
                    if (b.bulletType === 'PIERCING') {
                        // 狙擊貫穿彈
                        if (!b.hitEnemies.includes(e)) {
                            e.hp -= b.damage;
                            b.hitEnemies.push(e);
                        }
                    } else if (b.bulletType === 'GRENADE') {
                        b.explode();
                        b.life = 0;
                        break;
                    } else {
                        e.hp -= b.damage;
                        bullets.splice(i, 1);
                        break;
                    }

                    if (e.hp <= 0) {
                        enemies.splice(j, 1);
                        killCount++;
                    }
                }
            }
        } else {
            // 怪物子彈打中玩家
            if (Math.abs(b.x - player1.x) < player1.w/2 && Math.abs(b.y - (player1.y - player1.h/2)) < player1.h/2) {
                player1.hp = Math.max(0, player1.hp - b.damage);
                bullets.splice(i, 1);
            } else if (player2 && Math.abs(b.x - player2.x) < player2.w/2 && Math.abs(b.y - (player2.y - player2.h/2)) < player2.h/2) {
                player2.hp = Math.max(0, player2.hp - b.damage);
                bullets.splice(i, 1);
            }
        }

        if (b && b.life <= 0) bullets.splice(i, 1);
    }

    // 特效更新
    for (let i = shockwaves.length - 1; i >= 0; i--) {
        shockwaves[i].update();
        shockwaves[i].draw();
        if (shockwaves[i].alpha <= 0) shockwaves.splice(i, 1);
    }

    for (let i = particles.length - 1; i >= 0; i--) {
        particles[i].update();
        particles[i].draw();
        if (particles[i].life <= 0) particles.splice(i, 1);
    }

    enemies.forEach(e => {
        e.update();
        e.draw();
    });

    player1.update();
    player1.draw();

    if (player2) {
        player2.update();
        player2.draw();
    }

    requestAnimationFrame(gameLoop);
}

gameLoop();
</script>
