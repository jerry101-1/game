<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 跑酷小遊戲</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            overflow: hidden;
            background-color: #050510;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        /* 遊戲 UI */
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 255, 245, 0.7);
            z-index: 10;
        }

        /* 遊戲結束面板 */
        #game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(15, 15, 30, 0.9);
            padding: 40px 60px;
            border-radius: 16px;
            border: 2px solid #e94560;
            box-shadow: 0 0 30px rgba(233, 69, 96, 0.5);
            color: #fff;
            z-index: 20;
        }

        #game-over h1 {
            font-size: 42px;
            color: #e94560;
            margin-bottom: 15px;
            text-shadow: 0 0 10px #e94560;
        }

        #game-over p {
            font-size: 22px;
            margin-bottom: 25px;
        }

        #restart-btn {
            padding: 12px 35px;
            font-size: 18px;
            font-weight: bold;
            background-color: #00fff5;
            color: #0f3460;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 0 15px #00fff5;
            transition: 0.2s;
        }

        #restart-btn:hover {
            background-color: #fff;
            transform: scale(1.08);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui">距離: <span id="score">0</span> m</div>

    <div id="game-over">
        <h1>GAME OVER</h1>
        <p>跑庫紀錄: <span id="final-score">0</span> m</p>
        <button id="restart-btn" onclick="resetGame()">再次挑戰</button>
    </div>

    <div id="canvas-container"></div>

    <script>
        // --- 1. 基本 3D 場景設定 ---
        const container = document.getElementById('canvas-container');
        const scoreDisplay = document.getElementById('score');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreDisplay = document.getElementById('final-score');

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a1a);
        scene.fog = new THREE.FogExp2(0x0a0a1a, 0.018); // 遠方霧氣增加空間感

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 3.5, 7);
        camera.lookAt(0, 1.5, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // 光影效果
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(10, 20, 10);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- 2. 地面賽道建立 ---
        const trackWidth = 7;
        const trackLength = 200;
        const trackGeo = new THREE.PlaneGeometry(trackWidth, trackLength);
        const trackMat = new THREE.MeshStandardMaterial({ color: 0x16213e, roughness: 0.4 });
        const track = new THREE.Mesh(trackGeo, trackMat);
        track.rotation.x = -Math.PI / 2;
        track.position.z = -trackLength / 2 + 10;
        track.receiveShadow = true;
        scene.add(track);

        // 邊界螢光發光條
        const railGeo = new THREE.BoxGeometry(0.2, 0.2, trackLength);
        const railMat = new THREE.MeshBasicMaterial({ color: 0x00fff5 });
        const leftRail = new THREE.Mesh(railGeo, railMat);
        leftRail.position.set(-trackWidth / 2, 0.1, track.position.z);
        scene.add(leftRail);

        const rightRail = new THREE.Mesh(railGeo, railMat);
        rightRail.position.set(trackWidth / 2, 0.1, track.position.z);
        scene.add(rightRail);

        // --- 3. 玩家 3D 角色建構 ---
        const playerGroup = new THREE.Group();
        
        // 方塊主體
        const playerGeo = new THREE.BoxGeometry(1, 1.2, 1);
        const playerMat = new THREE.MeshStandardMaterial({ color: 0x00fff5, emissive: 0x005555, roughness: 0.2 });
        const playerBody = new THREE.Mesh(playerGeo, playerMat);
        playerBody.position.y = 0.6;
        playerBody.castShadow = true;
        playerGroup.add(playerBody);

        scene.add(playerGroup);

        // 玩家狀態變數
        const lanes = [-2.2, 0, 2.2]; // 左、中、右三個軌道
        let currentLane = 1;          // 預設中間
        let targetX = lanes[currentLane];
        
        let isJumping = false;
        let playerY = 0;
        let velocityY = 0;
        const gravity = 0.015;

        // 遊戲運行數據
        let isGameOver = false;
        let score = 0;
        let gameSpeed = 0.4;
        let obstacles = [];
        let spawnTimer = 0;

        // --- 4. 障礙物生成系統 ---
        const obsGeo = new THREE.BoxGeometry(1.2, 1.5, 1.2);
        const obsMat = new THREE.MeshStandardMaterial({ color: 0xe94560, emissive: 0x550011, roughness: 0.3 });

        function spawnObstacle() {
            const obs = new THREE.Mesh(obsGeo, obsMat);
            const laneIndex = Math.floor(Math.random() * 3);
            
            obs.position.set(lanes[laneIndex], 0.75, -80);
            obs.castShadow = true;
            
            scene.add(obs);
            obstacles.push(obs);
        }

        // --- 5. 操作控制事件 ---
        function handleKeyDown(e) {
            if (isGameOver) return;

            if ((e.key === 'ArrowLeft' || e.key === 'a' || e.key === 'A') && currentLane > 0) {
                currentLane--;
                targetX = lanes[currentLane];
            }
            if ((e.key === 'ArrowRight' || e.key === 'd' || e.key === 'D') && currentLane < 2) {
                currentLane++;
                targetX = lanes[currentLane];
            }
            if ((e.key === ' ' || e.key === 'ArrowUp' || e.key === 'w' || e.key === 'W') && !isJumping) {
                isJumping = true;
                velocityY = 0.38; // 跳躍高度
            }
        }
        window.addEventListener('keydown', handleKeyDown);

        // --- 6. 遊戲核心循環與物理運算 ---
        function animate() {
            if (isGameOver) return;

            requestAnimationFrame(animate);

            // 1. 平滑切換軌道 (X 軸插值)
            playerGroup.position.x += (targetX - playerGroup.position.x) * 0.2;

            // 2. 垂直跳躍物理 (Y 軸重力算式)
            if (isJumping) {
                playerY += velocityY;
                velocityY -= gravity;

                if (playerY <= 0) {
                    playerY = 0;
                    isJumping = false;
                    velocityY = 0;
                }
            }
            playerGroup.position.y = playerY;

            // 3. 障礙物生成邏輯
            spawnTimer += gameSpeed;
            if (spawnTimer > 12) {
                spawnObstacle();
                spawnTimer = 0;
            }

            // 4. 移動障礙物與 3D 邊界盒 (AABB) 碰撞檢測
            const pX = playerGroup.position.x;
            const pY = playerGroup.position.y;

            for (let i = obstacles.length - 1; i >= 0; i--) {
                const obs = obstacles[i];
                obs.position.z += gameSpeed;

                // 碰撞判定條件 (X、Y、Z 三軸重疊)
                const hitX = Math.abs(obs.position.x - pX) < 1.0;
                const hitZ = obs.position.z > -0.6 && obs.position.z < 0.6;
                const hitY = pY < 1.2; // 玩家跳得夠高就能躲過

                if (hitX && hitZ && hitY) {
                    endGame();
                    return;
                }

                // 移除已飛出後方的障礙物
                if (obs.position.z > 10) {
                    scene.remove(obs);
                    obstacles.splice(i, 1);
                }
            }

            // 5. 更新分數與推進速度
            score += 0.2;
            scoreDisplay.textContent = Math.floor(score);
            gameSpeed = 0.4 + Math.floor(score / 100) * 0.05; // 隨距離自動提速

            renderer.render(scene, camera);
        }

        // --- 7. 遊戲狀態控制 ---
        function endGame() {
            isGameOver = true;
            finalScoreDisplay.textContent = Math.floor(score);
            gameOverScreen.style.display = 'block';
        }

        function resetGame() {
            // 清理場景障礙物
            obstacles.forEach(obs => scene.remove(obs));
            obstacles = [];

            // 重設變數
            isGameOver = false;
            score = 0;
            gameSpeed = 0.4;
            currentLane = 1;
            targetX = lanes[currentLane];
            playerGroup.position.x = targetX;
            playerGroup.position.y = 0;
            playerY = 0;
            isJumping = false;
            spawnTimer = 0;

            scoreDisplay.textContent = '0';
            gameOverScreen.style.display = 'none';

            animate();
        }

        // 視窗大小改變校正
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // 啟動遊戲
        animate();
    </script>
</body>
</html>
