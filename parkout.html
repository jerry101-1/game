<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>3D Minecraft 10大無限硬核跑酷</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body { overflow: hidden; background-color: #050505; font-family: sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; }
        #crosshair {
            position: absolute; top: 50%; left: 50%; width: 10px; height: 10px;
            transform: translate(-50%, -50%); pointer-events: none; z-index: 15;
        }
        #crosshair::before, #crosshair::after { content: ''; position: absolute; background: rgba(255, 255, 255, 0.9); }
        #crosshair::before { top: 4px; left: 0; width: 10px; height: 2px; }
        #crosshair::after { top: 0; left: 4px; width: 2px; height: 10px; }

        #ui { position: absolute; top: 20px; left: 20px; color: #fff; z-index: 10; display: flex; flex-direction: column; gap: 8px; }
        .ui-card { background: rgba(0,0,0,0.85); padding: 10px 18px; border-radius: 8px; border: 2px solid #ffaa00; font-weight: bold; }
        #health-bar-container { width: 140px; height: 10px; background: #333; border-radius: 5px; border: 1px solid #fff; margin-top: 4px; overflow: hidden; }
        #health-bar { width: 100%; height: 100%; background: #ff334b; }

        #instructions {
            position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%);
            color: #fff; background: rgba(0,0,0,0.9); padding: 12px 24px; border-radius: 20px;
            z-index: 10; border: 1px solid #ffaa00; text-align: center; font-size: 14px;
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="crosshair"></div>
    <div id="ui">
        <div class="ui-card">🚩 關卡: <span id="stage-name" style="color:#ffaa00;">載入中...</span></div>
        <div class="ui-card">🏰 高度: <span id="height-val" style="color:#00ffff;">0</span> m</div>
        <div class="ui-card">
            <div>❤️ 生命值</div>
            <div id="health-bar-container"><div id="health-bar"></div></div>
        </div>
    </div>
    <div id="instructions">
        點擊鎖定視角 | WASD 移動 | 空白鍵跳躍 | 🟨 抵達黃色門破關<br>
        🟩 草地 | 🟦 冰塊 (急滑) | 🟥 TNT (爆炸高彈) | 🟪 史萊姆 (高跳)
    </div>
    <div id="canvas-container"></div>

    <script>
        const container = document.getElementById('canvas-container');
        const heightDisplay = document.getElementById('height-val');
        const stageNameDisplay = document.getElementById('stage-name');
        const healthBar = document.getElementById('health-bar');

        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050505, 0.003);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);
        const sunLight = new THREE.DirectionalLight(0xffffff, 0.9);
        sunLight.position.set(40, 100, 40);
        sunLight.castShadow = true;
        scene.add(sunLight);

        function createPixelTexture(colorHex) {
            const canvas = document.createElement('canvas');
            canvas.width = 16; canvas.height = 16;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = colorHex; ctx.fillRect(0, 0, 16, 16);
            for (let i = 0; i < 30; i++) {
                ctx.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.15)' : 'rgba(0,0,0,0.15)';
                ctx.fillRect(Math.floor(Math.random()*16), Math.floor(Math.random()*16), 1, 1);
            }
            const texture = new THREE.CanvasTexture(canvas);
            texture.magFilter = THREE.NearestFilter;
            return texture;
        }

        const grassTex = createPixelTexture('#55aa33');
        const stoneTex = createPixelTexture('#555555');
        const netherTex = createPixelTexture('#550000');
        const iceTex = createPixelTexture('#77d0ef');
        const slimeTex = createPixelTexture('#33ff55');
        const tntTex = createPixelTexture('#ff2200');
        const endTex = createPixelTexture('#223344');
        const rainbowTex = createPixelTexture('#ffaa00');
        const portalTex = createPixelTexture('#ffff00');

        let platforms = [];
        let currentStage = 0;
        let playerHealth = 100;

        function createBlock(x, y, z, w, h, d, texture, type = 'normal') {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshStandardMaterial({ map: texture, roughness: 0.5 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            mesh.castShadow = true; mesh.receiveShadow = true;

            const edges = new THREE.EdgesGeometry(geo);
            const line = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x000000 }));
            mesh.add(line);

            mesh.userData = { width: w, height: h, depth: d, type: type };
            return mesh;
        }

        // 🗺️ 10 大硬核關卡地圖（含長距離連續跳躍）
        const stages = [
            {
                name: "1. 入門試煉：懸空長廊", skyColor: 0x7ec0ee, startPos: new THREE.Vector3(0, 2, 0),
                blocks: [
                    { x: 0, y: 0, z: 0, w: 4, h: 1, d: 4, tex: grassTex },
                    { x: 0, y: 0.5, z: -5, w: 2, h: 0.8, d: 2, tex: grassTex },
                    { x: 0, y: 1.0, z: -10, w: 2, h: 0.8, d: 2, tex: grassTex },
                    { x: 3, y: 1.5, z: -15, w: 2, h: 0.8, d: 2, tex: grassTex },
                    { x: -3, y: 2.0, z: -20, w: 2, h: 0.8, d: 2, tex: grassTex },
                    { x: 0, y: 2.5, z: -25, w: 2, h: 0.8, d: 2, tex: grassTex },
                    { x: 0, y: 3.5, z: -30, w: 3, h: 1, d: 3, tex: portalTex, type: 'portal' }
                ]
            },
            {
                name: "2. 地獄長廊：Z 字折返與 4 格遠跳", skyColor: 0x220000, startPos: new THREE.Vector3(0, 2, 0),
                blocks: [
                    { x: 0, y: 0, z: 0, w: 4, h: 1, d: 4, tex: netherTex },
                    { x: 4, y: 1, z: -4, w: 1.8, h: 0.8, d: 1.8, tex: netherTex },
                    { x: -4, y: 2, z: -8, w: 1.8, h: 0.8, d: 1.8, tex: netherTex },
                    { x: 4, y: 3, z: -13, w: 1.5, h: 0.8, d: 1.5, tex: netherTex },
                    { x: -4, y: 4, z: -18, w: 1.5, h: 0.8, d: 1.5, tex: netherTex },
                    { x: 0, y: 5, z: -24, w: 1.2, h: 0.8, d: 1.2, tex: netherTex },
                    { x: 0, y: 6, z: -30, w: 3, h: 1, d: 3, tex: portalTex, type: 'portal' }
                ]
            },
            {
                name: "3. 冰霜陡峭天梯：疾速急煞", skyColor: 0x051525, startPos: new THREE.Vector3(0, 2, 0),
                blocks: [
                    { x: 0, y: 0, z: 0, w: 4, h: 1, d: 4, tex: iceTex, type: 'ice' },
                    { x: 0, y: 0.5, z: -6, w: 1.5, h: 0.8, d: 6, tex: iceTex, type: 'ice' },
                    { x: 4, y: 2.0, z: -14, w: 1.5, h: 0.8, d: 4, tex: iceTex, type: 'ice' },
                    { x: -4, y: 3.5, z: -21, w: 1.5, h: 0.8, d: 4, tex: iceTex, type: 'ice' },
                    { x: 0, y: 5.0, z: -28, w: 1.2, h: 0.8, d: 2, tex: iceTex, type: 'ice' },
                    { x: 0, y: 6.5, z: -35, w: 3, h: 1, d: 3, tex: portalTex, type: 'portal' }
                ]
            },
            {
                name: "4. 史萊姆高空巨彈跳", skyColor: 0x052505, startPos: new THREE.Vector3(0, 2, 0),
                blocks: [
                    { x: 0, y: 0, z: 0, w: 4, h: 1, d: 4, tex: grassTex },
                    { x: 0, y: 1, z: -5, w: 2, h: 0.8, d: 2, tex: slimeTex, type: 'slime' },
                    { x: 0, y: 9, z: -10, w: 2, h: 0.8, d: 2, tex: slimeTex, type: 'slime' },
                    { x: 0, y: 17, z: -15, w: 2, h: 0.8, d: 2, tex: slimeTex, type: 'slime' },
                    { x: 0, y: 25, z: -20, w: 3, h: 1, d: 3, tex: portalTex, type: 'portal' }
                ]
            },
            {
                name: "5. TNT 爆破空中連環踢", skyColor: 0x331100, startPos: new THREE.Vector3(0, 2, 0),
                blocks: [
                    { x: 0, y: 0, z: 0, w: 4, h: 1, d: 4, tex: grassTex },
                    { x: 0, y: 1, z: -5, w: 1.8, h: 0.8, d: 1.8, tex: tntTex, type: 'tnt' },
                    { x: 0, y: 8, z: -11, w: 1.8, h: 0.8, d: 1.8, tex: tntTex, type: 'tnt' },
                    { x: 0, y: 15, z: -17, w: 1.8, h: 0.8, d: 1.8, tex: tntTex, type: 'tnt' },
                    { x: 0, y: 22, z: -23, w: 3, h: 1, d: 3, tex: portalTex, type: 'portal' }
                ]
            },
            {
                name: "6. 細針直立柱：極微小落腳點", skyColor: 0x111122, startPos: new THREE.Vector3(0, 2, 0),
                blocks: [
                    { x: 0, y: 0, z: 0, w: 4, h: 1, d: 4, tex: stoneTex },
                    { x: 0, y: 1, z: -5, w: 0.6, h: 4, d: 0.6, tex: stoneTex },
                    { x: 2, y: 2, z: -10, w: 0.6, h: 4, d: 0.6, tex: stoneTex },
                    { x: -2, y: 3, z: -15, w: 0.6, h: 4, d: 0.6, tex: stoneTex },
                    { x: 0, y: 4, z: -20, w: 0.6, h: 4, d: 0.6, tex: stoneTex },
                    { x: 0, y: 5, z: -25, w: 3, h: 1, d: 3, tex: portalTex, type: 'portal' }
                ]
            },
            {
                name: "7. 終界迷宮立體升降神殿", skyColor: 0x0a0518, startPos: new THREE.Vector3(0, 2, 0),
                blocks: [
                    { x: 0, y: 0, z: 0, w: 4, h: 1, d: 4, tex: endTex },
                    { x: 0, y: 2, z: -4, w: 1.5, h: 0.8, d: 1.5, tex: endTex },
                    { x: 3, y: 4, z: -4, w: 1.5, h: 0.8, d: 1.5, tex: endTex },
                    { x: 3, y: 6, z: -8, w: 1.5, h: 0.8, d: 1.5, tex: endTex },
                    { x: -3, y: 8, z: -8, w: 1.5, h: 0.8, d: 1.5, tex: endTex },
                    { x: -3, y: 10, z: -13, w: 1.5, h: 0.8, d: 1.5, tex: endTex },
                    { x: 0, y: 12, z: -18, w: 3, h: 1, d: 3, tex: portalTex, type: 'portal' }
                ]
            },
            {
                name: "8. 冰雪 + TNT 雙重混合地獄", skyColor: 0x001122, startPos: new THREE.Vector3(0, 2, 0),
                blocks: [
                    { x: 0, y: 0, z: 0, w: 4, h: 1, d: 4, tex: iceTex, type: 'ice' },
                    { x: 0, y: 1, z: -6, w: 2, h: 0.8, d: 4, tex: iceTex, type: 'ice' },
                    { x: 0, y: 2, z: -12, w: 1.5, h: 0.8, d: 1.5, tex: tntTex, type: 'tnt' },
                    { x: 0, y: 9, z: -18, w: 2, h: 0.8, d: 4, tex: iceTex, type: 'ice' },
                    { x: 0, y: 10, z: -25, w: 3, h: 1, d: 3, tex: portalTex, type: 'portal' }
                ]
            },
            {
                name: "9. 彩虹微型極限極速陣", skyColor: 0x332200, startPos: new THREE.Vector3(0, 2, 0),
                blocks: [
                    { x: 0, y: 0, z: 0, w: 4, h: 1, d: 4, tex: rainbowTex },
                    { x: 0, y: 1, z: -4, w: 1, h: 0.8, d: 1, tex: rainbowTex },
                    { x: 2, y: 2, z: -8, w: 1, h: 0.8, d: 1, tex: rainbowTex },
                    { x: -2, y: 3, z: -12, w: 1, h: 0.8, d: 1, tex: rainbowTex },
                    { x: 2, y: 4, z: -16, w: 1, h: 0.8, d: 1, tex: rainbowTex },
                    { x: 0, y: 5, z: -20, w: 1, h: 0.8, d: 1, tex: rainbowTex },
                    { x: 0, y: 6.5, z: -25, w: 3, h: 1, d: 3, tex: portalTex, type: 'portal' }
                ]
            },
            {
                name: "10. 終極總決賽：百米障礙極限長征", skyColor: 0x220022, startPos: new THREE.Vector3(0, 2, 0),
                blocks: [
                    { x: 0, y: 0, z: 0, w: 5, h: 1, d: 5, tex: endTex },
                    { x: 0, y: 1, z: -5, w: 1.8, h: 0.8, d: 1.8, tex: grassTex },
                    { x: 0, y: 2, z: -11, w: 1.5, h: 0.8, d: 1.5, tex: iceTex, type: 'ice' },
                    { x: 0, y: 3, z: -17, w: 1.5, h: 0.8, d: 1.5, tex: slimeTex, type: 'slime' },
                    { x: 0, y: 11, z: -23, w: 1.5, h: 0.8, d: 1.5, tex: tntTex, type: 'tnt' },
                    { x: 0, y: 18, z: -29, w: 0.6, h: 4, d: 0.6, tex: stoneTex },
                    { x: 0, y: 19, z: -35, w: 0.6, h: 4, d: 0.6, tex: stoneTex },
                    { x: 0, y: 21, z: -42, w: 4, h: 1, d: 4, tex: portalTex, type: 'portal' }
                ]
            }
        ];

        // ♾️ 第 10 關破關後，啟用無限隨機演算法關卡生成！
        function generateProceduralStage(stageNum) {
            const blocks = [{ x: 0, y: 0, z: 0, w: 4, h: 1, d: 4, tex: grassTex }];
            let curX = 0, curY = 0, curZ = 0;
            const blockCount = 10 + stageNum * 2; // 關卡越後面越長！

            for (let i = 0; i < blockCount; i++) {
                curX += (Math.random() - 0.5) * 6;
                curY += Math.random() * 1.5 + 0.5;
                curZ -= Math.random() * 4 + 4; // 推進深度

                let tex = grassTex, type = 'normal';
                const rand = Math.random();
                if (rand > 0.7) { tex = iceTex; type = 'ice'; }
                else if (rand > 0.5) { tex = slimeTex; type = 'slime'; }
                else if (rand > 0.3) { tex = tntTex; type = 'tnt'; }

                blocks.push({ x: curX, y: curY, z: curZ, w: 1.5, h: 0.8, d: 1.5, tex: tex, type: type });
            }
            // 終點門
            blocks.push({ x: curX, y: curY + 1.5, z: curZ - 5, w: 3, h: 1, d: 3, tex: portalTex, type: 'portal' });

            return {
                name: `♾️ 無限考驗 第 ${stageNum} 關 (演化障礙)`,
                skyColor: Math.floor(Math.random() * 0xffffff),
                startPos: new THREE.Vector3(0, 2, 0),
                blocks: blocks
            };
        }

        function loadStage(index) {
            platforms.forEach(p => scene.remove(p));
            platforms = [];

            let stageData;
            if (index < stages.length) {
                stageData = stages[index];
            } else {
                stageData = generateProceduralStage(index + 1);
            }

            scene.background = new THREE.Color(stageData.skyColor);
            scene.fog.color.setHex(stageData.skyColor);
            stageNameDisplay.textContent = stageData.name;

            stageData.blocks.forEach(b => {
                const block = createBlock(b.x, b.y, b.z, b.w, b.h, b.d, b.tex, b.type || 'normal');
                platforms.push(block);
                scene.add(block);
            });

            playerPos.copy(stageData.startPos);
            playerVel.set(0, 0, 0);
            playerHealth = 100;
            healthBar.style.width = '100%';
        }

        function explodeTNT(tntPos) {
            playerHealth -= 25;
            healthBar.style.width = Math.max(0, playerHealth) + '%';
            const force = new THREE.Vector3().subVectors(playerPos, tntPos).normalize();
            playerVel.x += force.x * 0.5;
            playerVel.z += force.z * 0.5;
            playerVel.y = 0.72;
            isGrounded = false;
            if (playerHealth <= 0) loadStage(currentStage);
        }

        let yaw = Math.PI, pitch = 0;
        let playerPos = new THREE.Vector3(0, 2, 0);
        let playerVel = new THREE.Vector3();
        let isGrounded = false;
        const keys = {};

        container.addEventListener('click', () => container.requestPointerLock());
        document.addEventListener('mousemove', (e) => {
            if (document.pointerLockElement === container) {
                yaw -= e.movementX * 0.0022;
                pitch -= e.movementY * 0.0022;
                pitch = Math.max(-Math.PI / 2 + 0.05, Math.min(Math.PI / 2 - 0.05, pitch));
            }
        });
        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        function updatePhysics() {
            const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw)).normalize();
            const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();

            let moveDir = new THREE.Vector3();
            if (keys['KeyW']) moveDir.add(forward);
            if (keys['KeyS']) moveDir.sub(forward);
            if (keys['KeyD']) moveDir.add(right);
            if (keys['KeyA']) moveDir.sub(right);
            if (moveDir.length() > 0) moveDir.normalize();

            playerVel.x = moveDir.x * 0.17;
            playerVel.z = moveDir.z * 0.17;

            if (keys['Space'] && isGrounded) { playerVel.y = 0.43; isGrounded = false; }
            playerVel.y -= 0.018;

            let nextX = playerPos.x + playerVel.x;
            let nextY = playerPos.y + playerVel.y;
            let nextZ = playerPos.z + playerVel.z;

            isGrounded = false;
            for (let i = 0; i < platforms.length; i++) {
                const p = platforms[i];
                const pos = p.position; const hw = p.userData.width / 2; const hd = p.userData.depth / 2; const hh = p.userData.height / 2;

                if (nextX + 0.3 > pos.x - hw && nextX - 0.3 < pos.x + hw && nextZ + 0.3 > pos.z - hd && nextZ - 0.3 < pos.z + hd) {
                    if (playerPos.y >= pos.y + hh && nextY <= pos.y + hh) {
                        if (p.userData.type === 'tnt') {
                            explodeTNT(pos);
                        } else {
                            nextY = pos.y + hh; playerVel.y = 0; isGrounded = true;
                            if (p.userData.type === 'slime') { playerVel.y = 0.75; isGrounded = false; }
                            if (p.userData.type === 'ice') { playerVel.x *= 1.6; playerVel.z *= 1.6; }
                            if (p.userData.type === 'portal') {
                                currentStage++;
                                loadStage(currentStage);
                                return;
                            }
                        }
                    }
                }
            }

            playerPos.set(nextX, nextY, nextZ);
            if (playerPos.y < -20) loadStage(currentStage);
            heightDisplay.textContent = Math.max(0, Math.floor(playerPos.y));
        }

        function updateCamera() {
            camera.position.set(playerPos.x, playerPos.y + 1.6, playerPos.z);
            const target = new THREE.Vector3(
                playerPos.x - Math.sin(yaw) * Math.cos(pitch),
                playerPos.y + 1.6 + Math.sin(pitch),
                playerPos.z - Math.cos(yaw) * Math.cos(pitch)
            );
            camera.lookAt(target);
        }

        function animate() {
            requestAnimationFrame(animate);
            updatePhysics();
            updateCamera();
            renderer.render(scene, camera);
        }

        loadStage(0);
        animate();
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
