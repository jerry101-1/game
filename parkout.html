<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft 風格跑酷塔 - Checkpoint 版</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            overflow: hidden;
            background-color: #1a1a1a;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        /* 頂部 UI 介面 */
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            z-index: 10;
            display: flex;
            gap: 15px;
        }

        .ui-box {
            background: rgba(0, 0, 0, 0.75);
            padding: 10px 18px;
            border-radius: 8px;
            border: 2px solid #555;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        #checkpoint-msg {
            display: none;
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 200, 80, 0.85);
            color: white;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 22px;
            font-weight: bold;
            border: 2px solid #fff;
            z-index: 15;
            box-shadow: 0 0 15px rgba(0,255,100,0.8);
            animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 18px;
            border-radius: 6px;
            border: 1px solid #444;
            z-index: 10;
            pointer-events: none;
        }

        /* 通關/重生彈窗 */
        #game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(20, 20, 20, 0.95);
            padding: 35px 55px;
            border-radius: 12px;
            border: 3px solid #ffaa00;
            box-shadow: 0 0 30px rgba(255, 170, 0, 0.4);
            color: #fff;
            z-index: 20;
        }

        #game-over h1 {
            font-size: 36px;
            color: #ffaa00;
            margin-bottom: 15px;
        }

        #reward-text {
            font-size: 20px;
            color: #55ff55;
            margin-bottom: 15px;
            font-weight: bold;
        }

        #game-over p {
            font-size: 18px;
            margin-bottom: 25px;
        }

        .btn {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            background-color: #55ff55;
            color: #000;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 0 10px #55ff55;
            transition: 0.2s;
        }

        .btn:hover {
            background-color: #fff;
            transform: scale(1.05);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui">
        <div class="ui-box">🗺️ 關卡: <span id="map-name" style="color: #55ff55;">Minecraft 草原塔</span></div>
        <div class="ui-box">🚩 最新紀錄點: <span id="checkpoint-txt" style="color: #ffaa00;">起點</span></div>
        <div class="ui-box">💰 金幣: <span id="coins" style="color: #ffff55;">0</span></div>
    </div>

    <div id="checkpoint-msg">🚩 紀錄點已儲存！</div>

    <div id="instructions">WASD / 方向鍵移動 | 空白鍵跳躍 | 滑鼠拖曳旋轉視角</div>

    <div id="game-over">
        <h1 id="over-title">挑戰結果</h1>
        <div id="reward-text"></div>
        <p>攀爬高度: <span id="final-score">0</span> 米</p>
        <button id="action-btn" class="btn" onclick="handleButtonClick()">重生 / 下一關</button>
    </div>

    <div id="canvas-container"></div>

    <script>
        // --- 1. MC 像素風主題配置 ---
        const THEMES = [
            {
                name: "1. 經典草方塊塔",
                sky: 0x7ec0ee,
                lava: 0xd35400,
                blockGrass: 0x55aa33,
                blockDirt: 0x8b5a2b,
                checkpointColor: 0xffaa00,
                topBlock: 0xffd700
            },
            {
                name: "2. 地獄黑曜石塔",
                sky: 0x2c0000,
                lava: 0xff2200,
                blockGrass: 0x333344,
                blockDirt: 0x111122,
                checkpointColor: 0x00ffff,
                topBlock: 0x00ffcc
            }
        ];

        // --- 2. 場景初始化 ---
        const container = document.getElementById('canvas-container');
        const coinsDisplay = document.getElementById('coins');
        const mapNameDisplay = document.getElementById('map-name');
        const checkpointTxt = document.getElementById('checkpoint-txt');
        const checkpointMsg = document.getElementById('checkpoint-msg');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreDisplay = document.getElementById('final-score');
        const overTitle = document.getElementById('over-title');
        const rewardText = document.getElementById('reward-text');
        const actionBtn = document.getElementById('action-btn');

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // 光源 (陽光感)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.65);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.85);
        dirLight.position.set(30, 60, 30);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // 方塊與紀錄點資料
        let lava;
        let platforms = [];
        let checkpoints = [];
        let lastCheckpointPos = new THREE.Vector3(0, 2, 0);
        let lastCheckpointName = "起點";
        
        let currentLevel = 0;
        let totalCoins = 0;
        let isWinState = false;
        const platformCount = 40;

        // --- 3. 生成 MC 風格方塊 ---
        function createCubePlatform(x, y, z, width, height, depth, colorTop, colorSide) {
            const group = new THREE.Group();

            const geo = new THREE.BoxGeometry(width, height, depth);
            const topMat = new THREE.MeshStandardMaterial({ color: colorTop, roughness: 0.9 });
            const sideMat = new THREE.MeshStandardMaterial({ color: colorSide, roughness: 0.9 });

            // MC 經典頂面/側面分色 (草地與土塊)
            const materials = [
                sideMat, sideMat, 
                topMat, sideMat, 
                sideMat, sideMat
            ];

            const cube = new THREE.Mesh(geo, materials);
            cube.castShadow = true;
            cube.receiveShadow = true;
            group.add(cube);

            group.position.set(x, y, z);
            group.userData = { width: width, height: height, depth: depth, isTop: false, isCheckpoint: false };

            return group;
        }

        // 地圖重建器
        function buildMap(levelIdx) {
            const theme = THEMES[levelIdx % THEMES.length];
            mapNameDisplay.textContent = theme.name;

            scene.background = new THREE.Color(theme.sky);
            scene.fog = new THREE.FogExp2(theme.sky, 0.01);

            // 清理物件
            if (lava) scene.remove(lava);
            platforms.forEach(p => scene.remove(p));
            checkpoints.forEach(c => scene.remove(c));
            platforms = [];
            checkpoints = [];

            // 1. 熔岩海
            const lavaGeo = new THREE.PlaneGeometry(300, 300);
            const lavaMat = new THREE.MeshBasicMaterial({ color: theme.lava, side: THREE.DoubleSide });
            lava = new THREE.Mesh(lavaGeo, lavaMat);
            lava.rotation.x = -Math.PI / 2;
            lava.position.y = -2;
            scene.add(lava);

            // 2. 起始大方塊
            const startPlatform = createCubePlatform(0, 0, 0, 8, 1, 8, theme.blockGrass, theme.blockDirt);
            scene.add(startPlatform);
            platforms.push(startPlatform);

            // 3. 生成螺旋方塊塔
            const radius = 7;
            for (let i = 1; i <= platformCount; i++) {
                const angle = i * 0.7;
                const height = i * 3.2;

                const isTop = (i === platformCount);
                const isCheckpoint = (i % 10 === 0 && !isTop); // 每 10 層設一個紀錄點

                const width = isTop ? 4 : (isCheckpoint ? 3.5 : Math.max(1.8, 3.2 - i * 0.02));
                const depth = isTop ? 4 : (isCheckpoint ? 3.5 : Math.max(1.8, 3.2 - i * 0.02));

                let topColor = isTop ? theme.topBlock : (isCheckpoint ? theme.checkpointColor : theme.blockGrass);
                let sideColor = isTop ? theme.topBlock : theme.blockDirt;

                const platform = createCubePlatform(
                    Math.cos(angle) * radius,
                    height,
                    Math.sin(angle) * radius,
                    width, 0.8, depth,
                    topColor, sideColor
                );

                platform.userData.isTop = isTop;
                platform.userData.isCheckpoint = isCheckpoint;
                platform.userData.cpIndex = i;

                // 如果是紀錄點，在上面放置一個🚩旗幟裝飾
                if (isCheckpoint) {
                    const flagGeo = new THREE.CylinderGeometry(0.1, 0.1, 2);
                    const flagMat = new THREE.MeshStandardMaterial({ color: 0xffffff });
                    const flagPole = new THREE.Mesh(flagGeo, flagMat);
                    flagPole.position.set(0, 1.4, 0);

                    const topBannerGeo = new THREE.BoxGeometry(0.8, 0.5, 0.1);
                    const topBannerMat = new THREE.MeshStandardMaterial({ color: theme.checkpointColor });
                    const topBanner = new THREE.Mesh(topBannerGeo, topBannerMat);
                    topBanner.position.set(0.4, 2, 0);

                    platform.add(flagPole);
                    platform.add(topBanner);
                    checkpoints.push(platform);
                }

                scene.add(platform);
                platforms.push(platform);
            }
        }

        // --- 4. 玩家角色 (MC 人物造型簡化版) ---
        const playerGroup = new THREE.Group();
        
        // 身體方塊
        const bodyGeo = new THREE.BoxGeometry(0.8, 1.6, 0.8);
        const bodyMat = new THREE.MeshStandardMaterial({ color: 0x00a8ff });
        const playerBody = new THREE.Mesh(bodyGeo, bodyMat);
        playerBody.position.y = 0.8;
        playerBody.castShadow = true;
        playerGroup.add(playerBody);

        scene.add(playerGroup);

        let playerPos = new THREE.Vector3(0, 2, 0);
        let playerVel = new THREE.Vector3(0, 0, 0);
        let isGrounded = false;
        let isGameOver = false;

        const gravity = 0.018;
        const moveSpeed = 0.16;
        const jumpForce = 0.42;

        const keys = {};
        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        // 滑鼠視角
        let cameraAngleX = 0;
        let cameraAngleY = 0.3;
        let isMouseDown = false;
        let prevMouseX = 0, prevMouseY = 0;

        window.addEventListener('mousedown', (e) => {
            if (e.target.tagName !== 'BUTTON') {
                isMouseDown = true;
                prevMouseX = e.clientX;
                prevMouseY = e.clientY;
            }
        });
        window.addEventListener('mouseup', () => isMouseDown = false);
        window.addEventListener('mousemove', (e) => {
            if (isMouseDown) {
                const deltaX = e.clientX - prevMouseX;
                const deltaY = e.clientY - prevMouseY;
                cameraAngleX -= deltaX * 0.005;
                cameraAngleY = Math.max(0.1, Math.min(Math.PI / 2 - 0.1, cameraAngleY + deltaY * 0.005));
                prevMouseX = e.clientX;
                prevMouseY = e.clientY;
            }
        });

        // 提示訊息淡出
        function triggerCheckpointMsg(text) {
            checkpointTxt.textContent = text;
            checkpointMsg.style.display = 'block';
            setTimeout(() => {
                checkpointMsg.style.display = 'none';
            }, 1800);
        }

        // --- 5. 物理與紀錄點檢測 ---
        function updatePhysics() {
            if (isGameOver) return;

            const forward = new THREE.Vector3(-Math.sin(cameraAngleX), 0, -Math.cos(cameraAngleX)).normalize();
            const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();

            let moveDir = new THREE.Vector3(0, 0, 0);
            if (keys['KeyW'] || keys['ArrowUp']) moveDir.add(forward);
            if (keys['KeyS'] || keys['ArrowDown']) moveDir.sub(forward);
            if (keys['KeyD'] || keys['ArrowRight']) moveDir.add(right);
            if (keys['KeyA'] || keys['ArrowLeft']) moveDir.sub(right);

            if (moveDir.length() > 0) moveDir.normalize();

            playerVel.x = moveDir.x * moveSpeed;
            playerVel.z = moveDir.z * moveSpeed;

            if ((keys['Space']) && isGrounded) {
                playerVel.y = jumpForce;
                isGrounded = false;
            }

            playerVel.y -= gravity;

            let nextX = playerPos.x + playerVel.x;
            let nextY = playerPos.y + playerVel.y;
            let nextZ = playerPos.z + playerVel.z;

            // 碰撞判定
            isGrounded = false;
            const playerHalfW = 0.4;

            for (let p of platforms) {
                const pBox = p.position;
                const pw = p.userData.width / 2;
                const pd = p.userData.depth / 2;
                const ph = p.userData.height / 2;

                if (
                    nextX + playerHalfW > pBox.x - pw &&
                    nextX - playerHalfW < pBox.x + pw &&
                    nextZ + playerHalfW > pBox.z - pd &&
                    nextZ - playerHalfW < pBox.z + pd
                ) {
                    if (playerPos.y >= pBox.y + ph && nextY <= pBox.y + ph) {
                        nextY = pBox.y + ph;
                        playerVel.y = 0;
                        isGrounded = true;

                        // 踩到紀錄點
                        if (p.userData.isCheckpoint && lastCheckpointName !== `${p.userData.cpIndex} 層`) {
                            lastCheckpointPos.set(pBox.x, pBox.y + ph + 0.5, pBox.z);
                            lastCheckpointName = `${p.userData.cpIndex} 層`;
                            triggerCheckpointMsg(`🚩 第 ${p.userData.cpIndex} 層紀錄點！`);
                        }

                        // 踩到終點
                        if (p.userData.isTop) {
                            endGame(true);
                            return;
                        }
                    }
                }
            }

            playerPos.set(nextX, nextY, nextZ);
            playerGroup.position.copy(playerPos);

            // 掉落熔岩 -> 回紀錄點/重生
            if (playerPos.y < 0) {
                endGame(false);
            }
        }

        function updateCamera() {
            const camDistance = 10;
            const camX = playerPos.x + camDistance * Math.sin(cameraAngleX) * Math.cos(cameraAngleY);
            const camY = playerPos.y + 1.5 + camDistance * Math.sin(cameraAngleY);
            const camZ = playerPos.z + camDistance * Math.cos(cameraAngleX) * Math.cos(cameraAngleY);

            camera.position.set(camX, camY, camZ);
            camera.lookAt(playerPos.x, playerPos.y + 1, playerPos.z);
        }

        function animate() {
            if (isGameOver) return;
            requestAnimationFrame(animate);

            updatePhysics();
            updateCamera();

            renderer.render(scene, camera);
        }

        // --- 6. 結算與重生控制 ---
        function endGame(isWin) {
            isGameOver = true;
            isWinState = isWin;

            if (isWin) {
                const rewardCoins = 1500;
                totalCoins += rewardCoins;
                coinsDisplay.textContent = totalCoins;

                overTitle.textContent = "🏆 成功攀至塔頂！";
                rewardText.textContent = `🎁 獲得 +${rewardCoins} 金幣！`;
                actionBtn.textContent = "進入下一個地圖 ➔";
            } else {
                overTitle.textContent = "🔥 跌落熔岩！";
                rewardText.textContent = `將於紀錄點 [ ${lastCheckpointName} ] 復活`;
                actionBtn.textContent = "從紀錄點重生";
            }

            finalScoreDisplay.textContent = Math.max(0, Math.floor(playerPos.y));
            gameOverScreen.style.display = 'block';
        }

        function handleButtonClick() {
            if (isWinState) {
                currentLevel++;
                // 重設紀錄點到起點
                lastCheckpointPos.set(0, 2, 0);
                lastCheckpointName = "起點";
                checkpointTxt.textContent = "起點";
                resetGame(true);
            } else {
                // 從紀錄點重生
                resetGame(false);
            }
        }

        function resetGame(isNewMap) {
            isGameOver = false;

            if (isNewMap) {
                buildMap(currentLevel);
            }

            // 將玩家放回紀錄點位置
            playerPos.copy(lastCheckpointPos);
            playerVel.set(0, 0, 0);
            cameraAngleX = 0;
            cameraAngleY = 0.3;

            gameOverScreen.style.display = 'none';
            animate();
        }

        // 啟動遊戲
        buildMap(0);
        resetGame(true);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
