<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft 巨型彩虹螺旋跑酷塔</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            overflow: hidden;
            background-color: #7ec0ee;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
        }

        /* 頂部 UI 介面 */
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: #fff;
            font-size: 18px;
            font-weight: bold;
            z-index: 10;
            display: flex;
            gap: 12px;
        }

        .ui-box {
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 16px;
            border-radius: 6px;
            border: 2px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            text-shadow: 1px 1px 2px #000;
        }

        #checkpoint-msg {
            display: none;
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(85, 255, 85, 0.9);
            color: #000;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 22px;
            font-weight: bold;
            border: 2px solid #fff;
            z-index: 15;
            box-shadow: 0 0 20px rgba(85, 255, 85, 0.8);
            animation: popIn 0.3s ease;
        }

        @keyframes popIn {
            0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        #instructions {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #fff;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.75);
            padding: 8px 18px;
            border-radius: 6px;
            border: 1px solid #777;
            z-index: 10;
            pointer-events: none;
            text-shadow: 1px 1px 2px #000;
        }

        /* 通關/重生彈窗 */
        #game-over {
            display: none;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(20, 20, 20, 0.95);
            padding: 35px 55px;
            border-radius: 12px;
            border: 3px solid #55ff55;
            box-shadow: 0 0 30px rgba(85, 255, 85, 0.4);
            color: #fff;
            z-index: 20;
        }

        #game-over h1 {
            font-size: 36px;
            color: #55ff55;
            margin-bottom: 15px;
            text-shadow: 0 0 10px #55ff55;
        }

        #reward-text {
            font-size: 20px;
            color: #ffff55;
            margin-bottom: 15px;
            font-weight: bold;
        }

        #game-over p {
            font-size: 18px;
            margin-bottom: 25px;
        }

        .btn {
            padding: 12px 30px;
            font-size: 18px;
            font-weight: bold;
            background-color: #55ff55;
            color: #000;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 0 15px #55ff55;
            transition: 0.2s;
        }

        .btn:hover {
            background-color: #fff;
            transform: scale(1.05);
        }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui">
        <div class="ui-box">🏰 地圖: <span style="color: #ffff55;">MC 彩虹巨型螺旋塔</span></div>
        <div class="ui-box">🚩 紀錄點: <span id="checkpoint-txt" style="color: #55ff55;">起點</span></div>
        <div class="ui-box">📏 高度: <span id="score" style="color: #00fff5;">0</span> m</div>
    </div>

    <div id="checkpoint-msg">🚩 紀錄點已儲存！</div>

    <div id="instructions">WASD 移動 | 空白鍵跳躍 | 按住滑鼠左鍵拖曳旋轉視角</div>

    <div id="game-over">
        <h1 id="over-title">挑戰結果</h1>
        <div id="reward-text"></div>
        <p>攀爬高度: <span id="final-score">0</span> 米</p>
        <button id="action-btn" class="btn" onclick="handleButtonClick()">從紀錄點重生</button>
    </div>

    <div id="canvas-container"></div>

    <script>
        // --- 1. 彩虹配色方案與場景設定 ---
        const RAINBOW_COLORS = [
            0x00ff88, // 螢光綠
            0xffff00, // 鮮黃
            0xff8800, // 橘色
            0xff0055, // 紅/粉紅
            0x00ccff, // 水藍
            0xaa00ff  // 紫色
        ];

        const container = document.getElementById('canvas-container');
        const scoreDisplay = document.getElementById('score');
        const checkpointTxt = document.getElementById('checkpoint-txt');
        const checkpointMsg = document.getElementById('checkpoint-msg');
        const gameOverScreen = document.getElementById('game-over');
        const finalScoreDisplay = document.getElementById('final-score');
        const overTitle = document.getElementById('over-title');
        const rewardText = document.getElementById('reward-text');
        const actionBtn = document.getElementById('action-btn');

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x7ec0ee); // 藍天
        scene.fog = new THREE.FogExp2(0x7ec0ee, 0.005);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // 陽光效果
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(40, 80, 40);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- 2. 幾何巨塔建構 ---
        let platforms = [];
        let lastCheckpointPos = new THREE.Vector3(0, 2, 0);
        let lastCheckpointName = "起點";
        let isWinState = false;

        const towerRadius = 10;   // 螺旋半徑
        const totalSteps = 60;     // 階梯總數

        // 建立單個 MC 幾何方塊平台
        function createBlock(x, y, z, w, h, d, colorHex) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshStandardMaterial({ 
                color: colorHex, 
                roughness: 0.8,
                metalness: 0.1
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;

            mesh.userData = { width: w, height: h, depth: d, isTop: false, isCheckpoint: false };
            return mesh;
        }

        function buildSpiralTower() {
            // 1. 中央巨型幾何地標柱
            const coreGeo = new THREE.BoxGeometry(4, 220, 4);
            const coreMat = new THREE.MeshStandardMaterial({ color: 0x333344, roughness: 0.9 });
            const core = new THREE.Mesh(coreGeo, coreMat);
            core.position.y = 100;
            scene.add(core);

            // 2. 底層大平台 (綠色草地風)
            const baseBlock = createBlock(0, 0, 0, 12, 1, 12, 0x55aa33);
            scene.add(baseBlock);
            platforms.push(baseBlock);

            // 3. 巨型幾何螺旋跑酷階梯
            for (let i = 1; i <= totalSteps; i++) {
                const angle = i * 0.45; // 螺旋密度
                const height = i * 2.8;  // 高度遞增

                const x = Math.cos(angle) * towerRadius;
                const z = Math.sin(angle) * towerRadius;

                const isTop = (i === totalSteps);
                const isCheckpoint = (i % 12 === 0 && !isTop); // 每 12 階一個紀錄點

                // 選用彩虹分區色彩
                const colorIdx = Math.floor(i / 10) % RAINBOW_COLORS.length;
                let colorHex = isTop ? 0xffffd700 : (isCheckpoint ? 0xffffff : RAINBOW_COLORS[colorIdx]);

                const w = isTop ? 6 : (isCheckpoint ? 3.5 : 2.2);
                const d = isTop ? 6 : (isCheckpoint ? 3.5 : 2.2);

                const block = createBlock(x, height, z, w, 0.8, d, colorHex);
                block.userData.isTop = isTop;
                block.userData.isCheckpoint = isCheckpoint;
                block.userData.cpIndex = i;

                // 若為紀錄點，放置白色/黃色標誌柱
                if (isCheckpoint) {
                    const poleGeo = new THREE.BoxGeometry(0.4, 2, 0.4);
                    const poleMat = new THREE.MeshStandardMaterial({ color: 0xffaa00 });
                    const pole = new THREE.Mesh(poleGeo, poleMat);
                    pole.position.set(0, 1.4, 0);
                    block.add(pole);
                }

                scene.add(block);
                platforms.push(block);
            }
        }

        // --- 3. 玩家角色與操控 ---
        const playerGroup = new THREE.Group();
        const playerGeo = new THREE.BoxGeometry(0.8, 1.8, 0.8);
        const playerMat = new THREE.MeshStandardMaterial({ color: 0x00a8ff });
        const playerMesh = new THREE.Mesh(playerGeo, playerMat);
        playerMesh.position.y = 0.9;
        playerMesh.castShadow = true;
        playerGroup.add(playerMesh);

        scene.add(playerGroup);

        let playerPos = new THREE.Vector3(0, 2, 0);
        let playerVel = new THREE.Vector3(0, 0, 0);
        let isGrounded = false;
        let isGameOver = false;

        const gravity = 0.018;
        const moveSpeed = 0.17;
        const jumpForce = 0.43;

        const keys = {};
        window.addEventListener('keydown', (e) => keys[e.code] = true);
        window.addEventListener('keyup', (e) => keys[e.code] = false);

        // 視角控制器
        let cameraAngleX = 0;
        let cameraAngleY = 0.3;
        let isMouseDown = false;
        let prevMouseX = 0, prevMouseY = 0;

        window.addEventListener('mousedown', (e) => {
            if (e.target.tagName !== 'BUTTON') {
                isMouseDown = true;
                prevMouseX = e.clientX;
                prevMouseY = e.clientY;
            }
        });
        window.addEventListener('mouseup', () => isMouseDown = false);
        window.addEventListener('mousemove', (e) => {
            if (isMouseDown) {
                const deltaX = e.clientX - prevMouseX;
                const deltaY = e.clientY - prevMouseY;
                cameraAngleX -= deltaX * 0.005;
                cameraAngleY = Math.max(0.1, Math.min(Math.PI / 2 - 0.1, cameraAngleY + deltaY * 0.005));
                prevMouseX = e.clientX;
                prevMouseY = e.clientY;
            }
        });

        function triggerCheckpointMsg(text) {
            checkpointTxt.textContent = text;
            checkpointMsg.style.display = 'block';
            setTimeout(() => {
                checkpointMsg.style.display = 'none';
            }, 1800);
        }

        // --- 4. 物理與碰撞判定 ---
        function updatePhysics() {
            if (isGameOver) return;

            const forward = new THREE.Vector3(-Math.sin(cameraAngleX), 0, -Math.cos(cameraAngleX)).normalize();
            const right = new THREE.Vector3().crossVectors(forward, new THREE.Vector3(0, 1, 0)).normalize();

            let moveDir = new THREE.Vector3(0, 0, 0);
            if (keys['KeyW'] || keys['ArrowUp']) moveDir.add(forward);
            if (keys['KeyS'] || keys['ArrowDown']) moveDir.sub(forward);
            if (keys['KeyD'] || keys['ArrowRight']) moveDir.add(right);
            if (keys['KeyA'] || keys['ArrowLeft']) moveDir.sub(right);

            if (moveDir.length() > 0) moveDir.normalize();

            playerVel.x = moveDir.x * moveSpeed;
            playerVel.z = moveDir.z * moveSpeed;

            if ((keys['Space']) && isGrounded) {
                playerVel.y = jumpForce;
                isGrounded = false;
            }

            playerVel.y -= gravity;

            let nextX = playerPos.x + playerVel.x;
            let nextY = playerPos.y + playerVel.y;
            let nextZ = playerPos.z + playerVel.z;

            // 方塊碰撞判定
            isGrounded = false;
            const playerHalfW = 0.4;

            for (let p of platforms) {
                const pBox = p.position;
                const pw = p.userData.width / 2;
                const pd = p.userData.depth / 2;
                const ph = p.userData.height / 2;

                if (
                    nextX + playerHalfW > pBox.x - pw &&
                    nextX - playerHalfW < pBox.x + pw &&
                    nextZ + playerHalfW > pBox.z - pd &&
                    nextZ - playerHalfW < pBox.z + pd
                ) {
                    if (playerPos.y >= pBox.y + ph && nextY <= pBox.y + ph) {
                        nextY = pBox.y + ph;
                        playerVel.y = 0;
                        isGrounded = true;

                        // 紀錄點
                        if (p.userData.isCheckpoint && lastCheckpointName !== `${p.userData.cpIndex} 階`) {
                            lastCheckpointPos.set(pBox.x, pBox.y + ph + 0.5, pBox.z);
                            lastCheckpointName = `${p.userData.cpIndex} 階`;
                            triggerCheckpointMsg(`🚩 第 ${p.userData.cpIndex} 階紀錄點！`);
                        }

                        // 登頂
                        if (p.userData.isTop) {
                            endGame(true);
                            return;
                        }
                    }
                }
            }

            playerPos.set(nextX, nextY, nextZ);
            playerGroup.position.copy(playerPos);

            // 摔落底下
            if (playerPos.y < -10) {
                endGame(false);
            }

            scoreDisplay.textContent = Math.max(0, Math.floor(playerPos.y));
        }

        function updateCamera() {
            const camDistance = 11;
            const camX = playerPos.x + camDistance * Math.sin(cameraAngleX) * Math.cos(cameraAngleY);
            const camY = playerPos.y + 1.8 + camDistance * Math.sin(cameraAngleY);
            const camZ = playerPos.z + camDistance * Math.cos(cameraAngleX) * Math.cos(cameraAngleY);

            camera.position.set(camX, camY, camZ);
            camera.lookAt(playerPos.x, playerPos.y + 1, playerPos.z);
        }

        function animate() {
            if (isGameOver) return;
            requestAnimationFrame(animate);

            updatePhysics();
            updateCamera();

            renderer.render(scene, camera);
        }

        // --- 5. 遊戲狀態與重置 ---
        function endGame(isWin) {
            isGameOver = true;
            isWinState = isWin;

            if (isWin) {
                overTitle.textContent = "🏆 成功登頂彩虹塔！";
                rewardText.textContent = "恭喜你完成了這座巨型螺旋跑酷塔！";
                actionBtn.textContent = "再次挑戰";
            } else {
                overTitle.textContent = "💥 摔落高空！";
                rewardText.textContent = `將於紀錄點 [ ${lastCheckpointName} ] 復活`;
                actionBtn.textContent = "從紀錄點重生";
            }

            finalScoreDisplay.textContent = Math.max(0, Math.floor(playerPos.y));
            gameOverScreen.style.display = 'block';
        }

        function handleButtonClick() {
            if (isWinState) {
                lastCheckpointPos.set(0, 2, 0);
                lastCheckpointName = "起點";
                checkpointTxt.textContent = "起點";
            }
            resetGame();
        }

        function resetGame() {
            isGameOver = false;

            playerPos.copy(lastCheckpointPos);
            playerVel.set(0, 0, 0);
            cameraAngleX = 0;
            cameraAngleY = 0.3;

            gameOverScreen.style.display = 'none';
            animate();
        }

        // 啟動
        buildSpiralTower();
        resetGame();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
