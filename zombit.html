<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>殭屍生存 - 完整版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Arial, sans-serif;
            user-select: none;
        }

        /* ===== 主 UI ===== */
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        /* 頂部狀態列 */
        #topBar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 12px 20px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.85) 0%, transparent 100%);
        }
        #healthArmor {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .bar-container {
            width: 200px;
            height: 14px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
        }
        .bar-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.15s;
        }
        .bar-fill.health {
            background: linear-gradient(90deg, #ff2222, #ff6644);
        }
        .bar-fill.armor {
            background: linear-gradient(90deg, #4488ff, #66ccff);
        }
        .bar-label {
            color: #fff;
            font-size: 11px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 9px;
            opacity: 0.8;
        }
        .stat-text {
            color: #fff;
            font-size: 13px;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.9);
            opacity: 0.9;
        }
        #rightStats {
            text-align: right;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        #rightStats .stat-text {
            font-size: 14px;
        }
        #killDisplay {
            color: #ffcc44;
        }
        #waveDisplay {
            color: #44ddff;
        }

        /* 十字準星 */
        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(0, 255, 100, 0.6);
            font-size: 28px;
            font-weight: 100;
            text-shadow: 0 0 15px rgba(0, 255, 100, 0.2);
            pointer-events: none;
        }
        #crosshair .dot {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 2px;
            height: 2px;
            background: rgba(0, 255, 100, 0.8);
            border-radius: 50%;
        }

        /* 底部武器欄 */
        #bottomBar {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 16px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 24px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            pointer-events: none;
        }
        #weaponName {
            color: #88ddff;
            font-size: 16px;
            font-weight: bold;
            min-width: 90px;
        }
        #weaponRarity {
            font-size: 12px;
            margin-left: 4px;
        }
        #ammoDisplay {
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            min-width: 110px;
            text-align: center;
        }
        #ammoDisplay .max {
            color: #888;
            font-size: 16px;
        }
        #reloadHint {
            color: #ffaa44;
            font-size: 14px;
            animation: blink 0.5s infinite;
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }

        /* 武器快捷列 */
        #weaponSlots {
            position: absolute;
            bottom: 78px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            pointer-events: none;
        }
        .slot {
            padding: 4px 12px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            color: #555;
            font-size: 11px;
            transition: 0.2s;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .slot .key {
            color: #666;
            font-size: 9px;
        }
        .slot.active {
            border-color: #88ddff;
            color: #88ddff;
            background: rgba(136, 221, 255, 0.12);
            box-shadow: 0 0 20px rgba(136, 221, 255, 0.05);
        }
        .slot .rarity-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-right: 4px;
        }

        /* 拾取提示 */
        #pickupHint {
            position: absolute;
            bottom: 180px;
            left: 50%;
            transform: translateX(-50%);
            color: #44ff88;
            font-size: 16px;
            opacity: 0;
            transition: 0.3s;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.7);
            padding: 6px 18px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(68, 255, 136, 0.2);
        }
        #pickupHint.show {
            opacity: 1;
        }

        /* 操作提示 */
        #controls {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.2);
            font-size: 11px;
            pointer-events: none;
            letter-spacing: 1px;
            text-align: center;
            line-height: 1.6;
        }

        /* 空投提示 */
        #airdropIndicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff8800;
            font-size: 36px;
            font-weight: bold;
            text-shadow: 0 0 60px rgba(255, 136, 0, 0.4);
            opacity: 0;
            transition: 0.5s;
            pointer-events: none;
        }
        #airdropIndicator.show {
            opacity: 1;
        }

        /* 背包 (Tab) */
        #inventory {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px 32px;
            min-width: 400px;
            max-width: 500px;
            backdrop-filter: blur(20px);
            display: none;
            pointer-events: all;
            z-index: 50;
            max-height: 70vh;
            overflow-y: auto;
        }
        #inventory h2 {
            color: #fff;
            font-size: 20px;
            margin-bottom: 16px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 12px;
        }
        .inv-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            margin: 4px 0;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            cursor: pointer;
            transition: 0.2s;
            pointer-events: all;
        }
        .inv-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .inv-item .name {
            color: #ddd;
            font-size: 14px;
        }
        .inv-item .qty {
            color: #888;
            font-size: 13px;
        }
        .inv-item .use-btn {
            background: rgba(68, 255, 136, 0.15);
            border: 1px solid rgba(68, 255, 136, 0.2);
            color: #44ff88;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 11px;
            cursor: pointer;
            pointer-events: all;
        }
        .inv-item .use-btn:hover {
            background: rgba(68, 255, 136, 0.25);
        }
        .inv-empty {
            color: #666;
            text-align: center;
            padding: 30px 0;
            font-size: 14px;
        }
        #invClose {
            display: block;
            margin: 16px auto 0;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #888;
            padding: 6px 30px;
            border-radius: 20px;
            cursor: pointer;
            pointer-events: all;
            font-size: 13px;
        }
        #invClose:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* 小地圖 */
        #minimap {
            position: absolute;
            bottom: 90px;
            right: 20px;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.6);
            overflow: hidden;
            pointer-events: none;
            backdrop-filter: blur(5px);
        }
        #minimap canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        /* 遊戲結束 */
        #gameover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.88);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
            backdrop-filter: blur(12px);
        }
        #gameover h1 {
            color: #ff3333;
            font-size: 64px;
            text-shadow: 0 0 40px rgba(255, 0, 0, 0.3);
        }
        #gameover p {
            color: #ccc;
            font-size: 20px;
            margin: 6px 0;
        }
        #restartBtn {
            margin-top: 24px;
            padding: 14px 48px;
            font-size: 18px;
            background: #ff4444;
            border: none;
            color: #fff;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
            pointer-events: all;
        }
        #restartBtn:hover {
            background: #ff6666;
            transform: scale(1.05);
        }

        /* 傷害數字 */
        .damage-popup {
            position: absolute;
            pointer-events: none;
            color: #ff8844;
            font-weight: bold;
            font-size: 20px;
            text-shadow: 0 0 20px rgba(255, 136, 68, 0.3);
            z-index: 15;
            animation: floatUp 0.8s ease-out forwards;
        }
        .damage-popup.crit {
            color: #ff4444;
            font-size: 28px;
        }
        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-60px) scale(1.2);
            }
        }

        /* 受傷閃爍 */
        .hurt-flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(255, 0, 0, 0.3));
            pointer-events: none;
            z-index: 5;
            opacity: 0;
            transition: opacity 0.1s;
        }
        .hurt-flash.show {
            opacity: 1;
        }

        /* 滾動條美化 */
        #inventory::-webkit-scrollbar {
            width: 4px;
        }
        #inventory::-webkit-scrollbar-track {
            background: transparent;
        }
        #inventory::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }

        @media (max-width: 600px) {
            #bottomBar {
                padding: 6px 12px;
                gap: 8px;
                bottom: 15px;
            }
            #weaponName {
                font-size: 12px;
                min-width: 60px;
            }
            #ammoDisplay {
                font-size: 18px;
                min-width: 70px;
            }
            #weaponSlots {
                bottom: 62px;
            }
            .slot {
                font-size: 9px;
                padding: 2px 8px;
            }
            #minimap {
                width: 80px;
                height: 80px;
                bottom: 70px;
                right: 10px;
            }
            #inventory {
                min-width: 280px;
                padding: 16px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== UI ===== -->
    <div id="ui">
        <!-- 頂部 -->
        <div id="topBar">
            <div id="healthArmor">
                <div class="bar-container">
                    <div class="bar-fill health" id="healthBar" style="width:100%"></div>
                    <span class="bar-label" id="healthLabel">100</span>
                </div>
                <div class="bar-container">
                    <div class="bar-fill armor" id="armorBar" style="width:0%"></div>
                    <span class="bar-label" id="armorLabel">0</span>
                </div>
            </div>
            <div id="rightStats">
                <span class="stat-text" id="killDisplay">💀 0</span>
                <span class="stat-text" id="waveDisplay">🌊 第 1 波</span>
                <span class="stat-text" id="zombieCount" style="color:#ff6644;font-size:12px;">🧟 0</span>
            </div>
        </div>

        <!-- 十字準星 -->
        <div id="crosshair">✚<div class="dot"></div></div>

        <!-- 武器快捷列 -->
        <div id="weaponSlots"></div>

        <!-- 底部武器欄 -->
        <div id="bottomBar">
            <span id="weaponName">🔫 手槍 <span id="weaponRarity"></span></span>
            <span id="ammoDisplay">12 <span class="max">/ 12</span></span>
            <span id="reloadHint" style="display:none;">🔄 換彈中</span>
        </div>

        <!-- 拾取提示 -->
        <div id="pickupHint">📦 按 E 拾取</div>

        <!-- 操作提示 -->
        <div id="controls">🖱️ 點擊鎖定 · WASD移動 · 1-5切換武器 · R換彈 · E拾取 · Tab背包</div>

        <!-- 空投 -->
        <div id="airdropIndicator">📦 空投來了!</div>

        <!-- 受傷閃爍 -->
        <div class="hurt-flash" id="hurtFlash"></div>

        <!-- 小地圖 -->
        <div id="minimap"><canvas id="minimapCanvas" width="140" height="140"></canvas></div>
    </div>

    <!-- 背包 -->
    <div id="inventory">
        <h2>🎒 背包</h2>
        <div id="invItems"></div>
        <button id="invClose">關閉 (Tab)</button>
    </div>

    <!-- 遊戲結束 -->
    <div id="gameover">
        <h1>💀 你死了</h1>
        <p>擊殺數: <span id="finalKills">0</span></p>
        <p>存活波數: <span id="finalWave">0</span></p>
        <button id="restartBtn">🔄 重新開始</button>
    </div>

    <!-- ===== Three.js ===== -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

        // ============================================================
        //  1. 場景
        // ============================================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a18);
        scene.fog = new THREE.FogExp2(0x0a0a18, 0.004);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 120);
        camera.position.set(0, 1.8, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        document.body.prepend(renderer.domElement);

        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const bloom = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            0.2, 0.15, 0.05
        );
        composer.addPass(bloom);
        composer.addPass(new OutputPass());

        // ============================================================
        //  2. 燈光
        // ============================================================
        const ambient = new THREE.AmbientLight(0x223366, 0.25);
        scene.add(ambient);

        const mainLight = new THREE.DirectionalLight(0xffddaa, 2.0);
        mainLight.position.set(15, 25, 10);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 4096;
        mainLight.shadow.mapSize.height = 4096;
        mainLight.shadow.camera.near = 0.5;
        mainLight.shadow.camera.far = 80;
        mainLight.shadow.camera.left = -35;
        mainLight.shadow.camera.right = 35;
        mainLight.shadow.camera.top = 35;
        mainLight.shadow.camera.bottom = -35;
        scene.add(mainLight);

        const fillLight = new THREE.DirectionalLight(0x4488ff, 0.2);
        fillLight.position.set(-15, 5, -15);
        scene.add(fillLight);

        // ============================================================
        //  3. 地面 (大尺寸)
        // ============================================================
        function createGroundTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#2a2a2e';
            ctx.fillRect(0, 0, 512, 512);
            for (let i = 0; i < 8000; i++) {
                const x = Math.random() * 512,
                    y = Math.random() * 512;
                const g = 60 + Math.random() * 80;
                ctx.fillStyle = `rgb(${g},${g},${g+10})`;
                ctx.fillRect(x, y, 1 + Math.random() * 2, 1 + Math.random() * 2);
            }
            // 道路標線
            ctx.strokeStyle = 'rgba(80,80,90,0.15)';
            ctx.lineWidth = 2;
            for (let i = 0; i < 20; i++) {
                const x = Math.random() * 512;
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x + (Math.random() - 0.5) * 100, 512);
                ctx.stroke();
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(30, 30);
            tex.anisotropy = 8;
            return tex;
        }

        const ground = new THREE.Mesh(
            new THREE.CircleGeometry(60, 80),
            new THREE.MeshStandardMaterial({
                map: createGroundTexture(),
                roughness: 0.9,
                metalness: 0.05,
            })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.05;
        ground.receiveShadow = true;
        scene.add(ground);

        // ============================================================
        //  4. 建築物 (可進入)
        // ============================================================
        const buildings = [];

        function createBuilding(x, z, w, d, h, color = 0x445566, hasDoor = true) {
            const g = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.7, metalness: 0.1 });
            const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
            wall.position.y = h / 2;
            wall.castShadow = true;
            wall.receiveShadow = true;
            g.add(wall);

            // 屋頂
            const roofMat = new THREE.MeshStandardMaterial({ color: 0x334455, roughness: 0.8 });
            const roof = new THREE.Mesh(new THREE.BoxGeometry(w + 0.3, 0.1, d + 0.3), roofMat);
            roof.position.y = h + 0.05;
            roof.castShadow = true;
            g.add(roof);

            // 窗戶 (發光)
            const winMat = new THREE.MeshStandardMaterial({
                color: 0x88ccff,
                emissive: 0x88ccff,
                emissiveIntensity: 0.05,
                transparent: true,
                opacity: 0.3,
            });
            for (let wx of [-w * 0.3, w * 0.3]) {
                for (let wy of [h * 0.3, h * 0.6]) {
                    const win = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 0.4), winMat);
                    win.position.set(wx, wy, d / 2 + 0.01);
                    g.add(win);
                    const win2 = win.clone();
                    win2.position.z = -d / 2 - 0.01;
                    win2.rotation.y = Math.PI;
                    g.add(win2);
                }
            }

            // 門 (可進入標記)
            if (hasDoor) {
                const doorMat = new THREE.MeshStandardMaterial({ color: 0x2a1a0a, roughness: 0.9 });
                const door = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 1.2), doorMat);
                door.position.set(0, 0.6, d / 2 + 0.01);
                g.add(door);
                // 門框發光
                const glow = new THREE.PointLight(0xff8844, 0.15, 2);
                glow.position.set(0, 0.6, d / 2 + 0.5);
                g.add(glow);
            }

            g.position.set(x, 0, z);
            scene.add(g);

            // 儲存建築物碰撞資料 (可進入)
            buildings.push({
                mesh: g,
                x: x,
                z: z,
                w: w,
                d: d,
                h: h,
                minX: x - w / 2,
                maxX: x + w / 2,
                minZ: z - d / 2,
                maxZ: z + d / 2,
                enterable: hasDoor,
            });
            return g;
        }

        // 城鎮佈局
        createBuilding(-12, -8, 5, 6, 3.5, 0x556677);
        createBuilding(-12, 0, 5, 6, 3.5, 0x667788);
        createBuilding(-12, 8, 5, 6, 3.5, 0x556677);

        createBuilding(0, -12, 7, 5, 4.0, 0x445566);
        createBuilding(0, 0, 8, 6, 4.5, 0x556677);
        createBuilding(0, 10, 7, 5, 4.0, 0x445566);

        createBuilding(12, -8, 5, 6, 3.5, 0x667788);
        createBuilding(12, 0, 5, 6, 3.5, 0x556677);
        createBuilding(12, 8, 5, 6, 3.5, 0x667788);

        // 倉庫 (大建築)
        createBuilding(-6, -15, 8, 5, 5.0, 0x3a4a5a);
        createBuilding(6, 14, 8, 5, 5.0, 0x3a4a5a);

        // 裝飾路燈
        function createStreetLight(x, z) {
            const g = new THREE.Group();
            const poleMat = new THREE.MeshStandardMaterial({ color: 0x444455, roughness: 0.4, metalness: 0.7 });
            const pole = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.07, 3.0, 8), poleMat);
            pole.position.y = 1.5;
            pole.castShadow = true;

        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new(window.AudioContext || window.webkitAudioContext)();

        function playShootSound(volume = 0.3) {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.05);
                gain.gain.setValueAtTime(volume, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.05);
                // 噪音層
                const bufferSize = audioCtx.sampleRate * 0.03;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / bufferSize * 5);
                }
                const noise = audioCtx.createBufferSource();
                const ng = audioCtx.createGain();
                noise.buffer = buffer;
                noise.connect(ng);
                ng.connect(audioCtx.destination);
                ng.gain.setValueAtTime(volume * 0.6, audioCtx.currentTime);
                ng.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
                noise.start(audioCtx.currentTime);
            } catch (e) {}
        }

        function playReloadSound() {
            try {
                initAudio();
                for (let i = 0; i < 3; i++) {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.type = 'square';
                    osc.frequency.setValueAtTime(600 + i * 200, audioCtx.currentTime + i * 0.08);
                    gain.gain.setValueAtTime(0.08, audioCtx.currentTime + i * 0.08);
                    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.08 + 0.05);
                    osc.start(audioCtx.currentTime + i * 0.08);
                    osc.stop(audioCtx.currentTime + i * 0.08 + 0.05);

        function getDamageReduction() {
            let reduction = 0;
            if (armor.helmet.equipped && armor.helmet.durability > 0) reduction += 0.15;
            if (armor.vest.equipped && armor.vest.durability > 0) reduction += 0.25;
            return Math.min(reduction, 0.7);
        }

        function applyDamageToArmor(damage) {
            let remaining = damage;
            if (armor.vest.equipped && armor.vest.durability > 0) {
                const absorbed = Math.min(remaining * 0.6, armor.vest.durability);
                armor.vest.durability -= absorbed;
                remaining -= absorbed;
                if (armor.vest.durability < 0) armor.vest.durability = 0;
            }
            if (armor.helmet.equipped && armor.helmet.durability > 0 && remaining > 0) {
                const absorbed2 = Math.min(remaining * 0.3, armor.helmet.durability);
                armor.helmet.durability -= absorbed2;
                remaining -= absorbed2;
                if (armor.helmet.durability < 0) armor.helmet.durability = 0;
            }
            return Math.max(0, remaining);
        }
