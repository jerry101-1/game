<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>殭屍生存 - 城市大樓</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: #000;
            font-family: 'Segoe UI', Arial, sans-serif;
            user-select: none;
            cursor: default;
        }
        #ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        #topBar {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            padding: 12px 20px;
            background: linear-gradient(180deg, rgba(0, 0, 0, 0.85) 0%, transparent 100%);
        }
        #healthArmor {
            display: flex;
            flex-direction: column;
            gap: 4px;
            min-width: 180px;
        }
        .bar-container {
            width: 200px;
            height: 14px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.05);
            position: relative;
        }
        .bar-fill {
            height: 100%;
            border-radius: 10px;
            transition: width 0.15s;
        }
        .bar-fill.health {
            background: linear-gradient(90deg, #ff2222, #ff6644);
        }
        .bar-fill.armor {
            background: linear-gradient(90deg, #4488ff, #66ccff);
        }
        .bar-label {
            color: #fff;
            font-size: 9px;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.8);
            position: absolute;
            right: 6px;
            top: 50%;
            transform: translateY(-50%);
            opacity: 0.8;
        }
        .armor-rarity {
            font-size: 10px;
            margin-left: 4px;
        }
        .stat-text {
            color: #fff;
            font-size: 13px;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.9);
            opacity: 0.9;
        }
        #rightStats {
            text-align: right;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }
        #rightStats .stat-text {
            font-size: 14px;
        }
        #killDisplay {
            color: #ffcc44;
        }
        #waveDisplay {
            color: #44ddff;
        }
        #vehicleStatus {
            color: #88ddff;
            font-size: 12px;
        }

        #crosshair {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(0, 255, 100, 0.6);
            font-size: 28px;
            font-weight: 100;
            text-shadow: 0 0 15px rgba(0, 255, 100, 0.2);
            pointer-events: none;
        }
        #crosshair .dot {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 2px;
            height: 2px;
            background: rgba(0, 255, 100, 0.8);
            border-radius: 50%;
        }

        #bottomBar {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            align-items: center;
            gap: 16px;
            background: rgba(0, 0, 0, 0.8);
            padding: 10px 24px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(12px);
            pointer-events: none;
        }
        #weaponName {
            color: #88ddff;
            font-size: 16px;
            font-weight: bold;
            min-width: 90px;
        }
        #weaponRarity {
            font-size: 12px;
            margin-left: 4px;
        }
        #ammoDisplay {
            color: #fff;
            font-size: 24px;
            font-weight: bold;
            min-width: 110px;
            text-align: center;
        }
        #ammoDisplay .max {
            color: #888;
            font-size: 16px;
        }
        #reloadHint {
            color: #ffaa44;
            font-size: 14px;
            animation: blink 0.5s infinite;
        }
        @keyframes blink {
            0%,
            100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }

        #weaponSlots {
            position: absolute;
            bottom: 78px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 6px;
            pointer-events: none;
        }
        .slot {
            padding: 4px 12px;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 6px;
            color: #555;
            font-size: 11px;
            transition: 0.2s;
            font-family: 'Segoe UI', Arial, sans-serif;
        }
        .slot .key {
            color: #666;
            font-size: 9px;
        }
        .slot.active {
            border-color: #88ddff;
            color: #88ddff;
            background: rgba(136, 221, 255, 0.12);
            box-shadow: 0 0 20px rgba(136, 221, 255, 0.05);
        }
        .slot .rarity-dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            margin-right: 4px;
        }

        #pickupHint {
            position: absolute;
            bottom: 180px;
            left: 50%;
            transform: translateX(-50%);
            color: #44ff88;
            font-size: 16px;
            opacity: 0;
            transition: 0.3s;
            pointer-events: none;
            background: rgba(0, 0, 0, 0.7);
            padding: 6px 18px;
            border-radius: 10px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(68, 255, 136, 0.2);
        }
        #pickupHint.show {
            opacity: 1;
        }

        #controls {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.2);
            font-size: 11px;
            pointer-events: none;
            letter-spacing: 1px;
            text-align: center;
            line-height: 1.6;
        }

        #airdropIndicator {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff8800;
            font-size: 36px;
            font-weight: bold;
            text-shadow: 0 0 60px rgba(255, 136, 0, 0.4);
            opacity: 0;
            transition: 0.5s;
            pointer-events: none;
        }
        #airdropIndicator.show {
            opacity: 1;
        }

        #inventory {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 24px 32px;
            min-width: 400px;
            max-width: 500px;
            backdrop-filter: blur(20px);
            display: none;
            pointer-events: all;
            z-index: 50;
            max-height: 70vh;
            overflow-y: auto;
        }
        #inventory h2 {
            color: #fff;
            font-size: 20px;
            margin-bottom: 16px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 12px;
        }
        .inv-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            margin: 4px 0;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            cursor: pointer;
            transition: 0.2s;
            pointer-events: all;
        }
        .inv-item:hover {
            background: rgba(255, 255, 255, 0.08);
        }
        .inv-item .name {
            color: #ddd;
            font-size: 14px;
        }
        .inv-item .qty {
            color: #888;
            font-size: 13px;
        }
        .inv-item .use-btn {
            background: rgba(68, 255, 136, 0.15);
            border: 1px solid rgba(68, 255, 136, 0.2);
            color: #44ff88;
            padding: 2px 12px;
            border-radius: 12px;
            font-size: 11px;
            cursor: pointer;
            pointer-events: all;
        }
        .inv-item .use-btn:hover {
            background: rgba(68, 255, 136, 0.25);
        }
        .inv-empty {
            color: #666;
            text-align: center;
            padding: 30px 0;
            font-size: 14px;
        }
        #invClose {
            display: block;
            margin: 16px auto 0;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #888;
            padding: 6px 30px;
            border-radius: 20px;
            cursor: pointer;
            pointer-events: all;
            font-size: 13px;
        }
        #invClose:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        #minimap {
            position: absolute;
            bottom: 90px;
            right: 20px;
            width: 140px;
            height: 140px;
            border-radius: 50%;
            border: 2px solid rgba(255, 255, 255, 0.1);
            background: rgba(0, 0, 0, 0.6);
            overflow: hidden;
            pointer-events: none;
            backdrop-filter: blur(5px);
        }
        #minimap canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
        }

        #vehicleHUD {
            position: absolute;
            bottom: 100px;
            right: 180px;
            color: #88ddff;
            font-size: 14px;
            background: rgba(0, 0, 0, 0.7);
            padding: 8px 16px;
            border-radius: 10px;
            border: 1px solid rgba(136, 221, 255, 0.15);
            backdrop-filter: blur(5px);
            display: none;
            pointer-events: none;
            font-family: 'Courier New', monospace;
        }
        #vehicleHUD.show {
            display: block;
        }

        #gameover {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.88);
            display: none;
            justify-content: center;
            align-items: center;
            flex-direction: column;
            z-index: 100;
            backdrop-filter: blur(12px);
        }
        #gameover h1 {
            color: #ff3333;
            font-size: 64px;
            text-shadow: 0 0 40px rgba(255, 0, 0, 0.3);
        }
        #gameover p {
            color: #ccc;
            font-size: 20px;
            margin: 6px 0;
        }
        #restartBtn {
            margin-top: 24px;
            padding: 14px 48px;
            font-size: 18px;
            background: #ff4444;
            border: none;
            color: #fff;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: bold;
            pointer-events: all;
        }
        #restartBtn:hover {
            background: #ff6666;
            transform: scale(1.05);
        }

        .damage-popup {
            position: absolute;
            pointer-events: none;
            color: #ff8844;
            font-weight: bold;
            font-size: 20px;
            text-shadow: 0 0 20px rgba(255, 136, 68, 0.3);
            z-index: 15;
            animation: floatUp 0.8s ease-out forwards;
        }
        .damage-popup.crit {
            color: #ff4444;
            font-size: 28px;
        }
        @keyframes floatUp {
            0% {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
            100% {
                opacity: 0;
                transform: translateY(-60px) scale(1.2);
            }
        }

        .hurt-flash {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(ellipse at center, transparent 50%, rgba(255, 0, 0, 0.3));
            pointer-events: none;
            z-index: 5;
            opacity: 0;
            transition: opacity 0.1s;
        }
        .hurt-flash.show {
            opacity: 1;
        }

        #lockHint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255, 255, 255, 0.6);
            font-size: 24px;
            background: rgba(0, 0, 0, 0.7);
            padding: 20px 40px;
            border-radius: 16px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            z-index: 30;
            pointer-events: none;
            transition: opacity 0.5s;
            text-align: center;
            line-height: 1.8;
        }
        #lockHint .icon {
            font-size: 40px;
            display: block;
            margin-bottom: 8px;
        }
        #lockHint.hidden {
            opacity: 0;
        }

        #inventory::-webkit-scrollbar {
            width: 4px;
        }
        #inventory::-webkit-scrollbar-track {
            background: transparent;
        }
        #inventory::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 4px;
        }

        @media (max-width: 600px) {
            #bottomBar {
                padding: 6px 12px;
                gap: 8px;
                bottom: 15px;
            }
            #weaponName {
                font-size: 12px;
                min-width: 60px;
            }
            #ammoDisplay {
                font-size: 18px;
                min-width: 70px;
            }
            #weaponSlots {
                bottom: 62px;
            }
            .slot {
                font-size: 9px;
                padding: 2px 8px;
            }
            #minimap {
                width: 80px;
                height: 80px;
                bottom: 70px;
                right: 10px;
            }
            #inventory {
                min-width: 280px;
                padding: 16px;
            }
            #vehicleHUD {
                right: 100px;
                font-size: 11px;
                padding: 4px 10px;
            }
            #lockHint {
                font-size: 16px;
                padding: 14px 24px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== UI ===== -->
    <div id="ui">
        <div id="topBar">
            <div id="healthArmor">
                <div class="bar-container">
                    <div class="bar-fill health" id="healthBar" style="width:100%"></div>
                    <span class="bar-label" id="healthLabel">100</span>
                </div>
                <div class="bar-container">
                    <div class="bar-fill armor" id="armorBar" style="width:0%"></div>
                    <span class="bar-label" id="armorLabel">0 <span class="armor-rarity" id="armorRarityLabel"></span></span>
                </div>
            </div>
            <div id="rightStats">
                <span class="stat-text" id="killDisplay">💀 0</span>
                <span class="stat-text" id="waveDisplay">🌊 第 1 波</span>
                <span class="stat-text" id="zombieCount" style="color:#ff6644;font-size:12px;">🧟 0</span>
                <span class="stat-text" id="vehicleStatus" style="color:#88ddff;font-size:11px;"></span>
            </div>
        </div>

        <div id="crosshair">✚<div class="dot"></div></div>
        <div id="weaponSlots"></div>

        <div id="bottomBar">
            <span id="weaponName">🔫 手槍 <span id="weaponRarity"></span></span>
            <span id="ammoDisplay">12 <span class="max">/ 12</span></span>
            <span id="reloadHint" style="display:none;">🔄 換彈中</span>
        </div>

        <div id="pickupHint">📦 按 E 拾取</div>
        <div id="controls">🖱️ 點擊鎖定 · WASD移動 · 1-5切換武器 · R換彈 · E拾取 · Tab背包 · F進入/離開載具</div>
        <div id="airdropIndicator">📦 空投來了!</div>
        <div class="hurt-flash" id="hurtFlash"></div>

        <div id="minimap"><canvas id="minimapCanvas" width="140" height="140"></canvas></div>
        <div id="vehicleHUD">🚗 載具血量: <span id="vehicleHealth">100</span>%</div>

        <div id="lockHint">
            <span class="icon">🎯</span>
            點擊畫面開始<br>
            <span style="font-size:14px;color:rgba(255,255,255,0.3);">滑鼠鎖定後即可遊玩</span>
        </div>
    </div>

    <div id="inventory">
        <h2>🎒 背包</h2>
        <div id="invItems"></div>
        <button id="invClose">關閉 (Tab)</button>
    </div>

    <div id="gameover">
        <h1>💀 你死了</h1>
        <p>擊殺數: <span id="finalKills">0</span></p>
        <p>存活波數: <span id="finalWave">0</span></p>
        <button id="restartBtn">🔄 重新開始</button>
    </div>

    <!-- ===== Three.js ===== -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        // ============================================================
        //  防護程式碼
        // ============================================================
        document.addEventListener('contextmenu', e => e.preventDefault());

        document.addEventListener('keydown', e => {
            if (e.key === 'F12' || e.keyCode === 123) { e.preventDefault();
                e.stopPropagation(); return false; }
            if (e.ctrlKey && e.shiftKey && ['I', 'J', 'C', 'K'].includes(e.key.toUpperCase())) { e.preventDefault();
                e.stopPropagation(); return false; }
            if ((e.ctrlKey || e.metaKey) && e.key.toUpperCase() === 'U') { e.preventDefault();
                e.stopPropagation(); return false; }
            if (e.metaKey && e.altKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) { e.preventDefault();
                e.stopPropagation(); return false; }
            if (e.ctrlKey && e.shiftKey && e.key.toUpperCase() === 'R') { e.preventDefault();
                e.stopPropagation(); return false; }
            if (e.ctrlKey && e.key.toUpperCase() === 'R') { e.preventDefault();
                e.stopPropagation(); return false; }
        });

        (function() {
            setInterval(() => {
                try {
                    (function() { return false; })['constructor']('debugger')();
                } catch (e) {}
            }, 500);
        })();

        // ============================================================
        //  導入 Three.js
        // ============================================================
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

        // ============================================================
        //  0. 滑鼠鎖定 (修復版)
        // ============================================================
        let audioCtx = null;
        let isLocked = false;
        const lockHint = document.getElementById('lockHint');

        function initAudio() {
            if (!audioCtx) {
                try {
                    audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                } catch (e) {}
            }
            if (audioCtx && audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        document.addEventListener('click', () => {
            initAudio();
            if (!isLocked && !isDead && !inventoryOpen) {
                renderer.domElement.requestPointerLock();
            }
            if (isLocked && !isDead && !inventoryOpen) {
                shoot();
            }
        });

        document.addEventListener('pointerlockchange', () => {
            const isNowLocked = document.pointerLockElement === renderer.domElement;
            isLocked = isNowLocked;
            if (isNowLocked) {
                lockHint.classList.add('hidden');
                document.body.style.cursor = 'none';
            } else {
                if (!isDead) {
                    lockHint.classList.remove('hidden');
                }
                document.body.style.cursor = 'default';
            }
        });

        // ============================================================
        //  1. 場景
        // ============================================================
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0a0a18);
        scene.fog = new THREE.FogExp2(0x0a0a18, 0.003);

        const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 120);
        camera.position.set(0, 1.8, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.0;
        document.body.prepend(renderer.domElement);

        const composer = new EffectComposer(renderer);
        composer.addPass(new RenderPass(scene, camera));
        const bloom = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            0.15, 0.1, 0.05
        );
        composer.addPass(bloom);
        composer.addPass(new OutputPass());

        // ============================================================
        //  2. 燈光
        // ============================================================
        const ambient = new THREE.AmbientLight(0x223366, 0.2);
        scene.add(ambient);

        const mainLight = new THREE.DirectionalLight(0xffddaa, 2.0);
        mainLight.position.set(15, 30, 10);
        mainLight.castShadow = true;
        mainLight.shadow.mapSize.width = 4096;
        mainLight.shadow.mapSize.height = 4096;
        mainLight.shadow.camera.near = 0.5;
        mainLight.shadow.camera.far = 100;
        mainLight.shadow.camera.left = -50;
        mainLight.shadow.camera.right = 50;
        mainLight.shadow.camera.top = 50;
        mainLight.shadow.camera.bottom = -50;
        scene.add(mainLight);

        const fillLight = new THREE.DirectionalLight(0x4488ff, 0.15);
        fillLight.position.set(-15, 10, -15);
        scene.add(fillLight);

        // ============================================================
        //  3. 地面
        // ============================================================
        function createGroundTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#2a2a2e';
            ctx.fillRect(0, 0, 512, 512);
            for (let i = 0; i < 10000; i++) {
                const x = Math.random() * 512,
                    y = Math.random() * 512;
                const g = 60 + Math.random() * 80;
                ctx.fillStyle = `rgb(${g},${g},${g+10})`;
                ctx.fillRect(x, y, 1 + Math.random() * 2, 1 + Math.random() * 2);
            }
            // 道路標線
            ctx.strokeStyle = 'rgba(80,80,90,0.12)';
            ctx.lineWidth = 2;
            for (let i = 0; i < 30; i++) {
                const x = Math.random() * 512;
                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x + (Math.random() - 0.5) * 150, 512);
                ctx.stroke();
            }
            const tex = new THREE.CanvasTexture(canvas);
            tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(40, 40);
            tex.anisotropy = 8;
            return tex;
        }

        const ground = new THREE.Mesh(
            new THREE.CircleGeometry(70, 80),
            new THREE.MeshStandardMaterial({
                map: createGroundTexture(),
                roughness: 0.9,
                metalness: 0.05,
            })
        );
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -0.05;
        ground.receiveShadow = true;
        scene.add(ground);

        // ============================================================
        //  4. 建築物碰撞系統 (修復穿牆)
        // ============================================================
        const buildings = [];

        // 碰撞檢測函數
        function isInsideBuilding(x, z, margin = 0.4) {
            for (const b of buildings) {
                if (x > b.minX + margin && x < b.maxX - margin &&
                    z > b.minZ + margin && z < b.maxZ - margin) {
                    return b;
                }
            }
            return null;
        }

        function isPointInBuilding(x, z, margin = 0.2) {
            for (const b of buildings) {
                if (x > b.minX + margin && x < b.maxX - margin &&
                    z > b.minZ + margin && z < b.maxZ - margin) {
                    return true;
                }
            }
            return false;
        }

        // 創建建築物函數 (支援高樓)
        function createBuilding(x, z, w, d, h, color = 0x445566, hasDoor = true, floorCount = 1) {
            const g = new THREE.Group();
            const mat = new THREE.MeshStandardMaterial({ color, roughness: 0.6, metalness: 0.2 });
            const wall = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
            wall.position.y = h / 2;
            wall.castShadow = true;
            wall.receiveShadow = true;
            g.add(wall);

            // 窗戶 (樓層越多窗戶越多)
            const winMat = new THREE.MeshStandardMaterial({
                color: 0x88ccff,
                emissive: 0x88ccff,
                emissiveIntensity: 0.08,
                transparent: true,
                opacity: 0.25,
            });
            const floors = Math.max(1, Math.floor(h / 2.5));
            for (let f = 0; f < floors; f++) {
                const wy = 0.8 + f * (h / floors);
                for (let wx of [-w * 0.3, w * 0.3]) {
                    const win = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 0.5), winMat);
                    win.position.set(wx, wy, d / 2 + 0.01);
                    g.add(win);
                    const win2 = win.clone();
                    win2.position.z = -d / 2 - 0.01;
                    win2.rotation.y = Math.PI;
                    g.add(win2);
                }
            }

            // 屋頂
            const roofMat = new THREE.MeshStandardMaterial({ color: 0x334455, roughness: 0.8 });
            const roof = new THREE.Mesh(new THREE.BoxGeometry(w + 0.2, 0.1, d + 0.2), roofMat);
            roof.position.y = h + 0.05;
            roof.castShadow = true;
            g.add(roof);

            // 大門 (可進入標記)
            if (hasDoor) {
                const doorMat = new THREE.MeshStandardMaterial({ color: 0x2a1a0a, roughness: 0.9 });
                const door = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 1.2), doorMat);
                door.position.set(0, 0.6, d / 2 + 0.01);
                g.add(door);
                const glow = new THREE.PointLight(0xff8844, 0.15, 2);
                glow.position.set(0, 0.6, d / 2 + 0.5);
                g.add(glow);
            }

            g.position.set(x, 0, z);
            scene.add(g);

            // 儲存碰撞資料 (稍微縮小碰撞範圍讓玩家可以靠近牆壁)
            const margin = 0.3;
            buildings.push({
                mesh: g,
                x,
                z,
                w,
                d,
                h,
                minX: x - w / 2 - margin,
                maxX: x + w / 2 + margin,
                minZ: z - d / 2 - margin,
                maxZ: z + d / 2 + margin,
                enterable: hasDoor,
                floorCount: floors,
            });
            return g;
        }

        function getArmorReduction() {
            let total = 0;
            if (playerArmor.helmet.equipped && playerArmor.helmet.durability > 0) {
                total += ARMOR_RARITIES[playerArmor.helmet.rarity].dmgReduction;
            }
            if (playerArmor.vest.equipped && playerArmor.vest.durability > 0) {
                total += ARMOR_RARITIES[playerArmor.vest.rarity].dmgReduction;
            }
            return Math.min(total, 0.6);
        }

        function applyDamageToArmor(damage) {
            let remaining = damage;
            if (playerArmor.vest.equipped && playerArmor.vest.durability > 0) {
                const absorbed = Math.min(remaining * 0.6, playerArmor.vest.durability);
                playerArmor.vest.durability -= absorbed;
                remaining -= absorbed;
                if (playerArmor.vest.durability < 0) playerArmor.vest.durability = 0;
            }
            if (playerArmor.helmet.equipped && playerArmor.helmet.durability > 0 && remaining > 0) {
                const absorbed2 = Math.min(remaining * 0.3, playerArmor.helmet.durability);
                playerArmor.helmet.durability -= absorbed2;
                remaining -= absorbed2;
                if (playerArmor.helmet.durability < 0) playerArmor.helmet.durability = 0;
            }
            return Math.max(0, remaining);
        }

        function playShootSound(volume = 0.25) {
            try {
                if (!audioCtx) return;
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(800, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, audioCtx.currentTime + 0.05);
                gain.gain.setValueAtTime(volume, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.05);
                osc.start(audioCtx.currentTime);
                osc.stop(audioCtx.currentTime + 0.05);
                const bufferSize = audioCtx.sampleRate * 0.03;
                const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
                const data = buffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.exp(-i / bufferSize * 5);
                }
                const noise = audioCtx.createBufferSource();
                const ng = audioCtx.createGain();
                noise.buffer = buffer;
                noise.connect(ng);
                ng.connect(audioCtx.destination);
                ng.gain.setValueAtTime(volume * 0.5, audioCtx.currentTime);
                ng.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
                noise.start(audioCtx.currentTime);
            } catch (e) {}
        }

            const headlight = new THREE.Mesh(new THREE.SphereGeometry(0.06, 6, 6), lightMat);
            headlight.position.set(0.9, 0.25, -0.35);

            headlight2.position.z = 0.35;

                opacity: 0.15,

            const glowRing = new THREE.Mesh(new THREE.RingGeometry(0.9, 1.2, 16), glowMat);

            const vehicleData = {

        function spawnInitialVehicles() {
            const positions = [
                [-10, -8, 0.5],
                [10, -7, -0.8],
                [-8, 10, 1.2],
                [9, 9, -0.5],
                [2, -12, 0],
                [-12, 5, 2.0],
                [12, 6, -1.5],
                [0, 14, 0.3],
            ];
            for (const [x, z, rot] of positions) {
                if (Math.random() < 0.6 && !isPointInBuilding(x, z, 1)) {
                    createVehicle(x, z, rot);
                }
            }
        }
        spawnInitialVehicles();

        function vehicleShoot() {
            if (!isInVehicle || !currentVehicle) return;
            const v = currentVehicle;
            const now = performance.now();
            if (now - v.turretCooldown < 150) return;
            v.turretCooldown = now;

            const origin = v.mesh.position.clone();
            origin.y = 0.8;
            const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            dir.y = 0;
            dir.normalize();

            let hitZombie = null;
            let hitDist = Infinity;
            for (const z of zombies) {
                const zPos = z.mesh.position.clone();
                zPos.y = 0.8;
                const toZ = zPos.clone().sub(origin);
                const proj = toZ.dot(dir);
                if (proj < 0 || proj > 50) continue;
                const closest = origin.clone().add(dir.clone().multiplyScalar(proj));
                const dist = closest.distanceTo(zPos);
                if (dist < 1.0 && proj < hitDist) {
                    hitDist = proj;
                    hitZombie = z;
                }
            }

            if (hitZombie) {
                const dmg = v.turretDmg;
                hitZombie.health -= dmg;
                hitZombie.hitFlash = 0.15;
                emitParticles(hitZombie.mesh.position.clone().add(new THREE.Vector3(0, 0.8, 0)), 20, [1, 0.5, 0.1]);
                showDamagePopup(hitZombie.mesh.position.clone().add(new THREE.Vector3(0, 0.8, 0)), dmg, false);

                if (hitZombie.health <= 0) {
                    killZombie(hitZombie);
                    killCount++;
                    if (Math.random() < hitZombie.def.dropRate) {
                        const dp = hitZombie.mesh.position.clone();
                        dp.y = 0.15;
                        spawnDrop(dp);
                    }
                    setTimeout(() => {
                        if (zombies.length < 20 + wave * 2) spawnZombie();
                    }, 500 + Math.random() * 1500);
                    updateUI();
                }
            }

            playShootSound(0.15);
            emitParticles(origin.clone().add(dir.clone().multiplyScalar(1.5)), 10, [1, 0.8, 0.2]);
        }

        function enterVehicle() {
            if (isInVehicle) {
                leaveVehicle();
                return;
            }

            let nearest = null;
            let nearDist = 3.0;
            for (const v of vehicles) {
                if (v.occupied) continue;
                const dist = camera.position.distanceTo(v.mesh.position);
                if (dist < nearDist) {
                    nearDist = dist;
                    nearest = v;
                }
            }

            if (nearest) {
                isInVehicle = true;
                currentVehicle = nearest;
                nearest.occupied = true;
                camera.position.set(nearest.mesh.position.x, 0.8, nearest.mesh.position.z);
                camera.rotation.order = 'YXZ';
                document.getElementById('vehicleHUD').classList.add('show');
                document.getElementById('vehicleStatus').textContent = '🚗 駕駛中';
                playVehicleSound();
                updateUI();
                showPickupHint('🚗 已進入載具! 按 F 離開 | E 機槍射擊');
            } else {
                showPickupHint('❌ 附近沒有可用的載具');
            }
        }

        function leaveVehicle() {
            if (!isInVehicle || !currentVehicle) return;
            isInVehicle = false;
            currentVehicle.occupied = false;
            const pos = currentVehicle.mesh.position.clone();
            pos.x += 1.5;
            pos.z += 1.5;
            camera.position.set(pos.x, 1.8, pos.z);
            currentVehicle = null;
            document.getElementById('vehicleHUD').classList.remove('show');
            document.getElementById('vehicleStatus').textContent = '';
            updateUI();
            showPickupHint('🚶 已離開載具');
        }

        function moveVehicle(delta) {
            if (!isInVehicle || !currentVehicle) return;
            const v = currentVehicle;
            const speed = v.speed;

            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
            forward.y = 0;
            right.y = 0;
            forward.normalize();
            right.normalize();

            const move = new THREE.Vector3();
            if (keys.w) move.add(forward);
            if (keys.s) move.sub(forward);
            if (keys.a) move.sub(right);
            if (keys.d) move.add(right);

            if (move.length() > 0) {
                move.normalize().multiplyScalar(speed * delta);
                const newX = v.mesh.position.x + move.x;
                const newZ = v.mesh.position.z + move.z;
                // 載具碰撞檢測 (不能進入建築物)
                if (!isPointInBuilding(newX, newZ, 0.8)) {
                    const dist = Math.sqrt(newX * newX + newZ * newZ);
                    if (dist < 55) {
                        v.mesh.position.x = newX;
                        v.mesh.position.z = newZ;
                        camera.position.x = v.mesh.position.x;
                        camera.position.z = v.mesh.position.z;
                        camera.position.y = 0.8;
                        v.mesh.rotation.y = Math.atan2(move.x, move.z);
                    }
                }
            }
        }

        // ============================================================
        //  12. 殭屍系統 (加入碰撞檢測防止穿牆)
        // ============================================================
        const ZOMBIE_TYPES = {
            normal: { name: '普通', color: 0x7a8a7a, speed: 0.4, health: 3, damage: 8, size: 1.0, score: 10,
            dropRate: 0.5 },
            runner: { name: '跑者', color: 0x8a6a4a, speed: 0.9, health: 2, damage: 6, size: 0.9, score: 15,
            dropRate: 0.4 },
            fat: { name: '胖子', color: 0x5a7a4a, speed: 0.2, health: 8, damage: 20, size: 1.4, score: 25, dropRate: 0.7,
                explosive: true },
            tank: { name: '坦克', color: 0x4a4a5a, speed: 0.25, health: 20, damage: 15, size: 1.6, score: 40,
            dropRate: 0.9, armored: true },
        };

        let zombies = [];
        let killCount = 0;
        let wave = 1;
        let playerHealth = 100;
        const maxHealth = 100;
        let isDead = false;
        let inventoryOpen = false;

        function createZombie(posX, posZ, type = null) {
            // 確保殭屍不在建築物內生成
            if (isPointInBuilding(posX, posZ, 0.5)) {
                posX += (Math.random() - 0.5) * 4;
                posZ += (Math.random() - 0.5) * 4;
                if (isPointInBuilding(posX, posZ, 0.5)) {
                    // 如果還在建築物內，重新生成位置
                    const angle = Math.random() * Math.PI * 2;
                    const radius = 3 + Math.random() * 8;
                    posX = camera.position.x + Math.cos(angle) * radius;
                    posZ = camera.position.z + Math.sin(angle) * radius;
                    if (isPointInBuilding(posX, posZ, 0.5)) {
                        posX = camera.position.x + (Math.random() - 0.5) * 10;
                        posZ = camera.position.z + (Math.random() - 0.5) * 10;
                    }
                }
            }

            if (!type) {
                const types = ['normal', 'normal', 'normal', 'runner', 'fat'];
                if (wave > 3) types.push('tank');
                if (wave > 5) types.push('tank', 'fat');
                type = types[Math.floor(Math.random() * types.length)];
            }
            const def = ZOMBIE_TYPES[type];
            const group = new THREE.Group();
            const scale = def.size;

            const skinMat = new THREE.MeshStandardMaterial({ color: def.color, roughness: 0.7, metalness: 0 });
            const clothMat = new THREE.MeshStandardMaterial({ color: 0x3a3a2a, roughness: 0.9 });
            const pantsMat = new THREE.MeshStandardMaterial({ color: 0x2a2a3a, roughness: 0.9 });

            const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.35 * scale, 0.45 * scale, 0.9 * scale, 10),

            torso.position.y = 0.85 * scale;

            torso.receiveShadow = true;
            group.add(torso);

            const head = new THREE.Mesh(new THREE.SphereGeometry(0.28 * scale, 12, 12), skinMat);
            head.position.y = 1.45 * scale;

            head.castShadow = true;

            const eyeMat = new THREE.MeshStandardMaterial({ color: 0xff2200, emissive: 0xff2200, emissiveIntensity: 0.3 });
            const eL = new THREE.Mesh(new THREE.SphereGeometry(0.06 * scale, 8, 8), eyeMat);
            eL.position.set(-0.14 * scale, 1.5 * scale, 0.26 * scale);
            group.add(eL);
            const eR = new THREE.Mesh(new THREE.SphereGeometry(0.06 * scale, 8, 8), eyeMat);
            eR.position.set(0.14 * scale, 1.5 * scale, 0.26 * scale);
            group.add(eR);

            const armMat = new THREE.MeshStandardMaterial({ color: def.color, roughness: 0.8 });
            const aL = new THREE.Mesh(new THREE.CylinderGeometry(0.06 * scale, 0.07 * scale, 0.7 * scale, 6), armMat);
            aL.position.set(-0.42 * scale, 1.0 * scale, 0);
            aL.rotation.z = 0.2;
            aL.rotation.x = -0.3;
            aL.castShadow = true;
            group.add(aL);
            const aR = new THREE.Mesh(new THREE.CylinderGeometry(0.06 * scale, 0.07 * scale, 0.75 * scale, 6), armMat);
            aR.position.set(0.42 * scale, 0.95 * scale, 0);
            aR.rotation.z = -0.1;
            aR.rotation.x = 0.5;
            aR.castShadow = true;
            group.add(aR);

            const legMat = new THREE.MeshStandardMaterial({ color: 0x2a2a3a, roughness: 0.9 });
            const lL = new THREE.Mesh(new THREE.CylinderGeometry(0.08 * scale, 0.1 * scale, 0.6 * scale, 6), legMat);
            lL.position.set(-0.15 * scale, 0.25 * scale, 0);
            lL.castShadow = true;
            group.add(lL);
            const lR = new THREE.Mesh(new THREE.CylinderGeometry(0.08 * scale, 0.1 * scale, 0.6 * scale, 6), legMat);

        function spawnZombie() {
            const angle = Math.random() * Math.PI * 2;
            const radius = 6 + Math.random() * 14;
            const x = camera.position.x + Math.cos(angle) * radius;
            const z = camera.position.z + Math.sin(angle) * radius;
            // 檢查是否在建築物內
            if (isPointInBuilding(x, z, 0.5)) {
                // 調整位置
                spawnZombie();
                return;
            }
            createZombie(x, z);
        }

        function killZombie(z) {
            playZombieDeathSound();
            if (z.explosive) {
                const pos = z.mesh.position.clone();
                pos.y = 0.5;
                emitParticles(pos, 80, [1, 0.4, 0], 2.5);
                emitParticles(pos, 40, [1, 0.8, 0.2], 1.5);
                emitParticles(pos, 30, [0.8, 0.2, 0.1], 1.0);
                playExplosionSound();
                const boomPos = z.mesh.position;
                for (const other of zombies) {
                    if (other === z) continue;
                    const dist = boomPos.distanceTo(other.mesh.position);
                    if (dist < 3.5) {
                        other.health -= 15;
                        other.hitFlash = 0.2;
                        if (other.health <= 0) {
                            killZombie(other);
                            killCount++;
                            if (Math.random() < other.def.dropRate) {
                                const dp = other.mesh.position.clone();
                                dp.y = 0.15;
                                spawnDrop(dp);
                            }
                        }
                    }
                }
                for (const v of vehicles) {
                    const dist = boomPos.distanceTo(v.mesh.position);
                    if (dist < 3) {
                        v.hp -= 30;
                        emitParticles(v.mesh.position.clone().add(new THREE.Vector3(0, 0.5, 0)), 20, [1, 0.5, 0.1]);
                        if (v.hp <= 0) {
                            emitParticles(v.mesh.position.clone().add(new THREE.Vector3(0, 0.5, 0)), 60, [1, 0.3, 0],
                            2);
                            playExplosionSound();
                            scene.remove(v.mesh);
                            const idx = vehicles.indexOf(v);
                            if (idx > -1) vehicles.splice(idx, 1);
                            if (currentVehicle === v) {
                                leaveVehicle();
                            }
                        }
                    }
                }
            }

            emitParticles(z.mesh.position.clone().add(new THREE.Vector3(0, 0.6, 0)), 40, [0.6, 0.2, 0.1]);
            scene.remove(z.mesh);
            const idx = zombies.indexOf(z);
            if (idx > -1) zombies.splice(idx, 1);
        }

        // ============================================================
        //  13. 粒子系統
        // ============================================================
        const particleCount = 800;
        const pGeo = new THREE.BufferGeometry();
        const pPos = new Float32Array(particleCount * 3);
        const pCol = new Float32Array(particleCount * 3);
        const pSize = new Float32Array(particleCount);
        for (let i = 0; i < particleCount; i++) {
            pPos[i * 3 + 1] = -1000;
            pCol[i * 3] = 1;
            pCol[i * 3 + 1] = 0.3;
            pCol[i * 3 + 2] = 0.1;
            pSize[i] = 0.05 + Math.random() * 0.15;
        }
        pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
        pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
        pGeo.setAttribute('size', new THREE.BufferAttribute(pSize, 1));

        const pMat = new THREE.PointsMaterial({
            size: 0.15,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            transparent: true,
            opacity: 0.9,
            depthWrite: false,
        });
        const particleSystem = new THREE.Points(pGeo, pMat);
        scene.add(particleSystem);

        let particleList = [];

        function emitParticles(origin, count = 30, color = [1, 0.3, 0.1], speedMult = 1) {
            const pos = particleSystem.geometry.attributes.position.array;
            const col = particleSystem.geometry.attributes.color.array;
            let emitted = 0;
            for (let i = 0; i < particleCount && emitted < count; i++) {
                if (pos[i * 3 + 1] < -500) {
                    pos[i * 3] = origin.x + (Math.random() - 0.5) * 0.5;
                    pos[i * 3 + 1] = origin.y + (Math.random() - 0.5) * 0.5;
                    pos[i * 3 + 2] = origin.z + (Math.random() - 0.5) * 0.5;
                    const speed = (0.3 + Math.random() * 3.0) * speedMult;
                    const dir = new THREE.Vector3(
                        (Math.random() - 0.5) * 2,
                        Math.random() * 3,
                        (Math.random() - 0.5) * 2
                    ).normalize().multiplyScalar(speed);
                    particleList.push({
                        idx: i,
                        vel: dir,
                        life: 0.3 + Math.random() * 1.0,
                        maxLife: 0.3 + Math.random() * 1.0,
                    });
                    col[i * 3] = color[0];
                    col[i * 3 + 1] = color[1] * (0.3 + Math.random() * 0.7);
                    col[i * 3 + 2] = color[2] * (0.2 + Math.random() * 0.5);
                    emitted++;
                }
            }
            particleSystem.geometry.attributes.position.needsUpdate = true;
            particleSystem.geometry.attributes.color.needsUpdate = true;
        }

        function renderInventory() {
            if (!inventoryOpen) return;
            if (inventory.items.length === 0) {
                invItemsEl.innerHTML = '<div class="inv-empty">🔄 背包是空的</div>';
                return;
            }
            invItemsEl.innerHTML = inventory.items.map((item, idx) =>
                `<div class="inv-item">
                        <span class="name">${item.icon} ${item.name}</span>
                        <span class="qty">×${item.qty || 1}</span>
                        <button class="use-btn" data-idx="${idx}">使用</button>
                    </div>`
            ).join('');

            invItemsEl.querySelectorAll('.use-btn').forEach(btn => {

                });

        // ============================================================
        //  15. 醫療品使用
        // ============================================================
        function useMedicalItem(idx) {
            const item = inventory.items[idx];
            if (!item) return;
            const info = MEDICAL_ITEMS[item.id];
            if (!info) return;

            if (info.heal > 0) {
                const healed = Math.min(info.heal, maxHealth - playerHealth);
                playerHealth += healed;
                showPickupHint(`❤️ +${healed} 生命 (${item.name})`);
                playPickupSound();
            }
            if (info.armorRepair > 0) {
                let repaired = 0;
                const remaining = info.armorRepair;
                const vestNeed = playerArmor.vest.maxDurability - playerArmor.vest.durability;
                if (vestNeed > 0) {
                    const fix = Math.min(remaining, vestNeed);
                    playerArmor.vest.durability += fix;
                    repaired += fix;
                }
                const helmetNeed = playerArmor.helmet.maxDurability - playerArmor.helmet.durability;
                if (repaired < remaining && helmetNeed > 0) {
                    const fix = Math.min(remaining - repaired, helmetNeed);
                    playerArmor.helmet.durability += fix;
                    repaired += fix;
                }
                showPickupHint(`🛡️ +${repaired} 護甲 (${item.name})`);
                playPickupSound();
            }

            item.qty = (item.qty || 1) - 1;
            if (item.qty <= 0) {
                inventory.items.splice(idx, 1);
            }
            updateUI();
            renderInventory();
        }

        // ============================================================
        //  16. 拾取系統
        // ============================================================
        function pickupItem() {
            if (!nearDrop || !nearDrop.alive) return;
            const item = nearDrop;
            const data = item.data;

            if (item.type === 'health' || data?.type === 'medical') {
                const id = data?.itemId || 'bandage';
                const info = MEDICAL_ITEMS[id];
                if (info) {
                    const existing = inventory.items.find(i => i.id === id);
                    if (existing) {
                        existing.qty = (existing.qty || 1) + 1;
                    } else {
                        inventory.items.push({ id: id, name: info.name, icon: info.icon, qty: 1 });
                    }
                    showPickupHint(`📦 獲得 ${info.icon} ${info.name}`);
                    playPickupSound();
                }
            } else if (item.type === 'ammo' || data?.type === 'ammo') {
                const w = playerWeapons.find(w => w.id === data.weaponId);
                if (w) {
                    w.reserve += data.amount;
                    showPickupHint(`📦 +${data.amount} ${w.name}彈藥`);
                    playPickupSound();
                }
            } else if (item.type === 'weapon' || data?.type === 'weapon') {
                const wId = data.weaponId;
                const rarity = data.rarity || randomRarity();
                const def = WEAPON_DEFS[wId];
                const r = RARITIES[rarity];
                if (def) {
                    const existing = playerWeapons.find(w => w.id === wId);
                    if (existing) {
                        const currentRank = Object.keys(RARITIES).indexOf(existing.rarity);
                        const newRank = Object.keys(RARITIES).indexOf(rarity);
                        if (newRank > currentRank) {
                            existing.rarity = rarity;
                            existing.damage = Math.round(def.baseDamage * r.dmgMult);
                            existing.magSize = Math.round(def.baseMagSize * r.ammoMult);
                            existing.fireRate = Math.round(def.baseFireRate * r.fireRateMult);
                            existing.ammo = Math.min(existing.ammo, existing.magSize);
                            existing.reserve += Math.round(def.baseMagSize * r.ammoMult * 2);
                            existing.rarityLabel = r.label;
                            existing.rarityColor = r.color;
                            existing.stars = r.stars;
                            showPickupHint(`⬆️ ${def.name} 升級為 ${r.label}!`);
                            playPickupSound();
                        } else {
                            const amt = Math.round(def.baseMagSize * r.ammoMult * 2);
                            existing.reserve += amt;
                            showPickupHint(`📦 +${amt} ${def.name}彈藥`);
                            playPickupSound();
                        }
                    } else {
                        const newWeapon = {
                            id: wId,
                            def: def,
                            rarity: rarity,
                            damage: Math.round(def.baseDamage * r.dmgMult),
                            magSize: Math.round(def.baseMagSize * r.ammoMult),
                            fireRate: Math.round(def.baseFireRate * r.fireRateMult),
                            ammo: Math.round(def.baseMagSize * r.ammoMult),
                            reserve: Math.round(def.baseMagSize * r.ammoMult * 3),
                            reloadTime: def.reloadTime,
                            spread: def.spread,
                            auto: def.auto,
                            icon: def.icon,
                            pelletCount: def.pelletCount || 1,
                            name: def.name,
                            rarityLabel: r.label,
                            rarityColor: r.color,
                            stars: r.stars,
                        };
                        playerWeapons.push(newWeapon);
                        currentWeaponIndex = playerWeapons.length - 1;
                        showPickupHint(`🔫 獲得 ${r.stars} ${def.name} (${r.label})!`);
                        playPickupSound();
                    }
                }
            } else if (item.type === 'armor' || data?.type === 'armor') {
                const rarity = data.rarity || 'common';
                const amount = data.amount || 40;
                const rInfo = ARMOR_RARITIES[rarity];
                const hRank = Object.keys(ARMOR_RARITIES).indexOf(playerArmor.helmet.rarity);
                const vRank = Object.keys(ARMOR_RARITIES).indexOf(playerArmor.vest.rarity);
                const newRank = Object.keys(ARMOR_RARITIES).indexOf(rarity);

                if (newRank > hRank || newRank > vRank) {
                    if (hRank <= vRank && newRank > hRank) {
                        playerArmor.helmet.rarity = rarity;
                        playerArmor.helmet.maxDurability = rInfo.maxDurability;
                        playerArmor.helmet.durability = Math.min(playerArmor.helmet.durability + amount, rInfo
                        .maxDurability);
                        showPickupHint(`⬆️ 頭盔升級為 ${rInfo.stars} ${rInfo.label}!`);
                    } else if (newRank > vRank) {
                        playerArmor.vest.rarity = rarity;
                        playerArmor.vest.maxDurability = rInfo.maxDurability;
                        playerArmor.vest.durability = Math.min(playerArmor.vest.durability + amount, rInfo
                        .maxDurability);
                        showPickupHint(`⬆️ 背心升級為 ${rInfo.stars} ${rInfo.label}!`);
                    } else {
                        let repaired = 0;
                        const vestNeed = playerArmor.vest.maxDurability - playerArmor.vest.durability;
                        if (vestNeed > 0) {
                            const fix = Math.min(amount, vestNeed);
                            playerArmor.vest.durability += fix;
                            repaired += fix;
                        }
                        const helmetNeed = playerArmor.helmet.maxDurability - playerArmor.helmet.durability;
                        if (repaired < amount && helmetNeed > 0) {
                            const fix = Math.min(amount - repaired, helmetNeed);
                            playerArmor.helmet.durability += fix;
                            repaired += fix;
                        }
                        showPickupHint(`🛡️ +${repaired} 護甲`);
                    }
                } else {
                    let repaired = 0;
                    const vestNeed = playerArmor.vest.maxDurability - playerArmor.vest.durability;
                    if (vestNeed > 0) {
                        const fix = Math.min(amount, vestNeed);
                        playerArmor.vest.durability += fix;
                        repaired += fix;
                    }
                    const helmetNeed = playerArmor.helmet.maxDurability - playerArmor.helmet.durability;
                    if (repaired < amount && helmetNeed > 0) {
                        const fix = Math.min(amount - repaired, helmetNeed);
                        playerArmor.helmet.durability += fix;
                        repaired += fix;
                    }
                    showPickupHint(`🛡️ +${repaired} 護甲`);
                }
                playPickupSound();
            }

            scene.remove(item.mesh);
            if (item.glow) scene.remove(item.glow);
            item.alive = false;
            const idx = dropItems.indexOf(item);
            if (idx > -1) dropItems.splice(idx, 1);
            nearDrop = null;
            pickupHint.classList.remove('show');
            updateUI();
        }
