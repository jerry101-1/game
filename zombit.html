            const eyeMat = new THREE.MeshStandardMaterial({ color: 0xff2200, emissive: 0xff2200, emissiveIntensity: 0.3 });
            const eL = new THREE.Mesh(new THREE.SphereGeometry(0.06 * scale, 8, 8), eyeMat);
            eL.position.set(-0.14 * scale, 1.5 * scale, 0.26 * scale);
            group.add(eL);
            const eR = new THREE.Mesh(new THREE.SphereGeometry(0.06 * scale, 8, 8), eyeMat);
            eR.position.set(0.14 * scale, 1.5 * scale, 0.26 * scale);
            group.add(eR);

            // 手臂
            const armMat = new THREE.MeshStandardMaterial({ color: def.color, roughness: 0.8 });
            const aL = new THREE.Mesh(new THREE.CylinderGeometry(0.06 * scale, 0.07 * scale, 0.7 * scale, 6), armMat);
            aL.position.set(-0.42 * scale, 1.0 * scale, 0);
            aL.rotation.z = 0.2;
            aL.rotation.x = -0.3;
            aL.castShadow = true;
            group.add(aL);
            const aR = new THREE.Mesh(new THREE.CylinderGeometry(0.06 * scale, 0.07 * scale, 0.75 * scale, 6), armMat);
            aR.position.set(0.42 * scale, 0.95 * scale, 0);
            aR.rotation.z = -0.1;
            aR.rotation.x = 0.5;
            aR.castShadow = true;
            group.add(aR);

            // 腿
            const legMat = new THREE.MeshStandardMaterial({ color: 0x2a2a3a, roughness: 0.9 });
            const lL = new THREE.Mesh(new THREE.CylinderGeometry(0.08 * scale, 0.1 * scale, 0.6 * scale, 6), legMat);
            lL.position.set(-0.15 * scale, 0.25 * scale, 0);
            lL.castShadow = true;
            group.add(lL);
            const lR = new THREE.Mesh(new THREE.CylinderGeometry(0.08 * scale, 0.1 * scale, 0.6 * scale, 6), legMat);
            lR.position.set(0.15 * scale, 0.25 * scale, 0);
            lR.castShadow = true;
            group.add(lR);

            // 坦克有護甲標記
            if (def.armored) {
                const armorMat = new THREE.MeshStandardMaterial({ color: 0x888899, roughness: 0.3, metalness: 0.7 });
                const plate = new THREE.Mesh(new THREE.BoxGeometry(0.5 * scale, 0.3 * scale, 0.05 * scale), armorMat);
                plate.position.set(0, 0.85 * scale, 0.4 * scale);
                group.add(plate);
                const plate2 = plate.clone();
                plate2.position.z = -0.4 * scale;
                group.add(plate2);
            }

            // 胖子有爆炸標記
            if (def.explosive) {
                const glowMat = new THREE.MeshStandardMaterial({
                    color: 0xff4400,
                    emissive: 0xff4400,
                    emissiveIntensity: 0.2,
                    transparent: true,
                    opacity: 0.3,
                });
                const glow = new THREE.Mesh(new THREE.SphereGeometry(0.5 * scale, 8, 8), glowMat);
                glow.position.y = 0.85 * scale;
                group.add(glow);
            }

            group.position.set(posX, 0, posZ);
            group.rotation.y = Math.random() * Math.PI * 2;

            const zombieData = {
                mesh: group,
                type: type,
                def: def,
                health: def.health + Math.floor(wave / 3),
                maxHealth: def.health + Math.floor(wave / 3),
                speed: def.speed + wave * 0.01,
                damage: def.damage + Math.floor(wave / 2),
                hitFlash: 0,
                attackCooldown: 0,
                wobble: Math.random() * 100,
                score: def.score,
                explosive: def.explosive || false,
                armored: def.armored || false,
            };

            scene.add(group);
            zombies.push(zombieData);
            return zombieData;
        }

        function spawnZombie() {
            const angle = Math.random() * Math.PI * 2;
            const radius = 6 + Math.random() * 14;
            const x = camera.position.x + Math.cos(angle) * radius;
            const z = camera.position.z + Math.sin(angle) * radius;
            // 檢查是否在建築物內
            let inside = false;
            for (const b of buildings) {
                if (x > b.minX && x < b.maxX && z > b.minZ && z < b.maxZ) {
                    inside = true;
                    break;
                }
            }
            if (inside) {
                // 重新生成
                spawnZombie();
                return;
            }
            createZombie(x, z);
        }

        // 初始殭屍
        for (let i = 0; i < 8; i++) spawnZombie();

        // ============================================================
        //  11. 粒子系統
        // ============================================================
        const particleCount = 600;
        const pGeo = new THREE.BufferGeometry();
        const pPos = new Float32Array(particleCount * 3);
        const pCol = new Float32Array(particleCount * 3);
        const pSize = new Float32Array(particleCount);
        for (let i = 0; i < particleCount; i++) {
            pPos[i * 3 + 1] = -1000;
            pCol[i * 3] = 1;
            pCol[i * 3 + 1] = 0.3;
            pCol[i * 3 + 2] = 0.1;
            pSize[i] = 0.05 + Math.random() * 0.12;
        }
        pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
        pGeo.setAttribute('color', new THREE.BufferAttribute(pCol, 3));
        pGeo.setAttribute('size', new THREE.BufferAttribute(pSize, 1));

        const pMat = new THREE.PointsMaterial({
            size: 0.15,
            vertexColors: true,
            blending: THREE.AdditiveBlending,
            transparent: true,
            opacity: 0.8,
            depthWrite: false,
        });
        const particleSystem = new THREE.Points(pGeo, pMat);
        scene.add(particleSystem);

        let particleList = [];

        function emitParticles(origin, count = 30, color = [1, 0.3, 0.1], speedMult = 1) {
            const pos = particleSystem.geometry.attributes.position.array;
            const col = particleSystem.geometry.attributes.color.array;
            let emitted = 0;
            for (let i = 0; i < particleCount && emitted < count; i++) {
                if (pos[i * 3 + 1] < -500) {
                    pos[i * 3] = origin.x + (Math.random() - 0.5) * 0.5;
                    pos[i * 3 + 1] = origin.y + (Math.random() - 0.5) * 0.5;
                    pos[i * 3 + 2] = origin.z + (Math.random() - 0.5) * 0.5;
                    const speed = (0.5 + Math.random() * 2.5) * speedMult;
                    const dir = new THREE.Vector3(
                        (Math.random() - 0.5) * 2,
                        Math.random() * 2.5,
                        (Math.random() - 0.5) * 2
                    ).normalize().multiplyScalar(speed);
                    particleList.push({
                        idx: i,
                        vel: dir,
                        life: 0.3 + Math.random() * 0.8,
                        maxLife: 0.3 + Math.random() * 0.8,
                    });
                    col[i * 3] = color[0];
                    col[i * 3 + 1] = color[1] * (0.4 + Math.random() * 0.6);
                    col[i * 3 + 2] = color[2] * (0.3 + Math.random() * 0.4);
                    emitted++;
                }
            }
            particleSystem.geometry.attributes.position.needsUpdate = true;
            particleSystem.geometry.attributes.color.needsUpdate = true;
        }

        // ============================================================
        //  12. UI 更新
        // ============================================================
        const healthBar = document.getElementById('healthBar');
        const healthLabel = document.getElementById('healthLabel');
        const armorBar = document.getElementById('armorBar');
        const armorLabel = document.getElementById('armorLabel');
        const killDisplay = document.getElementById('killDisplay');
        const waveDisplay = document.getElementById('waveDisplay');
        const zombieCountEl = document.getElementById('zombieCount');
        const weaponNameEl = document.getElementById('weaponName');
        const weaponRarityEl = document.getElementById('weaponRarity');
        const ammoDisplayEl = document.getElementById('ammoDisplay');
        const reloadHintEl = document.getElementById('reloadHint');
        const weaponSlotsEl = document.getElementById('weaponSlots');
        const pickupHint = document.getElementById('pickupHint');
        const hurtFlash = document.getElementById('hurtFlash');
        const airdropIndicator = document.getElementById('airdropIndicator');
        const inventoryEl = document.getElementById('inventory');
        const invItemsEl = document.getElementById('invItems');

        let inventoryOpen = false;

        function updateUI() {
            // 血量
            const hpPct = Math.max(0, (playerHealth / maxHealth) * 100);
            healthBar.style.width = hpPct + '%';
            healthLabel.textContent = Math.round(playerHealth);

            // 護甲
            const totalArmor = armor.helmet.durability + armor.vest.durability;
            const maxArmor = armor.helmet.maxDurability + armor.vest.maxDurability;
            const armorPct = Math.max(0, (totalArmor / maxArmor) * 100);
            armorBar.style.width = armorPct + '%';
            armorLabel.textContent = Math.round(totalArmor);

            killDisplay.textContent = `💀 ${killCount}`;
            waveDisplay.textContent = `🌊 第 ${wave} 波`;
            zombieCountEl.textContent = `🧟 ${zombies.length}`;

            // 武器
            const w = getCurrentWeapon();
            if (w) {
                weaponNameEl.innerHTML = `${w.icon} ${w.name} <span id="weaponRarity" style="color:${w.rarityColor}">${w.stars} ${w.rarityLabel}</span>`;
                ammoDisplayEl.innerHTML = `${w.ammo} <span class="max">/ ${w.magSize}</span>`;
                reloadHintEl.style.display = isReloading ? 'inline' : 'none';
            }

            // 武器快捷列
            weaponSlotsEl.innerHTML = playerWeapons.map((w, i) => `
                    <div class="slot ${i === currentWeaponIndex ? 'active' : ''}">
                        <span class="rarity-dot" style="background:${w.rarityColor}"></span>
                        ${w.icon} ${i+1}
                    </div>
                `).join('');

            // 背包 UI
            renderInventory();
        }

        function renderInventory() {
            if (!inventoryOpen) return;
            if (inventory.items.length === 0) {
                invItemsEl.innerHTML = '<div class="inv-empty">🔄 背包是空的</div>';
                return;
            }
            invItemsEl.innerHTML = inventory.items.map((item, idx) => `
                    <div class="inv-item">
                        <span class="name">${item.icon} ${item.name}</span>
                        <span class="qty">×${item.qty || 1}</span>
                        <button class="use-btn" data-idx="${idx}">使用</button>
                    </div>
                `).join('');

            // 綁定使用按鈕
            invItemsEl.querySelectorAll('.use-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    const idx = parseInt(btn.dataset.idx);
                    useMedicalItem(idx);
                });
            });
        }

        // ============================================================
        //  13. 醫療品使用
        // ============================================================
        function useMedicalItem(idx) {
            const item = inventory.items[idx];
            if (!item) return;
            const info = MEDICAL_ITEMS[item.id];
            if (!info) return;

            if (info.heal > 0) {
                const healed = Math.min(info.heal, maxHealth - playerHealth);
                playerHealth += healed;
                showPickupHint(`❤️ +${healed} 生命 (${item.name})`);
                playPickupSound();
            }
            if (info.armorRepair > 0) {
                // 修復護甲
                let repaired = 0;
                const remaining = info.armorRepair;
                // 優先修復背心
                const vestNeed = armor.vest.maxDurability - armor.vest.durability;
                if (vestNeed > 0) {
                    const fix = Math.min(remaining, vestNeed);
                    armor.vest.durability += fix;
                    repaired += fix;
                }
                const helmetNeed = armor.helmet.maxDurability - armor.helmet.durability;
                if (repaired < remaining && helmetNeed > 0) {
                    const fix = Math.min(remaining - repaired, helmetNeed);
                    armor.helmet.durability += fix;
                    repaired += fix;
                }
                showPickupHint(`🛡️ +${repaired} 護甲 (${item.name})`);
                playPickupSound();
            }

            // 減少數量或移除
            item.qty = (item.qty || 1) - 1;
            if (item.qty <= 0) {
                inventory.items.splice(idx, 1);
            }
            updateUI();
            renderInventory();
        }

        // ============================================================
        //  14. 拾取系統
        // ============================================================
        function pickupItem() {
            if (!nearDrop || !nearDrop.alive) return;
            const item = nearDrop;
            const data = item.data;

            if (item.type === 'health' || data?.type === 'medical') {
                const id = data?.itemId || 'bandage';
                const info = MEDICAL_ITEMS[id];
                if (info) {
                    const existing = inventory.items.find(i => i.id === id);
                    if (existing) {
                        existing.qty = (existing.qty || 1) + 1;
                    } else {
                        inventory.items.push({ id: id, name: info.name, icon: info.icon, qty: 1 });
                    }
                    showPickupHint(`📦 獲得 ${info.icon} ${info.name}`);
                    playPickupSound();
                }
            } else if (item.type === 'ammo' || data?.type === 'ammo') {
                const w = playerWeapons.find(w => w.id === data.weaponId);
                if (w) {
                    w.reserve += data.amount;
                    showPickupHint(`📦 +${data.amount} ${w.name}彈藥`);
                    playPickupSound();
                }
            } else if (item.type === 'weapon' || data?.type === 'weapon') {
                const wId = data.weaponId;
                const rarity = data.rarity || randomRarity();
                const def = WEAPON_DEFS[wId];
                const r = RARITIES[rarity];
                if (def) {
                    const existing = playerWeapons.find(w => w.id === wId);
                    if (existing) {
                        // 升級稀有度 (如果更高)
                        const currentRarityRank = Object.keys(RARITIES).indexOf(existing.rarity);
                        const newRarityRank = Object.keys(RARITIES).indexOf(rarity);
                        if (newRarityRank > currentRarityRank) {
                            // 升級!
                            existing.rarity = rarity;
                            existing.damage = Math.round(def.baseDamage * r.dmgMult);
                            existing.magSize = Math.round(def.baseMagSize * r.ammoMult);
                            existing.fireRate = Math.round(def.baseFireRate * r.fireRateMult);
                            existing.ammo = Math.min(existing.ammo, existing.magSize);
                            existing.reserve += Math.round(def.baseMagSize * r.ammoMult * 2);
                            existing.rarityLabel = r.label;
                            existing.rarityColor = r.color;
                            existing.stars = r.stars;
                            showPickupHint(`⬆️ ${def.name} 升級為 ${r.label}!`);
                            playPickupSound();
                        } else {
                            // 轉為彈藥
                            const amt = Math.round(def.baseMagSize * r.ammoMult * 2);
                            existing.reserve += amt;
                            showPickupHint(`📦 +${amt} ${def.name}彈藥`);
                            playPickupSound();
                        }
                    } else {
                        const newWeapon = {
                            id: wId,
                            def: def,
                            rarity: rarity,
                            damage: Math.round(def.baseDamage * r.dmgMult),
                            magSize: Math.round(def.baseMagSize * r.ammoMult),
                            fireRate: Math.round(def.baseFireRate * r.fireRateMult),
                            ammo: Math.round(def.baseMagSize * r.ammoMult),
                            reserve: Math.round(def.baseMagSize * r.ammoMult * 3),
                            reloadTime: def.reloadTime,
                            spread: def.spread,
                            auto: def.auto,
                            icon: def.icon,
                            pelletCount: def.pelletCount || 1,
                            name: def.name,
                            rarityLabel: r.label,
                            rarityColor: r.color,
                            stars: r.stars,
                        };
                        playerWeapons.push(newWeapon);
                        currentWeaponIndex = playerWeapons.length - 1;
                        showPickupHint(`🔫 獲得 ${r.stars} ${def.name} (${r.label})!`);
                        playPickupSound();
                    }
                }
            } else if (item.type === 'armor' || data?.type === 'armor') {
                const amount = data.amount || 40;
                const isKit = data.isKit || false;
                // 修復護甲
                let repaired = 0;
                const remaining = amount;
                const vestNeed = armor.vest.maxDurability - armor.vest.durability;
                if (vestNeed > 0) {
                    const fix = Math.min(remaining, vestNeed);
                    armor.vest.durability += fix;
                    repaired += fix;
                }
                const helmetNeed = armor.helmet.maxDurability - armor.helmet.durability;
                if (repaired < remaining && helmetNeed > 0) {
                    const fix = Math.min(remaining - repaired, helmetNeed);
                    armor.helmet.durability += fix;
                    repaired += fix;
                }
                showPickupHint(`🛡️ +${repaired} 護甲`);
                playPickupSound();
            }

            // 移除掉落物
            scene.remove(item.mesh);
            if (item.glow) scene.remove(item.glow);
            item.alive = false;
            const idx = dropItems.indexOf(item);
            if (idx > -1) dropItems.splice(idx, 1);
            nearDrop = null;
            pickupHint.classList.remove('show');
            updateUI();
        }

        let pickupMessageTimeout = null;

        function showPickupHint(text) {
            pickupHint.textContent = text;
            pickupHint.classList.add('show');
            clearTimeout(pickupMessageTimeout);
            pickupMessageTimeout = setTimeout(() => {
                pickupHint.classList.remove('show');
            }, 1500);
        }

        // ============================================================
        //  15. 射擊系統
        // ============================================================
        const raycaster = new THREE.Raycaster();

        function shoot() {
            if (isDead) return;
            if (isReloading) return;
            const w = getCurrentWeapon();
            if (!w) return;
            const now = performance.now();
            if (now - lastFireTime < w.fireRate) return;
            if (w.ammo <= 0) {
                reloadWeapon();
                return;
            }

            lastFireTime = now;
            w.ammo--;
            playShootSound(0.25);

            const pellets = w.pelletCount || 1;

            for (let p = 0; p < pellets; p++) {
                const spread = w.spread * (w.id === 'shotgun' ? (0.5 + Math.random() * 0.5) : 1);
                const offsetX = (Math.random() - 0.5) * spread;
                const offsetY = (Math.random() - 0.5) * spread;
                raycaster.setFromCamera({ x: offsetX, y: offsetY }, camera);

                const targets = [];
                zombies.forEach(z => {
                    z.mesh.children.forEach(child => {
                        targets.push({ zombie: z, mesh: child });
                    });
                });

                const meshes = targets.map(t => t.mesh);
                const intersects = raycaster.intersectObjects(meshes);

                if (intersects.length > 0) {
                    const hit = intersects[0];
                    const target = targets.find(t => t.mesh === hit.object);
                    if (target) {
                        const z = target.zombie;
                        let damage = w.damage;
                        // 爆頭加成 (頭部)
                        if (hit.object.position.y > 1.2 * z.def.size) {
                            damage *= 2.0;
                            showDamagePopup(hit.point, damage, true);
                        } else {
                            showDamagePopup(hit.point, damage, false);
                        }
                        // 護甲減傷 (殭屍)
                        if (z.armored) {
                            damage *= 0.6;
                        }
                        z.health -= damage;
                        z.hitFlash = 0.15;
                        emitParticles(hit.point, 12, [1, 0.4, 0.1]);

                        if (z.health <= 0) {
                            // 爆炸效果 (胖子)
                            if (z.explosive) {
                                emitParticles(z.mesh.position.clone().add(new THREE.Vector3(0, 0.8, 0)), 80, [1, 0.5, 0],
                                    2);
                                // 範圍傷害
                                const boomPos = z.mesh.position;
                                for (const other of zombies) {
                                    if (other === z) continue;
                                    const dist = boomPos.distanceTo(other.mesh.position);
                                    if (dist < 3) {
                                        other.health -= 15;
                                        other.hitFlash = 0.2;
                                        if (other.health <= 0) {
                                            // 連鎖死亡
                                            killZombie(other);
                                        }
                                    }
                                }
                            }
                            killZombie(z);
                            killCount++;
                            updateUI();

                            // 掉落
                            if (Math.random() < z.def.dropRate) {
                                const dropPos = z.mesh.position.clone();
                                dropPos.y = 0.15;
                                spawnDrop(dropPos);
                            }

                            // 生成新殭屍
                            setTimeout(() => {
                                if (zombies.length < 20 + wave * 2) spawnZombie();
                            }, 500 + Math.random() * 1500);
                        }
                    }
                } else {
                    // 打地板
                    const far = new THREE.Vector3(0, 0, -40);
                    far.applyQuaternion(camera.quaternion);
                    far.add(camera.position);
                    emitParticles(far, 5, [0.6, 0.5, 0.2]);
                }
            }

            // 槍口閃光
            document.body.style.backgroundColor = 'rgba(255,255,200,0.04)';
            setTimeout(() => document.body.style.backgroundColor = '', 30);

            if (w.ammo === 0) {
                setTimeout(reloadWeapon, 200);
            }
            updateUI();
        }

        function killZombie(z) {
            playZombieDeathSound();
            emitParticles(z.mesh.position.clone().add(new THREE.Vector3(0, 0.6, 0)), 40, [0.6, 0.2, 0.1]);
            scene.remove(z.mesh);
            const idx = zombies.indexOf(z);
            if (idx > -1) zombies.splice(idx, 1);
        }

        // 傷害數字
        function showDamagePopup(position, damage, crit = false) {
            const el = document.createElement('div');
            el.className = 'damage-popup' + (crit ? ' crit' : '');
            el.textContent = crit ? `💥 ${damage}` : `-${damage}`;
            // 轉換 3D 位置到螢幕
            const vec = position.clone().add(new THREE.Vector3(0, 0.5, 0));
            vec.project(camera);
            const x = (vec.x * 0.5 + 0.5) * window.innerWidth;
            const y = (-vec.y * 0.5 + 0.5) * window.innerHeight;
            el.style.left = x + 'px';
            el.style.top = y + 'px';
            document.body.appendChild(el);
            setTimeout(() => el.remove(), 800);
        }

        // ============================================================
        //  16. 換彈
        // ============================================================
        function reloadWeapon() {
            if (isReloading) return;
            const w = getCurrentWeapon();
            if (!w) return;
            if (w.ammo === w.magSize) return;
            if (w.reserve <= 0) return;

            isReloading = true;
            playReloadSound();
            updateUI();

            setTimeout(() => {
                const w2 = getCurrentWeapon();
                if (!w2) { isReloading = false; return; }
                const need = w2.magSize - w2.ammo;
                const available = Math.min(need, w2.reserve);
                w2.ammo += available;
                w2.reserve -= available;
                isReloading = false;
                updateUI();
            }, w.reloadTime);
        }

        // ============================================================
        //  17. 空投系統
        // ============================================================
        let airdropActive = false;
        let airdropTimer = 25;

        function spawnAirdrop() {
            if (airdropActive) return;
            airdropActive = true;
            airdropIndicator.classList.add('show');
            playAirdropSound();

            const angle = Math.random() * Math.PI * 2;
            const dist = 8 + Math.random() * 12;
            const x = camera.position.x + Math.cos(angle) * dist;
            const z = camera.position.z + Math.sin(angle) * dist;

            const group = new THREE.Group();
            const boxMat = new THREE.MeshStandardMaterial({
                color: 0x3366aa,
                roughness: 0.5,
                metalness: 0.3,
                emissive: 0x224488,
                emissiveIntensity: 0.1,
            });
            const box = new THREE.Mesh(new THREE.BoxGeometry(0.9, 0.7, 0.9), boxMat);
            box.castShadow = true;
            box.receiveShadow = true;
            group.add(box);
            // 降落傘
            const paraMat = new THREE.MeshStandardMaterial({
                color: 0x88ccff,
                roughness: 0.8,
                transparent: true,
                opacity: 0.5,
                side: THREE.DoubleSide,
            });
            const para = new THREE.Mesh(new THREE.CircleGeometry(1.2, 8), paraMat);
            para.position.y = 1.4;
            para.rotation.x = Math.PI / 2;
            group.add(para);
            // 繩索
            const ropeMat = new THREE.MeshStandardMaterial({ color: 0x888888 });
            for (let i = 0; i < 4; i++) {
                const a = (i / 4) * Math.PI * 2;
                const rope = new THREE.Mesh(
                    new THREE.CylinderGeometry(0.01, 0.01, 0.8, 4),
                    ropeMat
                );
                rope.position.set(Math.cos(a) * 0.4, 0.6, Math.sin(a) * 0.4);
                group.add(rope);
            }
            const glow = new THREE.PointLight(0x44ddff, 2.0, 6);
            glow.position.y = 0.3;
            group.add(glow);

            group.position.set(x, 18, z);
            const targetY = 0.3;
            let speed = 2.5;
            scene.add(group);

            // 內容物
            const contents = {
                weapons: [],
                ammo: [],
                medical: [],
                armor: 0,
            };

            // 1~2 把武器 (高機率稀有以上)
            const count = 1 + Math.floor(Math.random() * 2);
            for (let i = 0; i < count; i++) {
                const wId = WEAPON_IDS[Math.floor(Math.random() * WEAPON_IDS.length)];
                let rarity = randomRarity();
                // 空投武器至少稀有
                const rarities = ['uncommon', 'rare', 'epic', 'legendary'];
                if (Math.random() < 0.5) {
                    rarity = rarities[Math.floor(Math.random() * rarities.length)];
                }
                contents.weapons.push({ weaponId: wId, rarity: rarity });
            }

            // 大量彈藥
            for (let i = 0; i < 3 + Math.floor(Math.random() * 4); i++) {
                const wId = WEAPON_IDS[Math.floor(Math.random() * WEAPON_IDS.length)];
                contents.ammo.push({ weaponId: wId, amount: 20 + Math.floor(Math.random() * 30) });
            }

            // 醫療品
            const medTypes = ['bandage', 'medkit', 'medbox'];
            for (let i = 0; i < 2 + Math.floor(Math.random() * 3); i++) {
                contents.medical.push(medTypes[Math.floor(Math.random() * medTypes.length)]);
            }

            // 護甲
            if (Math.random() < 0.6) {
                contents.armor = Math.random() < 0.3 ? 80 : 40;
            }

            function dropAnimate() {
                if (group.position.y > targetY) {
                    group.position.y -= speed * 0.025;
                    speed += 0.08;
                    group.rotation.y += 0.015;
                    requestAnimationFrame(dropAnimate);
                } else {
                    group.position.y = targetY;
                    emitParticles(group.position.clone().add(new THREE.Vector3(0, 0.5, 0)), 50, [0.3, 0.6, 1.0]);

                    const pos = group.position.clone();
                    pos.y = 0.15;

                    // 生成內容
                    for (const w of contents.weapons) {
                        const dp = pos.clone();
                        dp.x += (Math.random() - 0.5) * 0.8;
                        dp.z += (Math.random() - 0.5) * 0.8;
                        const item = {
                            position: dp,
                            type: 'weapon',
                            data: { type: 'weapon', weaponId: w.weaponId, rarity: w.rarity },
                            mesh: null,
                            glow: null,
                            alive: true,
                            bobOffset: Math.random() * 100,
                            pickupText: '',
                        };
                        const g = new THREE.Group();
                        const sphere = new THREE.Mesh(
                            new THREE.SphereGeometry(0.12, 12, 12),
                            new THREE.MeshStandardMaterial({
                                color: new THREE.Color(RARITIES[w.rarity].color),
                                emissive: new THREE.Color(RARITIES[w.rarity].color),
                                emissiveIntensity: 0.4,
                                roughness: 0.2,
                                metalness: 0.8,
                            })
                        );
                        sphere.castShadow = true;
                        g.add(sphere);
                        g.position.copy(dp);
                        scene.add(g);
                        item.mesh = g;
                        const gl = new THREE.PointLight(new THREE.Color(RARITIES[w.rarity].color), 0.3, 1.5);
                        gl.position.copy(dp);
                        gl.position.y = 0.3;
                        scene.add(gl);
                        item.glow = gl;
                        dropItems.push(item);
                    }

                    for (const ammo of contents.ammo) {
                        const dp = pos.clone();
                        dp.x += (Math.random() - 0.5) * 0.8;
                        dp.z += (Math.random() - 0.5) * 0.8;
                        spawnDrop(dp, 'ammo');
                    }

                    for (const med of contents.medical) {
                        const dp = pos.clone();
                        dp.x += (Math.random() - 0.5) * 0.8;
                        dp.z += (Math.random() - 0.5) * 0.8;
                        const item = {
                            position: dp,
                            type: 'health',
                            data: { type: 'medical', itemId: med },
                            mesh: null,
                            glow: null,
                            alive: true,
                            bobOffset: Math.random() * 100,
                            pickupText: '',
                        };
                        const g = new THREE.Group();
                        const info = MEDICAL_ITEMS[med];
                        const box2 = new THREE.Mesh(
                            new THREE.BoxGeometry(0.2, 0.2, 0.1),
                            new THREE.MeshStandardMaterial({
                                color: new THREE.Color(info.color),
                                emissive: new THREE.Color(info.color),
                                emissiveIntensity: 0.15,
                            })
                        );
                        g.add(box2);
                        const ch = new THREE.Mesh(
                            new THREE.BoxGeometry(0.04, 0.12, 0.02),
                            new THREE.MeshStandardMaterial({ color: 0xffffff })
                        );
                        ch.position.z = 0.06;
                        g.add(ch);
                        const cv = new THREE.Mesh(
                            new THREE.BoxGeometry(0.12, 0.04, 0.02),
                            new THREE.MeshStandardMaterial({ color: 0xffffff })
                        );
                        cv.position.z = 0.06;
                        g.add(cv);
                        g.position.copy(dp);
                        scene.add(g);
                        item.mesh = g;
                        const gl = new THREE.PointLight(new THREE.Color(info.color), 0.2, 1.2);
                        gl.position.copy(dp);
                        gl.position.y = 0.3;
                        scene.add(gl);
                        item.glow = gl;
                        dropItems.push(item);
                    }

                    if (contents.armor > 0) {
                        const dp = pos.clone();
                        dp.x += (Math.random() - 0.5) * 0.8;
                        dp.z += (Math.random() - 0.5) * 0.8;
                        spawnDrop(dp, 'armor');
                    }

                    setTimeout(() => {
                        scene.remove(group);
                    }, 500);

                    airdropActive = false;
                    airdropIndicator.classList.remove('show');
                    airdropTimer = 25 + Math.random() * 20;
                    updateUI();
                }
            }
            dropAnimate();
        }

        // ============================================================
        //  18. 建築物碰撞 (簡單)
        // ============================================================
        function isInsideBuilding(x, z) {
            for (const b of buildings) {
                if (x > b.minX + 0.3 && x < b.maxX - 0.3 && z > b.minZ + 0.3 && z < b.maxZ - 0.3) {
                    return b;
                }
            }
            return null;
        }

        // ============================================================
        //  19. 控制
        // ============================================================
        let isLocked = false;

        document.addEventListener('click', () => {
            if (!isLocked && !isDead && !inventoryOpen) {
                renderer.domElement.requestPointerLock();
            }
            if (isLocked && !isDead && !inventoryOpen) {
                shoot();
                initAudio();
            }
        });

        document.addEventListener('pointerlockchange', () => {
            isLocked = document.pointerLockElement === renderer.domElement;
        });

        document.addEventListener('mousemove', (e) => {
            if (!isLocked || isDead || inventoryOpen) return;
            camera.rotation.order = 'YXZ';
            camera.rotation.y -= (e.movementX || 0) * 0.002;
            camera.rotation.x -= (e.movementY || 0) * 0.002;
            camera.rotation.x = Math.max(-0.6, Math.min(0.8, camera.rotation.x));
        });

        const keys = { w: false, a: false, s: false, d: false, shift: false };

        document.addEventListener('keydown', (e) => {
            if (e.code === 'KeyW') keys.w = true;
            if (e.code === 'KeyA') keys.a = true;
            if (e.code === 'KeyS') keys.s = true;
            if (e.code === 'KeyD') keys.d = true;
            if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') keys.shift = true;

            // 武器切換
            if (e.key >= '1' && e.key <= '5') {
                const idx = parseInt(e.key) - 1;
                if (idx < playerWeapons.length) {
                    currentWeaponIndex = idx;
                    isReloading = false;
                    updateUI();
                }
            }
            if (e.key === 'r' || e.key === 'R') reloadWeapon();
            if (e.key === 'e' || e.key === 'E') pickupItem();

            // 背包
            if (e.key === 'Tab') {
                e.preventDefault();
                toggleInventory();
            }
        });

        document.addEventListener('keyup', (e) => {
            if (e.code === 'KeyW') keys.w = false;
            if (e.code === 'KeyA') keys.a = false;
            if (e.code === 'KeyS') keys.s = false;
            if (e.code === 'KeyD') keys.d = false;
            if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') keys.shift = false;
        });

        // 滾輪切換
        document.addEventListener('wheel', (e) => {
            if (!isLocked || isDead || inventoryOpen) return;
            e.preventDefault();
            const dir = e.deltaY > 0 ? 1 : -1;
            let newIdx = currentWeaponIndex + dir;
            if (newIdx < 0) newIdx = playerWeapons.length - 1;
            if (newIdx >= playerWeapons.length) newIdx = 0;
            currentWeaponIndex = newIdx;
            isReloading = false;
            updateUI();
        }, { passive: false });

        // 背包切換
        function toggleInventory() {
            inventoryOpen = !inventoryOpen;
            inventoryEl.style.display = inventoryOpen ? 'block' : 'none';
            if (inventoryOpen) {
                document.exitPointerLock();
                renderInventory();
            } else {
                renderer.domElement.requestPointerLock();
            }
        }

        document.getElementById('invClose').addEventListener('click', toggleInventory);

        // 移動
        function movePlayer(delta) {
            if (!isLocked || isDead || inventoryOpen) return;
            const speed = keys.shift ? 6.0 : 4.0;
            const forward = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            const right = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
            forward.y = 0;
            right.y = 0;
            forward.normalize();
            right.normalize();

            const move = new THREE.Vector3();
            if (keys.w) move.add(forward);
            if (keys.s) move.sub(forward);
            if (keys.a) move.sub(right);
            if (keys.d) move.add(right);
            if (move.length() > 0) {
                move.normalize().multiplyScalar(speed * delta);
                const newX = camera.position.x + move.x;
                const newZ = camera.position.z + move.z;

                // 建築物碰撞
                const building = isInsideBuilding(newX, newZ);
                if (building) {
                    // 可以進入建築物
                    camera.position.x = newX;
                    camera.position.z = newZ;
                } else {
                    // 外圍限制
                    const dist = Math.sqrt(newX * newX + newZ * newZ);
                    if (dist < 55) {
                        camera.position.x = newX;
                        camera.position.z = newZ;
                    }
                }
                camera.position.y = 1.8;
            }
        }

        // ============================================================
        //  20. 小地圖
        // ============================================================
        const minimapCanvas = document.getElementById('minimapCanvas');
        const minimapCtx = minimapCanvas.getContext('2d');

        function updateMinimap() {
            const ctx = minimapCtx;
            const w = 140,
                h = 140;
            ctx.clearRect(0, 0, w, h);

            // 背景
            const grad = ctx.createRadialGradient(70, 70, 0, 70, 70, 70);
            grad.addColorStop(0, 'rgba(20,30,50,0.9)');
            grad.addColorStop(1, 'rgba(0,0,0,0.9)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(70, 70, 68, 0, Math.PI * 2);
            ctx.fill();

            const scale = 2.2;
            const cx = 70,
                cy = 70;
            const px = camera.position.x,
                pz = camera.position.z;

            // 建築物
            for (const b of buildings) {
                const x = cx + (b.x - px) * scale;
                const y = cy + (b.z - pz) * scale;
                if (x < -10 || x > 150 || y < -10 || y > 150) continue;
                ctx.fillStyle = 'rgba(80,100,140,0.5)';
                ctx.fillRect(x - b.w * scale / 2, y - b.d * scale / 2, b.w * scale, b.d * scale);
                ctx.strokeStyle = 'rgba(150,180,220,0.2)';
                ctx.lineWidth = 0.5;
                ctx.strokeRect(x - b.w * scale / 2, y - b.d * scale / 2, b.w * scale, b.d * scale);
            }

            // 殭屍
            for (const z of zombies) {
                const x = cx + (z.mesh.position.x - px) * scale;
                const y = cy + (z.mesh.position.z - pz) * scale;
                if (x < 0 || x > 140 || y < 0 || y > 140) continue;
                const size = 2 + z.def.size * 1.5;
                ctx.fillStyle = z.explosive ? '#ff4400' : z.armored ? '#8888ff' : '#ff4444';
                ctx.beginPath();
                ctx.arc(x, y, size, 0, Math.PI * 2);
                ctx.fill();
            }

            // 掉落物
            for (const d of dropItems) {
                if (!d.alive) continue;
                const x = cx + (d.position.x - px) * scale;
                const y = cy + (d.position.z - pz) * scale;
                if (x < 0 || x > 140 || y < 0 || y > 140) continue;
                ctx.fillStyle = '#44ff88';
                ctx.beginPath();
                ctx.arc(x, y, 1.5, 0, Math.PI * 2);
                ctx.fill();
            }

            // 玩家
            ctx.shadowColor = 'rgba(0,255,100,0.3)';
            ctx.shadowBlur = 10;
            ctx.fillStyle = '#44ff88';
            ctx.beginPath();
            ctx.arc(cx, cy, 4, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;
            // 方向
            const dir = new THREE.Vector3(0, 0, -1).applyQuaternion(camera.quaternion);
            ctx.strokeStyle = 'rgba(68,255,136,0.3)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.lineTo(cx + dir.x * 12, cy + dir.z * 12);
            ctx.stroke();

            // 邊框
            ctx.strokeStyle = 'rgba(255,255,255,0.05)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            ctx.arc(70, 70, 68, 0, Math.PI * 2);
            ctx.stroke();
        }

        // ============================================================
        //  21. 遊戲狀態
        // ============================================================
        const gameoverDiv = document.getElementById('gameover');
        const finalKills = document.getElementById('finalKills');
        const finalWave = document.getElementById('finalWave');

        document.getElementById('restartBtn').addEventListener('click', () => {
            // 重置所有
            zombies.forEach(z => scene.remove(z.mesh));
            zombies = [];
            dropItems.forEach(d => { scene.remove(d.mesh); if (d.glow) scene.remove(d.glow); });
            dropItems = [];
            inventory.items = [];
            killCount = 0;
            wave = 1;
            playerHealth = 100;
            isDead = false;
            airdropActive = false;
            airdropTimer = 25;
            armor.helmet.durability = 80;
            armor.vest.durability = 60;
            gameoverDiv.style.display = 'none';
            camera.position.set(0, 1.8, 0);

            initWeapons();
            for (let i = 0; i < 8; i++) spawnZombie();
            updateUI();
            renderer.domElement.requestPointerLock();
        });

        // ============================================================
        //  22. 動畫循環
        // ============================================================
        const clock = new THREE.Clock();
        let waveCheckTimer = 0;

        function animate() {
            const delta = Math.min(clock.getDelta(), 0.05);
            const time = clock.getElapsedTime();

            if (!isDead) {
                movePlayer(delta);

                // 空投計時
                airdropTimer -= delta;
                if (airdropTimer <= 0) {
                    spawnAirdrop();
                    airdropTimer = 30 + Math.random() * 25;
                }

                // 殭屍 AI
                for (let i = zombies.length - 1; i >= 0; i--) {
                    const z = zombies[i];
                    if (!z) continue;

                    const dir = new THREE.Vector3();
                    dir.subVectors(camera.position, z.mesh.position);
                    dir.y = 0;
                    const dist = dir.length();

                    if (dist > 0.5 && dist < 30) {
                        dir.normalize();
                        const spd = z.speed * (z.type === 'runner' ? 1.5 : 1);
                        z.mesh.position.x += dir.x * spd * delta;
                        z.mesh.position.z += dir.z * spd * delta;
                        z.mesh.lookAt(camera.position.x, z.mesh.position.y, camera.position.z);
                    }

                    // 攻擊
                    if (dist < 1.4) {
                        if (z.attackCooldown <= 0) {
                            let dmg = z.damage;
                            // 護甲減傷
                            const reduction = getDamageReduction();
                            dmg = dmg * (1 - reduction);
                            // 護甲吸收
                            dmg = applyDamageToArmor(dmg);
                            playerHealth -= dmg;
                            z.attackCooldown = 1.0 + (z.type === 'runner' ? 0.3 : 0);
                            playHurtSound();
                            hurtFlash.classList.add('show');
                            setTimeout(() => hurtFlash.classList.remove('show'), 200);

                            if (playerHealth <= 0) {
                                playerHealth = 0;
                                isDead = true;
                                finalKills.textContent = killCount;
                                finalWave.textContent = wave;
                                gameoverDiv.style.display = 'flex';
                                document.exitPointerLock();
                                updateUI();
                            }
                            updateUI();
                        }
                    }
                    if (z.attackCooldown > 0) z.attackCooldown -= delta;

                    // 閃爍
                    if (z.hitFlash > 0) {
                        z.hitFlash -= delta;
                        z.mesh.children.forEach(child => {
                            if (child.isMesh && child.material) {
                                child.material.emissive = new THREE.Color(0xff4400);
                                child.material.emissiveIntensity = 0.6;
                            }
                        });
                    } else {
                        z.mesh.children.forEach(child => {
                            if (child.isMesh && child.material) {
                                child.material.emissive = new THREE.Color(0x112211);
                                child.material.emissiveIntensity = 0.05;
                            }
                        });
                    }

                    // 走路擺動
                    z.mesh.children.forEach((child, idx) => {
                        if (idx === 0 || idx === 1) return;
                        if (child.isMesh && child.geometry.type === 'CylinderGeometry') {
                            if (child.position.x < -0.3 || child.position.x > 0.3) {
                                if (child.position.x < 0) {
                                    child.rotation.x = -0.3 + Math.sin(time * 4 + z.wobble) * 0.2;
                                } else {
                                    child.rotation.x = 0.5 + Math.sin(time * 4 + z.wobble + 0.5) * 0.2;
                                }
                            }
                            if (child.position.y < 0.4) {
                                const legIdx = child.position.x < 0 ? 0 : 1;
                                child.rotation.x = Math.sin(time * 4 + z.wobble + legIdx * 0.5) * 0.1;
                            }
                        }
                    });
                }

                // 波數檢查
                waveCheckTimer += delta;
                if (zombies.length === 0 && waveCheckTimer > 2) {
                    wave++;
                    waveCheckTimer = 0;
                    const count = Math.min(6 + wave * 2, 35);
                    for (let i = 0; i < count; i++) {
                        setTimeout(spawnZombie, i * 120);
                    }
                    updateUI();
                }

                // 拾取檢測
                let found = null;
                for (const item of dropItems) {
                    if (!item.alive) continue;
                    const dist = camera.position.distanceTo(item.position);
                    if (dist < pickupRange) {
                        found = item;
                        break;
                    }
                }
                if (found !== nearDrop) {
                    nearDrop = found;
                    if (found) {
                        pickupHint.textContent = found.pickupText || '📦 按 E 拾取';
                        pickupHint.classList.add('show');
                    } else {
                        pickupHint.classList.remove('show');
                    }
                }

                // 更新粒子
                const pos = particleSystem.geometry.attributes.position.array;
                const col = particleSystem.geometry.attributes.color.array;
                for (let i = particleList.length - 1; i >= 0; i--) {
                    const p = particleList[i];
                    p.life -= delta;
                    if (p.life <= 0) {
                        pos[p.idx * 3 + 1] = -1000;
                        particleList.splice(i, 1);
                    } else {
                        pos[p.idx * 3] += p.vel.x * delta;
                        pos[p.idx * 3 + 1] += p.vel.y * delta;
                        pos[p.idx * 3 + 2] += p.vel.z * delta;
                        p.vel.y -= 2.5 * delta;
                        const alpha = p.life / p.maxLife;
                        col[p.idx * 3 + 1] *= 0.995;
                        col[p.idx * 3 + 2] *= 0.995;
                    }
                }
                particleSystem.geometry.attributes.position.needsUpdate = true;
                particleSystem.geometry.attributes.color.needsUpdate = true;

                // 掉落物浮動
                for (const d of dropItems) {
                    if (!d.alive) continue;
                    d.mesh.position.y = 0.15 + Math.sin(time * 1.5 + d.bobOffset) * 0.05;
                    d.mesh.rotation.y += delta * 0.5;
                    if (d.glow) {
                        d.glow.position.y = 0.3 + Math.sin(time * 1.5 + d.bobOffset) * 0.05;
                    }
                }

                updateUI();
                updateMinimap();
            }

            composer.render();
            requestAnimationFrame(animate);
        }

        // ============================================================
        //  23. 視窗調整
        // ============================================================
        window.addEventListener('resize', () => {
            const w = window.innerWidth,
                h = window.innerHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            composer.setSize(w, h);
        });

        // ============================================================
        //  啟動
        // ============================================================
        updateUI();
        animate();
        console.log('🧟 殭屍生存完整版已啟動!');
        console.log('📖 操作: WASD移動 | 滑鼠瞄準射擊 | 1-5切換武器 | R換彈 | E拾取 | Tab背包');
        console.log('⭐ 武器稀有度: 普通 ⭐ → 傳說 ⭐⭐⭐⭐⭐');
        console.log('🛡️ 護甲可修復，醫療品可存入背包');
        console.log('📦 空投每 25-50 秒一次');
    </script>
</body>
</html>
